<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 620" role="img" aria-labelledby="title"><title id="title">权限修改后的检查顺序</title><rect width="640" height="620" rx="24" fill="#f3f1fb"/><g font-family="system-ui, sans-serif"><text x="32" y="52" font-size="28" font-weight="700" fill="#25263a">权限修改后的检查顺序</text><rect x="28" y="88" width="584" height="140" rx="16" fill="white" stroke="#c9c3df"/><circle cx="62" cy="126" r="18" fill="#6d55bd"/><text x="62" y="134" text-anchor="middle" font-size="24" fill="white">1</text><text x="94" y="135" font-size="27" font-weight="600" fill="#282738">确认运行副本</text><text x="48" y="190" font-size="25" fill="#4c4b62">核对应用路径和系统权限项目</text><path d="M320 234v20m-8-8 8 8 8-8" stroke="#6d55bd" stroke-width="3" fill="none"/><rect x="28" y="262" width="584" height="140" rx="16" fill="white" stroke="#c9c3df"/><circle cx="62" cy="300" r="18" fill="#6d55bd"/><text x="62" y="308" text-anchor="middle" font-size="24" fill="white">2</text><text x="94" y="309" font-size="27" font-weight="600" fill="#282738">按提示重新打开应用</text><text x="48" y="364" font-size="25" fill="#4c4b62">先结束编辑或录制，再重启</text><path d="M320 408v20m-8-8 8 8 8-8" stroke="#6d55bd" stroke-width="3" fill="none"/><rect x="28" y="436" width="584" height="140" rx="16" fill="white" stroke="#c9c3df"/><circle cx="62" cy="474" r="18" fill="#6d55bd"/><text x="62" y="482" text-anchor="middle" font-size="24" fill="white">3</text><text x="94" y="483" font-size="27" font-weight="600" fill="#282738">执行一个小测试</text><text x="48" y="538" font-size="25" fill="#4c4b62">看状态，也检查实际图像或声音</text></g></svg>
