<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 620" role="img" aria-labelledby="title"><title id="title">Match the package to the computer</title><rect width="640" height="620" rx="24" fill="#f3f1fb"/><g font-family="system-ui, sans-serif"><text x="32" y="52" font-size="28" font-weight="700" fill="#25263a">Match the package to the computer</text><rect x="28" y="88" width="584" height="140" rx="16" fill="white" stroke="#c9c3df"/><circle cx="62" cy="126" r="18" fill="#6d55bd"/><text x="62" y="134" text-anchor="middle" font-size="24" fill="white">1</text><text x="94" y="135" font-size="27" font-weight="600" fill="#282738">Windows: check system type</text><text x="48" y="190" font-size="25" fill="#4c4b62">Choose the matching x64 or ARM64</text><path d="M320 234v20m-8-8 8 8 8-8" stroke="#6d55bd" stroke-width="3" fill="none"/><rect x="28" y="262" width="584" height="140" rx="16" fill="white" stroke="#c9c3df"/><circle cx="62" cy="300" r="18" fill="#6d55bd"/><text x="62" y="308" text-anchor="middle" font-size="24" fill="white">2</text><text x="94" y="309" font-size="27" font-weight="600" fill="#282738">Mac: check chip and OS</text><text x="48" y="364" font-size="25" fill="#4c4b62">Apple silicon: arm64; Intel: x86_64</text><path d="M320 408v20m-8-8 8 8 8-8" stroke="#6d55bd" stroke-width="3" fill="none"/><rect x="28" y="436" width="584" height="140" rx="16" fill="white" stroke="#c9c3df"/><circle cx="62" cy="474" r="18" fill="#6d55bd"/><text x="62" y="482" text-anchor="middle" font-size="24" fill="white">3</text><text x="94" y="483" font-size="27" font-weight="600" fill="#282738">Then choose the edition</text><text x="48" y="538" font-size="25" fill="#4c4b62">Intel Mac: Full only; macOS 15+</text></g></svg>
