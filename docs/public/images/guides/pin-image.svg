<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" role="img" aria-labelledby="title desc"><title id="title">截图固定与剪贴板固定，是两个入口</title><desc id="desc">创建贴图后，再移动到工作区旁边。操作示意。</desc><rect width="960" height="560" rx="24" fill="#f5f7fc" /><g font-family="system-ui,-apple-system,PingFang SC,Microsoft YaHei,sans-serif"><text x="36" y="52" font-size="30" fill="#18233b" font-weight="700">截图固定与剪贴板固定，是两个入口</text><text x="36" y="88" font-size="20" fill="#53627d" font-weight="400">创建贴图后，再移动到工作区旁边</text><rect x="36" y="138" width="278" height="127" rx="16" fill="#ffffff" stroke="#c8d3e6" stroke-width="2" /><text x="58" y="183" font-size="27" fill="#18233b" font-weight="600">截图选区</text><text x="58" y="235" font-size="24" fill="#18233b" font-weight="400">截图 → 固定到屏幕</text><rect x="36" y="294" width="278" height="127" rx="16" fill="#ffffff" stroke="#c8d3e6" stroke-width="2" /><text x="58" y="339" font-size="26" fill="#18233b" font-weight="600">图像 / 文字 / 文件</text><text x="58" y="390" font-size="22" fill="#18233b" font-weight="400">复制 → 剪贴板贴图</text><path d="M326 279 L383 279" fill="none" stroke="#6954d9" stroke-width="3" /><path d="M374 272 L383 279 L374 286" fill="none" stroke="#6954d9" stroke-width="3" /><rect x="405" y="138" width="519" height="283" rx="16" fill="#eaf0fa" stroke="#c8d3e6" stroke-width="2" /><rect x="431" y="165" width="281" height="197" rx="16" fill="#ffffff" stroke="#c8d3e6" stroke-width="2" /><text x="452" y="207" font-size="25" fill="#18233b" font-weight="400">桌面工作窗口</text><path d="M452 241 L685 241" fill="none" stroke="#dce3ef" stroke-width="8" /><path d="M452 280 L648 280" fill="none" stroke="#dce3ef" stroke-width="8" /><rect x="689" y="238" width="212" height="153" rx="16" fill="#ede9fe" stroke="#6954d9" stroke-width="2" /><text x="712" y="282" font-size="25" fill="#18233b" font-weight="600">参考贴图</text><text x="712" y="329" font-size="22" fill="#18233b" font-weight="400">拖动调整位置</text><text x="425" y="398" font-size="21" fill="#53627d" font-weight="400">复制视图 · 复制原始内容 · 保存为文件</text><path d="M36 510 L924 510" fill="none" stroke="#dce3ef" stroke-width="1" /><text x="36" y="539" font-size="18" fill="#53627d" font-weight="400">Snow Shot · 操作示意</text></g></svg>