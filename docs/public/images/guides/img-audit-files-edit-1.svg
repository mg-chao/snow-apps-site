<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" role="img" aria-labelledby="title desc"><title id="title">先为独立动作配置快捷键</title><desc id="desc">编辑选中的图像：确认按键后，回到文件管理器。。原创操作示意。</desc><rect width="960" height="560" rx="22" fill="#f5f7fc" /><g font-family="system-ui,-apple-system,PingFang SC,Microsoft YaHei,sans-serif"><text x="35" y="50" font-size="29" fill="#1e293b" font-weight="700">先为独立动作配置快捷键</text><text x="35" y="86" font-size="20" fill="#53627d" font-weight="400">编辑选中的图像：确认按键后，回到文件管理器。</text><rect x="40" y="132" width="880" height="329" rx="12" fill="#fff" stroke="#c8d3e6" stroke-width="2" /><rect x="60" y="151" width="253" height="38" rx="19" fill="#ede9fe" stroke="#ede9fe" stroke-width="2" /><text x="74" y="177" font-size="20" fill="#6146bd" font-weight="600">设置 → 全局快捷键</text><text x="76" y="266" font-size="32" fill="#6146bd" font-weight="600">编辑选中的图像</text><rect x="76" y="307" width="805" height="83" rx="12" fill="#edf2fb" stroke="#c8d3e6" stroke-width="2" /><text x="95" y="358" font-size="29" fill="#1e293b" font-weight="400">配置自己的组合键　→　确认没有冲突</text><text x="77" y="432" font-size="23" fill="#53627d" font-weight="400">新配置无默认绑定；不要套用截图快捷键。</text><path d="M35 511 L925 511" fill="none" stroke="#dbe3ef" stroke-width="1" /><text x="35" y="539" font-size="18" fill="#53627d" font-weight="400">Snow Shot · 操作示意</text></g></svg>