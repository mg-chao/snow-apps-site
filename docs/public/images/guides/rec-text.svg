<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" role="img" aria-labelledby="title desc"><title id="title">把图片中的字变成可复制文本</title><desc id="desc">①完整框选 → ②对照原图校正 → ③整理换行与标点。操作示意。</desc><rect width="960" height="560" rx="24" fill="#f5f7fc" /><g font-family="system-ui,-apple-system,PingFang SC,Microsoft YaHei,sans-serif"><text x="36" y="52" font-size="30" fill="#18233b" font-weight="700">把图片中的字变成可复制文本</text><text x="36" y="88" font-size="20" fill="#53627d" font-weight="400">①完整框选 → ②对照原图校正 → ③整理换行与标点</text><rect x="36" y="122" width="415" height="326" rx="16" fill="#ffffff" stroke="#c8d3e6" stroke-width="2" /><rect x="58" y="144" width="130" height="38" rx="19" fill="#ede9fe" stroke="#ede9fe" stroke-width="2" /><text x="72" y="170" font-size="20" fill="#5941bd" font-weight="600">图片中的字</text><text x="63" y="225" font-size="29" fill="#18233b" font-weight="400">错误代码：O12</text><text x="63" y="275" font-size="27" fill="#18233b" font-weight="400">请检查网络连接</text><text x="63" y="321" font-size="27" fill="#18233b" font-weight="400">然后重新尝试。</text><rect x="58" y="188" width="356" height="155" rx="6" fill="none" stroke="#6954d9" stroke-width="2" /><path d="M454 281 L498 281" fill="none" stroke="#6954d9" stroke-width="3" /><path d="M489 274 L498 281 L489 288" fill="none" stroke="#6954d9" stroke-width="3" /><rect x="514" y="122" width="410" height="326" rx="16" fill="#ffffff" stroke="#c8d3e6" stroke-width="2" /><rect x="536" y="144" width="150" height="38" rx="19" fill="#ede9fe" stroke="#ede9fe" stroke-width="2" /><text x="550" y="170" font-size="20" fill="#5941bd" font-weight="600">校正后的文本</text><text x="541" y="225" font-size="29" fill="#18233b" font-weight="400">错误代码：012</text><path d="M704 233 L759 233" fill="none" stroke="#c96520" stroke-width="4" /><text x="541" y="278" font-size="26" fill="#18233b" font-weight="400">请检查网络连接，然后</text><text x="541" y="319" font-size="26" fill="#18233b" font-weight="400">重新尝试。</text><rect x="539" y="369" width="153" height="38" rx="19" fill="#ede9fe" stroke="#ede9fe" stroke-width="2" /><text x="553" y="395" font-size="20" fill="#5941bd" font-weight="600">格式：移除换行</text><text x="706" y="397" font-size="20" fill="#167d69" font-weight="400">复制 → 粘贴校验</text><path d="M36 510 L924 510" fill="none" stroke="#dce3ef" stroke-width="1" /><text x="36" y="539" font-size="18" fill="#53627d" font-weight="400">Snow Shot · 操作示意</text></g></svg>