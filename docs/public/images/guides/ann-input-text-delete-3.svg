<svg xmlns="http://www.w3.org/2000/svg" width="440" height="660" viewBox="0 0 440 660" role="img" aria-labelledby="title desc"><title id="title">Delete的结果取决于设置: 设置关闭：删除整个文字对象</title><desc id="desc">相同输入状态但设置关闭，Delete使整段文字消失，输入结束，紫色方框不变</desc><rect width="440" height="660" rx="15" fill="#f4f7fc"/><g font-family="system-ui,-apple-system,PingFang SC,Microsoft YaHei,sans-serif"><text x="24" y="34" font-size="23" fill="#263b51" font-weight="700" >Delete的结果取决于设置</text><text x="24" y="70" font-size="20" fill="#287dbc" font-weight="600" >设置关闭：删除整个文字对象</text><g transform="translate(24 115)"><rect x="0" y="0" width="392" height="404" rx="11" fill="white" stroke="#d0dbe7" stroke-width="1.5" /><text x="18" y="31" font-size="21" fill="#7654d6" font-weight="600" >删除光标后的文字</text><rect x="18" y="65" width="57" height="28" rx="14" fill="#8a9bab" stroke="none" stroke-width="1.5" /><circle cx="32" cy="79" r="10" fill="white" stroke="white" stroke-width="2" /><text x="90" y="87" font-size="19" fill="#263b51" font-weight="400" >关闭</text><g transform="translate(18 107)"><rect x="0" y="0" width="356" height="240" rx="6" fill="#fafcfe" stroke="#c6d5e4" stroke-width="1.5" /><rect x="244" y="35" width="70" height="45" rx="4" fill="none" stroke="#7654d6" stroke-width="1.5" /><text x="203" y="108" font-size="17" fill="#7654d6" font-weight="400" >已完成的方框</text><text x="25" y="184" font-size="21" fill="#d44f58" font-weight="600" >整段文字已删除</text></g><text x="18" y="382" font-size="19" fill="#263b51" font-weight="400" >文字对象与插入光标都不再显示。</text></g><path d="M24 612 H416" stroke="#d9e2ed"/><text x="24" y="638" font-size="17" fill="#587087" font-weight="400" >操作示意</text></g></svg>