<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="480" viewBox="0 0 960 480" role="img" aria-labelledby="title"><title id="title">按任务选择截图入口（操作示意）</title><g font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif"><rect x="1" y="1" width="958" height="478" rx="12" fill="#f6f7fc" stroke="#cbd4e4" stroke-width="2" /><text x="30" y="43" font-size="28" fill="#263148">按任务选择截图入口</text><text x="30" y="460" font-size="18" fill="#536078">操作示意</text><rect x="30" y="90" width="280" height="290" rx="12" fill="#fff" stroke="#cbd4e4" stroke-width="2" /><circle cx="60" cy="125" r="19" fill="#7652dc" /><text x="53" y="133" font-size="23" fill="white">1</text><text x="55" y="182" font-size="25" fill="#263148">延时截图</text><text x="55" y="236" font-size="21" fill="#263148">先触发 → 展开菜单</text><text x="55" y="284" font-size="21" fill="#263148">等待 1–10 秒</text><text x="55" y="335" font-size="21" fill="#263148">进入截图选区</text><rect x="330" y="90" width="280" height="290" rx="12" fill="#fff" stroke="#cbd4e4" stroke-width="2" /><circle cx="360" cy="125" r="19" fill="#7652dc" /><text x="353" y="133" font-size="23" fill="white">2</text><text x="355" y="182" font-size="25" fill="#263148">直接截图</text><text x="355" y="236" font-size="21" fill="#263148">当前显示器 / 窗口</text><text x="355" y="284" font-size="21" fill="#263148">跳过选区编辑</text><text x="355" y="335" font-size="21" fill="#263148">结果复制到剪贴板</text><rect x="630" y="90" width="280" height="290" rx="12" fill="#fff" stroke="#cbd4e4" stroke-width="2" /><circle cx="660" cy="125" r="19" fill="#7652dc" /><text x="653" y="133" font-size="23" fill="white">3</text><text x="655" y="182" font-size="25" fill="#263148">重新截图</text><text x="655" y="236" font-size="21" fill="#263148">保留当前操作上下文</text><text x="655" y="284" font-size="21" fill="#263148">刷新屏幕图像</text><text x="655" y="335" font-size="21" fill="#263148">再次检查内容</text></g></svg>