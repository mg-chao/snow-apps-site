<svg xmlns="http://www.w3.org/2000/svg" width="820" height="440" viewBox="0 0 820 440" role="img" aria-labelledby="title desc"><title id="title">序号与步骤说明：单击连续放置序号</title><desc id="desc">操作示意。第 2 帧：单击连续放置序号。</desc><rect width="820" height="440" rx="16" fill="#f3f7fc" /><rect x="22" y="75" width="500" height="330" rx="10" fill="#fff" stroke="#d2deeb" /><rect x="540" y="75" width="260" height="330" rx="10" fill="#fff" stroke="#d2deeb" /><text x="25" y="39" font-size="25" fill="#26384c" font-weight="bold">序号与步骤说明</text><text x="25" y="63" font-size="17" fill="#546c84" font-weight="normal">2 / 3　单击连续放置序号</text><rect x="70" y="160" width="335" height="8" rx="4" fill="#c6d4e2" stroke="#c6d4e2" /><rect x="70" y="190" width="285" height="8" rx="4" fill="#c6d4e2" stroke="#c6d4e2" /><rect x="70" y="220" width="320" height="8" rx="4" fill="#c6d4e2" stroke="#c6d4e2" /><rect x="70" y="250" width="230" height="8" rx="4" fill="#c6d4e2" stroke="#c6d4e2" /><circle cx="85" cy="150" r="20" fill="#347ec7" stroke="#347ec7" stroke-width="2" /><text x="79" y="157" font-size="21" fill="white" font-weight="bold">1</text><circle cx="210" cy="210" r="20" fill="#347ec7" stroke="#347ec7" stroke-width="2" /><text x="204" y="217" font-size="21" fill="white" font-weight="bold">2</text><circle cx="375" cy="275" r="20" fill="#347ec7" stroke="#347ec7" stroke-width="2" /><text x="369" y="282" font-size="21" fill="white" font-weight="bold">3</text><text x="555" y="116" font-size="21" fill="#26384c" font-weight="bold">操作要点</text><text x="555" y="165" font-size="17" fill="#26384c" font-weight="normal">先选外观和编号体系</text><text x="555" y="215" font-size="17" fill="#26384c" font-weight="normal">每单击一次放一个编号</text><text x="555" y="265" font-size="17" fill="#26384c" font-weight="normal">拖动可带出关联说明</text><text x="555" y="355" font-size="17" fill="#546c84" font-weight="normal">按正文步骤操作</text><text x="555" y="385" font-size="16" fill="#546c84" font-weight="normal">操作示意</text></svg>