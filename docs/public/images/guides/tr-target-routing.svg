<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 1110" role="img" aria-labelledby="title desc"><title id="title">目标语言何时会自动切换</title><desc id="desc">阈值60%：80%达到阈值。</desc><rect width="720" height="1110" rx="22" fill="#f5f7fc"/><g font-family="system-ui,-apple-system,PingFang SC,Microsoft YaHei,sans-serif"><text x="32" y="58" font-size="36" fill="#28374e" font-weight="700">目标语言何时会自动切换</text><text x="32" y="109" font-size="28" fill="#53627d" font-weight="400">示例：本地检测为英语，置信度80%。</text><rect x="28" y="154" width="664" height="220" rx="16" fill="white" stroke="#c8d4e4"/><text x="50" y="203" font-size="29" fill="#2864ae" font-weight="700">1. 主要：英语 / 次要：法语</text><text x="50" y="260" font-size="30" fill="#28374e" font-weight="400">阈值60%：80%达到阈值。</text><text x="50" y="320" font-size="32" fill="#23704a" font-weight="700">实际目标：法语</text><rect x="28" y="404" width="664" height="220" rx="16" fill="white" stroke="#c8d4e4"/><text x="50" y="453" font-size="29" fill="#2864ae" font-weight="700">2. 主要：英语 / 次要：法语</text><text x="50" y="510" font-size="30" fill="#28374e" font-weight="400">阈值90%：80%低于阈值。</text><text x="50" y="570" font-size="32" fill="#23704a" font-weight="700">实际目标：英语</text><rect x="28" y="654" width="664" height="220" rx="16" fill="white" stroke="#c8d4e4"/><text x="50" y="703" font-size="29" fill="#2864ae" font-weight="700">3. 主要：英语 / 次要：英语</text><text x="50" y="760" font-size="30" fill="#28374e" font-weight="400">两种目标语言相同。</text><text x="50" y="820" font-size="32" fill="#23704a" font-weight="700">实际目标：英语</text><text x="32" y="956" font-size="30" fill="#28374e" font-weight="400">指定源语言不会单独关闭这种目标切换。</text><text x="32" y="1017" font-size="30" fill="#28374e" font-weight="400">阈值可设范围：30%–100%</text><text x="32" y="1072" font-size="25" fill="#53627d" font-weight="400">操作示意</text></g></svg>