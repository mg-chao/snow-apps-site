<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" role="img" aria-labelledby="title desc"><title id="title">保持原应用中的文字选择，再调用动作</title><desc id="desc">取词为空时，返回来源重新选择，或手动复制到翻译页。操作示意。</desc><rect width="960" height="560" rx="24" fill="#f5f7fc" /><g font-family="system-ui,-apple-system,PingFang SC,Microsoft YaHei,sans-serif"><text x="36" y="52" font-size="30" fill="#18233b" font-weight="700">保持原应用中的文字选择，再调用动作</text><text x="36" y="88" font-size="20" fill="#53627d" font-weight="400">取词为空时，返回来源重新选择，或手动复制到翻译页</text><rect x="36" y="132" width="358" height="308" rx="16" fill="#ffffff" stroke="#c8d3e6" stroke-width="2" /><text x="58" y="180" font-size="25" fill="#18233b" font-weight="600">来源应用中的真实文字</text><rect x="58" y="219" width="310" height="55" rx="3" fill="#dce8ff" stroke="#dce8ff" stroke-width="2" /><text x="73" y="256" font-size="21" fill="#18233b" font-weight="400">Select a complete sentence.</text><text x="58" y="321" font-size="23" fill="#18233b" font-weight="400">① 拖选整句，保留焦点</text><text x="58" y="383" font-size="22" fill="#18233b" font-weight="400">② 翻译选中文本快捷动作</text><path d="M407 280 L470 280" fill="none" stroke="#6954d9" stroke-width="3" /><path d="M461 273 L470 280 L461 287" fill="none" stroke="#6954d9" stroke-width="3" /><rect x="489" y="132" width="435" height="141" rx="16" fill="#ffffff" stroke="#c8d3e6" stroke-width="2" /><rect x="510" y="151" width="193" height="38" rx="19" fill="#ede9fe" stroke="#ede9fe" stroke-width="2" /><text x="524" y="177" font-size="20" fill="#5941bd" font-weight="600">主界面：翻译页面</text><text x="514" y="238" font-size="24" fill="#18233b" font-weight="400">查看原文 → 等待译文</text><rect x="489" y="299" width="435" height="141" rx="16" fill="#ffffff" stroke="#c8d3e6" stroke-width="2" /><rect x="510" y="318" width="193" height="38" rx="19" fill="#ede9fe" stroke="#ede9fe" stroke-width="2" /><text x="524" y="344" font-size="20" fill="#5941bd" font-weight="600">启用独立翻译窗口</text><text x="514" y="406" font-size="24" fill="#18233b" font-weight="400">查看译文 → 复制并关闭</text><path d="M36 510 L924 510" fill="none" stroke="#dce3ef" stroke-width="1" /><text x="36" y="539" font-size="18" fill="#53627d" font-weight="400">Snow Shot · 操作示意</text></g></svg>