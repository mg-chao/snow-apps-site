<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560" role="img" aria-labelledby="title desc"><title id="title">裁剪：可编辑标注与已合成图片: 删除相同的40行</title><desc id="desc">操作示意. 删除40行后，两边底图B均移到y=105；只有可编辑箭头仍保留y=145。</desc><rect width="960" height="560" rx="20" fill="#f5f7fc"/><g font-family="system-ui,-apple-system,PingFang SC,Microsoft YaHei,sans-serif"><text x="28" y="42" font-size="28" fill="#24384f" font-weight="700" text-anchor="start">裁剪：可编辑标注与已合成图片</text><text x="28" y="77" font-size="19" fill="#536b83" font-weight="400" text-anchor="start">删除相同的40行</text><rect x="28" y="98" width="438" height="396" rx="8" fill="white" stroke="#c8d3e6" stroke-width="1.5" /><text x="48" y="133" font-size="22" fill="#7154d9" font-weight="650" text-anchor="start">本次可编辑标注</text><text x="72" y="161" font-size="18" fill="#536b83" font-weight="600" text-anchor="start">300 × 160 px</text><rect x="72" y="177" width="360" height="240" rx="0" fill="none" stroke="#aabbd2" stroke-width="1.5" stroke-dasharray="5 5"/><g transform="translate(72 177) scale(1.2)"><rect x="0" y="0" width="300" height="160" rx="0" fill="white" stroke="#aabbd2" stroke-width="1.5" /><rect x="20" y="20" width="110" height="40" rx="0" fill="#e5effa" stroke="none" stroke-width="1.5" /><text x="36" y="49" font-size="25" fill="#2877bd" font-weight="700" text-anchor="start">A</text><rect x="20" y="90" width="260" height="30" rx="0" fill="#dcefe9" stroke="none" stroke-width="1.5" /><text x="36" y="114" font-size="25" fill="#258568" font-weight="700" text-anchor="start">B</text><path d="M0 145 L300 145" fill="none" stroke="#aabbd2" stroke-width="1" stroke-dasharray="4 4"/><path d="M160 145 L260 145" fill="none" stroke="#7154d9" stroke-width="3"/><path d="M250.0 139.0 L260 145 L250.0 151.0" fill="none" stroke="#7154d9" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></g><text x="64" y="356.0" font-size="16" fill="#536b83" font-weight="400" text-anchor="end">145</text><text x="48" y="451" font-size="19" fill="#536b83" font-weight="400" text-anchor="start">B移到y = 105。</text><text x="48" y="478" font-size="19" fill="#536b83" font-weight="400" text-anchor="start">箭头仍在y = 145。</text><rect x="494" y="98" width="438" height="396" rx="8" fill="white" stroke="#c8d3e6" stroke-width="1.5" /><text x="514" y="133" font-size="22" fill="#7154d9" font-weight="650" text-anchor="start">保存再打开的图片</text><text x="538" y="161" font-size="18" fill="#536b83" font-weight="600" text-anchor="start">300 × 160 px</text><rect x="538" y="177" width="360" height="240" rx="0" fill="none" stroke="#aabbd2" stroke-width="1.5" stroke-dasharray="5 5"/><g transform="translate(538 177) scale(1.2)"><rect x="0" y="0" width="300" height="160" rx="0" fill="white" stroke="#aabbd2" stroke-width="1.5" /><rect x="20" y="20" width="110" height="40" rx="0" fill="#e5effa" stroke="none" stroke-width="1.5" /><text x="36" y="49" font-size="25" fill="#2877bd" font-weight="700" text-anchor="start">A</text><rect x="20" y="90" width="260" height="30" rx="0" fill="#dcefe9" stroke="none" stroke-width="1.5" /><text x="36" y="114" font-size="25" fill="#258568" font-weight="700" text-anchor="start">B</text><path d="M0 145 L300 145" fill="none" stroke="#aabbd2" stroke-width="1" stroke-dasharray="4 4"/><path d="M160 105 L260 105" fill="none" stroke="#7154d9" stroke-width="3"/><path d="M250.0 99.0 L260 105 L250.0 111.0" fill="none" stroke="#7154d9" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></g><text x="530" y="356.0" font-size="16" fill="#536b83" font-weight="400" text-anchor="end">145</text><text x="530" y="308.0" font-size="16" fill="#258568" font-weight="400" text-anchor="end">105</text><text x="514" y="451" font-size="19" fill="#536b83" font-weight="400" text-anchor="start">B与已合成箭头一起</text><text x="514" y="478" font-size="19" fill="#536b83" font-weight="400" text-anchor="start">移到y = 105。</text><path d="M28 509 L932 509" fill="none" stroke="#dbe3ef" stroke-width="1"/><text x="28" y="539" font-size="18" fill="#536b83" font-weight="400" text-anchor="start">相同裁剪范围与显示比例；比较箭头的位置。</text><text x="930" y="539" font-size="17" fill="#536b83" font-weight="400" text-anchor="end">操作示意</text></g></svg>