<svg xmlns="http://www.w3.org/2000/svg" width="440" height="610" viewBox="0 0 440 610" role="img" aria-labelledby="title desc"><title id="title">右键与双击保留哪些点: 右键结束，只保留A和B</title><desc id="desc">右键结束后路径停在B，原指针位置C以灰色参照表示未加入</desc><rect width="440" height="610" rx="15" fill="#f4f7fc"/><g font-family="system-ui,-apple-system,PingFang SC,Microsoft YaHei,sans-serif"><text x="24" y="34" font-size="23" fill="#263b51" font-weight="700" >右键与双击保留哪些点</text><text x="24" y="70" font-size="20" fill="#287dbc" font-weight="600" >右键结束，只保留A和B</text><g transform="translate(24 115)"><rect x="0" y="0" width="392" height="358" rx="11" fill="white" stroke="#d0dbe7" stroke-width="1.5" /><text x="18" y="31" font-size="21" fill="#7654d6" font-weight="600" >动作：右键结束</text><g transform="translate(18 65)"><rect x="0" y="0" width="356" height="236" rx="6" fill="#fafcfe" stroke="#c6d5e4" stroke-width="1.5" /><path d="M44 141 L151 67" fill="none" stroke="#d44f58" stroke-width="3" stroke-linecap="round"/><path d="M44 141 L151 67" fill="none" stroke="#d44f58" stroke-width="3" stroke-linecap="round"/><polygon points="151.00,67.00 144.80,77.37 139.11,69.14" fill="#d44f58"/><circle cx="44" cy="141" r="6" fill="white" stroke="#287dbc" stroke-width="2" /><text x="38" y="125" font-size="19" fill="#287dbc" font-weight="600" >A</text><circle cx="151" cy="67" r="6" fill="white" stroke="#287dbc" stroke-width="2" /><text x="145" y="51" font-size="19" fill="#287dbc" font-weight="600" >B</text><circle cx="297" cy="153" r="7" fill="none" stroke="#a6b4c2" stroke-width="2" stroke-dasharray="3 3"/><text x="310" y="159" font-size="19" fill="#a6b4c2" font-weight="400" >C</text><text x="18" y="213" font-size="19" fill="#263b51" font-weight="600" >只留下 A → B</text></g><text x="18" y="336" font-size="19" fill="#263b51" font-weight="400" >当前指针位置不会自动成为末点。</text></g><path d="M24 562 H416" stroke="#d9e2ed"/><text x="24" y="588" font-size="17" fill="#587087" font-weight="400" >操作示意</text></g></svg>