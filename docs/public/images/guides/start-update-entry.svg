<svg xmlns="http://www.w3.org/2000/svg" width="440" height="650" viewBox="0 0 440 650">
<title>从关于页检查更新</title>
<desc>定位检查更新按钮，等待检查，再按结果和安装渠道继续。</desc>
<style>text{font-family:Arial,"PingFang SC",sans-serif;fill:#243047} .muted{fill:#536174} .button{font-size:15px;font-weight:600}</style>
<rect width="440" height="650" rx="16" fill="#f4f5fc"/>
<text x="22" y="34" font-size="24" class="">主动检查更新</text>
<text x="22" y="62" font-size="16" class="muted">主窗口侧栏 → 关于</text>
<rect x="18" y="83" width="404" height="126" rx="10" fill="#fff" stroke="#cbd2df"/>
<circle cx="39" cy="105" r="13" fill="#7050c8"/>
<text x="39" y="110" text-anchor="middle" font-size="16" style="fill:#fff">1</text>
<text x="62" y="111" font-size="17" class="">在关于页开始检查</text>
<text x="35" y="146" font-size="17" class="">更新区域</text>
<rect x="244" y="152" width="155" height="36" rx="10" fill="#f6f4fe" stroke="#8770cc"/>
<text x="254" y="176" font-size="15" class="button">检查更新</text>
<text x="35" y="188" font-size="15" class="muted">单击按钮，等待检查。</text>
<path d="M220 213v19m-6-6 6 6 6-6" fill="none" stroke="#8b7db3" stroke-width="2"/>
<rect x="18" y="238" width="404" height="112" rx="10" fill="#fff" stroke="#cbd2df"/>
<circle cx="39" cy="261" r="13" fill="#7050c8"/>
<text x="39" y="266" text-anchor="middle" font-size="16" style="fill:#fff">2</text>
<text x="62" y="267" font-size="17" class="">查看检查状态</text>
<text x="35" y="303" font-size="18" class="">正在检查更新…</text>
<text x="35" y="330" font-size="15" class="muted">检查结束后再选择后续动作。</text>
<path d="M220 355v19m-6-6 6 6 6-6" fill="none" stroke="#8b7db3" stroke-width="2"/>
<rect x="18" y="381" width="404" height="217" rx="10" fill="#fff" stroke="#cbd2df"/>
<circle cx="39" cy="405" r="13" fill="#7050c8"/>
<text x="39" y="410" text-anchor="middle" font-size="16" style="fill:#fff">3</text>
<text x="62" y="411" font-size="17" class="">按结果和安装渠道继续</text>
<text x="35" y="447" font-size="17" class="">没有更新：当前已是最新版本</text>
<text x="35" y="477" font-size="16" class="muted">有更新时，官网下载版的操作：</text>
<text x="35" y="514" font-size="16" class="">Windows</text>
<rect x="158" y="489" width="241" height="36" rx="10" fill="#f6f4fe" stroke="#8770cc"/>
<text x="168" y="513" font-size="15" class="button">下载更新</text>
<text x="35" y="561" font-size="16" class="">macOS</text>
<rect x="158" y="536" width="241" height="36" rx="10" fill="#f6f4fe" stroke="#8770cc"/>
<text x="168" y="560" font-size="15" class="button">从 GitHub 下载</text>
<text x="35" y="585" font-size="14" class="muted">Mac 也可能显示“从 Gitee 下载”。</text>
<text x="22" y="631" font-size="13" class="muted">操作示意</text>
</svg>
