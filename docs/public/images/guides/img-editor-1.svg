<svg xmlns="http://www.w3.org/2000/svg" width="820" height="440" viewBox="0 0 820 440" role="img" aria-labelledby="title desc"><title id="title">打开图片与裁剪行列：打开图片并查看整图</title><desc id="desc">操作示意。第 1 帧：打开图片并查看整图。</desc><rect width="820" height="440" rx="16" fill="#f3f7fc" /><rect x="22" y="75" width="500" height="330" rx="10" fill="#fff" stroke="#d2deeb" /><rect x="540" y="75" width="260" height="330" rx="10" fill="#fff" stroke="#d2deeb" /><text x="25" y="39" font-size="25" fill="#26384c" font-weight="bold">打开图片与裁剪行列</text><text x="25" y="63" font-size="17" fill="#546c84" font-weight="normal">1 / 3　打开图片并查看整图</text><rect x="145" y="115" width="255" height="230" rx="6" fill="white" stroke="#8da7bf" /><rect x="160" y="145" width="215" height="8" rx="4" fill="#c6d4e2" stroke="#c6d4e2" /><rect x="160" y="183" width="185" height="8" rx="4" fill="#c6d4e2" stroke="#c6d4e2" /><rect x="160" y="221" width="205" height="8" rx="4" fill="#c6d4e2" stroke="#c6d4e2" /><rect x="160" y="259" width="170" height="8" rx="4" fill="#c6d4e2" stroke="#c6d4e2" /><text x="60" y="95" font-size="18" fill="#26384c" font-weight="normal">适应窗口 / 100% 是观看比例</text><text x="555" y="116" font-size="21" fill="#26384c" font-weight="bold">操作要点</text><text x="555" y="165" font-size="17" fill="#26384c" font-weight="normal">先看整图再定位内容</text><text x="555" y="215" font-size="17" fill="#26384c" font-weight="normal">垂直裁剪删除横向条带</text><text x="555" y="265" font-size="17" fill="#26384c" font-weight="normal">不是保留框内，而是移除条带</text><text x="555" y="355" font-size="17" fill="#546c84" font-weight="normal">按正文步骤操作</text><text x="555" y="385" font-size="16" fill="#546c84" font-weight="normal">操作示意</text></svg>