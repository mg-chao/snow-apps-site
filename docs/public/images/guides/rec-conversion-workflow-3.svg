<svg xmlns="http://www.w3.org/2000/svg" width="440" height="830" viewBox="0 0 440 830" role="img" aria-labelledby="title desc"><title id="title">图片转换的模型、复制与输出: 部分内容不代表完成</title><desc id="desc">出现结果不完整时，可先在预览右键复制保留现有内容。结果区域重试会清空这一轮生成内容，从头处理同一张图片。</desc><rect width="440" height="830" rx="16" fill="#f5f7fc"/><g font-family="system-ui,-apple-system,PingFang SC,Microsoft YaHei,sans-serif"><text x="24" y="35" font-size="23" fill="#24384f" font-weight="700">图片转换的模型、复制与输出</text><text x="24" y="70" font-size="20" fill="#267cba" font-weight="600">部分内容不代表完成</text><g transform="translate(0 111)"><g transform="translate(24 0)"><rect x="0" y="0" width="392" height="220" rx="11" fill="#fff" stroke="#d1dbE8" stroke-width="1.4" /><text x="18" y="30" font-size="22" fill="#c34d56" font-weight="650">结果不完整：连接中断</text><rect x="18" y="63" width="356" height="48" rx="6" fill="#f5f7fb" stroke="none" stroke-width="1.4" /><text x="29" y="93" font-size="20" fill="#24384f" font-weight="400"># Guide</text><rect x="18" y="124" width="84" height="39" rx="8" fill="#f1edfb" stroke="#bdb0ea" stroke-width="1.4" /><text x="32" y="151" font-size="20" fill="#7154d9" font-weight="600">重试</text><text x="18" y="196" font-size="20" fill="#24384f" font-weight="400">先右键复制，按需保留这一部分。</text></g><g transform="translate(24 237)"><rect x="0" y="0" width="392" height="140" rx="11" fill="#fff" stroke="#d1dbE8" stroke-width="1.4" /><text x="18" y="30" font-size="22" fill="#7154d9" font-weight="650">单击结果重试后</text><text x="18" y="81" font-size="20" fill="#24384f" font-weight="400">旧内容清空 → 重新生成</text><text x="18" y="116" font-size="20" fill="#24384f" font-weight="400">它不等于设置窗口的模型列表重试。</text></g></g><path d="M24 781 H416" stroke="#dce3ef"/><text x="24" y="808" font-size="17" fill="#536b83" font-weight="400">操作示意</text></g></svg>