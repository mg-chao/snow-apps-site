<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" role="img" aria-labelledby="title desc"><title id="title">新建文字贴图，用同一段纯文本比较</title><desc id="desc">设置 → 固定到屏幕 → 文本样式；来源富文本尽可能保留。操作示意。</desc><rect width="960" height="560" rx="24" fill="#f5f7fc" /><g font-family="system-ui,-apple-system,PingFang SC,Microsoft YaHei,sans-serif"><text x="36" y="52" font-size="30" fill="#18233b" font-weight="700">新建文字贴图，用同一段纯文本比较</text><text x="36" y="88" font-size="20" fill="#53627d" font-weight="400">设置 → 固定到屏幕 → 文本样式；来源富文本尽可能保留</text><rect x="36" y="140" width="524" height="301" rx="16" fill="#ffffff" stroke="#c8d3e6" stroke-width="2" /><rect x="56" y="158" width="190" height="38" rx="19" fill="#ede9fe" stroke="#ede9fe" stroke-width="2" /><text x="70" y="184" font-size="20" fill="#5941bd" font-weight="600">较宽的最大文本宽度</text><text x="62" y="259" font-size="24" fill="#18233b" font-weight="400">这段参考说明保持在较宽的文字框里。</text><text x="62" y="321" font-size="23" fill="#53627d" font-weight="400">字体 · 字号 · 文本颜色 · 背景颜色</text><text x="62" y="403" font-size="23" fill="#6954d9" font-weight="400">调整设置后，重新创建纯文本贴图</text><rect x="598" y="140" width="326" height="301" rx="16" fill="#ffffff" stroke="#c8d3e6" stroke-width="2" /><rect x="618" y="158" width="190" height="38" rx="19" fill="#ede9fe" stroke="#ede9fe" stroke-width="2" /><text x="632" y="184" font-size="20" fill="#5941bd" font-weight="600">较窄的最大文本宽度</text><text x="620" y="254" font-size="27" fill="#18233b" font-weight="400">同一段参考说明</text><text x="620" y="304" font-size="27" fill="#18233b" font-weight="400">在这里发生换行</text><text x="620" y="403" font-size="23" fill="#53627d" font-weight="400">宽度包含内边距</text><path d="M36 510 L924 510" fill="none" stroke="#dce3ef" stroke-width="1" /><text x="36" y="539" font-size="18" fill="#53627d" font-weight="400">Snow Shot · 操作示意</text></g></svg>