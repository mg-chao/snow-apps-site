<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="900" height="470" viewBox="0 0 900 470" role="img" aria-labelledby="title desc">
<title id="title">先识别占用再清理</title><desc id="desc">日志 ZIP 用于诊断；配置 ZIP 用于恢复设置，不能互相替代。</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#1677ff" /></marker></defs>
<rect width="900" height="470" rx="20" fill="#fff" />
<g font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif"><text x="30" y="47" font-size="30" fill="#163963" font-weight="700">先识别占用再清理</text><text x="30" y="79" font-size="18" fill="#62758e" font-weight="400">操作示意</text><rect x="30" y="112" width="263" height="265" rx="16" fill="#f2f6fc" stroke="#cbd8e9" stroke-width="2" /><circle cx="58" cy="142" r="20" fill="#1677ff" /><text x="51" y="150" font-size="24" fill="white" font-weight="700">1</text><text x="88" y="151" font-size="24" fill="#163963" font-weight="600">查看状态</text><rect x="318" y="112" width="263" height="265" rx="16" fill="#f2f6fc" stroke="#cbd8e9" stroke-width="2" /><circle cx="346" cy="142" r="20" fill="#1677ff" /><text x="339" y="150" font-size="24" fill="white" font-weight="700">2</text><text x="376" y="151" font-size="24" fill="#163963" font-weight="600">配置备份</text><rect x="606" y="112" width="263" height="265" rx="16" fill="#f2f6fc" stroke="#cbd8e9" stroke-width="2" /><circle cx="634" cy="142" r="20" fill="#1677ff" /><text x="627" y="150" font-size="24" fill="white" font-weight="700">3</text><text x="664" y="151" font-size="24" fill="#163963" font-weight="600">分类清理</text><text x="54" y="209" font-size="22" fill="#24344d" font-weight="400">目录 / 模式 / 错误</text><text x="54" y="261" font-size="22" fill="#24344d" font-weight="400">历史 / 贴图 / OCR</text><text x="54" y="314" font-size="23" fill="#24344d" font-weight="400">临时录屏占用</text><text x="341" y="209" font-size="24" fill="#24344d" font-weight="400">导出 → ZIP</text><path d="M437 227L437 265" stroke="#1677ff" stroke-width="4" marker-end="url(#a)" fill="none" /><text x="341" y="303" font-size="23" fill="#24344d" font-weight="400">粘贴保存归档</text><text x="341" y="350" font-size="21" fill="#24344d" font-weight="400">导入会替换设置</text><text x="630" y="209" font-size="23" fill="#24344d" font-weight="400">历史保留限制</text><text x="630" y="261" font-size="23" fill="#24344d" font-weight="400">已关闭贴图</text><text x="630" y="313" font-size="23" fill="#24344d" font-weight="400">录屏临时文件</text><text x="30" y="444" font-size="20" fill="#52647e" font-weight="400">日志 ZIP 用于诊断；配置 ZIP 用于恢复设置，不能互相替代。</text></g></svg>