<svg xmlns="http://www.w3.org/2000/svg" width="440" height="830" viewBox="0 0 440 830" role="img" aria-labelledby="title desc"><title id="title">图片转换的模型、复制与输出: 保存两份同名配套文件</title><desc id="desc">Markdown输出.md与同名.txt，HTML输出.html与同名.txt。保存完整源码，不按预览选区裁切；取消不替换现有文件，成功后结束截图。分别重开文档和TXT核对。</desc><rect width="440" height="830" rx="16" fill="#f5f7fc"/><g font-family="system-ui,-apple-system,PingFang SC,Microsoft YaHei,sans-serif"><text x="24" y="35" font-size="23" fill="#24384f" font-weight="700">图片转换的模型、复制与输出</text><text x="24" y="70" font-size="20" fill="#267cba" font-weight="600">保存两份同名配套文件</text><g transform="translate(0 111)"><g transform="translate(24 0)"><rect x="0" y="0" width="392" height="194" rx="11" fill="#fff" stroke="#d1dbE8" stroke-width="1.4" /><text x="18" y="30" font-size="22" fill="#7154d9" font-weight="650">Markdown示例</text><rect x="18" y="63" width="356" height="76" rx="6" fill="#f5f7fb" stroke="none" stroke-width="1.4" /><text x="29" y="93" font-size="20" fill="#24384f" font-weight="400">note.md</text><text x="29" y="121" font-size="20" fill="#24384f" font-weight="400">note.txt</text><text x="18" y="170" font-size="20" fill="#24384f" font-weight="400">两份都是本轮完整生成源码。</text></g><g transform="translate(24 211)"><rect x="0" y="0" width="392" height="159" rx="11" fill="#fff" stroke="#d1dbE8" stroke-width="1.4" /><text x="18" y="30" font-size="22" fill="#7154d9" font-weight="650">HTML示例</text><rect x="18" y="63" width="356" height="76" rx="6" fill="#f5f7fb" stroke="none" stroke-width="1.4" /><text x="29" y="93" font-size="20" fill="#24384f" font-weight="400">page.html</text><text x="29" y="121" font-size="20" fill="#24384f" font-weight="400">page.txt</text></g><g transform="translate(24 387)"><rect x="0" y="0" width="392" height="140" rx="11" fill="#fff" stroke="#d1dbE8" stroke-width="1.4" /><text x="18" y="30" font-size="22" fill="#7154d9" font-weight="650">取消或保存</text><text x="18" y="81" font-size="20" fill="#24384f" font-weight="400">取消 → 保留当前结果与原文件</text><text x="18" y="116" font-size="20" fill="#24384f" font-weight="400">保存成功 → 结束截图 → 打开文件检查</text></g></g><path d="M24 781 H416" stroke="#dce3ef"/><text x="24" y="808" font-size="17" fill="#536b83" font-weight="400">操作示意</text></g></svg>