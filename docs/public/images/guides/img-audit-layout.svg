<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" role="img" aria-labelledby="title desc"><title id="title">同一组图片，三种布局方向</title><desc id="desc">纵向串接、横向并排、自定义行列；先检查顺序再输出。原创操作示意。</desc><rect width="960" height="560" rx="22" fill="#f5f7fc" /><g font-family="system-ui,-apple-system,PingFang SC,Microsoft YaHei,sans-serif"><text x="35" y="50" font-size="29" fill="#1e293b" font-weight="700">同一组图片，三种布局方向</text><text x="35" y="86" font-size="20" fill="#53627d" font-weight="400">纵向串接、横向并排、自定义行列；先检查顺序再输出</text><rect x="36" y="132" width="277" height="331" rx="12" fill="#fff" stroke="#c8d3e6" stroke-width="2" /><rect x="52" y="148" width="115" height="38" rx="19" fill="#ede9fe" stroke="#ede9fe" stroke-width="2" /><text x="66" y="174" font-size="20" fill="#6146bd" font-weight="600">纵向</text><rect x="102" y="211" width="142" height="56" rx="5" fill="#e7e0fa" stroke="#7654c9" stroke-width="2" /><text x="114" y="243" font-size="22" fill="#7654c9" font-weight="600">A</text><rect x="102" y="282" width="142" height="56" rx="5" fill="#dcefe9" stroke="#268471" stroke-width="2" /><text x="114" y="314" font-size="22" fill="#268471" font-weight="600">B</text><rect x="102" y="353" width="142" height="56" rx="5" fill="#fce8d7" stroke="#c26b2c" stroke-width="2" /><text x="114" y="385" font-size="22" fill="#c26b2c" font-weight="600">C</text><rect x="342" y="132" width="277" height="331" rx="12" fill="#fff" stroke="#c8d3e6" stroke-width="2" /><rect x="358" y="148" width="115" height="38" rx="19" fill="#ede9fe" stroke="#ede9fe" stroke-width="2" /><text x="372" y="174" font-size="20" fill="#6146bd" font-weight="600">横向</text><rect x="358" y="251" width="71" height="125" rx="5" fill="#e7e0fa" stroke="#7654c9" stroke-width="2" /><text x="370" y="283" font-size="22" fill="#7654c9" font-weight="600">A</text><rect x="444" y="251" width="71" height="125" rx="5" fill="#dcefe9" stroke="#268471" stroke-width="2" /><text x="456" y="283" font-size="22" fill="#268471" font-weight="600">B</text><rect x="530" y="251" width="71" height="125" rx="5" fill="#fce8d7" stroke="#c26b2c" stroke-width="2" /><text x="542" y="283" font-size="22" fill="#c26b2c" font-weight="600">C</text><rect x="648" y="132" width="276" height="331" rx="12" fill="#fff" stroke="#c8d3e6" stroke-width="2" /><rect x="664" y="148" width="224" height="38" rx="19" fill="#ede9fe" stroke="#ede9fe" stroke-width="2" /><text x="678" y="174" font-size="20" fill="#6146bd" font-weight="600">自定义：2 行 × 2 列</text><rect x="670" y="221" width="111" height="85" rx="5" fill="#e7e0fa" stroke="#7654c9" stroke-width="2" /><text x="682" y="253" font-size="22" fill="#7654c9" font-weight="600">A</text><rect x="795" y="221" width="111" height="85" rx="5" fill="#dcefe9" stroke="#268471" stroke-width="2" /><text x="807" y="253" font-size="22" fill="#268471" font-weight="600">B</text><rect x="670" y="321" width="111" height="85" rx="5" fill="#fce8d7" stroke="#c26b2c" stroke-width="2" /><text x="682" y="353" font-size="22" fill="#c26b2c" font-weight="600">C</text><rect x="795" y="321" width="111" height="85" rx="5" fill="#f5f7fc" stroke="#c8d3e6" stroke-width="2" /><text x="48" y="490" font-size="21" fill="#53627d" font-weight="400">示例只讲解位置与顺序；实际输出范围取决于图片、尺寸策略、边框和间距。</text><path d="M35 511 L925 511" fill="none" stroke="#dbe3ef" stroke-width="1" /><text x="35" y="539" font-size="18" fill="#53627d" font-weight="400">Snow Shot · 操作示意</text></g></svg>