<svg xmlns="http://www.w3.org/2000/svg" width="440" height="830" viewBox="0 0 440 830" role="img" aria-labelledby="title desc"><title id="title">图片转换的模型、复制与输出: 设置窗口的重试刷新列表</title><desc id="desc">属性栏设置打开图像转换设置。列表加载失败时，检查连接后用这个窗口里的重试刷新；选可用视觉模型后确定。取消只放弃本次选择，不是结果重试。</desc><rect width="440" height="830" rx="16" fill="#f5f7fc"/><g font-family="system-ui,-apple-system,PingFang SC,Microsoft YaHei,sans-serif"><text x="24" y="35" font-size="23" fill="#24384f" font-weight="700">图片转换的模型、复制与输出</text><text x="24" y="70" font-size="20" fill="#267cba" font-weight="600">设置窗口的重试刷新列表</text><g transform="translate(0 111)"><g transform="translate(24 0)"><rect x="0" y="0" width="392" height="245" rx="11" fill="#fff" stroke="#d1dbE8" stroke-width="1.4" /><text x="18" y="30" font-size="22" fill="#7154d9" font-weight="650">图像转换设置</text><rect x="260" y="63" width="114" height="36" rx="8" fill="#f1edfb" stroke="#bdb0ea" stroke-width="1.4" /><text x="273" y="88" font-size="20" fill="#7154d9" font-weight="600">重试</text><text x="18" y="125" font-size="18" fill="#536b83" font-weight="400">视觉模型</text><rect x="18" y="133" width="356" height="42" rx="6" fill="#fff" stroke="#c8d3e6" stroke-width="1.4" /><text x="30" y="161" font-size="20" fill="#24384f" font-weight="400">从可用列表选择</text><rect x="18" y="184" width="84" height="39" rx="8" fill="#f1edfb" stroke="#bdb0ea" stroke-width="1.4" /><text x="32" y="211" font-size="20" fill="#7154d9" font-weight="600">确定</text><rect x="114" y="184" width="84" height="39" rx="8" fill="#f1edfb" stroke="#bdb0ea" stroke-width="1.4" /><text x="128" y="211" font-size="20" fill="#7154d9" font-weight="600">取消</text></g><g transform="translate(24 262)"><rect x="0" y="0" width="392" height="132" rx="11" fill="#fff" stroke="#d1dbE8" stroke-width="1.4" /><text x="18" y="30" font-size="22" fill="#7154d9" font-weight="650">模型来源</text><text x="18" y="81" font-size="20" fill="#24384f" font-weight="400">可用Snow Shot视觉模型，或支持图像</text><text x="18" y="108" font-size="20" fill="#24384f" font-weight="400">的自定义模型。</text></g></g><path d="M24 781 H416" stroke="#dce3ef"/><text x="24" y="808" font-size="17" fill="#536b83" font-weight="400">操作示意</text></g></svg>