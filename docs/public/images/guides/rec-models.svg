<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" role="img" aria-labelledby="title desc"><title id="title">先准备资源，再比较识别策略</title><desc id="desc">同一文字样例，分别测试模型和检测策略。操作示意。</desc><rect width="960" height="560" rx="24" fill="#f5f7fc" /><g font-family="system-ui,-apple-system,PingFang SC,Microsoft YaHei,sans-serif"><text x="36" y="52" font-size="30" fill="#18233b" font-weight="700">先准备资源，再比较识别策略</text><text x="36" y="88" font-size="20" fill="#53627d" font-weight="400">同一文字样例，分别测试模型和检测策略</text><rect x="36" y="122" width="195" height="38" rx="19" fill="#ede9fe" stroke="#ede9fe" stroke-width="2" /><text x="50" y="148" font-size="20" fill="#5941bd" font-weight="600">联网：准备并试用</text><path d="M240 142 L278 142" fill="none" stroke="#6954d9" stroke-width="3" /><path d="M269 135 L278 142 L269 149" fill="none" stroke="#6954d9" stroke-width="3" /><rect x="295" y="122" width="240" height="38" rx="19" fill="#e4f4ed" stroke="#e4f4ed" stroke-width="2" /><text x="309" y="148" font-size="20" fill="#167d69" font-weight="600">断网：重复同一识别任务</text><rect x="36" y="197" width="278" height="216" rx="16" fill="#ffffff" stroke="#c8d3e6" stroke-width="2" /><text x="58" y="243" font-size="26" fill="#18233b" font-weight="600">超小型 V6</text><text x="58" y="289" font-size="22" fill="#18233b" font-weight="400">优先减少模型开销</text><text x="58" y="330" font-size="22" fill="#18233b" font-weight="400">适合先做速度比较</text><text x="58" y="373" font-size="20" fill="#53627d" font-weight="400">以实际样例校对结果</text><rect x="341" y="197" width="278" height="216" rx="16" fill="#ffffff" stroke="#c8d3e6" stroke-width="2" /><text x="363" y="243" font-size="26" fill="#18233b" font-weight="600">小型 V6</text><text x="363" y="289" font-size="22" fill="#18233b" font-weight="400">默认模型类型</text><text x="363" y="330" font-size="22" fill="#18233b" font-weight="400">先用它建立比较基准</text><text x="363" y="373" font-size="20" fill="#53627d" font-weight="400">以实际样例校对结果</text><rect x="646" y="197" width="278" height="216" rx="16" fill="#ffffff" stroke="#c8d3e6" stroke-width="2" /><text x="668" y="243" font-size="26" fill="#18233b" font-weight="600">中型 V6</text><text x="668" y="289" font-size="22" fill="#18233b" font-weight="400">更多模型资源</text><text x="668" y="330" font-size="22" fill="#18233b" font-weight="400">检查设备负载与结果</text><text x="668" y="373" font-size="20" fill="#53627d" font-weight="400">以实际样例校对结果</text><text x="38" y="468" font-size="22" fill="#18233b" font-weight="400">常驻进程 → 减少启动等待　　模型热启动 → 预加载，额外占用内存</text><path d="M36 510 L924 510" fill="none" stroke="#dce3ef" stroke-width="1" /><text x="36" y="539" font-size="18" fill="#53627d" font-weight="400">Snow Shot · 操作示意</text></g></svg>