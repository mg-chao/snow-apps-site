<svg xmlns="http://www.w3.org/2000/svg" width="440" height="720" viewBox="0 0 440 720" role="img" aria-labelledby="title desc"><title id="title">读取条码并取得所需内容: 空结果要新建截图</title><desc id="desc">没有识别结果时先取消截图，放大原应用或只框一个码，再重新进入条码识别。这里没有通用的结果重试按钮，切走再切回可能仍显示本轮空结果。</desc><rect width="440" height="720" rx="16" fill="#f5f7fc"/><g font-family="system-ui,-apple-system,PingFang SC,Microsoft YaHei,sans-serif"><text x="24" y="35" font-size="23" fill="#24384f" font-weight="700">读取条码并取得所需内容</text><text x="24" y="70" font-size="20" fill="#267cba" font-weight="600">空结果要新建截图</text><g transform="translate(0 111)"><g transform="translate(24 0)"><rect x="0" y="0" width="392" height="105" rx="11" fill="#fff" stroke="#d1dbE8" stroke-width="1.4" /><text x="18" y="30" font-size="22" fill="#c34d56" font-weight="650">未识别到条码</text><text x="18" y="81" font-size="20" fill="#24384f" font-weight="400">取消截图 → 调整原图 → 新截图</text></g><g transform="translate(24 122)"><rect x="0" y="0" width="392" height="167" rx="11" fill="#fff" stroke="#d1dbE8" stroke-width="1.4" /><text x="18" y="30" font-size="22" fill="#7154d9" font-weight="650">若组件缺失或损坏</text><text x="18" y="81" font-size="20" fill="#24384f" font-weight="400">修复或重新安装完整版，再从新截图尝</text><text x="18" y="108" font-size="20" fill="#24384f" font-weight="400">试。</text><text x="18" y="143" font-size="20" fill="#24384f" font-weight="400">文字OCR模型与翻译API不是条码组件。</text></g></g><path d="M24 671 H416" stroke="#dce3ef"/><text x="24" y="698" font-size="17" fill="#536b83" font-weight="400">操作示意</text></g></svg>