<svg xmlns="http://www.w3.org/2000/svg" width="440" height="660" viewBox="0 0 440 660" role="img" aria-labelledby="title desc"><title id="title">原图与结果的两种对照方式: 旁侧参照另有设置</title><desc id="desc">在识别结果设置中开启显示原图预览；返回文字结果后，可把单独的原图参照与文字一起对照。这不是把显示原图按钮设为默认开启。</desc><rect width="440" height="660" rx="16" fill="#f5f7fc"/><g font-family="system-ui,-apple-system,PingFang SC,Microsoft YaHei,sans-serif"><text x="24" y="35" font-size="23" fill="#24384f" font-weight="700">原图与结果的两种对照方式</text><text x="24" y="70" font-size="20" fill="#267cba" font-weight="600">旁侧参照另有设置</text><g transform="translate(0 111)"><g transform="translate(24 0)"><rect x="0" y="0" width="392" height="144" rx="11" fill="#fff" stroke="#d1dbE8" stroke-width="1.4" /><text x="18" y="30" font-size="22" fill="#7154d9" font-weight="650">识别结果</text><text x="18" y="78" font-size="18" fill="#536b83" font-weight="400">显示原图预览</text><rect x="18" y="91" width="59" height="30" rx="15" fill="#7154d9" stroke="#7154d9" stroke-width="1.4" /><circle cx="62" cy="106" r="11" fill="white"/><text x="93" y="114" font-size="20" fill="#24384f" font-weight="400">开启</text></g><g transform="translate(24 161)"><rect x="0" y="0" width="392" height="131" rx="11" fill="#fff" stroke="#d1dbE8" stroke-width="1.4" /><text x="18" y="30" font-size="22" fill="#7154d9" font-weight="650">文字结果</text><rect x="18" y="63" width="356" height="48" rx="6" fill="#f5f7fb" stroke="none" stroke-width="1.4" /><text x="29" y="93" font-size="20" fill="#24384f" font-weight="400">Error code: O12</text></g><g transform="translate(24 309)"><rect x="0" y="0" width="392" height="131" rx="11" fill="#fff" stroke="#d1dbE8" stroke-width="1.4" /><text x="18" y="30" font-size="22" fill="#7154d9" font-weight="650">单独的原图参照</text><rect x="18" y="63" width="356" height="48" rx="6" fill="#f5f7fb" stroke="none" stroke-width="1.4" /><text x="29" y="93" font-size="20" fill="#24384f" font-weight="400">Error code: 012</text></g></g><path d="M24 611 H416" stroke="#dce3ef"/><text x="24" y="638" font-size="17" fill="#536b83" font-weight="400">操作示意</text></g></svg>