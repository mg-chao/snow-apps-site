<svg xmlns="http://www.w3.org/2000/svg" width="760" height="430" viewBox="0 0 760 430" role="img" aria-labelledby="title desc" font-family="system-ui,sans-serif"><title id="title">Alt 从中心缩放：松开保留新大小</title><desc id="desc">操作示意。结果范围变大但中心没有移动；Alt拖对象本体则是复制移动，不能混用。</desc><rect width="760" height="430" rx="12" fill="#f3f7fc" /><text x="24" y="34" font-size="25" fill="#24384f">Alt 从中心缩放</text><text x="24" y="63" font-size="18" fill="#536c86">松开保留新大小</text><rect x="18" y="80" width="724" height="260" rx="7" fill="white" stroke="#b9cce0" /><rect x="195" y="124" width="330" height="182" rx="7" fill="#e8f2fc" stroke="#2877bd" /><rect x="195" y="124" width="330" height="182" rx="0" fill="none" stroke="#2877bd" stroke-dasharray="5 5" /><rect x="191" y="120" width="8" height="8" rx="1" fill="white" stroke="#2877bd" /><rect x="521" y="120" width="8" height="8" rx="1" fill="white" stroke="#2877bd" /><rect x="191" y="302" width="8" height="8" rx="1" fill="white" stroke="#2877bd" /><rect x="521" y="302" width="8" height="8" rx="1" fill="white" stroke="#2877bd" /><path d="M350 215 L370 215" stroke="#d84d53" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" /><path d="M360 205 L360 225" stroke="#d84d53" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" /><text x="560" y="217" font-size="22" fill="#24384f">中心不动</text><rect x="260" y="160" width="200" height="110" rx="0" fill="none" stroke="#8ea9c3" stroke-dasharray="5 5" /><path d="M460 270 L525 306" stroke="#d84d53" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round" /><path d="M517.4095026948896 294.9372539276583 L525 306 L511.59550475906036 305.4347502006833" stroke="#d84d53" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round" /><path d="M260 160 L195 124" stroke="#d84d53" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round" /><path d="M202.59049730511038 135.06274607234172 L195 124 L208.40449524093958 124.56524979931675" stroke="#d84d53" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round" /><rect x="45" y="100" width="75" height="33" rx="5" fill="#e2effb" stroke="#2877bd" /><text x="57" y="123" font-size="18" fill="#2877bd">Alt</text><text x="26" y="364" font-size="18" fill="#24384f">结果范围变大但中心没有移动；Alt拖对象本体则是复制移动，不能混用。</text><text x="24" y="416" font-size="15" fill="#536c86">操作示意</text></svg>