<svg xmlns="http://www.w3.org/2000/svg" width="440" height="620" viewBox="0 0 440 620" role="img" aria-labelledby="title desc"><title id="title">丢弃草稿，还是退出截图: 换到图像编辑器：Esc丢草稿</title><desc id="desc">图像编辑器中Esc取消红色路径草稿，紫色已完成标注与底图保留</desc><rect width="440" height="620" rx="15" fill="#f4f7fc"/><g font-family="system-ui,-apple-system,PingFang SC,Microsoft YaHei,sans-serif"><text x="24" y="34" font-size="23" fill="#263b51" font-weight="700" >丢弃草稿，还是退出截图</text><text x="24" y="70" font-size="20" fill="#287dbc" font-weight="600" >换到图像编辑器：Esc丢草稿</text><g transform="translate(24 115)"><rect x="0" y="0" width="392" height="340" rx="11" fill="white" stroke="#d0dbe7" stroke-width="1.5" /><text x="18" y="31" font-size="21" fill="#7654d6" font-weight="600" >动作：图像编辑器中按Esc</text><g transform="translate(18 65)"><rect x="0" y="0" width="356" height="218" rx="6" fill="#fafcfe" stroke="#c6d5e4" stroke-width="1.5" /><rect x="46" y="54" width="98" height="3" rx="1" fill="#d9e2eb" stroke="none" stroke-width="1.5" /><rect x="46" y="64" width="82" height="3" rx="1" fill="#d9e2eb" stroke="none" stroke-width="1.5" /><rect x="46" y="74" width="106" height="3" rx="1" fill="#d9e2eb" stroke="none" stroke-width="1.5" /><rect x="36" y="36" width="130" height="67" rx="7" fill="none" stroke="#7654d6" stroke-width="1.5" /><path d="M222 92 L307 43" fill="none" stroke="#7654d6" stroke-width="4" stroke-linecap="round"/><polygon points="307.00,43.00 299.97,52.83 294.97,44.16" fill="#7654d6"/><text x="207" y="115" font-size="17" fill="#7654d6" font-weight="400" >已完成</text></g><text x="18" y="318" font-size="19" fill="#263b51" font-weight="400" >已完成标注保留；编辑器仍打开。</text></g><path d="M24 572 H416" stroke="#d9e2ed"/><text x="24" y="598" font-size="17" fill="#587087" font-weight="400" >操作示意</text></g></svg>