<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560" role="img"><title>选择切线方向，再设置数量或尺寸</title><g font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif"><rect x="0" y="0" width="960" height="560" rx="20" fill="#f5f7fc" stroke="none"/><text x="28" y="42" font-size="28" fill="#182e50" font-weight="700" text-anchor="start">选择切线方向，再设置数量或尺寸</text><text x="28" y="79" font-size="19" fill="#53647c" font-weight="400" text-anchor="start">同一张 300 × 180 px 图片；以下示例的重叠宽度均为 0。</text><rect x="26" y="108" width="288" height="378" rx="8" fill="#fff" stroke="#cbd5e4"/><rect x="43" y="126" width="254" height="35" rx="7" fill="#eef3fc" stroke="none"/><text x="55" y="151" font-size="23" fill="#334e78" font-weight="700" text-anchor="start">垂直</text><rect x="50.0" y="188.0" width="80.0" height="144.0" rx="0" fill="#e9ddff" stroke="#fff"/><text x="90.0" y="268.0" font-size="25" fill="#31425e" font-weight="600" text-anchor="middle">1</text><rect x="130.0" y="188.0" width="80.0" height="144.0" rx="0" fill="#d7eefc" stroke="#fff"/><text x="170.0" y="268.0" font-size="25" fill="#31425e" font-weight="600" text-anchor="middle">2</text><rect x="210.0" y="188.0" width="80.0" height="144.0" rx="0" fill="#d9f2e7" stroke="#fff"/><text x="250.0" y="268.0" font-size="25" fill="#31425e" font-weight="600" text-anchor="middle">3</text><rect x="50" y="188" width="240" height="144" rx="0" fill="none" stroke="#8b9bb2"/><path d="M130.0 188V332" stroke="#e85b6b" stroke-width="3" stroke-dasharray="7 5"/><path d="M210.0 188V332" stroke="#e85b6b" stroke-width="3" stroke-dasharray="7 5"/><text x="44" y="369" font-size="18" fill="#4b5e7c" font-weight="400" text-anchor="start">竖切线 → 左右片</text><text x="44" y="407" font-size="19" fill="#2d4773" font-weight="600" text-anchor="start">精确分割：宽度 100 px</text><text x="44" y="450" font-size="17" fill="#4b5e7c" font-weight="400" text-anchor="start">3 张，每张 100 × 180 px</text><rect x="336" y="108" width="288" height="378" rx="8" fill="#fff" stroke="#cbd5e4"/><rect x="353" y="126" width="254" height="35" rx="7" fill="#eef3fc" stroke="none"/><text x="365" y="151" font-size="23" fill="#334e78" font-weight="700" text-anchor="start">水平</text><rect x="360.0" y="188.0" width="240.0" height="48.0" rx="0" fill="#e9ddff" stroke="#fff"/><text x="480.0" y="220.0" font-size="25" fill="#31425e" font-weight="600" text-anchor="middle">1</text><rect x="360.0" y="236.0" width="240.0" height="48.0" rx="0" fill="#d7eefc" stroke="#fff"/><text x="480.0" y="268.0" font-size="25" fill="#31425e" font-weight="600" text-anchor="middle">2</text><rect x="360.0" y="284.0" width="240.0" height="48.0" rx="0" fill="#d9f2e7" stroke="#fff"/><text x="480.0" y="316.0" font-size="25" fill="#31425e" font-weight="600" text-anchor="middle">3</text><rect x="360" y="188" width="240" height="144" rx="0" fill="none" stroke="#8b9bb2"/><path d="M360 236.0H600" stroke="#e85b6b" stroke-width="3" stroke-dasharray="7 5"/><path d="M360 284.0H600" stroke="#e85b6b" stroke-width="3" stroke-dasharray="7 5"/><text x="354" y="369" font-size="18" fill="#4b5e7c" font-weight="400" text-anchor="start">横切线 → 上下片</text><text x="354" y="407" font-size="19" fill="#2d4773" font-weight="600" text-anchor="start">精确分割：高度 60 px</text><text x="354" y="450" font-size="17" fill="#4b5e7c" font-weight="400" text-anchor="start">3 张，每张 300 × 60 px</text><rect x="646" y="108" width="288" height="378" rx="8" fill="#fff" stroke="#cbd5e4"/><rect x="663" y="126" width="254" height="35" rx="7" fill="#eef3fc" stroke="none"/><text x="675" y="151" font-size="23" fill="#334e78" font-weight="700" text-anchor="start">网格</text><rect x="670.0" y="188.0" width="80.0" height="72.0" rx="0" fill="#e9ddff" stroke="#fff"/><text x="710.0" y="232.0" font-size="25" fill="#31425e" font-weight="600" text-anchor="middle">1</text><rect x="750.0" y="188.0" width="80.0" height="72.0" rx="0" fill="#d7eefc" stroke="#fff"/><text x="790.0" y="232.0" font-size="25" fill="#31425e" font-weight="600" text-anchor="middle">2</text><rect x="830.0" y="188.0" width="80.0" height="72.0" rx="0" fill="#d9f2e7" stroke="#fff"/><text x="870.0" y="232.0" font-size="25" fill="#31425e" font-weight="600" text-anchor="middle">3</text><rect x="670.0" y="260.0" width="80.0" height="72.0" rx="0" fill="#ffe9c8" stroke="#fff"/><text x="710.0" y="304.0" font-size="25" fill="#31425e" font-weight="600" text-anchor="middle">4</text><rect x="750.0" y="260.0" width="80.0" height="72.0" rx="0" fill="#f8dfec" stroke="#fff"/><text x="790.0" y="304.0" font-size="25" fill="#31425e" font-weight="600" text-anchor="middle">5</text><rect x="830.0" y="260.0" width="80.0" height="72.0" rx="0" fill="#dfebff" stroke="#fff"/><text x="870.0" y="304.0" font-size="25" fill="#31425e" font-weight="600" text-anchor="middle">6</text><rect x="670" y="188" width="240" height="144" rx="0" fill="none" stroke="#8b9bb2"/><path d="M750.0 188V332" stroke="#e85b6b" stroke-width="3" stroke-dasharray="7 5"/><path d="M830.0 188V332" stroke="#e85b6b" stroke-width="3" stroke-dasharray="7 5"/><path d="M670 260.0H910" stroke="#e85b6b" stroke-width="3" stroke-dasharray="7 5"/><text x="664" y="369" font-size="18" fill="#4b5e7c" font-weight="400" text-anchor="start">行与列 → 二维切片</text><text x="664" y="407" font-size="19" fill="#2d4773" font-weight="600" text-anchor="start">2 行 × 3 列</text><text x="664" y="450" font-size="17" fill="#4b5e7c" font-weight="400" text-anchor="start">6 张，每张 100 × 90 px</text><text x="28" y="530" font-size="18" fill="#53647c" font-weight="400" text-anchor="start">操作示意 · 长图按高度分段时选择“水平”；网格只按行列设置。</text></g></svg>
