<svg xmlns="http://www.w3.org/2000/svg" width="600" height="720" viewBox="0 0 600 720" role="img"><title>可读文件列表保留顺序与重复项</title><desc>剪贴板提供可读图片路径 B、C、B 时，按顺序追加三张，重复的 B 也会保留。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#487bd0"/></marker></defs><rect width="600" height="720" rx="20" fill="#f4f7fc"/><g font-family="Arial,PingFang SC,Microsoft YaHei,sans-serif"><text x="24" y="43" font-size="25" fill="#203858" font-weight="700" text-anchor="start">可读文件列表保留顺序与重复项</text><rect x="24" y="98" width="552" height="398" rx="12" fill="#fff" stroke="#c7d4e7" stroke-width="2"/><text x="48" y="135" font-size="21" fill="#233a5b" font-weight="400" text-anchor="start">剪贴板文件列表顺序</text><rect x="55" y="158" width="140" height="74" rx="7" fill="#c5dbf3" stroke="#8fa7c8" stroke-width="2"/><text x="125.0" y="207.0" font-size="32" fill="#345075" font-weight="600" text-anchor="middle">B</text><rect x="229" y="158" width="140" height="74" rx="7" fill="#cde8c9" stroke="#8fa7c8" stroke-width="2"/><text x="299.0" y="207.0" font-size="32" fill="#345075" font-weight="600" text-anchor="middle">C</text><rect x="403" y="158" width="140" height="74" rx="7" fill="#c5dbf3" stroke="#8fa7c8" stroke-width="2"/><text x="473.0" y="207.0" font-size="32" fill="#345075" font-weight="600" text-anchor="middle">B</text><path d="M300 251L300 286" stroke="#487bd0" stroke-width="4" marker-end="url(#arrow)"/><text x="48" y="328" font-size="21" fill="#233a5b" font-weight="400" text-anchor="start">粘贴后：A、B、C、B</text><rect x="48" y="355" width="102" height="94" rx="7" fill="#f3d0d7" stroke="#8fa7c8" stroke-width="2"/><g transform="translate(99.0 402.0) rotate(90)"><text x="-22" y="9" font-size="36" fill="#345075" font-weight="700" text-anchor="start">F</text><path d="M19 20L19 -25" stroke="#487bd0" stroke-width="4" marker-end="url(#arrow)"/></g><rect x="182" y="355" width="102" height="94" rx="7" fill="#c5dbf3" stroke="#8fa7c8" stroke-width="2"/><text x="233.0" y="414.0" font-size="32" fill="#345075" font-weight="600" text-anchor="middle">B</text><rect x="316" y="355" width="102" height="94" rx="7" fill="#cde8c9" stroke="#8fa7c8" stroke-width="2"/><text x="367.0" y="414.0" font-size="32" fill="#345075" font-weight="600" text-anchor="middle">C</text><rect x="450" y="355" width="102" height="94" rx="7" fill="#c5dbf3" stroke="#8fa7c8" stroke-width="2"/><text x="501.0" y="414.0" font-size="32" fill="#345075" font-weight="600" text-anchor="middle">B</text><rect x="24" y="516" width="552" height="144" rx="12" fill="#fff" stroke="#d2dced" stroke-width="2"/><text x="44" y="548" font-size="21" fill="#233a5b" font-weight="400" text-anchor="start">剪贴板提供可读图片路径 B、C、B 时，按顺序追加三</text><text x="44" y="578" font-size="21" fill="#233a5b" font-weight="400" text-anchor="start">张，重复的 B 也会保留。</text><text x="24" y="694" font-size="19" fill="#5a6c86" font-weight="400" text-anchor="start">操作示意</text><text x="548" y="694" font-size="19" fill="#5a6c86" font-weight="400" text-anchor="end">3/4</text></g></svg>
