<svg xmlns="http://www.w3.org/2000/svg" width="440" height="710" viewBox="0 0 440 710" role="img" aria-labelledby="title desc"><title id="title">公式源码：等待、纠错与保存: 预览错误不等于识别失败</title><desc id="desc">示例源码缺少分母参数，预览无法显示。补回参数或撤销最近编辑；已经取得源码时，不必为了修复预览重新识别图片。</desc><rect width="440" height="710" rx="16" fill="#f5f7fc"/><g font-family="system-ui,-apple-system,PingFang SC,Microsoft YaHei,sans-serif"><text x="24" y="35" font-size="23" fill="#24384f" font-weight="700">公式源码：等待、纠错与保存</text><text x="24" y="70" font-size="20" fill="#267cba" font-weight="600">预览错误不等于识别失败</text><g transform="translate(0 111)"><g transform="translate(24 0)"><rect x="0" y="0" width="392" height="131" rx="11" fill="#fff" stroke="#d1dbE8" stroke-width="1.4" /><text x="18" y="30" font-size="22" fill="#7154d9" font-weight="650">当前源码</text><rect x="18" y="63" width="356" height="48" rx="6" fill="#f5f7fb" stroke="none" stroke-width="1.4" /><text x="29" y="93" font-size="20" fill="#24384f" font-weight="400">\frac{x}</text></g><g transform="translate(24 148)"><rect x="0" y="0" width="392" height="133" rx="11" fill="#fff" stroke="#d1dbE8" stroke-width="1.4" /><text x="18" y="30" font-size="22" fill="#c34d56" font-weight="650">无法预览此公式。请检查 LaTeX 源</text><text x="18" y="58" font-size="22" fill="#c34d56" font-weight="650">码</text><text x="18" y="109" font-size="20" fill="#24384f" font-weight="400">补为 \frac{x}{2} → 等待预览更新</text></g></g><path d="M24 661 H416" stroke="#dce3ef"/><text x="24" y="688" font-size="17" fill="#536b83" font-weight="400">操作示意</text></g></svg>