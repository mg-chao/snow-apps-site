<svg xmlns="http://www.w3.org/2000/svg" width="760" height="430" viewBox="0 0 760 430" role="img" aria-labelledby="title desc" font-family="system-ui,sans-serif"><title id="title">折线箭头两次单击完成：单击起点</title><desc id="desc">操作示意。折线箭头模式下，在空白处单击起点；移开鼠标，准备确定终点。</desc><rect width="760" height="430" rx="12" fill="#f3f7fc" /><text x="24" y="34" font-size="25" fill="#24384f">折线箭头两次单击完成</text><text x="24" y="63" font-size="18" fill="#536c86">单击起点</text><rect x="18" y="80" width="724" height="260" rx="7" fill="white" stroke="#b9cce0" /><rect x="45" y="100" width="90" height="33" rx="5" fill="#e2effb" stroke="#2877bd" /><text x="57" y="123" font-size="18" fill="#2877bd">折线箭头</text><circle cx="110" cy="245" r="8" fill="white" stroke="#2877bd" stroke-width="2" /><text x="75" y="286" font-size="19" fill="#24384f">起点</text><text x="26" y="364" font-size="18" fill="#24384f">折线箭头模式下，在空白处单击起点；移开鼠标，准备确定终点。</text><text x="24" y="416" font-size="15" fill="#536c86">操作示意</text></svg>