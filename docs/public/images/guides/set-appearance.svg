<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="900" height="470" viewBox="0 0 900 470" role="img" aria-labelledby="title desc">
<title id="title">皮肤与界面可读性</title><desc id="desc">三个表面可独立选图；系统原生菜单仍使用系统外观。</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#1677ff" /></marker></defs>
<rect width="900" height="470" rx="20" fill="#fff" />
<g font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif"><text x="30" y="47" font-size="30" fill="#163963" font-weight="700">皮肤与界面可读性</text><text x="30" y="79" font-size="18" fill="#62758e" font-weight="400">操作示意</text><rect x="30" y="112" width="263" height="265" rx="16" fill="#f2f6fc" stroke="#cbd8e9" stroke-width="2" /><circle cx="58" cy="142" r="20" fill="#1677ff" /><text x="51" y="150" font-size="24" fill="white" font-weight="700">1</text><text x="88" y="151" font-size="24" fill="#163963" font-weight="600">选表面</text><rect x="318" y="112" width="263" height="265" rx="16" fill="#f2f6fc" stroke="#cbd8e9" stroke-width="2" /><circle cx="346" cy="142" r="20" fill="#1677ff" /><text x="339" y="150" font-size="24" fill="white" font-weight="700">2</text><text x="376" y="151" font-size="24" fill="#163963" font-weight="600">图片与位置</text><rect x="606" y="112" width="263" height="265" rx="16" fill="#f2f6fc" stroke="#cbd8e9" stroke-width="2" /><circle cx="634" cy="142" r="20" fill="#1677ff" /><text x="627" y="150" font-size="24" fill="white" font-weight="700">3</text><text x="664" y="151" font-size="24" fill="#163963" font-weight="600">共用参数</text><text x="53" y="211" font-size="25" fill="#24344d" font-weight="400">主界面</text><text x="53" y="265" font-size="25" fill="#24344d" font-weight="400">工具栏</text><text x="53" y="319" font-size="23" fill="#24344d" font-weight="400">自定义托盘菜单</text><rect x="347" y="187" width="204" height="131" rx="8" fill="#dcecf8" stroke="#9fc2ee" stroke-width="2" /><rect x="365" y="203" width="121" height="96" rx="5" fill="#a1c5df" stroke="#a1c5df" stroke-width="2" /><text x="350" y="353" font-size="21" fill="#24344d" font-weight="400">PNG / JPG / WebP</text><text x="630" y="204" font-size="23" fill="#24344d" font-weight="400">叠加 / 完整显示</text><text x="630" y="250" font-size="23" fill="#24344d" font-weight="400">图片不透明度</text><text x="630" y="296" font-size="23" fill="#24344d" font-weight="400">模糊与遮罩</text><text x="630" y="343" font-size="23" fill="#24344d" font-weight="400">保持文字清晰</text><text x="30" y="444" font-size="20" fill="#52647e" font-weight="400">三个表面可独立选图；系统原生菜单仍使用系统外观。</text></g></svg>