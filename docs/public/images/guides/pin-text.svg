<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" role="img" aria-labelledby="title desc"><title id="title">文字范围上的标记，与画布绘制分开</title><desc id="desc">先选文字；需要箭头或图形时，再进入标注模式。操作示意。</desc><rect width="960" height="560" rx="24" fill="#f5f7fc" /><g font-family="system-ui,-apple-system,PingFang SC,Microsoft YaHei,sans-serif"><text x="36" y="52" font-size="30" fill="#18233b" font-weight="700">文字范围上的标记，与画布绘制分开</text><text x="36" y="88" font-size="20" fill="#53627d" font-weight="400">先选文字；需要箭头或图形时，再进入标注模式</text><rect x="36" y="138" width="546" height="311" rx="16" fill="#ffffff" stroke="#c8d3e6" stroke-width="2" /><text x="63" y="189" font-size="26" fill="#18233b" font-weight="600">选中文字后的快速标注</text><rect x="63" y="222" width="197" height="39" rx="3" fill="#ffe799" stroke="#ffe799" stroke-width="2" /><text x="68" y="251" font-size="25" fill="#18233b" font-weight="400">高亮这一段文字</text><text x="68" y="314" font-size="25" fill="#18233b" font-weight="400">波浪线　下划线　删除线</text><path d="M68 324 q6 -10 12 0 t12 0 t12 0 t12 0 t12 0 t12 0" fill="none" stroke="#d85a45" stroke-width="3" /><path d="M190 326 L289 326" fill="none" stroke="#6954d9" stroke-width="3" /><path d="M321 305 L420 305" fill="none" stroke="#6954d9" stroke-width="3" /><rect x="65" y="377" width="146" height="38" rx="19" fill="#ede9fe" stroke="#ede9fe" stroke-width="2" /><text x="79" y="403" font-size="20" fill="#5941bd" font-weight="600">复制所选文本</text><rect x="615" y="138" width="309" height="311" rx="16" fill="#ffffff" stroke="#c8d3e6" stroke-width="2" /><rect x="635" y="158" width="135" height="38" rx="19" fill="#ede9fe" stroke="#ede9fe" stroke-width="2" /><text x="649" y="184" font-size="20" fill="#5941bd" font-weight="600">图片标注模式</text><path d="M652 280 L833 346" fill="none" stroke="#6954d9" stroke-width="7" /><path d="M833 346 L817 320" fill="none" stroke="#6954d9" stroke-width="7" /><path d="M833 346 L798 345" fill="none" stroke="#6954d9" stroke-width="7" /><text x="637" y="410" font-size="20" fill="#18233b" font-weight="400">确认编辑后，另行复制保存</text><path d="M36 510 L924 510" fill="none" stroke="#dce3ef" stroke-width="1" /><text x="36" y="539" font-size="18" fill="#53627d" font-weight="400">Snow Shot · 操作示意</text></g></svg>