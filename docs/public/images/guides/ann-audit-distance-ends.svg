<svg xmlns="http://www.w3.org/2000/svg" width="760" height="430" viewBox="0 0 760 430" role="img" aria-labelledby="title desc" font-family="system-ui,sans-serif"><title id="title">尺寸端点只改变标注外观：相同长度与比例，比较端点</title><desc id="desc">操作示意。切换端点样式与比例不会校准实际距离；测量端点、比例和单位要分别检查。</desc><rect width="760" height="430" rx="12" fill="#f3f7fc" /><text x="24" y="34" font-size="25" fill="#24384f">尺寸端点只改变标注外观</text><text x="24" y="63" font-size="18" fill="#536c86">相同长度与比例，比较端点</text><rect x="18" y="80" width="724" height="260" rx="7" fill="white" stroke="#b9cce0" /><text x="40" y="129" font-size="19" fill="#24384f">竖线端点 · 小</text><path d="M285 145 L665 145" stroke="#2877bd" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round" /><text x="435" y="133" font-size="21" fill="#24384f">10.00 cm</text><path d="M285 137.8 L285 152.2" stroke="#2877bd" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round" /><path d="M665 137.8 L665 152.2" stroke="#2877bd" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round" /><text x="40" y="204" font-size="19" fill="#24384f">箭头端点 · 普通</text><path d="M285 220 L665 220" stroke="#2877bd" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round" /><text x="435" y="208" font-size="21" fill="#24384f">10.00 cm</text><path d="M299 213 L285 220 L299 227" stroke="#2877bd" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round" /><path d="M651 213 L665 220 L651 227" stroke="#2877bd" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round" /><text x="40" y="279" font-size="19" fill="#24384f">箭头端点 · 较大</text><path d="M285 295 L665 295" stroke="#2877bd" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round" /><text x="435" y="283" font-size="21" fill="#24384f">10.00 cm</text><path d="M310.2 282.4 L285 295 L310.2 307.6" stroke="#2877bd" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round" /><path d="M639.8 282.4 L665 295 L639.8 307.6" stroke="#2877bd" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round" /><text x="26" y="364" font-size="18" fill="#24384f">切换端点样式与比例不会校准实际距离；测量端点、比例和单位要分别检查。</text><text x="24" y="416" font-size="15" fill="#536c86">操作示意</text></svg>