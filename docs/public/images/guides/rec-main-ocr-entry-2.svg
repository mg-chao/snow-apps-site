<svg xmlns="http://www.w3.org/2000/svg" width="440" height="720" viewBox="0 0 440 720" role="img" aria-labelledby="title desc"><title id="title">不用先绑定按键也能识别: 点动作标题，不是未设置</title><desc id="desc">单击文本识别这一行的标题或空白区域启动截图，确认选区后识别。右侧未设置按钮进入快捷键录入；想试用识别不需要先配置它。</desc><rect width="440" height="720" rx="16" fill="#f5f7fc"/><g font-family="system-ui,-apple-system,PingFang SC,Microsoft YaHei,sans-serif"><text x="24" y="35" font-size="23" fill="#24384f" font-weight="700">不用先绑定按键也能识别</text><text x="24" y="70" font-size="20" fill="#267cba" font-weight="600">点动作标题，不是未设置</text><g transform="translate(0 111)"><g transform="translate(24 0)"><rect x="0" y="0" width="392" height="144" rx="11" fill="#fff" stroke="#d1dbE8" stroke-width="1.4" /><text x="18" y="30" font-size="22" fill="#7154d9" font-weight="650">全局快捷键动作行</text><text x="18" y="78" font-size="18" fill="#536b83" font-weight="400">可单击的动作标题</text><rect x="18" y="86" width="356" height="42" rx="6" fill="#fff" stroke="#c8d3e6" stroke-width="1.4" /><text x="30" y="114" font-size="20" fill="#24384f" font-weight="400">文本识别</text></g><g transform="translate(24 161)"><rect x="0" y="0" width="392" height="140" rx="11" fill="#fff" stroke="#d1dbE8" stroke-width="1.4" /><text x="18" y="30" font-size="22" fill="#7154d9" font-weight="650">两个点击去向</text><text x="18" y="81" font-size="20" fill="#24384f" font-weight="400">标题或空白区域 → 启动截图识别</text><text x="18" y="116" font-size="20" fill="#24384f" font-weight="400">未设置 → 配置快捷键</text></g></g><path d="M24 671 H416" stroke="#dce3ef"/><text x="24" y="698" font-size="17" fill="#536b83" font-weight="400">操作示意</text></g></svg>