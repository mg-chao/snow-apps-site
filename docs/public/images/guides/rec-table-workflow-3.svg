<svg xmlns="http://www.w3.org/2000/svg" width="440" height="690" viewBox="0 0 440 690" role="img" aria-labelledby="title desc"><title id="title">表格的等待、重试与文件: 保存完整表格或临时打开</title><desc id="desc">保存为文件始终输出当前整表XLSX，不按局部选区裁切；取消保留编辑，成功后结束截图。打开电子表格文件则生成临时XLSX并交给默认应用，需要长期保留时再另存。</desc><rect width="440" height="690" rx="16" fill="#f5f7fc"/><g font-family="system-ui,-apple-system,PingFang SC,Microsoft YaHei,sans-serif"><text x="24" y="35" font-size="23" fill="#24384f" font-weight="700">表格的等待、重试与文件</text><text x="24" y="70" font-size="20" fill="#267cba" font-weight="600">保存完整表格或临时打开</text><g transform="translate(0 111)"><g transform="translate(24 0)"><rect x="0" y="0" width="392" height="214" rx="11" fill="#fff" stroke="#d1dbE8" stroke-width="1.4" /><text x="18" y="30" font-size="22" fill="#7154d9" font-weight="650">table.xlsx</text><rect x="18" y="63" width="116" height="42" rx="0" fill="#eaf0f8" stroke="#b9c9da" stroke-width="1.4" /><text x="28" y="91" font-size="20" fill="#24384f" font-weight="400">项目</text><rect x="134" y="63" width="116" height="42" rx="0" fill="#eaf0f8" stroke="#b9c9da" stroke-width="1.4" /><text x="144" y="91" font-size="20" fill="#24384f" font-weight="400">数量</text><rect x="250" y="63" width="116" height="42" rx="0" fill="#eaf0f8" stroke="#b9c9da" stroke-width="1.4" /><text x="260" y="91" font-size="20" fill="#24384f" font-weight="400">金额</text><rect x="18" y="105" width="116" height="42" rx="0" fill="white" stroke="#b9c9da" stroke-width="1.4" /><text x="28" y="133" font-size="20" fill="#24384f" font-weight="400">笔</text><rect x="134" y="105" width="116" height="42" rx="0" fill="white" stroke="#b9c9da" stroke-width="1.4" /><text x="144" y="133" font-size="20" fill="#24384f" font-weight="400">2</text><rect x="250" y="105" width="116" height="42" rx="0" fill="white" stroke="#b9c9da" stroke-width="1.4" /><text x="260" y="133" font-size="20" fill="#24384f" font-weight="400">80</text><rect x="18" y="147" width="116" height="42" rx="0" fill="white" stroke="#b9c9da" stroke-width="1.4" /><text x="28" y="175" font-size="20" fill="#24384f" font-weight="400">纸</text><rect x="134" y="147" width="116" height="42" rx="0" fill="white" stroke="#b9c9da" stroke-width="1.4" /><text x="144" y="175" font-size="20" fill="#24384f" font-weight="400">3</text><rect x="250" y="147" width="116" height="42" rx="0" fill="white" stroke="#b9c9da" stroke-width="1.4" /><text x="260" y="175" font-size="20" fill="#24384f" font-weight="400">60</text></g><g transform="translate(24 231)"><rect x="0" y="0" width="392" height="202" rx="11" fill="#fff" stroke="#d1dbE8" stroke-width="1.4" /><text x="18" y="30" font-size="22" fill="#7154d9" font-weight="650">两种去向</text><text x="18" y="81" font-size="20" fill="#24384f" font-weight="400">保存为文件 → 指定目录 → 重开核对</text><text x="18" y="116" font-size="20" fill="#24384f" font-weight="400">打开电子表格文件 → 临时XLSX → 默认</text><text x="18" y="143" font-size="20" fill="#24384f" font-weight="400">应用</text><text x="18" y="178" font-size="20" fill="#24384f" font-weight="400">取消保存 → 回到当前表格</text></g></g><path d="M24 641 H416" stroke="#dce3ef"/><text x="24" y="668" font-size="17" fill="#536b83" font-weight="400">操作示意</text></g></svg>