<svg xmlns="http://www.w3.org/2000/svg" width="820" height="440" viewBox="0 0 820 440" role="img" aria-labelledby="title desc"><title id="title">矩形、椭圆与菱形：Shift 等比绘制</title><desc id="desc">操作示意。第 2 帧：Shift 等比绘制。</desc><rect width="820" height="440" rx="16" fill="#f3f7fc" /><rect x="22" y="75" width="500" height="330" rx="10" fill="#fff" stroke="#d2deeb" /><rect x="540" y="75" width="260" height="330" rx="10" fill="#fff" stroke="#d2deeb" /><text x="25" y="39" font-size="25" fill="#26384c" font-weight="bold">矩形、椭圆与菱形</text><text x="25" y="63" font-size="17" fill="#546c84" font-weight="normal">2 / 3　Shift 等比绘制</text><rect x="135" y="125" width="190" height="190" rx="0" fill="none" stroke="#e34f52" stroke-width="3" /><text x="175" y="225" font-size="28" fill="#26384c" font-weight="normal">Shift</text><text x="125" y="345" font-size="18" fill="#26384c" font-weight="normal">等比 → 正方形 / 圆形</text><text x="555" y="116" font-size="21" fill="#26384c" font-weight="bold">操作要点</text><text x="555" y="165" font-size="17" fill="#26384c" font-weight="normal">拖动对角确定范围</text><text x="555" y="215" font-size="17" fill="#26384c" font-weight="normal">Shift 保持等比</text><text x="555" y="265" font-size="17" fill="#26384c" font-weight="normal">选中后可换形状和圆角</text><text x="555" y="355" font-size="17" fill="#546c84" font-weight="normal">按正文步骤操作</text><text x="555" y="385" font-size="16" fill="#546c84" font-weight="normal">操作示意</text></svg>