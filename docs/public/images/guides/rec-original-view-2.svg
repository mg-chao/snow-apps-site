<svg xmlns="http://www.w3.org/2000/svg" width="440" height="660" viewBox="0 0 440 660" role="img" aria-labelledby="title desc"><title id="title">原图与结果的两种对照方式: 切回输入，再切回结果</title><desc id="desc">开启显示原图后，文字结果暂时隐藏，输入图像里的012可用于校对。再单击同一按钮，回到上一帧的文字结果继续编辑。</desc><rect width="440" height="660" rx="16" fill="#f5f7fc"/><g font-family="system-ui,-apple-system,PingFang SC,Microsoft YaHei,sans-serif"><text x="24" y="35" font-size="23" fill="#24384f" font-weight="700">原图与结果的两种对照方式</text><text x="24" y="70" font-size="20" fill="#267cba" font-weight="600">切回输入，再切回结果</text><g transform="translate(0 111)"><g transform="translate(24 0)"><rect x="0" y="0" width="392" height="131" rx="11" fill="#fff" stroke="#d1dbE8" stroke-width="1.4" /><text x="18" y="30" font-size="22" fill="#7154d9" font-weight="650">显示原图：开启</text><rect x="18" y="63" width="356" height="48" rx="6" fill="#f5f7fb" stroke="none" stroke-width="1.4" /><text x="29" y="93" font-size="20" fill="#24384f" font-weight="400">Error code: 012</text></g><g transform="translate(24 148)"><rect x="0" y="0" width="392" height="105" rx="11" fill="#fff" stroke="#d1dbE8" stroke-width="1.4" /><text x="18" y="30" font-size="22" fill="#7154d9" font-weight="650">文字结果暂时隐藏</text><text x="18" y="81" font-size="20" fill="#24384f" font-weight="400">再单击同一按钮 → 返回结果</text></g></g><path d="M24 611 H416" stroke="#dce3ef"/><text x="24" y="638" font-size="17" fill="#536b83" font-weight="400">操作示意</text></g></svg>