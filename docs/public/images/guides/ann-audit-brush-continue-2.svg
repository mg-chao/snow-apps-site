<svg xmlns="http://www.w3.org/2000/svg" width="760" height="430" viewBox="0 0 760 430" role="img" aria-labelledby="title desc" font-family="system-ui,sans-serif"><title id="title">从笔画端点继续画：从端点按下继续拖</title><desc id="desc">操作示意。从反馈位置按住左键向外移动，新增部分接在原笔画末端。</desc><rect width="760" height="430" rx="12" fill="#f3f7fc" /><text x="24" y="34" font-size="25" fill="#24384f">从笔画端点继续画</text><text x="24" y="63" font-size="18" fill="#536c86">从端点按下继续拖</text><rect x="18" y="80" width="724" height="260" rx="7" fill="white" stroke="#b9cce0" /><path d="M80 245 Q165 125 280 225" stroke="#2877bd" stroke-width="7" fill="none" stroke-linecap="round" stroke-linejoin="round" /><circle cx="280" cy="225" r="11" fill="none" stroke="#d84d53" stroke-width="2" /><path d="M280 225 Q365 315 470 175 T645 190" stroke="#2877bd" stroke-width="7" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="8 5" /><text x="26" y="364" font-size="18" fill="#24384f">从反馈位置按住左键向外移动，新增部分接在原笔画末端。</text><text x="24" y="416" font-size="15" fill="#536c86">操作示意</text></svg>