<svg xmlns="http://www.w3.org/2000/svg" width="440" height="660" viewBox="0 0 440 660" role="img" aria-labelledby="title desc"><title id="title">原图与结果的两种对照方式: 先查看识别结果</title><desc id="desc">这是截图识别的结果状态。显示原图按钮尚未开启；先记住要校对的字符，再切换查看输入图像。</desc><rect width="440" height="660" rx="16" fill="#f5f7fc"/><g font-family="system-ui,-apple-system,PingFang SC,Microsoft YaHei,sans-serif"><text x="24" y="35" font-size="23" fill="#24384f" font-weight="700">原图与结果的两种对照方式</text><text x="24" y="70" font-size="20" fill="#267cba" font-weight="600">先查看识别结果</text><g transform="translate(0 111)"><g transform="translate(24 0)"><rect x="0" y="0" width="392" height="131" rx="11" fill="#fff" stroke="#d1dbE8" stroke-width="1.4" /><text x="18" y="30" font-size="22" fill="#7154d9" font-weight="650">显示原图：关闭</text><rect x="18" y="63" width="356" height="48" rx="6" fill="#f5f7fb" stroke="none" stroke-width="1.4" /><text x="29" y="93" font-size="20" fill="#24384f" font-weight="400">Error code: O12</text></g><g transform="translate(24 148)"><rect x="0" y="0" width="392" height="105" rx="11" fill="#fff" stroke="#d1dbE8" stroke-width="1.4" /><text x="18" y="30" font-size="22" fill="#7154d9" font-weight="650">下一步</text><text x="18" y="81" font-size="20" fill="#24384f" font-weight="400">在属性栏单击“显示原图”。</text></g></g><path d="M24 611 H416" stroke="#dce3ef"/><text x="24" y="638" font-size="17" fill="#536b83" font-weight="400">操作示意</text></g></svg>