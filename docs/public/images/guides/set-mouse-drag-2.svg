<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="900" height="470" viewBox="0 0 900 470" role="img" aria-labelledby="title desc">
<title id="title">激活按键加鼠标拖动</title><desc id="desc">保持按键，用指定鼠标键拖出范围。</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#1677ff" /></marker></defs>
<rect width="900" height="470" rx="20" fill="#fff" />
<g font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif"><text x="30" y="47" font-size="30" fill="#163963" font-weight="700">激活按键加鼠标拖动</text><text x="30" y="79" font-size="18" fill="#62758e" font-weight="400">操作示意</text><rect x="40" y="112" width="820" height="275" rx="12" fill="#f6f9fd" stroke="#cbd8e9" stroke-width="2" /><rect x="65" y="178" width="270" height="56" rx="9" fill="#fff" stroke="#9fc2ee" stroke-width="2" /><text x="83" y="216" font-size="23" fill="#24344d" font-weight="400">按住已配置激活按键</text><rect x="380" y="190" width="400" height="120" rx="4" fill="#e4efff" stroke="#1677ff" stroke-width="2" /><circle cx="380" cy="190" r="7" fill="#1677ff" /><path d="M392 204L760 300" stroke="#1677ff" stroke-width="4" marker-end="url(#a)" fill="none" /><text x="438" y="348" font-size="24" fill="#24344d" font-weight="400">用指定鼠标键拖动选区</text><text x="30" y="444" font-size="20" fill="#52647e" font-weight="400">保持按键，用指定鼠标键拖出范围。</text></g></svg>