<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" role="img" aria-labelledby="title desc"><title id="title">自动复制、结束或编辑，先看入口条件</title><desc id="desc">设置 → 截图 → 操作方式 → 文本识别后自动执行。操作示意。</desc><rect width="960" height="560" rx="24" fill="#f5f7fc" /><g font-family="system-ui,-apple-system,PingFang SC,Microsoft YaHei,sans-serif"><text x="36" y="52" font-size="30" fill="#18233b" font-weight="700">自动复制、结束或编辑，先看入口条件</text><text x="36" y="88" font-size="20" fill="#53627d" font-weight="400">设置 → 截图 → 操作方式 → 文本识别后自动执行</text><rect x="36" y="136" width="280" height="134" rx="16" fill="#ffffff" stroke="#c8d3e6" stroke-width="2" /><rect x="52" y="150" width="245" height="38" rx="19" fill="#ede9fe" stroke="#ede9fe" stroke-width="2" /><text x="66" y="176" font-size="20" fill="#5941bd" font-weight="600">不执行操作</text><text x="54" y="227" font-size="21" fill="#53627d" font-weight="400">保留结果，手动检查</text><rect x="340" y="136" width="280" height="134" rx="16" fill="#ffffff" stroke="#c8d3e6" stroke-width="2" /><rect x="356" y="150" width="245" height="38" rx="19" fill="#ede9fe" stroke="#ede9fe" stroke-width="2" /><text x="370" y="176" font-size="20" fill="#5941bd" font-weight="600">复制文本</text><text x="358" y="227" font-size="21" fill="#53627d" font-weight="400">复制后保持截图</text><rect x="644" y="136" width="280" height="134" rx="16" fill="#ffffff" stroke="#c8d3e6" stroke-width="2" /><rect x="660" y="150" width="245" height="38" rx="19" fill="#ede9fe" stroke="#ede9fe" stroke-width="2" /><text x="674" y="176" font-size="20" fill="#5941bd" font-weight="600">复制并结束截图</text><text x="662" y="227" font-size="21" fill="#53627d" font-weight="400">复制后回到其他应用</text><rect x="36" y="304" width="280" height="134" rx="16" fill="#ffffff" stroke="#c8d3e6" stroke-width="2" /><rect x="52" y="318" width="245" height="38" rx="19" fill="#ede9fe" stroke="#ede9fe" stroke-width="2" /><text x="66" y="344" font-size="20" fill="#5941bd" font-weight="600">复制文本（全局）</text><text x="54" y="395" font-size="21" fill="#53627d" font-weight="400">仅独立全局识别入口</text><rect x="340" y="304" width="280" height="134" rx="16" fill="#ffffff" stroke="#c8d3e6" stroke-width="2" /><rect x="356" y="318" width="245" height="38" rx="19" fill="#ede9fe" stroke="#ede9fe" stroke-width="2" /><text x="370" y="344" font-size="20" fill="#5941bd" font-weight="600">复制并结束（全局）</text><text x="358" y="395" font-size="21" fill="#53627d" font-weight="400">仅独立全局识别入口</text><rect x="644" y="304" width="280" height="134" rx="16" fill="#ffffff" stroke="#c8d3e6" stroke-width="2" /><rect x="660" y="318" width="245" height="38" rx="19" fill="#ede9fe" stroke="#ede9fe" stroke-width="2" /><text x="674" y="344" font-size="20" fill="#5941bd" font-weight="600">启用编辑模式</text><text x="662" y="395" font-size="21" fill="#53627d" font-weight="400">识别后直接修正文字</text><path d="M36 510 L924 510" fill="none" stroke="#dce3ef" stroke-width="1" /><text x="36" y="539" font-size="18" fill="#53627d" font-weight="400">Snow Shot · 操作示意</text></g></svg>