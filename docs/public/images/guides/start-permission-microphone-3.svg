<svg xmlns="http://www.w3.org/2000/svg" width="440" height="650" viewBox="0 0 440 650"><title>已授权后测试声音</title><rect width="440" height="650" rx="14" fill="#f5f7fc"/><g font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif"><text x="24" y="32" font-size="23" fill="#24384f" font-weight="400">已授权后测试声音</text><rect x="24" y="78" width="392" height="151" rx="10" fill="white" stroke="#c8d3e6" stroke-width="1.4" /><text x="40" y="108" font-size="21" fill="#7154d9" font-weight="400">应用权限</text><text x="40" y="139" font-size="20" fill="#24384f" font-weight="400">麦克风</text><rect x="232" y="175" width="168" height="42" rx="7" fill="#e9f6f0" stroke="#258568" stroke-width="1.4" /><text x="244" y="203" font-size="19" fill="#258568" font-weight="400">已授权</text><rect x="24" y="251" width="392" height="120" rx="10" fill="white" stroke="#c8d3e6" stroke-width="1.4" /><text x="40" y="280" font-size="21" fill="#7154d9" font-weight="400">权限引导自动收起</text><text x="40" y="313" font-size="20" fill="#24384f" font-weight="400">以应用内已授权状态为准。</text><rect x="24" y="392" width="392" height="213" rx="10" fill="white" stroke="#c8d3e6" stroke-width="1.4" /><text x="40" y="421" font-size="21" fill="#7154d9" font-weight="400">再录短片检查声音</text><text x="40" y="454" font-size="20" fill="#24384f" font-weight="400">选择 MP4，启用麦克风。开始 → 说一</text><text x="40" y="481" font-size="20" fill="#24384f" font-weight="400">句话 → 停止 → 回放，确认能听到自己</text><text x="40" y="508" font-size="20" fill="#24384f" font-weight="400">的声音。</text><path d="M24 620H416" stroke="#dbe3ef"/><text x="24" y="640" font-size="17" fill="#536b83" font-weight="400">操作示意</text></g></svg>
