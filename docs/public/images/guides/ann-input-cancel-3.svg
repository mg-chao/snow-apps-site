<svg xmlns="http://www.w3.org/2000/svg" width="440" height="620" viewBox="0 0 440 620" role="img" aria-labelledby="title desc"><title id="title">丢弃草稿，还是退出截图: 同一草稿：Esc退出截图</title><desc id="desc">默认Esc使截图标注层结束，回到原应用，本次结果未输出</desc><rect width="440" height="620" rx="15" fill="#f4f7fc"/><g font-family="system-ui,-apple-system,PingFang SC,Microsoft YaHei,sans-serif"><text x="24" y="34" font-size="23" fill="#263b51" font-weight="700" >丢弃草稿，还是退出截图</text><text x="24" y="70" font-size="20" fill="#287dbc" font-weight="600" >同一草稿：Esc退出截图</text><g transform="translate(24 115)"><rect x="0" y="0" width="392" height="340" rx="11" fill="white" stroke="#d0dbe7" stroke-width="1.5" /><text x="18" y="31" font-size="21" fill="#7654d6" font-weight="600" >动作：截图中按Esc</text><g transform="translate(18 65)"><rect x="0" y="0" width="356" height="218" rx="6" fill="#fafcfe" stroke="#c6d5e4" stroke-width="1.5" /><text x="22" y="43" font-size="22" fill="#263b51" font-weight="600" >回到原应用</text><rect x="22" y="70" width="275" height="7" rx="3" fill="#d1dce7" stroke="none" stroke-width="1.5" /><rect x="22" y="97" width="238" height="7" rx="3" fill="#d1dce7" stroke="none" stroke-width="1.5" /><rect x="22" y="124" width="266" height="7" rx="3" fill="#d1dce7" stroke="none" stroke-width="1.5" /><rect x="22" y="151" width="191" height="7" rx="3" fill="#d1dce7" stroke="none" stroke-width="1.5" /><text x="22" y="198" font-size="18" fill="#587087" font-weight="400" >本次截图未输出</text></g><text x="18" y="318" font-size="19" fill="#263b51" font-weight="400" >若显示退出确认，确认后关闭。</text></g><path d="M24 572 H416" stroke="#d9e2ed"/><text x="24" y="598" font-size="17" fill="#587087" font-weight="400" >操作示意</text></g></svg>