<svg xmlns="http://www.w3.org/2000/svg" width="960" height="480" viewBox="0 0 960 480" role="img" aria-labelledby="title"><title id="title">macOS 权限：按功能逐项处理（操作示意）</title><g font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif"><rect x="1" y="1" width="958" height="478" rx="12" fill="#f6f7fc" stroke="#cbd4e4" stroke-width="2" /><text x="30" y="43" font-size="28" fill="#263148">macOS 权限：按功能逐项处理</text><text x="30" y="460" font-size="18" fill="#536078">操作示意</text><rect x="30" y="80" width="900" height="65" rx="12" fill="#fff" stroke="#cbd4e4" stroke-width="2" /><circle cx="60" cy="112" r="19" fill="#7652dc" /><text x="53" y="120" font-size="23" fill="white">1</text><text x="95" y="120" font-size="24" fill="#263148">屏幕录制</text><text x="445" y="120" font-size="22" fill="#263148">截图与录屏画面</text><rect x="30" y="159" width="900" height="65" rx="12" fill="#fff" stroke="#cbd4e4" stroke-width="2" /><circle cx="60" cy="191" r="19" fill="#7652dc" /><text x="53" y="199" font-size="23" fill="white">2</text><text x="95" y="199" font-size="24" fill="#263148">辅助功能</text><text x="445" y="199" font-size="22" fill="#263148">需要系统控制的操作</text><rect x="30" y="238" width="900" height="65" rx="12" fill="#fff" stroke="#cbd4e4" stroke-width="2" /><circle cx="60" cy="270" r="19" fill="#7652dc" /><text x="53" y="278" font-size="23" fill="white">3</text><text x="95" y="278" font-size="24" fill="#263148">输入监控</text><text x="445" y="278" font-size="22" fill="#263148">全局键鼠与录制效果</text><rect x="30" y="317" width="900" height="65" rx="12" fill="#fff" stroke="#cbd4e4" stroke-width="2" /><circle cx="60" cy="349" r="19" fill="#7652dc" /><text x="53" y="357" font-size="23" fill="white">4</text><text x="95" y="357" font-size="24" fill="#263148">麦克风</text><text x="445" y="357" font-size="22" fill="#263148">录制自己的声音</text></g></svg>