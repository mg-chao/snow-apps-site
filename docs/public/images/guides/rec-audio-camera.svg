<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="900" height="470" viewBox="0 0 900 470" role="img" aria-labelledby="title desc">
<title id="title">声音与摄像头准备</title><desc id="desc">MP4 支持声音；动图格式无音频。先确认预览，再开始。</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#1677ff" /></marker></defs>
<rect width="900" height="470" rx="20" fill="#fff" />
<g font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif"><text x="30" y="47" font-size="30" fill="#163963" font-weight="700">声音与摄像头准备</text><text x="30" y="79" font-size="18" fill="#62758e" font-weight="400">操作示意</text><rect x="30" y="112" width="405" height="265" rx="16" fill="#f2f6fc" stroke="#cbd8e9" stroke-width="2" /><circle cx="58" cy="142" r="20" fill="#1677ff" /><text x="51" y="150" font-size="24" fill="white" font-weight="700">1</text><text x="88" y="151" font-size="24" fill="#163963" font-weight="600">两种音源分别确认</text><rect x="465" y="112" width="405" height="265" rx="16" fill="#f2f6fc" stroke="#cbd8e9" stroke-width="2" /><circle cx="493" cy="142" r="20" fill="#1677ff" /><text x="486" y="150" font-size="24" fill="white" font-weight="700">3</text><text x="523" y="151" font-size="24" fill="#163963" font-weight="600">摄像头布局</text><text x="60" y="202" font-size="24" fill="#24344d" font-weight="400">麦克风 → 人声</text><circle cx="78" cy="252" r="20" fill="#1677ff" /><text x="71" y="260" font-size="24" fill="white" font-weight="700">2</text><text x="112" y="261" font-size="24" fill="#24344d" font-weight="400">系统音频 → 电脑声</text><rect x="65" y="289" width="325" height="28" rx="6" fill="#e0f4e8" stroke="#bedbc8" stroke-width="2" /><rect x="68" y="292" width="213" height="22" rx="4" fill="#36a76a" stroke="#36a76a" stroke-width="2" /><text x="65" y="352" font-size="21" fill="#24344d" font-weight="400">悬停调增益：-24 ~ +24 dB</text><rect x="490" y="175" width="352" height="174" rx="8" fill="#edf6ff" stroke="#8bbcff" stroke-width="2" /><rect x="707" y="245" width="110" height="84" rx="8" fill="#d7eafa" stroke="#1677ff" stroke-width="2" /><text x="715" y="292" font-size="23" fill="#24344d" font-weight="400">摄像头</text><path d="M720 241L648 197" stroke="#1677ff" stroke-width="4" marker-end="url(#a)" fill="none" /><text x="501" y="211" font-size="21" fill="#24344d" font-weight="400">拖动位置</text><text x="500" y="369" font-size="20" fill="#24344d" font-weight="400">缩放 · 方形/圆形 · 旋转翻转</text><text x="30" y="444" font-size="20" fill="#52647e" font-weight="400">MP4 支持声音；动图格式无音频。先确认预览，再开始。</text></g></svg>