<svg xmlns="http://www.w3.org/2000/svg" width="440" height="650" viewBox="0 0 440 650"><title>打开系统开关再验证</title><rect width="440" height="650" rx="14" fill="#f5f7fc"/><g font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif"><text x="24" y="32" font-size="23" fill="#24384f" font-weight="400">打开系统开关再验证</text><rect x="24" y="78" width="392" height="150" rx="10" fill="white" stroke="#c8d3e6" stroke-width="1.4" /><text x="40" y="107" font-size="21" fill="#7154d9" font-weight="400">在系统设置中操作</text><text x="40" y="140" font-size="20" fill="#24384f" font-weight="400">找到当前 Snow Shot，打开权限开关。</text><text x="40" y="167" font-size="20" fill="#24384f" font-weight="400">若系统要求重新打开应用，按提示完成。</text><path d="M220 237v24m-7-7 7 7 7-7" fill="none" stroke="#267cba" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><rect x="24" y="278" width="392" height="151" rx="10" fill="white" stroke="#c8d3e6" stroke-width="1.4" /><text x="40" y="308" font-size="21" fill="#7154d9" font-weight="400">应用权限</text><text x="40" y="339" font-size="20" fill="#24384f" font-weight="400">屏幕与系统音频录制</text><rect x="232" y="375" width="168" height="42" rx="7" fill="#e9f6f0" stroke="#258568" stroke-width="1.4" /><text x="244" y="403" font-size="19" fill="#258568" font-weight="400">已授权</text><rect x="24" y="449" width="392" height="156" rx="10" fill="white" stroke="#c8d3e6" stroke-width="1.4" /><text x="40" y="478" font-size="21" fill="#7154d9" font-weight="400">还要检查实际结果</text><text x="40" y="511" font-size="20" fill="#24384f" font-weight="400">回到应用，执行一次相关动作；例如截</text><text x="40" y="538" font-size="20" fill="#24384f" font-weight="400">图后检查画面。拖入应用不等于已授权。</text><path d="M24 620H416" stroke="#dbe3ef"/><text x="24" y="640" font-size="17" fill="#536b83" font-weight="400">操作示意</text></g></svg>
