<svg xmlns="http://www.w3.org/2000/svg" width="440" height="620" viewBox="0 0 440 620" role="img" aria-labelledby="title desc"><title id="title">丢弃草稿，还是退出截图: 先区分成品与草稿</title><desc id="desc">截图画布上有紫色已完成标注和红色未完成路径，末段用虚线区分</desc><rect width="440" height="620" rx="15" fill="#f4f7fc"/><g font-family="system-ui,-apple-system,PingFang SC,Microsoft YaHei,sans-serif"><text x="24" y="34" font-size="23" fill="#263b51" font-weight="700" >丢弃草稿，还是退出截图</text><text x="24" y="70" font-size="20" fill="#287dbc" font-weight="600" >先区分成品与草稿</text><g transform="translate(24 115)"><rect x="0" y="0" width="392" height="340" rx="11" fill="white" stroke="#d0dbe7" stroke-width="1.5" /><text x="18" y="31" font-size="21" fill="#7654d6" font-weight="600" >截图中的标注草稿</text><g transform="translate(18 65)"><rect x="0" y="0" width="356" height="218" rx="6" fill="#fafcfe" stroke="#c6d5e4" stroke-width="1.5" /><rect x="46" y="54" width="98" height="3" rx="1" fill="#d9e2eb" stroke="none" stroke-width="1.5" /><rect x="46" y="64" width="82" height="3" rx="1" fill="#d9e2eb" stroke="none" stroke-width="1.5" /><rect x="46" y="74" width="106" height="3" rx="1" fill="#d9e2eb" stroke="none" stroke-width="1.5" /><rect x="36" y="36" width="130" height="67" rx="7" fill="none" stroke="#7654d6" stroke-width="1.5" /><path d="M222 92 L307 43" fill="none" stroke="#7654d6" stroke-width="4" stroke-linecap="round"/><polygon points="307.00,43.00 299.97,52.83 294.97,44.16" fill="#7654d6"/><text x="207" y="115" font-size="17" fill="#7654d6" font-weight="400" >已完成</text><path d="M47 177 L151 137" fill="none" stroke="#d44f58" stroke-width="3" stroke-linecap="round"/><path d="M151 137 L304 181" fill="none" stroke="#d44f58" stroke-width="3" stroke-linecap="round" stroke-dasharray="7 5"/><polygon points="304.00,181.00 292.05,182.77 294.81,173.15" fill="#d44f58"/><circle cx="47" cy="177" r="5" fill="white" stroke="#287dbc" stroke-width="2" /><circle cx="151" cy="137" r="5" fill="white" stroke="#287dbc" stroke-width="2" /><circle cx