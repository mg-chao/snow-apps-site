<svg xmlns="http://www.w3.org/2000/svg" width="600" height="720" viewBox="0 0 600 720" role="img"><title>复制图像后，返回拼接粘贴</title><desc>保留已有图片 A。复制图片 B，回到拼接预览，按 Ctrl+V（Mac 为 Command+V）。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#487bd0"/></marker></defs><rect width="600" height="720" rx="20" fill="#f4f7fc"/><g font-family="Arial,PingFang SC,Microsoft YaHei,sans-serif"><text x="24" y="43" font-size="25" fill="#203858" font-weight="700" text-anchor="start">复制图像后，返回拼接粘贴</text><rect x="24" y="98" width="552" height="398" rx="12" fill="#fff" stroke="#c7d4e7" stroke-width="2"/><text x="48" y="134" font-size="21" fill="#233a5b" font-weight="400" text-anchor="start">当前拼接</text><rect x="52" y="168" width="192" height="118" rx="7" fill="#f3d0d7" stroke="#8fa7c8" stroke-width="2"/><g transform="translate(148.0 227.0) rotate(90)"><text x="-22" y="9" font-size="36" fill="#345075" font-weight="700" text-anchor="start">F</text><path d="M19 20L19 -25" stroke="#487bd0" stroke-width="4" marker-end="url(#arrow)"/></g><text x="148" y="319" font-size="21" fill="#233a5b" font-weight="400" text-anchor="middle">A · 90°</text><rect x="330" y="168" width="210" height="118" rx="7" fill="#f6f9fd" stroke="#a8bbd7" stroke-width="2" stroke-dasharray="7 5"/><text x="435" y="223" font-size="19" fill="#233a5b" font-weight="400" text-anchor="middle">尚未加入</text><rect x="108" y="356" width="138" height="92" rx="7" fill="#c5dbf3" stroke="#8fa7c8" stroke-width="2"/><text x="177.0" y="414.0" font-size="32" fill="#345075" font-weight="600" text-anchor="middle">B</text><rect x="300" y="378" width="228" height="38" rx="7" fill="#ecf3fe" stroke="#9db8e0" stroke-width="2"/><text x="414.0" y="405" font-size="20" fill="#325a92" font-weight="600" text-anchor="middle">Ctrl+V / ⌘V</text><text x="48" y="478" font-size="20" fill="#233a5b" font-weight="400" text-anchor="start">剪贴板：图片 B</text><rect x="24" y="516" width="552" height="144" rx="12" fill="#fff" stroke="#d2dced" stroke-width="2"/><text x="44" y="548" font-size="21" fill="#233a5b" font-weight="400" text-anchor="start">保留已有图片 A。复制图片 B，回到拼接预览，按</text><text x="44" y="578" font-size="21" fill="#233a5b" font-weight="400" text-anchor="start">Ctrl+V（Mac 为 Command+V）。</text><text x="24" y="694" font-size="19" fill="#5a6c86" font-weight="400" text-anchor="start">操作示意</text><text x="548" y="694" font-size="19" fill="#5a6c86" font-weight="400" text-anchor="end">1/4</text></g></svg>
