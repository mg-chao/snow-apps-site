<svg xmlns="http://www.w3.org/2000/svg" width="820" height="440" viewBox="0 0 820 440" role="img" aria-labelledby="title desc"><title id="title">角度标注：点第一边端点</title><desc id="desc">操作示意。第 1 帧：点第一边端点。</desc><rect width="820" height="440" rx="16" fill="#f3f7fc" /><rect x="22" y="75" width="500" height="330" rx="10" fill="#fff" stroke="#d2deeb" /><rect x="540" y="75" width="260" height="330" rx="10" fill="#fff" stroke="#d2deeb" /><text x="25" y="39" font-size="25" fill="#26384c" font-weight="bold">角度标注</text><text x="25" y="63" font-size="17" fill="#546c84" font-weight="normal">1 / 3　点第一边端点</text><circle cx="120" cy="160" r="6" fill="white" stroke="#347ec7" stroke-width="2" /><circle cx="100" cy="145" r="12" fill="#347ec7" stroke="#347ec7" stroke-width="2" /><text x="95" y="151" font-size="17" fill="white" font-weight="bold">1</text><text x="75" y="110" font-size="18" fill="#26384c" font-weight="normal">第一边端点 → 顶点 → 第二边端点</text><text x="555" y="116" font-size="21" fill="#26384c" font-weight="bold">操作要点</text><text x="555" y="165" font-size="17" fill="#26384c" font-weight="normal">第一个位置在第一边外端</text><text x="555" y="215" font-size="17" fill="#26384c" font-weight="normal">第二个位置是顶点</text><text x="555" y="265" font-size="17" fill="#26384c" font-weight="normal">第三点确定另一条边和角弧</text><text x="555" y="355" font-size="17" fill="#546c84" font-weight="normal">按正文步骤操作</text><text x="555" y="385" font-size="16" fill="#546c84" font-weight="normal">操作示意</text></svg>