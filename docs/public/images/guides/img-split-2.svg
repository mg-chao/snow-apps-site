<svg xmlns="http://www.w3.org/2000/svg" width="820" height="440" viewBox="0 0 820 440" role="img" aria-labelledby="title desc"><title id="title">图片分割与手动切线：在标尺加线并拖动修正</title><desc id="desc">操作示意。第 2 帧：在标尺加线并拖动修正。</desc><rect width="820" height="440" rx="16" fill="#f3f7fc" /><rect x="22" y="75" width="500" height="330" rx="10" fill="#fff" stroke="#d2deeb" /><rect x="540" y="75" width="260" height="330" rx="10" fill="#fff" stroke="#d2deeb" /><text x="25" y="39" font-size="25" fill="#26384c" font-weight="bold">图片分割与手动切线</text><text x="25" y="63" font-size="17" fill="#546c84" font-weight="normal">2 / 3　在标尺加线并拖动修正</text><rect x="165" y="110" width="220" height="230" rx="6" fill="#eef4fb" stroke="#8da7bf" /><line x1="185" y1="135" x2="365" y2="135" stroke="#aabfce" stroke-width="5" /><line x1="185" y1="160" x2="365" y2="160" stroke="#aabfce" stroke-width="5" /><line x1="185" y1="190" x2="365" y2="190" stroke="#aabfce" stroke-width="5" /><line x1="185" y1="225" x2="365" y2="225" stroke="#aabfce" stroke-width="5" /><line x1="185" y1="255" x2="365" y2="255" stroke="#aabfce" stroke-width="5" /><line x1="185" y1="290" x2="365" y2="290" stroke="#aabfce" stroke-width="5" /><line x1="185" y1="320" x2="365" y2="320" stroke="#aabfce" stroke-width="5" /><line x1="150" y1="200" x2="405" y2="200" stroke="#e34f52" stroke-width="2" stroke-dasharray="5 4" /><circle cx="150" cy="200" r="6" fill="white" stroke="#347ec7" stroke-width="2" /><line x1="150" y1="275" x2="405" y2="275" stroke="#e34f52" stroke-width="2" stroke-dasharray="5 4" /><circle cx="150" cy="275" r="6" fill="white" stroke="#347ec7" stroke-width="2" /><line x1="425" y1="180" x2="425" y2="200" stroke="#e34f52" stroke-width="3" /><path d="M415 194 L425 200 L415 206" stroke="#e34f52" stroke-width="3" fill="none" stroke-linejoin="round" stroke-linecap="round" /><text x="65" y="95" font-size="18" fill="#26384c" font-weight="normal">点击标尺加线，拖线修正位置</text><text x="555" y="116" font-size="21" fill="#26384c" font-weight="bold">操作要点</text><text x="555" y="165" font-size="17" fill="#26384c" font-weight="normal">自动结果先看分界</text><text x="555" y="215" font-size="17" fill="#26384c" font-weight="normal">切线可新增、移动与删除</text><text x="555" y="265" font-size="17" fill="#26384c" font-weight="normal">确认所有切片后保存全部</text><text x="555" y="355" font-size="17" fill="#546c84" font-weight="normal">按正文步骤操作</text><text x="555" y="385" font-size="16" fill="#546c84" font-weight="normal">操作示意</text></svg>