<svg xmlns="http://www.w3.org/2000/svg" width="760" height="430" viewBox="0 0 760 430" role="img" aria-labelledby="title desc" font-family="system-ui,sans-serif"><title id="title">右键临时选择与移动：保持画笔工具</title><desc id="desc">操作示意。此时没有正在绘制的笔画；在同类已有笔画上准备临时选择。</desc><rect width="760" height="430" rx="12" fill="#f3f7fc" /><text x="24" y="34" font-size="25" fill="#24384f">右键临时选择与移动</text><text x="24" y="63" font-size="18" fill="#536c86">保持画笔工具</text><rect x="18" y="80" width="724" height="260" rx="7" fill="white" stroke="#b9cce0" /><rect x="40" y="100" width="105" height="33" rx="5" fill="#e2effb" stroke="#2877bd" /><text x="52" y="123" font-size="18" fill="#2877bd">当前：画笔</text><path d="M110 250 Q190 140 290 235 T470 200" stroke="#2877bd" stroke-width="7" fill="none" stroke-linecap="round" stroke-linejoin="round" /><text x="26" y="364" font-size="18" fill="#24384f">此时没有正在绘制的笔画；在同类已有笔画上准备临时选择。</text><text x="24" y="416" font-size="15" fill="#536c86">操作示意</text></svg>