<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1330" viewBox="0 0 720 1330" role="img" aria-labelledby="title desc">
<title id="title">在二次确认中取消目录切换</title>
<desc id="desc">在开始处理前放弃，保留当前有效目录。 填写目标目录草稿 → 取消“更改存储目录？” → 继续调整，或退出草稿</desc>
<rect width="720" height="1330" rx="24" fill="#f3f6fb"/>
<g font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif">
<text x="32" y="37" font-size="22" fill="#58708d" font-weight="600">操作示意 · Windows</text>
<text x="32" y="84" font-size="32" fill="#172e50" font-weight="700">在二次确认中取消目录切换</text>
<text x="32" y="157" font-size="23" fill="#4c6481" font-weight="400">在开始处理前放弃，保留当前有效目录。</text>
<rect x="32" y="188" width="656" height="316" rx="18" fill="#fff" stroke="#c8d4e4" stroke-width="2"/>
<rect x="48" y="204" width="624" height="64" rx="12" fill="#eaf0ff"/>
<circle cx="78" cy="236" r="21" fill="#2c57a5"/>
<text x="71" y="245" font-size="26" fill="#fff" font-weight="700">1</text>
<text x="112" y="246" font-size="28" fill="#2c57a5" font-weight="700">填写目标目录草稿</text>
<text x="58" y="314" font-size="28" fill="#33465e" font-weight="400">当前有效目录为 A。</text>
<text x="58" y="356" font-size="28" fill="#33465e" font-weight="400">存储目录 → 选择目录</text>
<text x="58" y="398" font-size="28" fill="#33465e" font-weight="400">在弹窗中填写新目标 B。</text>
<text x="58" y="440" font-size="28" fill="#33465e" font-weight="400">点击外层确定，进入下一层确认。</text>
<path d="M360 515v23m-10-10 10 10 10-10" fill="none" stroke="#7890ad" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="32" y="550" width="656" height="316" rx="18" fill="#fff" stroke="#c8d4e4" stroke-width="2"/>
<rect x="48" y="566" width="624" height="64" rx="12" fill="#fff2da"/>
<circle cx="78" cy="598" r="21" fill="#865414"/>
<text x="71" y="607" font-size="26" fill="#fff" font-weight="700">2</text>
<text x="112" y="608" font-size="28" fill="#865414" font-weight="700">取消“更改存储目录？”</text>
<text x="58" y="676" font-size="28" fill="#33465e" font-weight="400">核对目标 B 与将要处理的数据范围。</text>
<text x="58" y="718" font-size="28" fill="#33465e" font-weight="400">在这层确认中点击取消。</text>
<text x="58" y="760" font-size="28" fill="#33465e" font-weight="400">此次目录切换尚未开始。</text>
<path d="M360 877v23m-10-10 10 10 10-10" fill="none" stroke="#7890ad" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="32" y="912" width="656" height="316" rx="18" fill="#fff" stroke="#c8d4e4" stroke-width="2"/>
<rect x="48" y="928" width="624" height="64" rx="12" fill="#e6f6ee"/>
<circle cx="78" cy="960" r="21" fill="#20614a"/>
<text x="71" y="969" font-size="26" fill="#fff" font-weight="700">3</text>
<text x="112" y="970" font-size="28" fill="#20614a" font-weight="700">继续调整，或退出草稿</text>
<text x="58" y="1038" font-size="28" fill="#33465e" font-weight="400">当前有效目录仍为 A。</text>
<text x="58" y="1080" font-size="28" fill="#33465e" font-weight="400">目录设置窗口仍可调整。</text>
<text x="58" y="1122" font-size="28" fill="#33465e" font-weight="400">要退出草稿，再取消目录设置窗口。</text>
<text x="58" y="1164" font-size="28" fill="#33465e" font-weight="400">原有数据仍由 A 提供。</text>
<text x="32" y="1284" font-size="23" fill="#4c6481" font-weight="400">开始处理后，取消和关闭暂不可用。</text>
</g>
</svg>
