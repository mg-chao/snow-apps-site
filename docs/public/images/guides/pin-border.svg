<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" role="img" aria-labelledby="title desc"><title id="title">边框与阴影，用来分辨窗口状态</title><desc id="desc">当前窗口菜单控制显示；设置决定新建默认与状态颜色。操作示意。</desc><rect width="960" height="560" rx="24" fill="#f5f7fc" /><g font-family="system-ui,-apple-system,PingFang SC,Microsoft YaHei,sans-serif"><text x="36" y="52" font-size="30" fill="#18233b" font-weight="700">边框与阴影，用来分辨窗口状态</text><text x="36" y="88" font-size="20" fill="#53627d" font-weight="400">当前窗口菜单控制显示；设置决定新建默认与状态颜色</text><rect x="36" y="144" width="279" height="300" rx="16" fill="#ffffff" stroke="#c8d3e6" stroke-width="2" /><rect x="53" y="162" width="239" height="38" rx="19" fill="#ede9fe" stroke="#ede9fe" stroke-width="2" /><text x="67" y="188" font-size="20" fill="#5941bd" font-weight="600">普通：边框 / 阴影颜色</text><rect x="72" y="236" width="203" height="130" rx="9" fill="#ffffff" stroke="#53627d" stroke-width="2" /><text x="95" y="310" font-size="24" fill="#53627d" font-weight="600">参考贴图</text><rect x="341" y="144" width="279" height="300" rx="16" fill="#ffffff" stroke="#c8d3e6" stroke-width="2" /><rect x="358" y="162" width="239" height="38" rx="19" fill="#ede9fe" stroke="#ede9fe" stroke-width="2" /><text x="372" y="188" font-size="20" fill="#5941bd" font-weight="600">获得焦点：激活颜色</text><rect x="377" y="236" width="203" height="130" rx="9" fill="#ffffff" stroke="#6954d9" stroke-width="2" /><text x="400" y="310" font-size="24" fill="#6954d9" font-weight="600">当前正在使用</text><rect x="646" y="144" width="279" height="300" rx="16" fill="#ffffff" stroke="#c8d3e6" stroke-width="2" /><rect x="663" y="162" width="239" height="38" rx="19" fill="#ede9fe" stroke="#ede9fe" stroke-width="2" /><text x="677" y="188" font-size="20" fill="#5941bd" font-weight="600">已锁定：锁定颜色</text><rect x="682" y="236" width="203" height="130" rx="9" fill="#ffffff" stroke="#c96520" stroke-width="2" /><text x="705" y="310" font-size="24" fill="#c96520" font-weight="600">防止误移动</text><text x="38" y="484" font-size="22" fill="#53627d" font-weight="400">图中颜色只用于区分状态；请按自己的主题设置。</text><path d="M36 510 L924 510" fill="none" stroke="#dce3ef" stroke-width="1" /><text x="36" y="539" font-size="18" fill="#53627d" font-weight="400">Snow Shot · 操作示意</text></g></svg>