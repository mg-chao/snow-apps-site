<svg xmlns="http://www.w3.org/2000/svg" width="440" height="730" viewBox="0 0 440 730" role="img" aria-labelledby="title desc"><title id="title">文字结果的保存按钮: 悬停核对保存为文件</title><desc id="desc">这是保存为文件按钮的图标。保持图像编辑器中的文本识别结果，悬停核对名称后单击，选择TXT位置；取消保留文字，保存后重开TXT核对。这个文字输出不同于保存原始图片。</desc><rect width="440" height="730" rx="16" fill="#f5f7fc"/><g font-family="system-ui,-apple-system,PingFang SC,Microsoft YaHei,sans-serif"><text x="24" y="35" font-size="23" fill="#24384f" font-weight="700">文字结果的保存按钮</text><text x="24" y="70" font-size="20" fill="#267cba" font-weight="600">悬停核对保存为文件</text><g transform="translate(0 111)"><g transform="translate(24 0)"><rect x="0" y="0" width="392" height="120" rx="11" fill="#fff" stroke="#d1dbE8" stroke-width="1.4" /><text x="18" y="30" font-size="22" fill="#7154d9" font-weight="650">保存为文件</text><rect x="18" y="63" width="58" height="58" rx="9" fill="#f0edfb" stroke="#bdb0ea" stroke-width="1.4" /><g transform="translate(26 71) scale(0.041015625)"><path d="M198.4 64h456.96q33.6 0 57.12 23.52l170.24 170.24q23.52 23.52 23.52 57.12v564.48q0 80.64-80.64 80.64H198.4q-80.64 0-80.64-80.64V144.64q0-80.64 80.64-80.64Zm0 80.64v734.72h98.56V592.64q0-80.64 80.64-80.64h268.8q80.64 0 80.64 80.64v286.72h98.56V314.88L655.36 144.64v161.28q0 80.64-80.64 80.64H413.44q-80.64 0-80.64-80.64V144.64H198.4Zm215.04 0v161.28h161.28V144.64H413.44Zm-35.84 448v286.72h268.8V592.64H377.6Z" fill="#7154d9" fill-rule="evenodd"/></g><text x="90" y="88" font-size="20" fill="#24384f" font-weight="400">悬停提示：保存为文件</text></g><g transform="translate(24 137)"><rect x="0" y="0" width="392" height="159" rx="11" fill="#fff" stroke="#d1dbE8" stroke-width="1.4" /><text x="18" y="30" font-size="22" fill="#7154d9" font-weight="650">保持文字识别结果</text><rect x="18" y="63" width="356" height="76" rx="6" fill="#f5f7fb" stroke="none" stroke-width="1.4" /><text x="29" y="93" font-size="20" fill="#24384f" font-weight="400">Start</text><text x="29" y="121" font-size="20" fill="#24384f" font-weight="400">Goal</text></g><g transform="translate(24 313)"><rect x="0" y="0" width="392" height="175" rx="11" fill="#fff" stroke="#d1dbE8" stroke-width="1.4" /><text x="18" y="30" font-size="22" fill="#7154d9" font-weight="650">文件对话框的去向</text><text x="18" y="81" font-size="20" fill="#24384f" font-weight="400">取消 → 当前文字仍可修改</text><text x="18" y="116" font-size="20" fill="#24384f" font-weight="400">保存 → recognized-goal.txt</text><text x="18" y="151" font-size="20" fill="#24384f" font-weight="400">重开TXT → 检查Start与Goal两行</text></g></g><path d="M24 681 H416" stroke="#dce3ef"/><text x="24" y="708" font-size="17" fill="#536b83" font-weight="400">操作示意</text></g></svg>