<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560" role="img" aria-labelledby="title desc"><title id="title">垂直裁剪：预览、取消与提交: 按住预览 40 行</title><desc id="desc">操作示意. 按住左键预览贯穿整宽的40 px横带；底图仍为300×200，尚未提交。</desc><rect width="960" height="560" rx="20" fill="#f5f7fc"/><g font-family="system-ui,-apple-system,PingFang SC,Microsoft YaHei,sans-serif"><text x="28" y="42" font-size="28" fill="#24384f" font-weight="700" text-anchor="start">垂直裁剪：预览、取消与提交</text><text x="28" y="77" font-size="19" fill="#536b83" font-weight="400" text-anchor="start">按住预览 40 行</text><rect x="28" y="98" width="592" height="396" rx="8" fill="white" stroke="#c8d3e6" stroke-width="1.5" /><text x="80" y="121" font-size="19" fill="#536b83" font-weight="600" text-anchor="start">300 × 200 px</text><g transform="translate(80 136) scale(1.6)"><rect x="0" y="0" width="300" height="200" rx="0" fill="white" stroke="#aabbd2" stroke-width="1.5" /><rect x="20" y="20" width="110" height="40" rx="0" fill="#e5effa" stroke="none" stroke-width="1.5" /><text x="36" y="49" font-size="25" fill="#2877bd" font-weight="700" text-anchor="start">A</text><rect x="20" y="130" width="260" height="30" rx="0" fill="#dcefe9" stroke="none" stroke-width="1.5" /><text x="36" y="154" font-size="25" fill="#258568" font-weight="700" text-anchor="start">B</text><rect x="0" y="80" width="300" height="40" rx="0" fill="#df5961" stroke="none" stroke-width="1.5" opacity=".85"/><path d="M0 80 L300 80" fill="none" stroke="#2877bd" stroke-width="1.3" stroke-dasharray="4 3"/><path d="M0 120 L300 120" fill="none" stroke="#2877bd" stroke-width="1.3" stroke-dasharray="4 3"/><text x="150" y="106" font-size="16" fill="white" font-weight="700" text-anchor="middle">40 px</text><path d="M279 85 L279 115" fill="none" stroke="white" stroke-width="1.6"/><path d="M282.6 109.0 L279 115 L275.4 109.0" fill="none" stroke="white" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></g><text x="66" y="141" font-size="16" fill="#536b83" font-weight="400" text-anchor="end">0</text><text x="66" y="461.0" font-size="16" fill="#536b83" font-weight="400" text-anchor="end">200</text><text x="86" y="485" font-size="19" fill="#7154d9" font-weight="550" text-anchor="start">当前工具：垂直裁剪</text><rect x="644" y="98" width="288" height="396" rx="8" fill="white" stroke="#c8d3e6" stroke-width="1.5" /><text x="666" y="134" font-size="22" fill="#7154d9" font-weight="650" text-anchor="start">垂直裁剪</text><text x="666" y="181" font-size="20" fill="#24384f" font-weight="400" text-anchor="start">左键仍然按住。</text><text x="666" y="229" font-size="20" fill="#24384f" font-weight="400" text-anchor="start">N = 40 px，贯穿整宽。</text><text x="666" y="277" font-size="20" fill="#24384f" font-weight="400" text-anchor="start">底图像素还没有改变。</text><path d="M28 509 L932 509" fill="none" stroke="#dbe3ef" stroke-width="1"/><text x="28" y="539" font-size="18" fill="#536b83" font-weight="400" text-anchor="start">各帧保持原点和比例；预览与提交是不同状态。</text><text x="930" y="539" font-size="17" fill="#536b83" font-weight="400" text-anchor="end">操作示意</text></g></svg>