<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="760" height="430" viewBox="0 0 760 430" role="img" aria-labelledby="title desc" font-family="system-ui,sans-serif"><title id="title">空白处右键重置下一次序号：再单击放一个 1</title><desc id="desc">操作示意。单击新位置得到新的一号；点旧对象的右键会选择它，不是执行空白重置。</desc><rect width="760" height="430" rx="12" fill="#f3f7fc" /><text x="24" y="34" font-size="25" fill="#24384f">空白处右键重置下一次序号</text><text x="24" y="63" font-size="18" fill="#536c86">再单击放一个 1</text><rect x="18" y="80" width="724" height="260" rx="7" fill="white" stroke="#b9cce0" /><circle cx="130" cy="170" r="25" fill="#2877bd" stroke="#2877bd" stroke-width="2" /><text x="122" y="179" font-size="25" fill="white">1</text><circle cx="310" cy="170" r="25" fill="#2877bd" stroke="#2877bd" stroke-width="2" /><text x="302" y="179" font-size="25" fill="white">2</text><circle cx="490" cy="170" r="25" fill="#2877bd" stroke="#2877bd" stroke-width="2" /><text x="482" y="179" font-size="25" fill="white">3</text><rect x="45" y="101" width="105" height="33" rx="5" fill="#e2effb" stroke="#2877bd" /><text x="57" y="124" font-size="18" fill="#2877bd">当前：序号</text><circle cx="595" cy="275" r="25" fill="#258568" stroke="#258568" stroke-width="2" /><text x="587" y="284" font-size="25" fill="white">1</text><text x="125" y="310" font-size="20" fill="#24384f">旧 1 / 2 / 3 保持，新的一组从 1 开始</text><text x="26" y="364" font-size="18" fill="#24384f">单击新位置得到新的一号；点旧对象的右键会选择它，不是执行空白重置。</text><text x="24" y="416" font-size="15" fill="#536c86">操作示意</text></svg>