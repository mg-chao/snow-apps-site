<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" role="img" aria-labelledby="title desc"><title id="title">原图译文与文字结果，用途不同</title><desc id="desc">原图翻译便于对照位置；文字结果便于继续复制。操作示意。</desc><rect width="960" height="560" rx="24" fill="#f5f7fc" /><g font-family="system-ui,-apple-system,PingFang SC,Microsoft YaHei,sans-serif"><text x="36" y="52" font-size="30" fill="#18233b" font-weight="700">原图译文与文字结果，用途不同</text><text x="36" y="88" font-size="20" fill="#53627d" font-weight="400">原图翻译便于对照位置；文字结果便于继续复制</text><rect x="36" y="135" width="270" height="305" rx="16" fill="#ffffff" stroke="#c8d3e6" stroke-width="2" /><rect x="56" y="153" width="105" height="38" rx="19" fill="#ede9fe" stroke="#ede9fe" stroke-width="2" /><text x="70" y="179" font-size="20" fill="#5941bd" font-weight="600">截图原文</text><rect x="59" y="219" width="223" height="139" rx="16" fill="#eaf0fa" stroke="#c8d3e6" stroke-width="2" /><text x="79" y="265" font-size="23" fill="#18233b" font-weight="400">Network error</text><text x="79" y="321" font-size="23" fill="#18233b" font-weight="400">Try again</text><path d="M316 281 L357 281" fill="none" stroke="#6954d9" stroke-width="3" /><path d="M348 274 L357 281 L348 288" fill="none" stroke="#6954d9" stroke-width="3" /><rect x="376" y="135" width="260" height="305" rx="16" fill="#ffffff" stroke="#c8d3e6" stroke-width="2" /><rect x="396" y="153" width="142" height="38" rx="19" fill="#ede9fe" stroke="#ede9fe" stroke-width="2" /><text x="410" y="179" font-size="20" fill="#5941bd" font-weight="600">原图翻译开启</text><rect x="398" y="219" width="214" height="139" rx="16" fill="#eaf0fa" stroke="#c8d3e6" stroke-width="2" /><text x="418" y="265" font-size="25" fill="#18233b" font-weight="400">网络错误</text><text x="418" y="321" font-size="25" fill="#18233b" font-weight="400">重新尝试</text><rect x="661" y="135" width="263" height="305" rx="16" fill="#ffffff" stroke="#c8d3e6" stroke-width="2" /><rect x="681" y="153" width="141" height="38" rx="19" fill="#ede9fe" stroke="#ede9fe" stroke-width="2" /><text x="695" y="179" font-size="20" fill="#5941bd" font-weight="600">文字结果</text><text x="685" y="258" font-size="25" fill="#18233b" font-weight="400">网络错误</text><text x="685" y="312" font-size="25" fill="#18233b" font-weight="400">重新尝试</text><rect x="681" y="372" width="194" height="38" rx="19" fill="#ede9fe" stroke="#ede9fe" stroke-width="2" /><text x="695" y="398" font-size="20" fill="#5941bd" font-weight="600">选择所需文字后复制</text><text x="38" y="478" font-size="23" fill="#18233b" font-weight="400">译文来自识别文字；识别有误时，应先校正原文再翻译。</text><path d="M36 510 L924 510" fill="none" stroke="#dce3ef" stroke-width="1" /><text x="36" y="539" font-size="18" fill="#53627d" font-weight="400">Snow Shot · 操作示意</text></g></svg>