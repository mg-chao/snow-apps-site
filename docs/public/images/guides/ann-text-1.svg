<svg xmlns="http://www.w3.org/2000/svg" width="820" height="440" viewBox="0 0 820 440" role="img" aria-labelledby="title desc"><title id="title">文字标注与排版：单击创建输入区域</title><desc id="desc">操作示意。第 1 帧：单击创建输入区域。</desc><rect width="820" height="440" rx="16" fill="#f3f7fc" /><rect x="22" y="75" width="500" height="330" rx="10" fill="#fff" stroke="#d2deeb" /><rect x="540" y="75" width="260" height="330" rx="10" fill="#fff" stroke="#d2deeb" /><text x="25" y="39" font-size="25" fill="#26384c" font-weight="bold">文字标注与排版</text><text x="25" y="63" font-size="17" fill="#546c84" font-weight="normal">1 / 3　单击创建输入区域</text><rect x="90" y="160" width="340" height="110" rx="6" fill="white" stroke="#347ec7" /><line x1="110" y1="180" x2="110" y2="215" stroke="#26384c" stroke-width="2" /><text x="90" y="120" font-size="20" fill="#26384c" font-weight="normal">文字工具 → 单击画布</text><text x="555" y="116" font-size="21" fill="#26384c" font-weight="bold">操作要点</text><text x="555" y="165" font-size="17" fill="#26384c" font-weight="normal">单击出现输入区域</text><text x="555" y="215" font-size="17" fill="#26384c" font-weight="normal">输入字符，回车换行</text><text x="555" y="265" font-size="17" fill="#26384c" font-weight="normal">点击外部完成，再移动对象</text><text x="555" y="355" font-size="17" fill="#546c84" font-weight="normal">按正文步骤操作</text><text x="555" y="385" font-size="16" fill="#546c84" font-weight="normal">操作示意</text></svg>