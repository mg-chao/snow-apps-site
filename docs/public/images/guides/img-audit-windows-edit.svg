<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" role="img" aria-labelledby="title desc"><title id="title">Windows 右键编辑：开关决定新贴图状态</title><desc id="desc">设置 → 搜索“打开编辑时启用标注模式”；不改变独立图像编辑窗口。原创操作示意。</desc><rect width="960" height="560" rx="22" fill="#f5f7fc" /><g font-family="system-ui,-apple-system,PingFang SC,Microsoft YaHei,sans-serif"><text x="35" y="50" font-size="29" fill="#1e293b" font-weight="700">Windows 右键编辑：开关决定新贴图状态</text><text x="35" y="86" font-size="20" fill="#53627d" font-weight="400">设置 → 搜索“打开编辑时启用标注模式”；不改变独立图像编辑窗口</text><rect x="38" y="136" width="884" height="139" rx="12" fill="#fff" stroke="#c8d3e6" stroke-width="2" /><rect x="57" y="154" width="206" height="38" rx="19" fill="#ede9fe" stroke="#ede9fe" stroke-width="2" /><text x="71" y="180" font-size="20" fill="#6146bd" font-weight="600">开关关闭</text><text x="286" y="190" font-size="25" fill="#1e293b" font-weight="400">文件右键 → 使用 Snow Shot 编辑</text><text x="286" y="243" font-size="23" fill="#53627d" font-weight="400">新贴图先显示图像 → 需要时手动进入标注模式</text><rect x="38" y="306" width="884" height="139" rx="12" fill="#fff" stroke="#c8d3e6" stroke-width="2" /><rect x="57" y="324" width="206" height="38" rx="19" fill="#ede9fe" stroke="#ede9fe" stroke-width="2" /><text x="71" y="350" font-size="20" fill="#6146bd" font-weight="600">开关开启</text><text x="286" y="360" font-size="25" fill="#1e293b" font-weight="400">文件右键 → 使用 Snow Shot 编辑</text><text x="286" y="413" font-size="23" fill="#6146bd" font-weight="400">新贴图直接进入标注模式 → 可以继续绘制</text><path d="M35 511 L925 511" fill="none" stroke="#dbe3ef" stroke-width="1" /><text x="35" y="539" font-size="18" fill="#53627d" font-weight="400">Snow Shot · 操作示意</text></g></svg>