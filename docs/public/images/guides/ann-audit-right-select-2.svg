<svg xmlns="http://www.w3.org/2000/svg" width="760" height="430" viewBox="0 0 760 430" role="img" aria-labelledby="title desc" font-family="system-ui,sans-serif"><title id="title">右键临时选择与移动：右键点中对象</title><desc id="desc">操作示意。右键单击笔画本体使其选中，画笔工具保持；不需要先切到选择元素。</desc><rect width="760" height="430" rx="12" fill="#f3f7fc" /><text x="24" y="34" font-size="25" fill="#24384f">右键临时选择与移动</text><text x="24" y="63" font-size="18" fill="#536c86">右键点中对象</text><rect x="18" y="80" width="724" height="260" rx="7" fill="white" stroke="#b9cce0" /><rect x="40" y="100" width="105" height="33" rx="5" fill="#e2effb" stroke="#2877bd" /><text x="52" y="123" font-size="18" fill="#2877bd">当前：画笔</text><path d="M110 250 Q190 140 290 235 T470 200" stroke="#2877bd" stroke-width="7" fill="none" stroke-linecap="round" stroke-linejoin="round" /><rect x="95" y="155" width="390" height="115" rx="0" fill="none" stroke="#2877bd" stroke-dasharray="5 5" /><rect x="91" y="151" width="8" height="8" rx="1" fill="white" stroke="#2877bd" /><rect x="481" y="151" width="8" height="8" rx="1" fill="white" stroke="#2877bd" /><rect x="91" y="266" width="8" height="8" rx="1" fill="white" stroke="#2877bd" /><rect x="481" y="266" width="8" height="8" rx="1" fill="white" stroke="#2877bd" /><rect x="535" y="115" width="60" height="33" rx="5" fill="#e2effb" stroke="#2877bd" /><text x="547" y="138" font-size="18" fill="#2877bd">右键</text><text x="26" y="364" font-size="18" fill="#24384f">右键单击笔画本体使其选中，画笔工具保持；不需要先切到选择元素。</text><text x="24" y="416" font-size="15" fill="#536c86">操作示意</text></svg>