<svg xmlns="http://www.w3.org/2000/svg" width="820" height="440" viewBox="0 0 820 440" role="img" aria-labelledby="title desc"><title id="title">画笔与压感笔画：按下开始自由绘画</title><desc id="desc">操作示意。第 1 帧：按下开始自由绘画。</desc><rect width="820" height="440" rx="16" fill="#f3f7fc" /><rect x="22" y="75" width="500" height="330" rx="10" fill="#fff" stroke="#d2deeb" /><rect x="540" y="75" width="260" height="330" rx="10" fill="#fff" stroke="#d2deeb" /><text x="25" y="39" font-size="25" fill="#26384c" font-weight="bold">画笔与压感笔画</text><text x="25" y="63" font-size="17" fill="#546c84" font-weight="normal">1 / 3　按下开始自由绘画</text><path d="M80 230 Q120 135 175 205" stroke="#347ec7" stroke-width="7" fill="none" stroke-linejoin="round" stroke-linecap="round" /><text x="80" y="320" font-size="22" fill="#26384c" font-weight="normal">按下 → 连续移动 → 松开</text><text x="555" y="116" font-size="21" fill="#26384c" font-weight="bold">操作要点</text><text x="555" y="165" font-size="17" fill="#26384c" font-weight="normal">按下开始记录轨迹</text><text x="555" y="215" font-size="17" fill="#26384c" font-weight="normal">保持按住，移动指针</text><text x="555" y="265" font-size="17" fill="#26384c" font-weight="normal">松开结束，选择后编辑</text><text x="555" y="355" font-size="17" fill="#546c84" font-weight="normal">按正文步骤操作</text><text x="555" y="385" font-size="16" fill="#546c84" font-weight="normal">操作示意</text></svg>