<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1330" viewBox="0 0 720 1330" role="img" aria-labelledby="title desc">
<title id="title">恢复主题、主色和字体</title>
<desc id="desc">主题配置有独立的重置范围。 找到主题配置的重置 → 核对分区名称 → 确认后的结果</desc>
<rect width="720" height="1330" rx="24" fill="#f3f6fb"/>
<g font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif">
<text x="32" y="37" font-size="22" fill="#58708d" font-weight="600">操作示意</text>
<text x="32" y="84" font-size="32" fill="#172e50" font-weight="700">恢复主题、主色和字体</text>
<text x="32" y="157" font-size="23" fill="#4c6481" font-weight="400">主题配置有独立的重置范围。</text>
<rect x="32" y="188" width="656" height="316" rx="18" fill="#fff" stroke="#c8d4e4" stroke-width="2"/>
<rect x="48" y="204" width="624" height="64" rx="12" fill="#eaf0ff"/>
<circle cx="78" cy="236" r="21" fill="#2c57a5"/>
<text x="71" y="245" font-size="26" fill="#fff" font-weight="700">1</text>
<text x="112" y="246" font-size="28" fill="#2c57a5" font-weight="700">找到主题配置的重置</text>
<text x="58" y="314" font-size="28" fill="#33465e" font-weight="400">设置 → 外观 → 主题配置</text>
<text x="58" y="356" font-size="28" fill="#33465e" font-weight="400">点击标题右侧的重置圆箭头。</text>
<text x="58" y="398" font-size="28" fill="#33465e" font-weight="400">此分区包括主题、主色、字体和字号。</text>
<path d="M360 515v23m-10-10 10 10 10-10" fill="none" stroke="#7890ad" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="32" y="550" width="656" height="316" rx="18" fill="#fff" stroke="#c8d4e4" stroke-width="2"/>
<rect x="48" y="566" width="624" height="64" rx="12" fill="#fff2da"/>
<circle cx="78" cy="598" r="21" fill="#865414"/>
<text x="71" y="607" font-size="26" fill="#fff" font-weight="700">2</text>
<text x="112" y="608" font-size="28" fill="#865414" font-weight="700">核对分区名称</text>
<text x="58" y="676" font-size="28" fill="#33465e" font-weight="400">确定重置&quot;主题配置&quot;为默认设置吗？</text>
<text x="58" y="718" font-size="28" fill="#33465e" font-weight="400">确认：恢复此分区的默认值。</text>
<text x="58" y="760" font-size="28" fill="#33465e" font-weight="400">取消：保留全部当前设置。</text>
<path d="M360 877v23m-10-10 10 10 10-10" fill="none" stroke="#7890ad" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="32" y="912" width="656" height="316" rx="18" fill="#fff" stroke="#c8d4e4" stroke-width="2"/>
<rect x="48" y="928" width="624" height="64" rx="12" fill="#e6f6ee"/>
<circle cx="78" cy="960" r="21" fill="#20614a"/>
<text x="71" y="969" font-size="26" fill="#fff" font-weight="700">3</text>
<text x="112" y="970" font-size="28" fill="#20614a" font-weight="700">确认后的结果</text>
<text x="58" y="1038" font-size="28" fill="#33465e" font-weight="400">主题：跟随系统</text>
<text x="58" y="1080" font-size="28" fill="#33465e" font-weight="400">主题主色：默认主色</text>
<text x="58" y="1122" font-size="28" fill="#33465e" font-weight="400">应用字体：系统默认</text>
<text x="58" y="1164" font-size="28" fill="#33465e" font-weight="400">字体大小：14 px</text>
<text x="32" y="1284" font-size="23" fill="#4c6481" font-weight="400">工具栏尺寸与皮肤在各自分区恢复。</text>
</g>
</svg>
