<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 610" role="img" aria-labelledby="title desc"><title id="title">撤销这次源码修改</title><desc id="desc">撤销后，原来的 l 再次出现。</desc><rect width="440" height="610" rx="20" fill="#f5f7fc"/><g font-family="system-ui,-apple-system,PingFang SC,Microsoft YaHei,sans-serif"><text x="24" y="43" font-size="25" fill="#18233b" font-weight="700">撤销这次源码修改</text><rect x="24" y="68" width="392" height="112" rx="14" fill="#fff" stroke="#c8d3e6" stroke-width="2"/><text x="42" y="96" font-size="19" fill="#53627d" font-weight="400">原始公式</text><text x="141" y="124" font-size="32" fill="#18233b">x<tspan baseline-shift="sub" font-size="20">1</tspan><tspan baseline-shift="baseline"> + y</tspan><tspan baseline-shift="sub" font-size="20">1</tspan></text><path d="M130 136 H302" stroke="#18233b" stroke-width="2"/><text x="204" y="170" font-size="30" fill="#18233b" font-weight="400">2</text><rect x="24" y="198" width="392" height="140" rx="14" fill="#fff" stroke="#c8d3e6" stroke-width="2"/><text x="42" y="228" font-size="19" fill="#53627d" font-weight="400">当前 LaTeX 公式源码</text><rect x="153" y="245" width="18" height="30" rx="3" fill="#fff0de"/><g font-family="Menlo,Consolas,monospace"><text x="42" y="268" font-size="23" fill="#2563c6" font-weight="400">\frac{x_l+y_1}{2}</text></g><text x="42" y="309" font-size="18" fill="#53627d" font-weight="400">撤销后，原来的 l 再次出现。</text><rect x="24" y="356" width="392" height="162" rx="14" fill="#fff" stroke="#c8d3e6" stroke-width="2"/><text x="42" y="387" font-size="19" fill="#53627d" font-weight="400">内容更新后的公式预览</text><text x="141" y="440" font-size="32" fill="#18233b">x<tspan baseline-shift="sub" font-size="20">l</tspan><tspan baseline-shift="baseline"> + y</tspan><tspan baseline-shift="sub" font-size="20">1</tspan></text><path d="M130 452 H302" stroke="#18233b" stroke-width="2"/><text x="204" y="486" font-size="30" fill="#18233b" font-weight="400">2</text><text x="24" y="558" font-size="18" fill="#53627d" font-weight