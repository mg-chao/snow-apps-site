<svg xmlns="http://www.w3.org/2000/svg" width="440" height="690" viewBox="0 0 440 690" role="img" aria-labelledby="title desc"><title id="title">表格的等待、重试与文件: 先修复条件，再重试</title><desc id="desc">无有效单元格、模型不可用或网络错误时，读提示，检查模型与服务后再单击重试。换模型立即生效；切回用过的模型可能恢复已有编辑。</desc><rect width="440" height="690" rx="16" fill="#f5f7fc"/><g font-family="system-ui,-apple-system,PingFang SC,Microsoft YaHei,sans-serif"><text x="24" y="35" font-size="23" fill="#24384f" font-weight="700">表格的等待、重试与文件</text><text x="24" y="70" font-size="20" fill="#267cba" font-weight="600">先修复条件，再重试</text><g transform="translate(0 111)"><g transform="translate(24 0)"><rect x="0" y="0" width="392" height="105" rx="11" fill="#fff" stroke="#d1dbE8" stroke-width="1.4" /><text x="18" y="30" font-size="22" fill="#c34d56" font-weight="650">未识别到表格单元格</text><text x="18" y="81" font-size="20" fill="#24384f" font-weight="400">检查输入范围、服务与返回的表格结构。</text></g><g transform="translate(24 122)"><rect x="0" y="0" width="392" height="186" rx="11" fill="#fff" stroke="#d1dbE8" stroke-width="1.4" /><text x="18" y="30" font-size="22" fill="#7154d9" font-weight="650">结果中的操作</text><rect x="18" y="63" width="84" height="39" rx="8" fill="#f1edfb" stroke="#bdb0ea" stroke-width="1.4" /><text x="32" y="90" font-size="20" fill="#7154d9" font-weight="600">重试</text><text x="18" y="135" font-size="20" fill="#24384f" font-weight="400">原图不清楚时，新截图比重复同一请求</text><text x="18" y="162" font-size="20" fill="#24384f" font-weight="400">更有用。</text></g></g><path d="M24 641 H416" stroke="#dce3ef"/><text x="24" y="668" font-size="17" fill="#536b83" font-weight="400">操作示意</text></g></svg>