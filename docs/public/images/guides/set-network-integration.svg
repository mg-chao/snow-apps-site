<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="900" height="470" viewBox="0 0 900 470" role="img" aria-labelledby="title desc">
<title id="title">网络访问与本机控制分别配置</title><desc id="desc">代理用于网络连接；MCP 用于连接本机客户端。</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#1677ff" /></marker></defs>
<rect width="900" height="470" rx="20" fill="#fff" />
<g font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif"><text x="30" y="47" font-size="30" fill="#163963" font-weight="700">网络访问与本机控制分别配置</text><text x="30" y="79" font-size="18" fill="#62758e" font-weight="400">操作示意</text><rect x="30" y="112" width="405" height="265" rx="16" fill="#f2f6fc" stroke="#cbd8e9" stroke-width="2" /><circle cx="58" cy="142" r="20" fill="#1677ff" /><text x="51" y="150" font-size="24" fill="white" font-weight="700">1</text><text x="88" y="151" font-size="24" fill="#163963" font-weight="600">网络连接路径</text><rect x="465" y="112" width="405" height="265" rx="16" fill="#f2f6fc" stroke="#cbd8e9" stroke-width="2" /><circle cx="493" cy="142" r="20" fill="#1677ff" /><text x="486" y="150" font-size="24" fill="white" font-weight="700">2</text><text x="523" y="151" font-size="24" fill="#163963" font-weight="600">本机 MCP</text><text x="58" y="204" font-size="25" fill="#24344d" font-weight="400">无代理 / 系统 / 手动</text><path d="M90 250L360 250" stroke="#1677ff" stroke-width="4" marker-end="url(#a)" fill="none" /><text x="65" y="301" font-size="23" fill="#24344d" font-weight="400">Snow Shot → 在线服务</text><text x="60" y="351" font-size="23" fill="#24344d" font-weight="400">请求成功才证明连通</text><text x="496" y="203" font-size="25" fill="#24344d" font-weight="400">客户端配置 → 连接</text><path d="M516 249L811 249" stroke="#1677ff" stroke-width="4" marker-end="url(#a)" fill="none" /><circle cx="529" cy="312" r="20" fill="#1677ff" /><text x="522" y="320" font-size="24" fill="white" font-weight="700">3</text><text x="562" y="321" font-size="23" fill="#24344d" font-weight="400">Snow Shot 保持运行</text><text x="497" y="359" font-size="22" fill="#24344d" font-weight="400">检查状态与连接数</text><text x="30" y="444" font-size="20" fill="#52647e" font-weight="400">代理用于网络连接；MCP 用于连接本机客户端。</text></g></svg>