<svg xmlns="http://www.w3.org/2000/svg" width="760" height="430" viewBox="0 0 760 430" role="img" aria-labelledby="title desc" font-family="system-ui,sans-serif"><title id="title">Shift 让旋转角度规整对齐：松开完成</title><desc id="desc">操作示意。在目标角度松开鼠标，保留15°旋转结果；不要把旋转柄当缩放柄。</desc><rect width="760" height="430" rx="12" fill="#f3f7fc" /><text x="24" y="34" font-size="25" fill="#24384f">Shift 让旋转角度规整对齐</text><text x="24" y="63" font-size="18" fill="#536c86">松开完成</text><rect x="18" y="80" width="724" height="260" rx="7" fill="white" stroke="#b9cce0" /><g transform="translate(350 220) rotate(15)"><rect x="-130" y="-60" width="260" height="120" rx="7" fill="#e8f2fc" stroke="#2877bd" /><rect x="-130" y="-60" width="260" height="120" rx="0" fill="none" stroke="#2877bd" stroke-dasharray="5 5" /><rect x="-134" y="-64" width="8" height="8" rx="1" fill="white" stroke="#2877bd" /><rect x="126" y="-64" width="8" height="8" rx="1" fill="white" stroke="#2877bd" /><rect x="-134" y="56" width="8" height="8" rx="1" fill="white" stroke="#2877bd" /><rect x="126" y="56" width="8" height="8" rx="1" fill="white" stroke="#2877bd" /><path d="M0 -60 L0 -95" stroke="#2877bd" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" /><circle cx="0" cy="-95" r="7" fill="white" stroke="#2877bd" stroke-width="2" /></g><circle cx="350" cy="220" r="4" fill="#2877bd" stroke="#2877bd" stroke-width="2" /><text x="540" y="240" font-size="35" fill="#d84d53">15°</text><text x="26" y="364" font-size="18" fill="#24384f">在目标角度松开鼠标，保留15°旋转结果；不要把旋转柄当缩放柄。</text><text x="24" y="416" font-size="15" fill="#536c86">操作示意</text></svg>