<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" role="img" aria-labelledby="title desc"><title id="title">输入停顿后，自动重新翻译</title><desc id="desc">原文改变、语言改变或服务改变，都会开始新一轮处理。操作示意。</desc><rect width="960" height="560" rx="24" fill="#f5f7fc" /><g font-family="system-ui,-apple-system,PingFang SC,Microsoft YaHei,sans-serif"><text x="36" y="52" font-size="30" fill="#18233b" font-weight="700">输入停顿后，自动重新翻译</text><text x="36" y="88" font-size="20" fill="#53627d" font-weight="400">原文改变、语言改变或服务改变，都会开始新一轮处理</text><rect x="36" y="124" width="170" height="38" rx="19" fill="#ede9fe" stroke="#ede9fe" stroke-width="2" /><text x="50" y="150" font-size="20" fill="#5941bd" font-weight="600">源语言：英语</text><rect x="225" y="124" width="170" height="38" rx="19" fill="#ede9fe" stroke="#ede9fe" stroke-width="2" /><text x="239" y="150" font-size="20" fill="#5941bd" font-weight="600">目标语言：中文</text><rect x="414" y="124" width="248" height="38" rx="19" fill="#ede9fe" stroke="#ede9fe" stroke-width="2" /><text x="428" y="150" font-size="20" fill="#5941bd" font-weight="600">翻译服务：已配置服务</text><rect x="36" y="200" width="414" height="237" rx="16" fill="#ffffff" stroke="#c8d3e6" stroke-width="2" /><text x="60" y="249" font-size="25" fill="#18233b" font-weight="600">原文 · 可以编辑</text><text x="60" y="307" font-size="22" fill="#18233b" font-weight="400">Please check the connection.</text><text x="60" y="384" font-size="22" fill="#53627d" font-weight="400">停止输入 → 等待处理</text><path d="M461 317 L499 317" fill="none" stroke="#6954d9" stroke-width="3" /><path d="M490 310 L499 317 L490 324" fill="none" stroke="#6954d9" stroke-width="3" /><rect x="517" y="200" width="407" height="237" rx="16" fill="#ffffff" stroke="#c8d3e6" stroke-width="2" /><text x="541" y="249" font-size="25" fill="#18233b" font-weight="600">译文 · 阅读与复制</text><text x="541" y="307" font-size="28" fill="#18233b" font-weight="400">请检查连接。</text><rect x="541" y="365" width="120" height="38" rx="19" fill="#ede9fe" stroke="#ede9fe" stroke-width="2" /><text x="555" y="391" font-size="20" fill="#5941bd" font-weight="600">复制译文</text><text x="688" y="392" font-size="22" fill="#c96520" font-weight="400">错误时：重试</text><path d="M36 510 L924 510" fill="none" stroke="#dce3ef" stroke-width="1" /><text x="36" y="539" font-size="18" fill="#53627d" font-weight="400">Snow Shot · 操作示意</text></g></svg>