<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" role="img" aria-labelledby="title desc"><title id="title">变换方向、显示透明度与裁剪，各自独立</title><desc id="desc">先看清当前模式，再执行需要的操作。操作示意。</desc><rect width="960" height="560" rx="24" fill="#f5f7fc" /><g font-family="system-ui,-apple-system,PingFang SC,Microsoft YaHei,sans-serif"><text x="36" y="52" font-size="30" fill="#18233b" font-weight="700">变换方向、显示透明度与裁剪，各自独立</text><text x="36" y="88" font-size="20" fill="#53627d" font-weight="400">先看清当前模式，再执行需要的操作</text><rect x="36" y="136" width="271" height="312" rx="16" fill="#ffffff" stroke="#c8d3e6" stroke-width="2" /><rect x="56" y="154" width="128" height="38" rx="19" fill="#ede9fe" stroke="#ede9fe" stroke-width="2" /><text x="70" y="180" font-size="20" fill="#5941bd" font-weight="600">旋转 / 翻转</text><text x="92" y="309" font-size="116" fill="#6954d9" font-weight="700">L</text><text x="56" y="411" font-size="23" fill="#18233b" font-weight="400">90° 旋转与镜像</text><rect x="345" y="136" width="271" height="312" rx="16" fill="#ffffff" stroke="#c8d3e6" stroke-width="2" /><rect x="365" y="154" width="146" height="38" rx="19" fill="#ede9fe" stroke="#ede9fe" stroke-width="2" /><text x="379" y="180" font-size="20" fill="#5941bd" font-weight="600">不透明度 50%</text><rect x="378" y="221" width="145" height="125" rx="16" fill="#acc3ee" stroke="#acc3ee" stroke-width="2" /><rect x="438" y="273" width="145" height="125" rx="16" fill="#cbbef3" stroke="#6954d9" stroke-width="2" /><text x="365" y="425" font-size="23" fill="#18233b" font-weight="400">对照重叠画面</text><rect x="653" y="136" width="271" height="312" rx="16" fill="#ffffff" stroke="#c8d3e6" stroke-width="2" /><rect x="673" y="154" width="140" height="38" rx="19" fill="#ede9fe" stroke="#ede9fe" stroke-width="2" /><text x="687" y="180" font-size="20" fill="#5941bd" font-weight="600">右键拖动裁剪</text><rect x="688" y="221" width="199" height="164" rx="16" fill="#eaf0fa" stroke="#c8d3e6" stroke-width="2" /><rect x="709" y="244" width="136" height="112" rx="0" fill="#ede9fe" stroke="#6954d9" stroke-width="2" /><text x="673" y="425" font-size="22" fill="#18233b" font-weight="400">先收窄视图，再应用</text><path d="M36 510 L924 510" fill="none" stroke="#dce3ef" stroke-width="1" /><text x="36" y="539" font-size="18" fill="#53627d" font-weight="400">Snow Shot · 操作示意</text></g></svg>