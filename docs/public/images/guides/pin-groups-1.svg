<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" role="img" aria-labelledby="title desc"><title id="title">按下组合，预览下一组</title><desc id="desc">先绑定切换窗口分组动作；观察候选，再决定提交或取消。。操作示意。</desc><rect width="960" height="560" rx="24" fill="#f5f7fc" /><g font-family="system-ui,-apple-system,PingFang SC,Microsoft YaHei,sans-serif"><text x="36" y="52" font-size="30" fill="#18233b" font-weight="700">按下组合，预览下一组</text><text x="36" y="88" font-size="20" fill="#53627d" font-weight="400">先绑定切换窗口分组动作；观察候选，再决定提交或取消。</text><rect x="38" y="143" width="884" height="301" rx="16" fill="#ffffff" stroke="#c8d3e6" stroke-width="2" /><text x="62" y="193" font-size="28" fill="#18233b" font-weight="600">窗口分组预览</text><rect x="69" y="232" width="252" height="103" rx="16" fill="#fff" stroke="#c8d3e6" stroke-width="2" /><text x="89" y="295" font-size="26" fill="#18233b" font-weight="400">默认</text><rect x="346" y="232" width="252" height="103" rx="16" fill="#ede9fe" stroke="#6954d9" stroke-width="2" /><text x="366" y="295" font-size="26" fill="#18233b" font-weight="400">设计对照</text><rect x="623" y="232" width="252" height="103" rx="16" fill="#fff" stroke="#c8d3e6" stroke-width="2" /><text x="643" y="295" font-size="26" fill="#18233b" font-weight="400">报错排查</text><text x="69" y="400" font-size="26" fill="#167d69" font-weight="400">当前组：默认</text><rect x="485" y="367" width="386" height="38" rx="19" fill="#ede9fe" stroke="#ede9fe" stroke-width="2" /><text x="499" y="393" font-size="20" fill="#5941bd" font-weight="600">松键：确认　　Esc：取消</text><path d="M36 510 L924 510" fill="none" stroke="#dce3ef" stroke-width="1" /><text x="36" y="539" font-size="18" fill="#53627d" font-weight="400">Snow Shot · 操作示意</text></g></svg>