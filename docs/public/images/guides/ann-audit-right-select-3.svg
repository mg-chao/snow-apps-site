<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="760" height="430" viewBox="0 0 760 430" role="img" aria-labelledby="title desc" font-family="system-ui,sans-serif"><title id="title">右键临时选择与移动：按住右键拖动</title><desc id="desc">操作示意。保持右键拖动，选中笔画整体移动；松开后可以继续用原来的画笔。</desc><rect width="760" height="430" rx="12" fill="#f3f7fc" /><text x="24" y="34" font-size="25" fill="#24384f">右键临时选择与移动</text><text x="24" y="63" font-size="18" fill="#536c86">按住右键拖动</text><rect x="18" y="80" width="724" height="260" rx="7" fill="white" stroke="#b9cce0" /><rect x="40" y="100" width="105" height="33" rx="5" fill="#e2effb" stroke="#2877bd" /><text x="52" y="123" font-size="18" fill="#2877bd">当前：画笔</text><path d="M190 250 Q270 140 370 235 T550 200" stroke="#2877bd" stroke-width="7" fill="none" stroke-linecap="round" stroke-linejoin="round" /><rect x="175" y="155" width="390" height="115" rx="0" fill="none" stroke="#2877bd" stroke-dasharray="5 5" /><rect x="171" y="151" width="8" height="8" rx="1" fill="white" stroke="#2877bd" /><rect x="561" y="151" width="8" height="8" rx="1" fill="white" stroke="#2877bd" /><rect x="171" y="266" width="8" height="8" rx="1" fill="white" stroke="#2877bd" /><rect x="561" y="266" width="8" height="8" rx="1" fill="white" stroke="#2877bd" /><rect x="535" y="115" width="60" height="33" rx="5" fill="#e2effb" stroke="#2877bd" /><text x="547" y="138" font-size="18" fill="#2877bd">右键</text><path d="M420 295 L505 295" stroke="#d84d53" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round" /><path d="M493.0 289.0 L505 295 L493.0 301.0" stroke="#d84d53" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round" /><text x="65" y="320" font-size="20" fill="#24384f">工具保持，移动的是已有对象</text><text x="26" y="364" font-size="18" fill="#24384f">保持右键拖动，选中笔画整体移动；松开后可以继续用原来的画笔。</text><text x="24" y="416" font-size="15" fill="#536c86">操作示意</text></svg>