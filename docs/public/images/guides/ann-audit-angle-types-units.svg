<svg xmlns="http://www.w3.org/2000/svg" width="760" height="430" viewBox="0 0 760 430" role="img" aria-labelledby="title desc" font-family="system-ui,sans-serif"><title id="title">同组三点的角类型与单位：270° 有向角、90° 内角、4.712 弧度</title><desc id="desc">操作示意。先明确要表达的转向或内角，再选择类型；单位变化按数学换算显示，不是沿用同一个数字。</desc><rect width="760" height="430" rx="12" fill="#f3f7fc" /><text x="24" y="34" font-size="25" fill="#24384f">同组三点的角类型与单位</text><text x="24" y="63" font-size="18" fill="#536c86">270° 有向角、90° 内角、4.712 弧度</text><rect x="18" y="80" width="724" height="260" rx="7" fill="white" stroke="#b9cce0" /><text x="42" y="122" font-size="20" fill="#24384f">360° 角</text><path d="M130 240 L130 145" stroke="#2877bd" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round" /><path d="M130 240 L224 240" stroke="#2877bd" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round" /><path d="M130 192 A48 48 0 1 0 178 240" stroke="#d84d53" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round" /><text x="72" y="310" font-size="23" fill="#d84d53">270°</text><text x="292" y="122" font-size="20" fill="#24384f">180° 角</text><path d="M380 240 L380 145" stroke="#2877bd" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round" /><path d="M380 240 L474 240" stroke="#2877bd" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round" /><path d="M380 192 A48 48 0 0 1 428 240" stroke="#d84d53" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round" /><text x="322" y="310" font-size="23" fill="#d84d53">90°</text><text x="542" y="122" font-size="20" fill="#24384f">360° 角 / 弧度</text><path d="M630 240 L630 145" stroke="#2877bd" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round" /><path d="M630 240 L724 240" stroke="#2877bd" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round" /><path d="M630 192 A48 48 0 1 0 678 240" stroke="#d84d53" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round" /><text x="572" y="310" font-size="23" fill="#d84d53">4.712 rad</text><text x="26" y="364" font-size="18" fill="#24384f">先明确要表达的转向或内角，再选择类型；单位变化按数学换算显示，不是沿用同</text><text x="26" y="389" font-size="18" fill="#24384f">一个数字。</text><text x="24" y="416" font-size="15" fill="#536c86">操作示意</text></svg>