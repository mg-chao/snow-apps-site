<svg xmlns="http://www.w3.org/2000/svg" width="760" height="430" viewBox="0 0 760 430" role="img" aria-labelledby="title desc" font-family="system-ui,sans-serif"><title id="title">连线绑定图形与随附文字：移动被连接图形</title><desc id="desc">操作示意。拖动右侧图形后，绑定的箭头端点随图形位置变化，左侧关系保留。</desc><rect width="760" height="430" rx="12" fill="#f3f7fc" /><text x="24" y="34" font-size="25" fill="#24384f">连线绑定图形与随附文字</text><text x="24" y="63" font-size="18" fill="#536c86">移动被连接图形</text><rect x="18" y="80" width="724" height="260" rx="7" fill="white" stroke="#b9cce0" /><rect x="65" y="190" width="155" height="74" rx="7" fill="#e8f2fc" stroke="#2877bd" /><text x="92" y="235" font-size="22" fill="#24384f">来源图形</text><rect x="525" y="115" width="155" height="74" rx="7" fill="#e8f2fc" stroke="#2877bd" /><text x="553" y="160" font-size="22" fill="#24384f">目标图形</text><path d="M224 227 L520 152" stroke="#2877bd" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round" /><path d="M506.8938956040699 149.13119753852206 L520 152 L509.8412953932596 160.76360203985732" stroke="#2877bd" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round" /><circle cx="224" cy="227" r="6" fill="white" stroke="#2877bd" stroke-width="2" /><circle cx="520" cy="152" r="6" fill="white" stroke="#2877bd" stroke-width="2" /><path d="M708 222 L708 156" stroke="#d84d53" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round" /><path d="M702.0 168.0 L708 156 L714.0 168.0" stroke="#d84d53" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round" /><text x="318" y="304" font-size="20" fill="#24384f">移动主体 → 端点随动</text><text x="26" y="364" font-size="18" fill="#24384f">拖动右侧图形后，绑定的箭头端点随图形位置变化，左侧关系保留。</text><text x="24" y="416" font-size="15" fill="#536c86">操作示意</text></svg>