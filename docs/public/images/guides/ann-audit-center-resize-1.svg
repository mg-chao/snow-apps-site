<svg xmlns="http://www.w3.org/2000/svg" width="760" height="430" viewBox="0 0 760 430" role="img" aria-labelledby="title desc" font-family="system-ui,sans-serif"><title id="title">Alt 从中心缩放：找到缩放控制柄</title><desc id="desc">操作示意。选中对象，记住中心十字位置；这次操作针对控制柄，不是对象本体。</desc><rect width="760" height="430" rx="12" fill="#f3f7fc" /><text x="24" y="34" font-size="25" fill="#24384f">Alt 从中心缩放</text><text x="24" y="63" font-size="18" fill="#536c86">找到缩放控制柄</text><rect x="18" y="80" width="724" height="260" rx="7" fill="white" stroke="#b9cce0" /><rect x="260" y="160" width="200" height="110" rx="7" fill="#e8f2fc" stroke="#2877bd" /><rect x="260" y="160" width="200" height="110" rx="0" fill="none" stroke="#2877bd" stroke-dasharray="5 5" /><rect x="256" y="156" width="8" height="8" rx="1" fill="white" stroke="#2877bd" /><rect x="456" y="156" width="8" height="8" rx="1" fill="white" stroke="#2877bd" /><rect x="256" y="266" width="8" height="8" rx="1" fill="white" stroke="#2877bd" /><rect x="456" y="266" width="8" height="8" rx="1" fill="white" stroke="#2877bd" /><path d="M350 215 L370 215" stroke="#d84d53" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" /><path d="M360 205 L360 225" stroke="#d84d53" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" /><text x="560" y="217" font-size="22" fill="#24384f">中心不动</text><text x="26" y="364" font-size="18" fill="#24384f">选中对象，记住中心十字位置；这次操作针对控制柄，不是对象本体。</text><text x="24" y="416" font-size="15" fill="#536c86">操作示意</text></svg>