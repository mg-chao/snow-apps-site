<svg xmlns="http://www.w3.org/2000/svg" width="440" height="650" viewBox="0 0 440 650"><title>Open the permission settings</title><rect width="440" height="650" rx="14" fill="#f5f7fc"/><g font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif"><text x="24" y="32" font-size="23" fill="#24384f" font-weight="400">Open the permission settings</text><rect x="24" y="78" width="392" height="151" rx="10" fill="white" stroke="#c8d3e6" stroke-width="1.4" /><text x="40" y="108" font-size="21" fill="#7154d9" font-weight="400">App permissions</text><text x="40" y="139" font-size="20" fill="#24384f" font-weight="400">Screen &amp; System Audio Recording</text><rect x="232" y="175" width="168" height="42" rx="7" fill="#eaf3ff" stroke="#267cba" stroke-width="1.4" /><text x="244" y="203" font-size="19" fill="#267cba" font-weight="400">Go to settings</text><path d="M220 237v24m-7-7 7 7 7-7" fill="none" stroke="#267cba" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><rect x="24" y="278" width="392" height="250" rx="10" fill="#fff" stroke="#bac8d9" stroke-width="1.4" /><text x="39" y="307" font-size="25" fill="#267cba" font-weight="400">↑</text><text x="385" y="307" font-size="24" fill="#536b83" font-weight="400">×</text><text x="75" y="308" font-size="20" fill="#24384f" font-weight="400">Drag ‘Snow Shot’ into the</text><text x="75" y="335" font-size="20" fill="#24384f" font-weight="400">permissions list above. If</text><text x="75" y="362" font-size="20" fill="#24384f" font-weight="400">it is already listed, turn</text><text x="75" y="389" font-size="20" fill="#24384f" font-weight="400">it on</text><rect x="40" y="428" width="352" height="58" rx="6" fill="#f0f4f8" stroke="#d1dbe9" stroke-width="1.4" /><image x="49" y="435" width="44" height="44" href="data:image/webp;base64,"/><text x="105" y="464" font-size="22" fill="#24384f" font-weight="400">Snow Shot</text><rect x="24" y="548" width="392" height="57" rx="10" fill="white" stroke="#c8d3e6" stroke-width="1.4" /><text x="40" y="577" font-size="21" fill="#7154d9" font-weight="400">Locate the application row</text><path d="M24 620H416" stroke="#dbe3ef"/><text x="24" y="640" font-size="17" fill="#536b83" font-weight="400">Instructional illustration</text></g></svg>
