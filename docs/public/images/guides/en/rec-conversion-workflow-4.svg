<svg xmlns="http://www.w3.org/2000/svg" width="440" height="830" viewBox="0 0 440 830" role="img" aria-labelledby="title desc"><title id="title">Image conversion controls: Save the document and its companion</title><desc id="desc">Markdown outputs .md plus a matching .txt; HTML outputs .html plus a matching .txt. Saving includes all source, not the preview selection. Cancel does not replace files; success ends capture. Reopen both outputs to check.</desc><rect width="440" height="830" rx="16" fill="#f5f7fc"/><g font-family="system-ui,-apple-system,PingFang SC,Microsoft YaHei,sans-serif"><text x="24" y="35" font-size="23" fill="#24384f" font-weight="700">Image conversion controls</text><text x="24" y="70" font-size="20" fill="#267cba" font-weight="600">Save the document and its</text><text x="24" y="97" font-size="20" fill="#267cba" font-weight="600">companion</text><g transform="translate(0 138)"><g transform="translate(24 0)"><rect x="0" y="0" width="392" height="221" rx="11" fill="#fff" stroke="#d1dbE8" stroke-width="1.4" /><text x="18" y="30" font-size="22" fill="#7154d9" font-weight="650">Markdown example</text><rect x="18" y="63" width="356" height="76" rx="6" fill="#f5f7fb" stroke="none" stroke-width="1.4" /><text x="29" y="93" font-size="20" fill="#24384f" font-weight="400">note.md</text><text x="29" y="121" font-size="20" fill="#24384f" font-weight="400">note.txt</text><text x="18" y="170" font-size="20" fill="#24384f" font-weight="400">Both contain the complete</text><text x="18" y="197" font-size="20" fill="#24384f" font-weight="400">generated source.</text></g><g transform="translate(24 238)"><rect x="0" y="0" width="392" height="159" rx="11" fill="#fff" stroke="#d1dbE8" stroke-width="1.4" /><text x="18" y="30" font-size="22" fill="#7154d9" font-weight="650">HTML example</text><rect x="18" y="63" width="356" height="76" rx="6" fill="#f5f7fb" stroke="none" stroke-width="1.4" /><text x="29" y="93" font-size="20" fill="#24384f" font-weight="400">page.html</text><text x="29" y="121" font-size="20" fill="#24384f" font-weight="400">page.txt</text></g><g transform="translate(24 414)"><rect x="0" y="0" width="392" height="194" rx="11" fill="#fff" stroke="#d1dbE8" stroke-width="1.4" /><text x="18" y="30" font-size="22" fill="#7154d9" font-weight="650">Cancel or Save</text><text x="18" y="81" font-size="20" fill="#24384f" font-weight="400">Cancel → keep the result and</text><text x="18" y="108" font-size="20" fill="#24384f" font-weight="400">existing files</text><text x="18" y="143" font-size="20" fill="#24384f" font-weight="400">Save succeeds → capture ends →</text><text x="18" y="170" font-size="20" fill="#24384f" font-weight="400">open and check</text></g></g><path d="M24 781 H416" stroke="#dce3ef"/><text x="24" y="808" font-size="17" fill="#536b83" font-weight="400">Instructional illustration</text></g></svg>