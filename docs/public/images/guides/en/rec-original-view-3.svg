<svg xmlns="http://www.w3.org/2000/svg" width="440" height="660" viewBox="0 0 440 660" role="img" aria-labelledby="title desc"><title id="title">Original and result views: A side reference has its own setting</title><desc id="desc">Enable Show original image preview under Recognition output. Return to the text result and compare it with the separate input reference. This does not turn on the Show original image button by default.</desc><rect width="440" height="660" rx="16" fill="#f5f7fc"/><g font-family="system-ui,-apple-system,PingFang SC,Microsoft YaHei,sans-serif"><text x="24" y="35" font-size="23" fill="#24384f" font-weight="700">Original and result views</text><text x="24" y="70" font-size="20" fill="#267cba" font-weight="600">A side reference has its own</text><text x="24" y="97" font-size="20" fill="#267cba" font-weight="600">setting</text><g transform="translate(0 138)"><g transform="translate(24 0)"><rect x="0" y="0" width="392" height="144" rx="11" fill="#fff" stroke="#d1dbE8" stroke-width="1.4" /><text x="18" y="30" font-size="22" fill="#7154d9" font-weight="650">Recognition output</text><text x="18" y="78" font-size="18" fill="#536b83" font-weight="400">Show original image preview</text><rect x="18" y="91" width="59" height="30" rx="15" fill="#7154d9" stroke="#7154d9" stroke-width="1.4" /><circle cx="62" cy="106" r="11" fill="white"/><text x="93" y="114" font-size="20" fill="#24384f" font-weight="400">On</text></g><g transform="translate(24 161)"><rect x="0" y="0" width="392" height="131" rx="11" fill="#fff" stroke="#d1dbE8" stroke-width="1.4" /><text x="18" y="30" font-size="22" fill="#7154d9" font-weight="650">Text result</text><rect x="18" y="63" width="356" height="48" rx="6" fill="#f5f7fb" stroke="none" stroke-width="1.4" /><text x="29" y="93" font-size="20" fill="#24384f" font-weight="400">Error code: O12</text></g><g transform="translate(24 309)"><rect x="0" y="0" width="392" height="131" rx="11" fill="#fff" stroke="#d1dbE8" stroke-width="1.4" />