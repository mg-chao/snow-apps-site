e opacity</text><text x="630" y="296" font-size="23" fill="#24344d" font-weight="400">Blur and mask</text><text x="630" y="343" font-size="23" fill="#24344d" font-weight="400">Keep text readable</text><text x="30" y="444" font-size="20" fill="#52647e" font-weight="400">Choose an image for each surface; native menus keep system appearance.</text></g></svg>