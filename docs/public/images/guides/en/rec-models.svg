<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" role="img" aria-labelledby="title desc"><title id="title">Prepare resources, then compare recognition strategies</title><desc id="desc">Test models and detection strategies on the same text.</desc><rect width="960" height="560" rx="24" fill="#f5f7fc" /><g font-family="system-ui,-apple-system,PingFang SC,Microsoft YaHei,sans-serif"><text x="36" y="52" font-size="30" fill="#18233b" font-weight="700">Prepare resources, then compare recognition strategies</text><text x="36" y="88" font-size="20" fill="#53627d" font-weight="400">Test models and detection strategies on the same text</text><rect x="36" y="122" width="195" height="38" rx="19" fill="#ede9fe" stroke="#ede9fe" stroke-width="2" /><text x="50" y="148" font-size="13.92" fill="#5941bd" font-weight="600">Online: Prepare and test</text><path d="M240 142 L278 142" fill="none" stroke="#6954d9" stroke-width="3" /><path d="M269 135 L278 142 L269 149" fill="none" stroke="#6954d9" stroke-width="3" /><rect x="295" y="122" width="240" height="38" rx="19" fill="#e4f4ed" stroke="#e4f4ed" stroke-width="2" /><text x="309" y="148" font-size="15.35" fill="#167d69" font-weight="600">Offline: Repeat the same task</text><rect x="36" y="197" width="278" height="216" rx="16" fill="#ffffff" stroke="#c8d3e6" stroke-width="2" /><text x="58" y="243" font-size="26" fill="#18233b" font-weight="600">Ultra small V6</text><text x="58" y="289" font-size="19.16" fill="#18233b" font-weight="400">Reduce model overhead first</text><text x="58" y="330" font-size="21.43" fill="#18233b" font-weight="400">Start by comparing speed</text><text x="58" y="373" font-size="19.9" fill="#53627d" font-weight="400">Check against real samples</text><rect x="341" y="197" width="278" height="216" rx="16" fill="#ffffff" stroke="#c8d3e6" stroke-width="2" /><text x="363" y="243" font-size="26" fill="#18233b" font-weight="600">Small V6</text><text x="363" y="289" font-size="22" fill="#18233b" font-weight="40