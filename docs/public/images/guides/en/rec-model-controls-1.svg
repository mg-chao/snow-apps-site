<svg xmlns="http://www.w3.org/2000/svg" width="440" height="960" viewBox="0 0 440 960" role="img" aria-labelledby="title desc"><title id="title">Local OCR controls: Choose a model, then a fresh task</title><desc id="desc">Choose the required model size; the setting is saved. End the screenshot and capture the same sample again. Ready resources recognize directly; missing selected-model resources trigger preparation.</desc><rect width="440" height="960" rx="16" fill="#f5f7fc"/><g font-family="system-ui,-apple-system,PingFang SC,Microsoft YaHei,sans-serif"><text x="24" y="35" font-size="23" fill="#24384f" font-weight="700">Local OCR controls</text><text x="24" y="70" font-size="20" fill="#267cba" font-weight="600">Choose a model, then a fresh task</text><g transform="translate(0 111)"><g transform="translate(24 0)"><rect x="0" y="0" width="392" height="238" rx="11" fill="#fff" stroke="#d1dbE8" stroke-width="1.4" /><text x="18" y="30" font-size="22" fill="#7154d9" font-weight="650">OCR models &amp; performance</text><text x="18" y="78" font-size="18" fill="#536b83" font-weight="400">Model type</text><rect x="18" y="86" width="356" height="42" rx="6" fill="#fff" stroke="#c8d3e6" stroke-width="1.4" /><text x="30" y="114" font-size="20" fill="#24384f" font-weight="400">Small V6</text><text x="34" y="155" font-size="20" fill="#7154d9" font-weight="400">Ultra small V6</text><text x="34" y="184" font-size="20" fill="#7154d9" font-weight="400">Small V6</text><text x="34" y="213" font-size="20" fill="#7154d9" font-weight="400">Medium V6</text></g><g transform="translate(24 255)"><rect x="0" y="0" width="392" height="222" rx="11" fill="#fff" stroke="#d1dbE8" stroke-width="1.4" /><text x="18" y="30" font-size="22" fill="#7154d9" font-weight="650">New capture → Text</text><text x="18" y="58" font-size="22" fill="#7154d9" font-weight="650">recognition</text><text x="18" y="109" font-size="20" fill="#24384f" font-weight="400">Resources ready → local</text><text x="18" y="136" font-size="20" fill="#24384f" font-weight="400">recognition can run offline</text><text x="18" y="171" font-size="20" fill="#24384f" font-weight="400">Missing resources → prepare →</text><text x="18" y="198" font-size="20" fill="#24384f" font-weight="400">recognize</text></g><g transform="translate(24 494)"><rect x="0" y="0" width="392" height="276" rx="11" fill="#fff" stroke="#d1dbE8" stroke-width="1.4" /><text x="18" y="30" font-size="22" fill="#7154d9" font-weight="650">Example progress during</text><text x="18" y="58" font-size="22" fill="#7154d9" font-weight="650">download</text><rect x="18" y="91" width="356" height="76" rx="6" fill="#f5f7fb" stroke="none" stroke-width="1.4" /><text x="29" y="121" font-size="20" fill="#24384f" font-weight="400">Preparing text recognition</text><text x="29" y="149" font-size="20" fill="#24384f" font-weight="400">components (50%)</text><text x="18" y="198" font-size="20" fill="#24384f" font-weight="400">Stay online and wait. Ready</text><text x="18" y="225" font-size="20" fill="#24384f" font-weight="400">resources do not show this</text><text x="18" y="252" font-size="20" fill="#24384f" font-weight="400">download message.</text></g></g><path d="M24 911 H416" stroke="#dce3ef"/><text x="24" y="938" font-size="17" fill="#536b83" font-weight="400">Instructional illustration</text></g></svg>