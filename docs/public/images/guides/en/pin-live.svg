<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" role="img" aria-labelledby="title desc"><title id="title">Live updates differ from a frozen image</title><desc id="desc">Keep the source running; copy or save captures one current frame.</desc><rect width="960" height="560" rx="24" fill="#f5f7fc" /><g font-family="system-ui,-apple-system,PingFang SC,Microsoft YaHei,sans-serif"><text x="36" y="52" font-size="30" fill="#18233b" font-weight="700">Live updates differ from a frozen image</text><text x="36" y="88" font-size="20" fill="#53627d" font-weight="400">Keep the source running; copy or save captures one current frame</text><rect x="36" y="134" width="280" height="307" rx="16" fill="#ffffff" stroke="#c8d3e6" stroke-width="2" /><rect x="56" y="153" width="120" height="38" rx="19" fill="#ede9fe" stroke="#ede9fe" stroke-width="2" /><text x="70" y="179" font-size="14.07" fill="#5941bd" font-weight="600">Source window</text><text x="67" y="245" font-size="27" fill="#18233b" font-weight="400">State A → State B</text><text x="67" y="319" font-size="18.38" fill="#18233b" font-weight="400">Keep running and capturable</text><text x="67" y="402" font-size="14.06" fill="#53627d" font-weight="400">Minimizing or closing affects updates</text><path d="M328 278 L375 278" fill="none" stroke="#6954d9" stroke-width="3" /><path d="M366 271 L375 278 L366 285" fill="none" stroke="#6954d9" stroke-width="3" /><rect x="395" y="134" width="253" height="307" rx="16" fill="#ffffff" stroke="#c8d3e6" stroke-width="2" /><rect x="415" y="153" width="136" height="38" rx="19" fill="#ede9fe" stroke="#ede9fe" stroke-width="2" /><text x="429" y="179" font-size="20" fill="#5941bd" font-weight="600">Live pin</text><text x="425" y="245" font-size="27" fill="#167d69" font-weight="400">Follow A → B</text><text x="415" y="319" font-size="18.13" fill="#18233b" font-weight="400">Copy / Save: current frame</text><path d="M661 278 L703 278" fill="none" stroke="#6954d9" stroke-width="3" /><path d="M694 271 L703 278 L694 285" fill="none" stroke="#6954d9" stroke-width="3" /><rect x="721" y="134" width="203" height="307" rx="16" fill="#ffffff" stroke="#c8d3e6" stroke-width="2" /><rect x="739" y="153" width="160" height="38" rx="19" fill="#ede9fe" stroke="#ede9fe" stroke-width="2" /><text x="753" y="179" font-size="17.13" fill="#5941bd" font-weight="600">Convert to image</text><text x="745" y="251" font-size="25" fill="#18233b" font-weight="400">Static frame B</text><text x="745" y="318" font-size="12.59" fill="#18233b" font-weight="400">Continue OCR and annotation</text><text x="744" y="402" font-size="14.78" fill="#c96520" font-weight="400">Stop following the source</text><path d="M36 510 L924 510" fill="none" stroke="#dce3ef" stroke-width="1" /><text x="36" y="539" font-size="18" fill="#53627d" font-weight="400">Snow Shot · Instructional illustration</text></g></svg>