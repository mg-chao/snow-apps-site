<svg xmlns="http://www.w3.org/2000/svg" width="440" height="950" viewBox="0 0 440 950" role="img" aria-labelledby="title desc"><title id="title">Cell text or table range: Paste right and down from the origin</title><desc id="desc">The source is 2×2 cells. Right-click the destination quantity cell and Paste; it replaces a 2×2 rectangle to its right and below, leaving Item unchanged. Plain text uses tabs for columns and line breaks for rows.</desc><rect width="440" height="950" rx="16" fill="#f5f7fc"/><g font-family="system-ui,-apple-system,PingFang SC,Microsoft YaHei,sans-serif"><text x="24" y="35" font-size="23" fill="#24384f" font-weight="700">Cell text or table range</text><text x="24" y="70" font-size="20" fill="#267cba" font-weight="600">Paste right and down from the</text><text x="24" y="97" font-size="20" fill="#267cba" font-weight="600">origin</text><g transform="translate(0 138)"><g transform="translate(24 0)"><rect x="0" y="0" width="392" height="159" rx="11" fill="#fff" stroke="#d1dbE8" stroke-width="1.4" /><text x="18" y="30" font-size="22" fill="#7154d9" font-weight="650">Source 2×2</text><rect x="18" y="63" width="356" height="76" rx="6" fill="#f5f7fb" stroke="none" stroke-width="1.4" /><text x="29" y="93" font-size="20" fill="#24384f" font-weight="400">7 90</text><text x="29" y="121" font-size="20" fill="#24384f" font-weight="400">8 100</text></g><g transform="translate(24 176)"><rect x="0" y="0" width="392" height="214" rx="11" fill="#fff" stroke="#d1dbE8" stroke-width="1.4" /><text x="18" y="30" font-size="22" fill="#7154d9" font-weight="650">Result: start in Qty</text><rect x="18" y="63" width="116" height="42" rx="0" fill="#eaf0f8" stroke="#b9c9da" stroke-width="1.4" /><text x="28" y="91" font-size="20" fill="#24384f" font-weight="400">Item</text><rect x="134" y="63" width="116" height="42" rx="0" fill="#eaf0f8" stroke="#b9c9da" stroke-width="1.4" /><text x="144" y="91" font-size="20" fill="#24384f" font-weight="400">Qty</text><rect x="250" y="63" width="116" height="42" rx="0" fill="#eaf0f8" stroke="#b9c9da" stroke-width="1.4" /><text x="260" y="91" font-size="20" fill="#24384f" font-weight="400">Sum</text><rect x="18" y="105" width="116" height="42" rx="0" fill="white" stroke="#b9c9da" stroke-width="1.4" /><text x="28" y="133" font-size="20" fill="#24384f" font-weight="400">Pen</text><rect x="134" y="105" width="116" height="42" rx="0" fill="#eee9fb" stroke="#b9c9da" stroke-width="1.4" /><text x="144" y="133" font-size="20" fill="#24384f" font-weight="400">7</text><rect x="250" y="105" width="116" height="42" rx="0" fill="white" stroke="#b9c9da" stroke-width="1.4" /><text x="260" y="133" font-size="20" fill="#24384f" font-weight="400">90</text><rect x="18" y="147" width="116" height="42" rx="0" fill="white" stroke="#b9c9da" stroke-width="1.4" /><text x="28" y="175" font-size="20" fill="#24384f" font-weight="400">Paper</text><rect x="134" y="147" width="116" height="42" rx="0" fill="white" stroke="#b9c9da" stroke-width="1.4" /><text x="144" y="175" font-size="20" fill="#24384f" font-weight="400">8</text><rect x="250" y="147" width="116" height="42" rx="0" fill="white" stroke="#b9c9da" stroke-width="1.4" /><text x="260" y="175" font-size="20" fill="#24384f" font-weight="400">100</text></g><g transform="translate(24 407)"><rect x="0" y="0" width="392" height="187" rx="11" fill="#fff" stroke="#d1dbE8" stroke-width="1.4" /><text x="18" y="30" font-size="22" fill="#7154d9" font-weight="650">Rows and columns are not</text><text x="18" y="58" font-size="22" fill="#7154d9" font-weight="650">added</text><text x="18" y="109" font-size="20" fill="#24384f" font-weight="400">If it does not fit, reduce the</text><text x="18" y="136" font-size="20" fill="#24384f" font-weight="400">source or change the origin.</text><text x="18" y="163" font-size="20" fill="#24384f" font-weight="400">Undo a mistaken paste.</text></g></g><path d="M24 901 H416" stroke="#dce3ef"/><text x="24" y="928" font-size="17" fill="#536b83" font-weight="400">Instructional illustration</text></g></svg>