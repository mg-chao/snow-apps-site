<svg xmlns="http://www.w3.org/2000/svg" width="820" height="440" viewBox="0 0 820 440" role="img" aria-labelledby="title desc"><title id="title">Angle annotations: Place the first endpoint</title><desc id="desc">Step 1: Place the first endpoint</desc><rect width="820" height="440" rx="16" fill="#f3f7fc" /><rect x="22" y="75" width="500" height="330" rx="10" fill="#fff" stroke="#d2deeb" /><rect x="540" y="75" width="260" height="330" rx="10" fill="#fff" stroke="#d2deeb" /><text x="25" y="39" font-size="25" fill="#26384c" font-weight="bold">Angle annotations</text><text x="25" y="63" font-size="17" fill="#546c84" font-weight="normal">1 / 3  Place the first endpoint</text><circle cx="120" cy="160" r="6" fill="white" stroke="#347ec7" stroke-width="2" /><circle cx="100" cy="145" r="12" fill="#347ec7" stroke="#347ec7" stroke-width="2" /><text x="95" y="151" font-size="17" fill="white" font-weight="bold">1</text><text x="75" y="110" font-size="18" fill="#26384c" font-weight="normal">First endpoint → vertex → second endpoint</text><text x="555" y="116" font-size="21" fill="#26384c" font-weight="bold">Key steps</text><text x="555" y="165" font-size="14.79" fill="#26384c" font-weight="normal">Start at the first side’s outer end</text><text x="555" y="215" font-size="16.81" fill="#26384c" font-weight="normal">The second point is the vertex</text><text x="555" y="265" font-size="13.11" fill="#26384c" font-weight="normal">The third point defines the second side</text><text x="555" y="355" font-size="17" fill="#546c84" font-weight="normal">Follow the tutorial steps</text><text x="555" y="385" font-size="16" fill="#546c84" font-weight="normal">Instructional illustration</text></svg>