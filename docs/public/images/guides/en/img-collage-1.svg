<svg xmlns="http://www.w3.org/2000/svg" width="820" height="440" viewBox="0 0 820 440" role="img" aria-labelledby="title desc"><title id="title">Image collage: add three images</title><desc id="desc">Add three images to the composition.</desc><rect width="820" height="440" rx="16" fill="#f3f7fc" /><rect x="22" y="75" width="500" height="330" rx="10" fill="#fff" stroke="#d2deeb" /><rect x="540" y="75" width="260" height="330" rx="10" fill="#fff" stroke="#d2deeb" /><text x="25" y="39" font-size="25" fill="#26384c" font-weight="bold">Image collage and layout</text><text x="25" y="63" font-size="17" fill="#546c84" font-weight="normal">1 / 3  Add three images</text><rect x="70" y="155" width="120" height="110" rx="6" fill="#e5f2fb" stroke="#8da7bf" /><text x="118" y="220" font-size="34" fill="#26384c" font-weight="normal">1</text><rect x="212" y="155" width="120" height="110" rx="6" fill="#fce8e6" stroke="#8da7bf" /><text x="260" y="220" font-size="34" fill="#26384c" font-weight="normal">2</text><rect x="354" y="155" width="120" height="110" rx="6" fill="#e5f4e8" stroke="#8da7bf" /><text x="402" y="220" font-size="34" fill="#26384c" font-weight="normal">3</text><text x="555" y="116" font-size="21" fill="#26384c" font-weight="bold">Key steps</text><text x="555" y="165" font-size="17" fill="#26384c" font-weight="normal">Several images in one session</text><text x="555" y="215" font-size="16.14" fill="#26384c" font-weight="normal">Drag onto another to swap order</text><text x="555" y="265" font-size="13.86" fill="#26384c" font-weight="normal">Check outer margin and inner spacing</text><text x="555" y="355" font-size="17" fill="#546c84" font-weight="normal">Follow the page steps</text><text x="555" y="385" font-size="16" fill="#546c84" font-weight="normal">Instructional illustration</text></svg>