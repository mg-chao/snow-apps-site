<svg xmlns="http://www.w3.org/2000/svg" width="440" height="690" viewBox="0 0 440 690" role="img" aria-labelledby="title desc"><title id="title">Table states and files: Fix the condition before Retry</title><desc id="desc">For no valid cells, an unavailable model, or a network error, read the message, check the model/service, then Retry. Model changes apply immediately; a previously used model may restore its edits.</desc><rect width="440" height="690" rx="16" fill="#f5f7fc"/><g font-family="system-ui,-apple-system,PingFang SC,Microsoft YaHei,sans-serif"><text x="24" y="35" font-size="23" fill="#24384f" font-weight="700">Table states and files</text><text x="24" y="70" font-size="20" fill="#267cba" font-weight="600">Fix the condition before Retry</text><g transform="translate(0 111)"><g transform="translate(24 0)"><rect x="0" y="0" width="392" height="160" rx="11" fill="#fff" stroke="#d1dbE8" stroke-width="1.4" /><text x="18" y="30" font-size="22" fill="#c34d56" font-weight="650">No table cells were</text><text x="18" y="58" font-size="22" fill="#c34d56" font-weight="650">recognized</text><text x="18" y="109" font-size="20" fill="#24384f" font-weight="400">Check the input area, service</text><text x="18" y="136" font-size="20" fill="#24384f" font-weight="400">and returned table structure.</text></g><g transform="translate(24 177)"><rect x="0" y="0" width="392" height="213" rx="11" fill="#fff" stroke="#d1dbE8" stroke-width="1.4" /><text x="18" y="30" font-size="22" fill="#7154d9" font-weight="650">Result action</text><rect x="18" y="63" width="84" height="39" rx="8" fill="#f1edfb" stroke="#bdb0ea" stroke-width="1.4" /><text x="32" y="90" font-size="20" fill="#7154d9" font-weight="600">Retry</text><text x="18" y="135" font-size="20" fill="#24384f" font-weight="400">For unclear input, recapture</text><text x="18" y="162" font-size="20" fill="#24384f" font-weight="400">rather than repeating the same</text><text x="18" y="189" font-size="20" fill="#24384f" font-weight="400">request.</text></g></g><path d="M24 641 H416" stroke="#dce3ef"/><text x="24" y="668" font-size="17" fill="#536b83" font-weight="400">Instructional illustration</text></g></svg>