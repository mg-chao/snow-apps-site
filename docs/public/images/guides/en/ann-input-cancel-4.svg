<svg xmlns="http://www.w3.org/2000/svg" width="440" height="620" viewBox="0 0 440 620" role="img" aria-labelledby="title desc"><title id="title">Discard a draft or end capture: Image editor: Esc drops the draft</title><desc id="desc">In the image editor, Esc removes the red path draft while retaining the purple annotations and base image</desc><rect width="440" height="620" rx="15" fill="#f4f7fc"/><g font-family="system-ui,-apple-system,PingFang SC,Microsoft YaHei,sans-serif"><text x="24" y="34" font-size="23" fill="#263b51" font-weight="700" >Discard a draft or end capture</text><text x="24" y="70" font-size="20" fill="#287dbc" font-weight="600" >Image editor: Esc drops the draft</text><g transform="translate(24 115)"><rect x="0" y="0" width="392" height="393" rx="11" fill="white" stroke="#d0dbe7" stroke-width="1.5" /><text x="18" y="31" font-size="21" fill="#7654d6" font-weight="600" >Action: Esc in the image</text><text x="18" y="58" font-size="21" fill="#7654d6" font-weight="600" >editor</text><g transform="translate(18 92)"><rect x="0" y="0" width="356" height="218" rx="6" fill="#fafcfe" stroke="#c6d5e4" stroke-width="1.5" /><rect x="46" y="54" width="98" height="3" rx="1" fill="#d9e2eb" stroke="none" stroke-width="1.5" /><rect x="46" y="64" width="82" height="3" rx="1" fill="#d9e2eb" stroke="none" stroke-width="1.5" /><rect x="46" y="74" width="106" height="3" rx="1" fill="#d9e2eb" stroke="none" stroke-width="1.5" /><rect x="36" y="36" width="130" height="67" rx="7" fill="none" stroke="#7654d6" stroke-width="1.5" /><path d="M222 92 L307 43" fill="none" stroke="#7654d6" stroke-width="4" stroke-linecap="round"/><polygon points="307.00,43.00 299.97,52.83 294.97,44.16" fill="#7654d6"/><text x="207" y="115" font-size="17" fill="#7654d6" font-weight="400" >Completed</text></g><text x="18" y="345" font-size="19" fill="#263b51" font-weight="400" >Completed work stays; the editor</text><text x="18" y="371" font-size="19" fill="#263b51" font-weight="400" >remains open.</text></g><path d="M24 572 H416" stroke="#d9e2ed"/><text x="24" y="598" font-size="17" fill="#587087" font-weight="400" >Instructional illustration</text></g></svg>