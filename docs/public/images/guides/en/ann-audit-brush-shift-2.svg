<svg xmlns="http://www.w3.org/2000/svg" width="760" height="430" viewBox="0 0 760 430" role="img" aria-labelledby="title desc" font-family="system-ui,sans-serif"><title id="title">Add a straight section to a stroke: Hold Shift for a straight edge</title><desc id="desc">Keep holding the mouse; press Shift to make the current section straight.</desc><rect width="760" height="430" rx="12" fill="#f3f7fc" /><text x="24" y="34" font-size="25" fill="#24384f">Add a straight section to a stroke</text><text x="24" y="63" font-size="18" fill="#536c86">Hold Shift for a straight edge</text><rect x="18" y="80" width="724" height="260" rx="7" fill="white" stroke="#b9cce0" /><path d="M75 230 Q155 105 245 220" stroke="#2877bd" stroke-width="7" fill="none" stroke-linecap="round" stroke-linejoin="round" /><path d="M245 220 L445 160" stroke="#2877bd" stroke-width="7" fill="none" stroke-linecap="round" stroke-linejoin="round" /><rect x="530" y="112" width="105" height="33" rx="5" fill="#e2effb" stroke="#2877bd" /><text x="542" y="135" font-size="18" fill="#2877bd">Shift</text><text x="26" y="364" font-size="18" fill="#24384f">Keep holding the mouse; press Shift to make the current section straight.</text><text x="24" y="416" font-size="15" fill="#536c86">Instructional illustration</text></svg>