<svg xmlns="http://www.w3.org/2000/svg" width="820" height="440" viewBox="0 0 820 440" role="img" aria-labelledby="title desc"><title id="title">Full-screen canvas: point and exit</title><desc id="desc">Use the laser pointer, then exit the canvas.</desc><rect width="820" height="440" rx="16" fill="#f3f7fc" /><rect x="22" y="75" width="500" height="330" rx="10" fill="#fff" stroke="#d2deeb" /><rect x="540" y="75" width="260" height="330" rx="10" fill="#fff" stroke="#d2deeb" /><text x="25" y="39" font-size="25" fill="#26384c" font-weight="bold">Full-screen canvas and laser pointer</text><text x="25" y="63" font-size="17" fill="#546c84" font-weight="normal">3 / 3  Point and exit</text><rect x="65" y="115" width="430" height="220" rx="6" fill="#eaf0f6" stroke="#8da7bf" /><text x="85" y="148" font-size="20" fill="#26384c" font-weight="normal">Application being presented</text><rect x="85" y="180" width="335" height="8" rx="4" fill="#c6d4e2" stroke="#c6d4e2" /><rect x="85" y="210" width="285" height="8" rx="4" fill="#c6d4e2" stroke="#c6d4e2" /><rect x="85" y="240" width="320" height="8" rx="4" fill="#c6d4e2" stroke="#c6d4e2" /><rect x="85" y="270" width="230" height="8" rx="4" fill="#c6d4e2" stroke="#c6d4e2" /><circle cx="295" cy="215" r="10" fill="#ff595e" stroke="#ff595e" stroke-width="2" /><path d="M205 240 Q250 190 295 215" stroke="#ff595e" stroke-width="4" fill="none" stroke-linejoin="round" stroke-linecap="round" /><text x="80" y="365" font-size="18" fill="#26384c" font-weight="normal">Laser effect points briefly</text><text x="555" y="116" font-size="21" fill="#26384c" font-weight="bold">Key steps</text><text x="555" y="165" font-size="14.56" fill="#26384c" font-weight="normal">Drawing layer above the application</text><text x="555" y="215" font-size="11.1" fill="#26384c" font-weight="normal">Click-through and drawing are separate states</text><text x="555" y="265" font-size="12.38" fill="#26384c" font-weight="normal">Use laser pointing for temporary attention</text><text x="555" y="355" font-size="17" fill="#546c84" font-weight="normal">Follow the page steps</text><text x="555" y="385" font-size="16" fill="#546c84" font-weight="normal">Instructional illustration</text></svg>