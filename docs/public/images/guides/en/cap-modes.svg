<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="480" viewBox="0 0 960 480" role="img" aria-labelledby="title"><title id="title">Choose a capture action for the task (illustration)</title><g font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif"><rect x="1" y="1" width="958" height="478" rx="12" fill="#f6f7fc" stroke="#cbd4e4" stroke-width="2" /><text x="30" y="43" font-size="28" fill="#263148">Choose a capture action for the task</text><text x="30" y="460" font-size="18" fill="#536078">Instructional illustration</text><rect x="30" y="90" width="280" height="290" rx="12" fill="#fff" stroke="#cbd4e4" stroke-width="2" /><circle cx="60" cy="125" r="19" fill="#7652dc" /><text x="53" y="133" font-size="23" fill="white">1</text><text x="55" y="182" font-size="25" fill="#263148">Delayed screenshot</text><text x="55" y="236" font-size="21" fill="#263148">Trigger → Open the menu</text><text x="55" y="284" font-size="21" fill="#263148">Wait 1–10 seconds</text><text x="55" y="335" font-size="21" fill="#263148">Enter region selection</text><rect x="330" y="90" width="280" height="290" rx="12" fill="#fff" stroke="#cbd4e4" stroke-width="2" /><circle cx="360" cy="125" r="19" fill="#7652dc" /><text x="353" y="133" font-size="23" fill="white">2</text><text x="355" y="182" font-size="25" fill="#263148">Direct capture</text><text x="355" y="236" font-size="21" fill="#263148">Current display / Window</text><text x="355" y="284" font-size="21" fill="#263148">Skip selection editing</text><text x="355" y="335" font-size="16.92" fill="#263148">Copy the result to the clipboard</text><rect x="630" y="90" width="280" height="290" rx="12" fill="#fff" stroke="#cbd4e4" stroke-width="2" /><circle cx="660" cy="125" r="19" fill="#7652dc" /><text x="653" y="133" font-size="23" fill="white">3</text><text x="655" y="182" font-size="25" fill="#263148">Retake screenshot</text><text x="655" y="236" font-size="17.86" fill="#263148">Keep the current task context</text><text x="655" y="284" font-size="21" fill="#263148">Refresh the screen image</text><text x="655" y="335" font-size="21" fill="#263148">Inspect the content again</text></g></svg>