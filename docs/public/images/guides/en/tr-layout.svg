<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" role="img" aria-labelledby="title desc"><title id="title">Choose text grouping before in-image translation</title><desc id="desc">Smart merging organizes paragraphs; Original keeps recognized lines. Illustration</desc><rect width="960" height="560" rx="24" fill="#f5f7fc" /><g font-family="system-ui,-apple-system,PingFang SC,Microsoft YaHei,sans-serif"><text x="36" y="52" font-size="30" fill="#18233b" font-weight="700">Choose text grouping before in-image translation</text><text x="36" y="88" font-size="20" fill="#53627d" font-weight="400">Smart merging organizes paragraphs; Original keeps recognized lines</text><rect x="36" y="137" width="414" height="308" rx="16" fill="#ffffff" stroke="#c8d3e6" stroke-width="2" /><rect x="56" y="155" width="155" height="38" rx="19" fill="#ede9fe" stroke="#ede9fe" stroke-width="2" /><text x="70" y="181" font-size="20" fill="#5941bd" font-weight="600">Smart merging</text><rect x="61" y="228" width="359" height="139" rx="16" fill="#e7e1fc" stroke="#6954d9" stroke-width="2" /><text x="83" y="271" font-size="25" fill="#18233b" font-weight="400">First line of continuous text</text><text x="83" y="322" font-size="23.42" fill="#18233b" font-weight="400">Second line of continuous text</text><text x="62" y="410" font-size="18.71" fill="#53627d" font-weight="400">Nearby lines form blocks according to layout</text><rect x="510" y="137" width="414" height="308" rx="16" fill="#ffffff" stroke="#c8d3e6" stroke-width="2" /><rect x="530" y="155" width="155" height="38" rx="19" fill="#ede9fe" stroke="#ede9fe" stroke-width="2" /><text x="544" y="181" font-size="20" fill="#5941bd" font-weight="600">Original</text><rect x="535" y="228" width="359" height="59" rx="16" fill="#e7e1fc" stroke="#6954d9" stroke-width="2" /><text x="557" y="268" font-size="25" fill="#18233b" font-weight="400">Original recognized line 1</text><rect x="535" y="307" width="359" height="59" rx="16" fill="#e3f3ee" stroke="#167d69" stroke-width="2" /><text x="557" y="347" font-size="25" fill="#18233b" font-weight="400">Original recognized line 2</text><text x="535" y="410" font-size="16.14" fill="#53627d" font-weight="400">Each recognized line keeps its own correspondence</text><path d="M36 510 L924 510" fill="none" stroke="#dce3ef" stroke-width="1" /><text x="36" y="539" font-size="18" fill="#53627d" font-weight="400">Snow Shot · Instructional illustration</text></g></svg>