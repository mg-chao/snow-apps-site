<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560" role="img" aria-labelledby="title desc"><title id="title">Crop history and editable annotations: Keep an editable marker</title><desc id="desc">Instructional illustration. The base B and editable purple arrow meet at y=145 in a 300×200 image.</desc><rect width="960" height="560" rx="20" fill="#f5f7fc"/><g font-family="system-ui,-apple-system,PingFang SC,Microsoft YaHei,sans-serif"><text x="28" y="42" font-size="28" fill="#24384f" font-weight="700" text-anchor="start">Crop history and editable annotations</text><text x="28" y="77" font-size="19" fill="#536b83" font-weight="400" text-anchor="start">Keep an editable marker</text><rect x="28" y="98" width="592" height="396" rx="8" fill="white" stroke="#c8d3e6" stroke-width="1.5" /><text x="80" y="121" font-size="19" fill="#536b83" font-weight="600" text-anchor="start">300 × 200 px</text><g transform="translate(80 136) scale(1.6)"><rect x="0" y="0" width="300" height="200" rx="0" fill="white" stroke="#aabbd2" stroke-width="1.5" /><rect x="20" y="20" width="110" height="40" rx="0" fill="#e5effa" stroke="none" stroke-width="1.5" /><text x="36" y="49" font-size="25" fill="#2877bd" font-weight="700" text-anchor="start">A</text><rect x="20" y="130" width="260" height="30" rx="0" fill="#dcefe9" stroke="none" stroke-width="1.5" /><text x="36" y="154" font-size="25" fill="#258568" font-weight="700" text-anchor="start">B</text><path d="M0 145 L300 145" fill="none" stroke="#7154d9" stroke-width="1" stroke-dasharray="4 4"/><path d="M160 145 L260 145" fill="none" stroke="#7154d9" stroke-width="3"/><path d="M250 139 L260 145 L250 151" fill="none" stroke="#7154d9" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></g><text x="66" y="141" font-size="16" fill="#536b83" font-weight="400" text-anchor="end">0</text><text x="66" y="373.0" font-size="16" fill="#7154d9" font-weight="400" text-anchor="end">145</text><text x="66" y="461.0" font-size="16" fill="#536b83" font-weight="400" text-anchor="end">200</text><text x="86" y="486" font-size="18" fill="#536b83" font-weight="400" text-anchor="start">A / B: image pixels</text><path d="M318 480 L362 480" fill="none" stroke="#7154d9" stroke-width="2"/><path d="M352 474 L362 480 L352 486" fill="none" stroke="#7154d9" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="374" y="486" font-size="18" fill="#7154d9" font-weight="400" text-anchor="start">Editable</text><rect x="644" y="98" width="288" height="396" rx="8" fill="white" stroke="#c8d3e6" stroke-width="1.5" /><text x="666" y="134" font-size="22" fill="#7154d9" font-weight="650" text-anchor="start">Baseline</text><text x="666" y="182" font-size="20" fill="#24384f" font-weight="400" text-anchor="start">B center: y = 145.</text><text x="666" y="232" font-size="20" fill="#24384f" font-weight="400" text-anchor="start">Arrow: y = 145.</text><text x="666" y="282" font-size="20" fill="#24384f" font-weight="400" text-anchor="start">Next: remove y =</text><text x="666" y="310" font-size="20" fill="#24384f" font-weight="400" text-anchor="start">80–120 (40 px).</text><path d="M28 509 L932 509" fill="none" stroke="#dbe3ef" stroke-width="1"/><text x="28" y="539" font-size="18" fill="#536b83" font-weight="400" text-anchor="start">Same origin and scale; the purple arrow is editable.</text><text x="930" y="539" font-size="17" fill="#536b83" font-weight="400" text-anchor="end">Instructional illustration</text></g></svg>