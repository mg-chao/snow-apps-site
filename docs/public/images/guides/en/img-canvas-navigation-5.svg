<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" role="img" aria-labelledby="title desc"><title id="title">Navigate the annotation layer: Hold the middle button and drag</title><desc id="desc">Instructional illustration. Hold only the middle mouse button and drag from the dashed mouse position 60 px left and 30 px up. Both annotations follow the pointer.</desc><defs><clipPath id="scene-clip"><rect x="0" y="0" width="840" height="280" rx="8"/></clipPath></defs><rect width="960" height="600" rx="20" fill="#f5f7fc"/><g font-family="system-ui,-apple-system,PingFang SC,Microsoft YaHei,sans-serif"><text x="32" y="43" font-size="29" fill="#24384f" font-weight="700" text-anchor="start">Navigate the annotation layer</text><text x="928" y="42" font-size="22" fill="#536b83" font-weight="600" text-anchor="end">5 / 6</text><text x="32" y="82" font-size="25" fill="#267cba" font-weight="650" text-anchor="start">Middle button held: drag left and up</text><text x="32" y="124" font-size="22" fill="#536b83" font-weight="400" text-anchor="start">Application: fixed · Purple: annotation layer</text><g transform="translate(60 154)"><g id="fixed-application"><rect x="0" y="0" width="840" height="280" rx="8" fill="#fff" stroke="#aebdd0" stroke-width="1.5" /><rect x="1" y="1" width="838" height="42" rx="7" fill="#e8edf4" stroke="none" stroke-width="1.5" /><text x="20" y="30" font-size="21" fill="#536b83" font-weight="600" text-anchor="start">Application underneath — fixed</text><rect x="22" y="63" width="112" height="188" rx="6" fill="#f1f4f8" stroke="none" stroke-width="1.5" /><path d="M39 85 L115 85" fill="none" stroke="#ccd5df" stroke-width="6" stroke-linecap="round" /><path d="M39 113 L101 113" fill="none" stroke="#ccd5df" stroke-width="6" stroke-linecap="round" /><path d="M39 141 L114 141" fill="none" stroke="#ccd5df" stroke-width="6" stroke-linecap="round" /><path d="M39 169 L93 169" fill="none" stroke="#ccd5df" stroke-width="6" stroke-linecap="round" /><path d="M39 197 L107 197" fill="none" stroke="#ccd5df" stroke-width="6" stroke-linecap="round" /><rect x="170" y="99" width="120" height="82" rx="4" fill="#e5eef7" stroke="#b5c5d4" stroke-width="1.5" /><text x="230" y="155" font-size="36" fill="#24384f" font-weight="700" text-anchor="middle">A</text><rect x="510" y="99" width="120" height="82" rx="4" fill="#e3eee9" stroke="#b5c5d4" stroke-width="1.5" /><text x="570" y="155" font-size="36" fill="#24384f" font-weight="700" text-anchor="middle">B</text><path d="M175 222 L350 222" fill="none" stroke="#d5dee8" stroke-width="9" stroke-linecap="round" /><path d="M515 222 L690 222" fill="none" stroke="#d5dee8" stroke-width="9" stroke-linecap="round" /></g><g clip-path="url(#scene-clip)"><g transform="translate(10.675724137 22.150440779) scale(1.127496852)" opacity=".32" stroke-dasharray="6 5"><ellipse cx="230" cy="140" rx="78" ry="59" fill="none" stroke="#7946cb" stroke-width="4"/><path d="M415 205 L559 158" fill="none" stroke="#7946cb" stroke-width="5" stroke-linecap="round" /><path d="M545.3582413366506 154.87871491674815 L559 158 L549.8262737908486 168.56800584024865" fill="none" stroke="#7946cb" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/></g><g id="annotation-layer"><g transform="translate(-49.324275863 -7.849559221) scale(1.127496852)"><ellipse cx="230" cy="140" rx="78" ry="59" fill="none" stroke="#7946cb" stroke-width="4"/><path d="M415 205 L559 158" fill="none" stroke="#7946cb" stroke-width="5" stroke-linecap="round" /><path d="M545.3582413366506 154.87871491674815 L559 158 L549.8262737908486 168.56800584024865" fill="none" stroke="#7946cb" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/></g></g><g opacity=".45" stroke-dasharray="4 3"><rect x="714" y="223" width="26" height="41" rx="12" fill="white" stroke="#536b83" stroke-width="1.5" /><path d="M715 238 L739 238" fill="none" stroke="#536b83" stroke-width="1.3" stroke-linecap="round" /><rect x="724" y="228" width="6" height="15" rx="3" fill="white" stroke="#536b83" stroke-width="1.5" /></g><path d="M713 237 L679 219" fill="none" stroke="#267cba" stroke-width="2.5" stroke-linecap="round" /><path d="M683.2213869886695 225.9871232915909 L679 219 L687.1516438401894 218.56330479427558" fill="none" stroke="#267cba" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><rect x="654" y="193" width="26" height="41" rx="12" fill="white" stroke="#267cba" stroke-width="1.5" /><path d="M655 208 L679 208" fill="none" stroke="#267cba" stroke-width="1.3" stroke-linecap="round" /><rect x="664" y="198" width="6" height="15" rx="3" fill="#267cba" stroke="#267cba" stroke-width="1.5" /></g></g><text x="32" y="479" font-size="23" fill="#24384f" font-weight="600" text-anchor="start">Dashed mouse → solid mouse: 60 px left, 30 px up.</text><text x="32" y="510" font-size="23" fill="#24384f" font-weight="400" text-anchor="start">Both marks move together, retaining their relative positions.</text><path d="M32 538 L928 538" fill="none" stroke="#dbe3ef" stroke-width="1" stroke-linecap="round" /><text x="32" y="568" font-size="19" fill="#536b83" font-weight="400" text-anchor="start">Dashed purple = previous view</text><text x="928" y="568" font-size="19" fill="#536b83" font-weight="400" text-anchor="end">Instructional illustration</text></g></svg>