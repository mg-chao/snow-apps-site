<rect width="900" height="470" rx="20" fill="#fff" />
<g font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif"><text x="30" y="47" font-size="30" fill="#163963" font-weight="700">Prepare audio and webcam</text><text x="30" y="79" font-size="18" fill="#62758e" font-weight="400">Instructional illustration</text><rect x="30" y="112" width="405" height="265" rx="16" fill="#f2f6fc" stroke="#cbd8e9" stroke-width="2" /><circle cx="58" cy="142" r="20" fill="#1677ff" /><text x="51" y="150" font-size="24" fill="white" font-weight="700">1</text><text x="88" y="151" font-size="24" fill="#163963" font-weight="600">Check both audio sources</text><rect x="465" y="112" width="405" height="265" rx="16" fill="#f2f6fc" stroke="#cbd8e9" stroke-width="2" /><circle cx="493" cy="142" r="20" fill="#1677ff" /><text x="486" y="150" font-size="24" fill="white" font-weight="700">3</text><text x="523" y="151" font-size="24" fill="#163963" font-weight="600">Webcam layout</text><text x="60" y="202" font-size="24" fill="#24344d" font-weight="400">Microphone → Voice</text><circle cx="78" cy="252" r="20" fill="#1677ff" /><text x="71" y="260" font-size="24" fill="white" font-weight="700">2</text><text x="112" y="261" font-size="21.37" fill="#24344d" font-weight="400">System audio → Computer sound</text><rect x="65" y="289" width="325" height="28" rx="6" fill="#e0f4e8" stroke="#bedbc8" stroke-width="2" /><rect x="68" y="292" width="213" height="22" rx="4" fill="#36a76a" stroke="#36a76a" stroke-width="2" /><text x="65" y="352" font-size="21" fill="#24344d" font-weight="400">Hover for gain: −24 to +24 dB</text><rect x="490" y="175" width="352" height="174" rx="8" fill="#edf6ff" stroke="#8bbcff" stroke-width="2" /><rect x="707" y="245" width="110" height="84" rx="8" fill="#d7eafa" stroke="#1677ff" stroke-width="2" /><text x="715" y="292" font-size="23" fill="#24344d" font-weight="400">Webcam</text><path d="M720 241L648 197" stroke="#1677ff" stroke-width="4" marker-end="url(#a)" fill="none" /><text x="501" y="211" font-size="21" fill="#24344d" font-weight="400">Drag to move</text><text x="500" y="369" font-size="20" fill="#24344d" font-weight="400">Resize · Square/Circle · Rotate/Flip</text><text x="30" y="444" font-size="20" fill="#52647e" font-weight="400">MP4 supports audio; animations are silent. Check the preview first.</text></g></svg>