<svg xmlns="http://www.w3.org/2000/svg" width="440" height="720" viewBox="0 0 440 720" role="img" aria-labelledby="title desc"><title id="title">Use decoded barcode content: Choose the copy range</title><desc id="desc">Results start fully selected. These two QR payloads illustrate scope: select only the second and right-click Copy for that item. Select all again to copy everything.</desc><rect width="440" height="720" rx="16" fill="#f5f7fc"/><g font-family="system-ui,-apple-system,PingFang SC,Microsoft YaHei,sans-serif"><text x="24" y="35" font-size="23" fill="#24384f" font-weight="700">Use decoded barcode content</text><text x="24" y="70" font-size="20" fill="#267cba" font-weight="600">Choose the copy range</text><g transform="translate(0 111)"><g transform="translate(24 0)"><rect x="0" y="0" width="392" height="187" rx="11" fill="#fff" stroke="#d1dbE8" stroke-width="1.4" /><text x="18" y="30" font-size="22" fill="#7154d9" font-weight="650">Example payloads</text><rect x="18" y="63" width="356" height="104" rx="6" fill="#f5f7fb" stroke="none" stroke-width="1.4" /><rect x="26" y="70" width="248.4" height="27" rx="2" fill="#dbeafb" stroke="none" stroke-width="1.4" /><text x="29" y="93" font-size="20" fill="#24384f" font-weight="400">Snow Shot guide fixture</text><rect x="26" y="98" width="313.20000000000005" height="27" rx="2" fill="#dbeafb" stroke="none" stroke-width="1.4" /><text x="29" y="121" font-size="20" fill="#24384f" font-weight="400">https://example.com/snow-shot</text><rect x="26" y="126" width="151.20000000000002" height="27" rx="2" fill="#dbeafb" stroke="none" stroke-width="1.4" /><text x="29" y="149" font-size="20" fill="#24384f" font-weight="400">-guide-fixture</text></g><g transform="translate(24 204)"><rect x="0" y="0" width="392" height="187" rx="11" fill="#fff" stroke="#d1dbE8" stroke-width="1.4" /><text x="18" y="30" font-size="22" fill="#7154d9" font-weight="650">Select the second →</text><text x="18" y="58" font-size="22" fill="#7154d9" font-weight="650">right-click Copy</text><rect x="18" y="91" width="356" height="76" rx="6" fill="#f5f7fb" stroke="none" stroke-width="1.4" /><text x="29" y="121" font-size="20" fill="#24384f" font-weight="400">https://example.com/snow-shot</text><text x="29" y="149" font-size="20" fill="#24384f" font-weight="400">-guide-fixture</text></g></g><path d="M24 671 H416" stroke="#dce3ef"/><text x="24" y="698" font-size="17" fill="#536b83" font-weight="400">Instructional illustration</text></g></svg>