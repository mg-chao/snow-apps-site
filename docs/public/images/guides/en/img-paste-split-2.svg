oke-width="2"/><text x="400" y="334" font-size="34" fill="#233a5b" font-weight="400" text-anchor="middle">F</text><path d="M270 172V372" stroke="#387bcf" stroke-width="3" stroke-dasharray="7 5"/><text x="44" y="405" font-size="21" fill="#233a5b" font-weight="400" text-anchor="start">Manual cut: x=120</text><rect x="83" y="437" width="434" height="38" rx="7" fill="#ecf3fe" stroke="#9db8e0" stroke-width="2"/><text x="300.0" y="464" font-size="20" fill="#325a92" font-weight="600" text-anchor="middle">Review replacement</text><rect x="24" y="516" width="552" height="144" rx="12" fill="#fff" stroke="#d2dced" stroke-width="2"/><text x="44" y="548" font-size="21" fill="#233a5b" font-weight="400" text-anchor="start">The current image has a manual cut at</text><text x="44" y="578" font-size="21" fill="#233a5b" font-weight="400" text-anchor="start">x=120. Pasting a new image asks whether to</text><text x="44" y="608" font-size="21" fill="#233a5b" font-weight="400" text-anchor="start">discard those edits.</text><text x="24" y="694" font-size="19" fill="#5a6c86" font-weight="400" text-anchor="start">Instructional illustration</text><text x="548" y="694" font-size="19" fill="#5a6c86" font-weight="400" text-anchor="end">2/4</text></g></svg>
