<svg xmlns="http://www.w3.org/2000/svg" width="440" height="950" viewBox="0 0 440 950" role="img" aria-labelledby="title desc"><title id="title">Cell text or table range: Commit, then leave the next editor</title><desc id="desc">Change quantity 2 to 4. Enter commits and opens the next row; Esc leaves that next uncommitted editor while keeping 4. Right-click the target cell directly for range commands.</desc><rect width="440" height="950" rx="16" fill="#f5f7fc"/><g font-family="system-ui,-apple-system,PingFang SC,Microsoft YaHei,sans-serif"><text x="24" y="35" font-size="23" fill="#24384f" font-weight="700">Cell text or table range</text><text x="24" y="70" font-size="20" fill="#267cba" font-weight="600">Commit, then leave the next editor</text><g transform="translate(0 111)"><g transform="translate(24 0)"><rect x="0" y="0" width="392" height="242" rx="11" fill="#fff" stroke="#d1dbE8" stroke-width="1.4" /><text x="18" y="30" font-size="22" fill="#7154d9" font-weight="650">Current table: 4 is</text><text x="18" y="58" font-size="22" fill="#7154d9" font-weight="650">committed</text><rect x="18" y="91" width="116" height="42" rx="0" fill="#eaf0f8" stroke="#b9c9da" stroke-width="1.4" /><text x="28" y="119" font-size="20" fill="#24384f" font-weight="400">Item</text><rect x="134" y="91" width="116" height="42" rx="0" fill="#eaf0f8" stroke="#b9c9da" stroke-width="1.4" /><text x="144" y="119" font-size="20" fill="#24384f" font-weight="400">Qty</text><rect x="250" y="91" width="116" height="42" rx="0" fill="#eaf0f8" stroke="#b9c9da" stroke-width="1.4" /><text x="260" y="119" font-size="20" fill="#24384f" font-weight="400">Sum</text><rect x="18" y="133" width="116" height="42" rx="0" fill="white" stroke="#b9c9da" stroke-width="1.4" /><text x="28" y="161" font-size="20" fill="#24384f" font-weight="400">Pen</text><rect x="134" y="133" width="116" height="42" rx="0" fill="white" stroke="#b9c9da" stroke-width="1.4" /><text x="144" y="161" font-size="20" fill="#24384f" font-weight="400">4</text><rect x="250" y="133" width="116" height="42" rx="0" fill="white" stroke="#b9c9da" stroke-width="1.4" /><text x="260" y="161" font-size="20" fill="#24384f" font-weight="400">80</text><rect x="18" y="175" width="116" height="42" rx="0" fill="white" stroke="#b9c9da" stroke-width="1.4" /><text x="28" y="203" font-size="20" fill="#24384f" font-weight="400">Paper</text><rect x="134" y="175" width="116" height="42" rx="0" fill="#eee9fb" stroke="#b9c9da" stroke-width="1.4" /><text x="144" y="203" font-size="20" fill="#24384f" font-weight="400">3</text><rect x="250" y="175" width="116" height="42" rx="0" fill="white" stroke="#b9c9da" stroke-width="1.4" /><text x="260" y="203" font-size="20" fill="#24384f" font-weight="400">60</text></g><g transform="translate(24 259)"><rect x="0" y="0" width="392" height="263" rx="11" fill="#fff" stroke="#d1dbE8" stroke-width="1.4" /><text x="18" y="30" font-size="22" fill="#7154d9" font-weight="650">Table-range context menu</text><rect x="18" y="63" width="356" height="34" rx="3" fill="#f4f1fc" stroke="#e3e6ef" stroke-width="1.4" /><text x="30" y="87" font-size="20" fill="#24384f" font-weight="400">Copy</text><rect x="18" y="100" width="356" height="34" rx="3" fill="white" stroke="#e3e6ef" stroke-width="1.4" /><text x="30" y="124" font-size="20" fill="#24384f" font-weight="400">Paste</text><rect x="18" y="137" width="356" height="34" rx="3" fill="white" stroke="#e3e6ef" stroke-width="1.4" /><text x="30" y="161" font-size="20" fill="#24384f" font-weight="400">Clear contents</text><rect x="18" y="174" width="356" height="34" rx="3" fill="white" stroke="#e3e6ef" stroke-width="1.4" /><text x="30" y="198" font-size="20" fill="#24384f" font-weight="400">Merge cells</text><rect x="18" y="211" width="356" height="34" rx="3" fill="white" stroke="#e3e6ef" stroke-width="1.4" /><text x="30" y="235" font-size="20" fill="#24384f" font-weight="400">Split cells</text></g></g><path d="M24 901 H416" stroke="#dce3ef"/><text x="24" y="928" font-size="17" fill="#536b83" font-weight="400">Instructional illustration</text></g></svg>