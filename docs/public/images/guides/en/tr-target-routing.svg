<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 1110" role="img" aria-labelledby="title desc"><title id="title">Choose when the target can switch</title><desc id="desc">Threshold 60%: 80% reaches the threshold.</desc><rect width="720" height="1110" rx="22" fill="#f5f7fc"/><g font-family="system-ui,-apple-system,PingFang SC,Microsoft YaHei,sans-serif"><text x="32" y="58" font-size="36" fill="#28374e" font-weight="700">Choose when the target can switch</text><text x="32" y="109" font-size="28" fill="#53627d" font-weight="400">Example: local detection finds English at 80%.</text><rect x="28" y="154" width="664" height="220" rx="16" fill="white" stroke="#c8d4e4"/><text x="50" y="203" font-size="29" fill="#2864ae" font-weight="700">1. Primary: English / Secondary: French</text><text x="50" y="260" font-size="30" fill="#28374e" font-weight="400">Threshold 60%: 80% reaches the threshold.</text><text x="50" y="320" font-size="32" fill="#23704a" font-weight="700">Actual target: French</text><rect x="28" y="404" width="664" height="220" rx="16" fill="white" stroke="#c8d4e4"/><text x="50" y="453" font-size="29" fill="#2864ae" font-weight="700">2. Primary: English / Secondary: French</text><text x="50" y="510" font-size="30" fill="#28374e" font-weight="400">Threshold 90%: 80% is below the threshold.</text><text x="50" y="570" font-size="32" fill="#23704a" font-weight="700">Actual target: English</text><rect x="28" y="654" width="664" height="220" rx="16" fill="white" stroke="#c8d4e4"/><text x="50" y="703" font-size="29" fill="#2864ae" font-weight="700">3. Primary: English / Secondary: English</text><text x="50" y="760" font-size="30" fill="#28374e" font-weight="400">Both targets are the same.</text><text x="50" y="820" font-size="32" fill="#23704a" font-weight="700">Actual target: English</text><text x="32" y="928" font-size="30" fill="#28374e" font-weight="400">Specifying the source language alone</text><text x="32" y="969" font-size="30" fill="#28374e" font-weight="400">does not disable the target switch.</text><text x="32" y="1017" font-size="30" fill="#28374e" font-weight="400">Threshold range: 30%–100%</text><text x="32" y="1072" font-size="25" fill="#53627d" font-weight="400">Instructional illustration</text></g></svg>