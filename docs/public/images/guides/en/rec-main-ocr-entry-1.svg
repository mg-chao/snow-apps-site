<svg xmlns="http://www.w3.org/2000/svg" width="440" height="720" viewBox="0 0 440 720" role="img" aria-labelledby="title desc"><title id="title">Start OCR without assigning keys: Search locates the action</title><desc id="desc">Search for Text recognition in the main window and choose the result. This locates its Global shortcuts action row; selecting the search result does not immediately capture.</desc><rect width="440" height="720" rx="16" fill="#f5f7fc"/><g font-family="system-ui,-apple-system,PingFang SC,Microsoft YaHei,sans-serif"><text x="24" y="35" font-size="23" fill="#24384f" font-weight="700">Start OCR without assigning</text><text x="24" y="64" font-size="23" fill="#24384f" font-weight="700">keys</text><text x="24" y="99" font-size="20" fill="#267cba" font-weight="600">Search locates the action</text><g transform="translate(0 140)"><g transform="translate(24 0)"><rect x="0" y="0" width="392" height="144" rx="11" fill="#fff" stroke="#d1dbE8" stroke-width="1.4" /><text x="18" y="30" font-size="22" fill="#7154d9" font-weight="650">Search function</text><text x="18" y="78" font-size="18" fill="#536b83" font-weight="400">Enter</text><rect x="18" y="86" width="356" height="42" rx="6" fill="#fff" stroke="#c8d3e6" stroke-width="1.4" /><text x="30" y="114" font-size="20" fill="#24384f" font-weight="400">Text recognition</text></g><g transform="translate(24 161)"><rect x="0" y="0" width="392" height="167" rx="11" fill="#fff" stroke="#d1dbE8" stroke-width="1.4" /><text x="18" y="30" font-size="22" fill="#7154d9" font-weight="650">After choosing the result</text><text x="18" y="81" font-size="20" fill="#24384f" font-weight="400">Locate: Global shortcuts → Text</text><text x="18" y="108" font-size="20" fill="#24384f" font-weight="400">recognition</text><text x="18" y="143" font-size="20" fill="#24384f" font-weight="400">Capture has not started yet.</text></g></g><path d="M24 671 H416" stroke="#dce3ef"/><text x="24" y="698" font-size="17" fill="#536b83" font-weight="400">Instructional illustration</text></g></svg>