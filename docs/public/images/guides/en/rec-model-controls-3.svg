<svg xmlns="http://www.w3.org/2000/svg" width="440" height="590" viewBox="0 0 440 590" role="img" aria-labelledby="title desc"><title id="title">Local OCR controls: Why hot start is unavailable</title><desc id="desc">Model hot start is unavailable while the resident process is off. New Mini configurations disable residency; ordinary text recognition still works.</desc><rect width="440" height="590" rx="16" fill="#f5f7fc"/><g font-family="system-ui,-apple-system,PingFang SC,Microsoft YaHei,sans-serif"><text x="24" y="35" font-size="23" fill="#24384f" font-weight="700">Local OCR controls</text><text x="24" y="70" font-size="20" fill="#267cba" font-weight="600">Why hot start is unavailable</text><g transform="translate(0 111)"><g transform="translate(24 0)"><rect x="0" y="0" width="392" height="218" rx="11" fill="#fff" stroke="#d1dbE8" stroke-width="1.4" /><text x="18" y="30" font-size="22" fill="#7154d9" font-weight="650">Current switches</text><text x="18" y="78" font-size="18" fill="#536b83" font-weight="400">Resident recognition process</text><rect x="18" y="91" width="59" height="30" rx="15" fill="#8493a8" stroke="#8493a8" stroke-width="1.4" /><circle cx="33" cy="106" r="11" fill="white"/><text x="93" y="114" font-size="20" fill="#24384f" font-weight="400">Off</text><text x="18" y="152" font-size="18" fill="#536b83" font-weight="400">Model hot start</text><rect x="18" y="165" width="59" height="30" rx="15" fill="#a8b5c6" stroke="#a8b5c6" stroke-width="1.4" /><circle cx="33" cy="180" r="11" fill="white"/><text x="93" y="188" font-size="20" fill="#8393a4" font-weight="400">Off</text></g><g transform="translate(24 235)"><rect x="0" y="0" width="392" height="159" rx="11" fill="#fff" stroke="#d1dbE8" stroke-width="1.4" /><text x="18" y="30" font-size="22" fill="#7154d9" font-weight="650">What to observe</text><text x="18" y="81" font-size="20" fill="#24384f" font-weight="400">The hot-start switch is</text><text x="18" y="108" font-size="20" fill="#24384f" font-weight="400">unavailable, not the Text</text><text x="18" y="135" font-size="20" fill="#24384f" font-weight="400">recognition action.</text></g></g><path d="M24 541 H416" stroke="#dce3ef"/><text x="24" y="568" font-size="17" fill="#536b83" font-weight="400">Instructional illustration</text></g></svg>