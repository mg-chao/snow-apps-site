<svg xmlns="http://www.w3.org/2000/svg" width="440" height="830" viewBox="0 0 440 830" role="img" aria-labelledby="title desc"><title id="title">Image conversion controls: Partial content is not completion</title><desc id="desc">For Incomplete result, first use preview context Copy if you want to retain the visible content. Retry in the result clears generated content and starts again with the same image.</desc><rect width="440" height="830" rx="16" fill="#f5f7fc"/><g font-family="system-ui,-apple-system,PingFang SC,Microsoft YaHei,sans-serif"><text x="24" y="35" font-size="23" fill="#24384f" font-weight="700">Image conversion controls</text><text x="24" y="70" font-size="20" fill="#267cba" font-weight="600">Partial content is not completion</text><g transform="translate(0 111)"><g transform="translate(24 0)"><rect x="0" y="0" width="392" height="275" rx="11" fill="#fff" stroke="#d1dbE8" stroke-width="1.4" /><text x="18" y="30" font-size="22" fill="#c34d56" font-weight="650">Incomplete result:</text><text x="18" y="58" font-size="22" fill="#c34d56" font-weight="650">connection interrupted</text><rect x="18" y="91" width="356" height="48" rx="6" fill="#f5f7fb" stroke="none" stroke-width="1.4" /><text x="29" y="121" font-size="20" fill="#24384f" font-weight="400"># Guide</text><rect x="18" y="152" width="84" height="39" rx="8" fill="#f1edfb" stroke="#bdb0ea" stroke-width="1.4" /><text x="32" y="179" font-size="20" fill="#7154d9" font-weight="600">Retry</text><text x="18" y="224" font-size="20" fill="#24384f" font-weight="400">Context-copy first if you need</text><text x="18" y="251" font-size="20" fill="#24384f" font-weight="400">this part.</text></g><g transform="translate(24 292)"><rect x="0" y="0" width="392" height="194" rx="11" fill="#fff" stroke="#d1dbE8" stroke-width="1.4" /><text x="18" y="30" font-size="22" fill="#7154d9" font-weight="650">After result Retry</text><text x="18" y="81" font-size="20" fill="#24384f" font-weight="400">Generated content clears →</text><text x="18" y="108" font-size="20" fill="#24384f" font-weight="400">generation starts again</text><text x="18" y="143" font-size="20" fill="#24384f" font-weight="400">This differs from retrying the</text><text x="18" y="170" font-size="20" fill="#24384f" font-weight="400">model list in Settings.</text></g></g><path d="M24 781 H416" stroke="#dce3ef"/><text x="24" y="808" font-size="17" fill="#536b83" font-weight="400">Instructional illustration</text></g></svg>