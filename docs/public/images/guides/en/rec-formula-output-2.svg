<svg xmlns="http://www.w3.org/2000/svg" width="440" height="710" viewBox="0 0 440 710" role="img" aria-labelledby="title desc"><title id="title">Formula states and source files: Preview errors differ from recognition errors</title><desc id="desc">This example lacks a denominator argument, so preview fails. Add the argument or undo the recent edit; available source does not need another recognition request just to repair its preview.</desc><rect width="440" height="710" rx="16" fill="#f5f7fc"/><g font-family="system-ui,-apple-system,PingFang SC,Microsoft YaHei,sans-serif"><text x="24" y="35" font-size="23" fill="#24384f" font-weight="700">Formula states and source</text><text x="24" y="64" font-size="23" fill="#24384f" font-weight="700">files</text><text x="24" y="99" font-size="20" fill="#267cba" font-weight="600">Preview errors differ from</text><text x="24" y="126" font-size="20" fill="#267cba" font-weight="600">recognition errors</text><g transform="translate(0 167)"><g transform="translate(24 0)"><rect x="0" y="0" width="392" height="131" rx="11" fill="#fff" stroke="#d1dbE8" stroke-width="1.4" /><text x="18" y="30" font-size="22" fill="#7154d9" font-weight="650">Current source</text><rect x="18" y="63" width="356" height="48" rx="6" fill="#f5f7fb" stroke="none" stroke-width="1.4" /><text x="29" y="93" font-size="20" fill="#24384f" font-weight="400">\frac{x}</text></g><g transform="translate(24 148)"><rect x="0" y="0" width="392" height="188" rx="11" fill="#fff" stroke="#d1dbE8" stroke-width="1.4" /><text x="18" y="30" font-size="22" fill="#c34d56" font-weight="650">Unable to preview this</text><text x="18" y="58" font-size="22" fill="#c34d56" font-weight="650">formula. Check the LaTeX</text><text x="18" y="86" font-size="22" fill="#c34d56" font-weight="650">source</text><text x="18" y="137" font-size="20" fill="#24384f" font-weight="400">Change to \frac{x}{2} → wait</text><text x="18" y="164" font-size="20" fill="#24384f" font-weight="400">for the preview</text></g></g><path d="M24 661 H416" stroke="#dce3ef"/><text x="24" y="688" font-size="17" fill="#536b83" font-weight="400">Instructional illustration</text></g></svg>