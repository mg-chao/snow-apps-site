<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="480" viewBox="0 0 960 480" role="img" aria-labelledby="title"><title id="title">Choose a package for your computer (illustration)</title><g font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif"><rect x="1" y="1" width="958" height="478" rx="12" fill="#f6f7fc" stroke="#cbd4e4" stroke-width="2" /><text x="30" y="43" font-size="28" fill="#263148">Choose a package for your computer</text><text x="30" y="460" font-size="18" fill="#536078">Instructional illustration</text><rect x="30" y="80" width="430" height="145" rx="12" fill="#fff" stroke="#cbd4e4" stroke-width="2" /><text x="54" y="118" font-size="27" fill="#263148">Windows</text><text x="54" y="160" font-size="24" fill="#263148">Intel / AMD → x64</text><text x="54" y="196" font-size="24" fill="#263148">ARM processor → ARM64</text><rect x="490" y="80" width="440" height="145" rx="12" fill="#fff" stroke="#cbd4e4" stroke-width="2" /><text x="514" y="118" font-size="27" fill="#263148">macOS 15 or later</text><text x="514" y="160" font-size="24" fill="#263148">Apple silicon → arm64</text><text x="514" y="196" font-size="24" fill="#263148">Intel → Full x86_64</text><rect x="30" y="250" width="900" height="165" rx="12" fill="#ebe6fb" stroke="#d5caf7" stroke-width="2" /><text x="54" y="290" font-size="26" fill="#263148">Full: Local recognition and more recognition tools</text><text x="54" y="332" font-size="24" fill="#263148">Mini: Smaller package; add or bind text recognition</text><text x="54" y="379" font-size="24" fill="#263148">Check system and architecture, then choose an install channel.</text></g></svg>