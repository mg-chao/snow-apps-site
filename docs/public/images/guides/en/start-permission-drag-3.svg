<svg xmlns="http://www.w3.org/2000/svg" width="440" height="650" viewBox="0 0 440 650"><title>Enable access, then verify</title><rect width="440" height="650" rx="14" fill="#f5f7fc"/><g font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif"><text x="24" y="32" font-size="23" fill="#24384f" font-weight="400">Enable access, then verify</text><rect x="24" y="78" width="392" height="150" rx="10" fill="white" stroke="#c8d3e6" stroke-width="1.4" /><text x="40" y="107" font-size="21" fill="#7154d9" font-weight="400">Act in System Settings</text><text x="40" y="140" font-size="20" fill="#24384f" font-weight="400">Find the current Snow Shot and</text><text x="40" y="167" font-size="20" fill="#24384f" font-weight="400">turn on access. Reopen the app</text><text x="40" y="194" font-size="20" fill="#24384f" font-weight="400">if the system asks.</text><path d="M220 237v24m-7-7 7 7 7-7" fill="none" stroke="#267cba" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><rect x="24" y="278" width="392" height="151" rx="10" fill="white" stroke="#c8d3e6" stroke-width="1.4" /><text x="40" y="308" font-size="21" fill="#7154d9" font-weight="400">App permissions</text><text x="40" y="339" font-size="20" fill="#24384f" font-weight="400">Screen &amp; System Audio Recording</text><rect x="232" y="375" width="168" height="42" rx="7" fill="#e9f6f0" stroke="#258568" stroke-width="1.4" /><text x="244" y="403" font-size="19" fill="#258568" font-weight="400">Authorized</text><rect x="24" y="449" width="392" height="156" rx="10" fill="white" stroke="#c8d3e6" stroke-width="1.4" /><text x="40" y="478" font-size="21" fill="#7154d9" font-weight="400">Check the actual result too</text><text x="40" y="511" font-size="20" fill="#24384f" font-weight="400">Perform the action in Snow Shot</text><text x="40" y="538" font-size="20" fill="#24384f" font-weight="400">and check the result. Dragging</text><text x="40" y="565" font-size="20" fill="#24384f" font-weight="400">alone does not authorize the</text><text x="40" y="592" font-size="20" fill="#24384f" font-weight="400">app.</text><path d="M24 620H416" stroke="#dbe3ef"/><text x="24" y="640" font-size="17" fill="#536b83" font-weight="400">Instructional illustration</text></g></svg>
