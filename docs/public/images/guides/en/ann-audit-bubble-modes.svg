<svg xmlns="http://www.w3.org/2000/svg" width="760" height="430" viewBox="0 0 760 430" role="img" aria-labelledby="title desc" font-family="system-ui,sans-serif"><title id="title">Compare bubble shapes: Rectangle and cloud bodies</title><desc id="desc">Select the bubble, then choose Thought bubble: a cloud body with a circular tail.</desc><rect width="760" height="430" rx="12" fill="#f3f7fc" /><text x="24" y="34" font-size="25" fill="#24384f">Compare bubble shapes</text><text x="24" y="63" font-size="18" fill="#536c86">Rectangle and cloud bodies</text><rect x="18" y="80" width="724" height="260" rx="7" fill="white" stroke="#b9cce0" /><text x="86" y="118" font-size="22" fill="#24384f">Speech bubble</text><text x="452" y="118" font-size="22" fill="#24384f">Thought bubble</text><path d="M65 145 H310 Q330 145 330 165 V235 Q330 255 310 255 H160 L118 295 L130 255 H65 Q45 255 45 235 V165 Q45 145 65 145 Z" stroke="#2877bd" stroke-width="3" fill="#e8f2fc" stroke-linecap="round" stroke-linejoin="round" /><text x="95" y="205" font-size="22" fill="#24384f">The same explanation</text><path d="M430 155 C430 130 466 125 480 143 C495 112 540 115 554 142 C580 118 620 134 617 155 C657 155 672 186 650 205 C671 232 642 260 616 251 C611 279 568 282 550 261 C527 285 486 276 480 253 C451 272 417 251 427 228 C398 218 402 176 430 155 Z" stroke="#2877bd" stroke-width="3" fill="#e8f2fc" stroke-linecap="round" stroke-linejoin="round" /><text x="450" y="208" font-size="22" fill="#24384f">The same explanation</text><circle cx="464" cy="282" r="11" fill="#e8f2fc" stroke="#2877bd" stroke-width="2" /><circle cx="447" cy="306" r="7" fill="#e8f2fc" stroke="#2877bd" stroke-width="2" /><text x="26" y="364" font-size="18" fill="#24384f">Choose Thought bubble for a cloud body</text><text x="26" y="389" font-size="18" fill="#24384f">and a tail of circles.</text><text x="24" y="416" font-size="15" fill="#536c86">Instructional illustration</text></svg>