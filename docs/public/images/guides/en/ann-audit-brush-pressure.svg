<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="760" height="430" viewBox="0 0 760 430" role="img" aria-labelledby="title desc" font-family="system-ui,sans-serif"><title id="title">Regular and pressure-sensitive strokes: Compare width along similar paths</title><desc id="desc">Compare modes, not fixed pressure values. Mouse input can simulate width; a pen can supply pressure.</desc><rect width="760" height="430" rx="12" fill="#f3f7fc" /><text x="24" y="34" font-size="25" fill="#24384f">Regular and pressure-sensitive strokes</text><text x="24" y="63" font-size="18" fill="#536c86">Compare width along similar paths</text><rect x="18" y="80" width="724" height="260" rx="7" fill="white" stroke="#b9cce0" /><text x="45" y="125" font-size="22" fill="#24384f">Regular: consistent width</text><path d="M70 180 Q150 105 225 180 T385 180 T560 180" stroke="#2877bd" stroke-width="7" fill="none" stroke-linecap="round" stroke-linejoin="round" /><text x="45" y="238" font-size="22" fill="#24384f">Pressure: variable width</text><path d="M70 285 Q145 218 225 280 Q300 340 385 280 Q470 218 560 280 Q470 230 385 294 Q300 355 225 293 Q145 230 70 285 Z" stroke="#2877bd" stroke-width="1" fill="#2877bd" stroke-linecap="round" stroke-linejoin="round" /><text x="26" y="364" font-size="18" fill="#24384f">Mouse input can simulate width variation.</text><text x="26" y="389" font-size="18" fill="#24384f">A pen can supply actual pressure.</text><text x="24" y="416" font-size="15" fill="#536c86">Instructional illustration</text></svg>