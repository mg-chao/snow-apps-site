<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560" role="img" aria-labelledby="title desc"><title id="title">Horizontal crop: remove columns: Inspect the original</title><desc id="desc">Instructional illustration. The 300×180 image contains A, a 60 px blank strip, and B.</desc><rect width="960" height="560" rx="20" fill="#f5f7fc"/><g font-family="system-ui,-apple-system,PingFang SC,Microsoft YaHei,sans-serif"><text x="28" y="42" font-size="28" fill="#24384f" font-weight="700" text-anchor="start">Horizontal crop: remove columns</text><text x="28" y="77" font-size="19" fill="#536b83" font-weight="400" text-anchor="start">Inspect the original</text><rect x="28" y="98" width="592" height="396" rx="8" fill="white" stroke="#c8d3e6" stroke-width="1.5" /><text x="56" y="121" font-size="19" fill="#536b83" font-weight="600" text-anchor="start">300 × 180 px</text><g transform="translate(56 136) scale(1.8)"><rect x="0" y="0" width="300" height="180" rx="0" fill="#fff" stroke="#aabbd2" stroke-width="1.5" /><rect x="0" y="0" width="120" height="180" rx="0" fill="#e5effa" stroke="none" stroke-width="1.5" /><rect x="180" y="0" width="120" height="180" rx="0" fill="#dcefe9" stroke="none" stroke-width="1.5" /><text x="60" y="95" font-size="42" fill="#2877bd" font-weight="700" text-anchor="middle">A</text><text x="240" y="95" font-size="42" fill="#258568" font-weight="700" text-anchor="middle">B</text></g><path d="M56.0 463 L56.0 470" fill="none" stroke="#536b83" stroke-width="1"/><text x="56.0" y="489" font-size="16" fill="#536b83" font-weight="400" text-anchor="middle">0</text><path d="M272.0 463 L272.0 470" fill="none" stroke="#536b83" stroke-width="1"/><text x="272.0" y="489" font-size="16" fill="#536b83" font-weight="400" text-anchor="middle">120</text><path d="M380.0 463 L380.0 470" fill="none" stroke="#536b83" stroke-width="1"/><text x="380.0" y="489" font-size="16" fill="#536b83" font-weight="400" text-anchor="middle">180</text><path d="M596.0 463 L596.0 470" fill="none" stroke="#536b83" stroke-width="1"/><text x="596.0" y="489" font-size="16" fill="#536b83" font-weight="400" text-anchor="middle">300</text><rect x="644" y="98" width="288" height="396" rx="8" fill="white" stroke="#c8d3e6" stroke-width="1.5" /><text x="666" y="134" font-size="22" fill="#7154d9" font-weight="650" text-anchor="start">Horizontal crop</text><text x="666" y="182" font-size="20" fill="#24384f" font-weight="400" text-anchor="start">Keep A and B.</text><text x="666" y="232" font-size="20" fill="#24384f" font-weight="400" text-anchor="start">Blank strip: 60</text><text x="666" y="260" font-size="20" fill="#24384f" font-weight="400" text-anchor="start">columns.</text><text x="666" y="310" font-size="20" fill="#24384f" font-weight="400" text-anchor="start">Image height: 180 px.</text><path d="M28 509 L932 509" fill="none" stroke="#dbe3ef" stroke-width="1"/><text x="28" y="539" font-size="18" fill="#536b83" font-weight="400" text-anchor="start">Source pixels: the view scale stays fixed.</text><text x="930" y="539" font-size="17" fill="#536b83" font-weight="400" text-anchor="end">Instructional illustration</text></g></svg>