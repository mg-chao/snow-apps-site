<svg xmlns="http://www.w3.org/2000/svg" width="440" height="620" viewBox="0 0 440 620" role="img" aria-labelledby="title desc"><title id="title">Text Undo and canvas Undo: Canvas Undo first reverts the text edit</title><desc id="desc">The first toolbar Undo restores committed Step12 to Step1 without a caret; the box stays on the right</desc><rect width="440" height="620" rx="15" fill="#f4f7fc"/><g font-family="system-ui,-apple-system,PingFang SC,Microsoft YaHei,sans-serif"><text x="24" y="34" font-size="23" fill="#263b51" font-weight="700" >Text Undo and canvas Undo</text><text x="24" y="70" font-size="20" fill="#287dbc" font-weight="600" >Canvas Undo first reverts the text</text><text x="24" y="97" font-size="20" fill="#287dbc" font-weight="600" >edit</text><g transform="translate(24 142)"><rect x="0" y="0" width="392" height="388" rx="11" fill="white" stroke="#d0dbe7" stroke-width="1.5" /><text x="18" y="31" font-size="21" fill="#7654d6" font-weight="600" >Action: toolbar Undo once</text><g transform="translate(18 65)"><rect x="0" y="0" width="356" height="240" rx="6" fill="#fafcfe" stroke="#c6d5e4" stroke-width="1.5" /><rect x="34" y="35" width="70" height="45" rx="4" fill="none" stroke="#bac7d4" stroke-width="1.5" stroke-dasharray="5 4"/><path d="M122 57 L222 57" fill="none" stroke="#a6b4c2" stroke-width="2" stroke-linecap="round"/><polygon points="222.00,57.00 211.00,62.00 211.00,52.00" fill="#a6b4c2"/><rect x="244" y="35" width="70" height="45" rx="4" fill="none" stroke="#7654d6" stroke-width="1.5" /><text x="203" y="108" font-size="17" fill="#7654d6" font-weight="400" >Completed box</text><text y="180" font-size="22" fill="#d44f58" font-weight="500" font-family="Menlo,Consolas,monospace"><tspan x="45">S</tspan><tspan x="61">t</tspan><tspan x="77">e</tspan><tspan x="93">p</tspan><tspan x="109">1</tspan></text></g><text x="18" y="340" font-size="19" fill="#263b51" font-weight="400" >Completed edits are undone in</text><text x="18" y="366" font-size="19" fill="#263b51" font-weight="400" >reverse order.</text></g><path d="M24 572 H416" stroke="#d9e2ed"/><text x="24" y="598" font-size="17" fill="#587087" font-weight="400" >Instructional illustration</text></g></svg>