<svg xmlns="http://www.w3.org/2000/svg" width="820" height="440" viewBox="0 0 820 440" role="img" aria-labelledby="title desc"><title id="title">Image editing: join the remaining parts</title><desc id="desc">Remove the strip and join top to bottom.</desc><rect width="820" height="440" rx="16" fill="#f3f7fc" /><rect x="22" y="75" width="500" height="330" rx="10" fill="#fff" stroke="#d2deeb" /><rect x="540" y="75" width="260" height="330" rx="10" fill="#fff" stroke="#d2deeb" /><text x="25" y="39" font-size="25" fill="#26384c" font-weight="bold">Open images and crop strips</text><text x="25" y="63" font-size="17" fill="#546c84" font-weight="normal">3 / 3  Inspect the join</text><rect x="145" y="115" width="255" height="185" rx="6" fill="white" stroke="#8da7bf" /><rect x="160" y="145" width="215" height="8" rx="4" fill="#c6d4e2" stroke="#c6d4e2" /><rect x="160" y="175" width="185" height="8" rx="4" fill="#c6d4e2" stroke="#c6d4e2" /><rect x="160" y="205" width="205" height="8" rx="4" fill="#c6d4e2" stroke="#c6d4e2" /><rect x="160" y="235" width="170" height="8" rx="4" fill="#c6d4e2" stroke="#c6d4e2" /><line x1="145" y1="210" x2="400" y2="210" stroke="#3b9a80" stroke-width="2" stroke-dasharray="5 5" /><text x="130" y="335" font-size="18" fill="#26384c" font-weight="normal">Remove strip → remaining parts join</text><text x="555" y="116" font-size="21" fill="#26384c" font-weight="bold">Key steps</text><text x="555" y="165" font-size="17" fill="#26384c" font-weight="normal">Inspect the whole image first</text><text x="555" y="215" font-size="13.31" fill="#26384c" font-weight="normal">Vertical crop removes horizontal strips</text><text x="555" y="265" font-size="14.12" fill="#26384c" font-weight="normal">Delete a strip, not retain a rectangle</text><text x="555" y="355" font-size="17" fill="#546c84" font-weight="normal">Follow the page steps</text><text x="555" y="385" font-size="16" fill="#546c84" font-weight="normal">Instructional illustration</text></svg>