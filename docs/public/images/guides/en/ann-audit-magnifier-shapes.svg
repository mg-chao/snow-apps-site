<svg xmlns="http://www.w3.org/2000/svg" width="760" height="430" viewBox="0 0 760 430" role="img" aria-labelledby="title desc" font-family="system-ui,sans-serif"><title id="title">Magnifier shapes: Same content, different shapes</title><desc id="desc">Select the magnifier before changing its shape. Rounding applies to rectangles.</desc><rect width="760" height="430" rx="12" fill="#f3f7fc" /><text x="24" y="34" font-size="25" fill="#24384f">Magnifier shapes</text><text x="24" y="63" font-size="18" fill="#536c86">Same content, different shapes</text><rect x="18" y="80" width="724" height="260" rx="7" fill="white" stroke="#b9cce0" /><text x="45" y="124" font-size="22" fill="#24384f">Rounded rectangle</text><rect x="60" y="155" width="165" height="115" rx="22" fill="#e8f2fc" stroke="#d84d53" /><text x="92" y="221" font-size="27" fill="#24384f">Detail</text><text x="285" y="124" font-size="22" fill="#24384f">Ellipse</text><ellipse cx="383" cy="212" rx="90" ry="62" fill="#e8f2fc" stroke="#d84d53" stroke-width="3" /><text x="332" y="221" font-size="27" fill="#24384f">Detail</text><text x="525" y="124" font-size="22" fill="#24384f">Diamond</text><path d="M623 145 L713 212 L623 279 L533 212 Z" stroke="#d84d53" stroke-width="3" fill="#e8f2fc" stroke-linecap="round" stroke-linejoin="round" /><text x="572" y="221" font-size="27" fill="#24384f">Detail</text><text x="26" y="364" font-size="18" fill="#24384f">Select the lens, then change its shape; rounding is for rectangles.</text><text x="24" y="416" font-size="15" fill="#536c86">Instructional illustration</text></svg>