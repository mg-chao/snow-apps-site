<svg xmlns="http://www.w3.org/2000/svg" width="440" height="720" viewBox="0 0 440 720" role="img" aria-labelledby="title desc"><title id="title">Use decoded barcode content: Start a fresh capture after no result</title><desc id="desc">For no result, cancel the screenshot, enlarge the source or capture only one code, then enter Barcode recognition again. There is no generic result Retry button; switching away and back may retain the empty result.</desc><rect width="440" height="720" rx="16" fill="#f5f7fc"/><g font-family="system-ui,-apple-system,PingFang SC,Microsoft YaHei,sans-serif"><text x="24" y="35" font-size="23" fill="#24384f" font-weight="700">Use decoded barcode content</text><text x="24" y="70" font-size="20" fill="#267cba" font-weight="600">Start a fresh capture after no</text><text x="24" y="97" font-size="20" fill="#267cba" font-weight="600">result</text><g transform="translate(0 138)"><g transform="translate(24 0)"><rect x="0" y="0" width="392" height="132" rx="11" fill="#fff" stroke="#d1dbE8" stroke-width="1.4" /><text x="18" y="30" font-size="22" fill="#c34d56" font-weight="650">No barcode was recognized</text><text x="18" y="81" font-size="20" fill="#24384f" font-weight="400">Cancel screenshot → adjust</text><text x="18" y="108" font-size="20" fill="#24384f" font-weight="400">input → new capture</text></g><g transform="translate(24 149)"><rect x="0" y="0" width="392" height="249" rx="11" fill="#fff" stroke="#d1dbE8" stroke-width="1.4" /><text x="18" y="30" font-size="22" fill="#7154d9" font-weight="650">If components are missing or</text><text x="18" y="58" font-size="22" fill="#7154d9" font-weight="650">damaged</text><text x="18" y="109" font-size="20" fill="#24384f" font-weight="400">Repair or reinstall Full, then</text><text x="18" y="136" font-size="20" fill="#24384f" font-weight="400">try a new capture.</text><text x="18" y="171" font-size="20" fill="#24384f" font-weight="400">Text OCR models and translation</text><text x="18" y="198" font-size="20" fill="#24384f" font-weight="400">APIs do not supply barcode</text><text x="18" y="225" font-size="20" fill="#24384f" font-weight="400">components.</text></g></g><path d="M24 671 H416" stroke="#dce3ef"/><text x="24" y="698" font-size="17" fill="#536b83" font-weight="400">Instructional illustration</text></g></svg>