<svg xmlns="http://www.w3.org/2000/svg" width="440" height="720" viewBox="0 0 440 720" role="img" aria-labelledby="title desc"><title id="title">Start OCR without assigning keys: Mini has separate toolbar layouts</title><desc id="desc">To reveal Mini&#x27;s hidden Text recognition button, edit the screenshot toolbar for screenshots and the Pin to screen toolbar for the image editor. Drag it from Hidden tools to a visible position; the layouts are separate.</desc><rect width="440" height="720" rx="16" fill="#f5f7fc"/><g font-family="system-ui,-apple-system,PingFang SC,Microsoft YaHei,sans-serif"><text x="24" y="35" font-size="23" fill="#24384f" font-weight="700">Start OCR without assigning</text><text x="24" y="64" font-size="23" fill="#24384f" font-weight="700">keys</text><text x="24" y="99" font-size="20" fill="#267cba" font-weight="600">Mini has separate toolbar layouts</text><g transform="translate(0 140)"><g transform="translate(24 0)"><rect x="0" y="0" width="392" height="167" rx="11" fill="#fff" stroke="#d1dbE8" stroke-width="1.4" /><text x="18" y="30" font-size="22" fill="#7154d9" font-weight="650">Screenshot entry</text><text x="18" y="81" font-size="20" fill="#24384f" font-weight="400">Settings → Screenshots → Action</text><text x="18" y="108" font-size="20" fill="#24384f" font-weight="400">toolbar</text><text x="18" y="143" font-size="20" fill="#24384f" font-weight="400">Screenshot toolbar settings</text></g><g transform="translate(24 184)"><rect x="0" y="0" width="392" height="167" rx="11" fill="#fff" stroke="#d1dbE8" stroke-width="1.4" /><text x="18" y="30" font-size="22" fill="#7154d9" font-weight="650">Image-editor entry</text><text x="18" y="81" font-size="20" fill="#24384f" font-weight="400">Settings → Pin to screen →</text><text x="18" y="108" font-size="20" fill="#24384f" font-weight="400">Action toolbar</text><text x="18" y="143" font-size="20" fill="#24384f" font-weight="400">Pin to screen toolbar settings</text></g><g transform="translate(24 368)"><rect x="0" y="0" width="392" height="132" rx="11" fill="#fff" stroke="#d1dbE8" stroke-width="1.4" /><text x="18" y="30" font-size="22" fill="#7154d9" font-weight="650">The same tool</text><text x="18" y="81" font-size="20" fill="#24384f" font-weight="400">Hidden tools: Text recognition</text><text x="18" y="108" font-size="20" fill="#24384f" font-weight="400">→ visible position</text></g></g><path d="M24 671 H416" stroke="#dce3ef"/><text x="24" y="698" font-size="17" fill="#536b83" font-weight="400">Instructional illustration</text></g></svg>