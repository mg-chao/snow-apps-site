<svg xmlns="http://www.w3.org/2000/svg" width="440" height="710" viewBox="0 0 440 710" role="img" aria-labelledby="title desc"><title id="title">Formula states and source files: Partial copy or complete TXT</title><desc id="desc">Select source to copy only an expression. TXT saving includes the entire current source regardless of selection. Cancel keeps edits; success ends capture. Reopen the file and check its commands.</desc><rect width="440" height="710" rx="16" fill="#f5f7fc"/><g font-family="system-ui,-apple-system,PingFang SC,Microsoft YaHei,sans-serif"><text x="24" y="35" font-size="23" fill="#24384f" font-weight="700">Formula states and source</text><text x="24" y="64" font-size="23" fill="#24384f" font-weight="700">files</text><text x="24" y="99" font-size="20" fill="#267cba" font-weight="600">Partial copy or complete TXT</text><g transform="translate(0 140)"><g transform="translate(24 0)"><rect x="0" y="0" width="392" height="131" rx="11" fill="#fff" stroke="#d1dbE8" stroke-width="1.4" /><text x="18" y="30" font-size="22" fill="#7154d9" font-weight="650">Current source</text><rect x="18" y="63" width="356" height="48" rx="6" fill="#f5f7fb" stroke="none" stroke-width="1.4" /><text x="29" y="93" font-size="20" fill="#24384f" font-weight="400">\frac{x}{2}</text></g><g transform="translate(24 148)"><rect x="0" y="0" width="392" height="131" rx="11" fill="#fff" stroke="#d1dbE8" stroke-width="1.4" /><text x="18" y="30" font-size="22" fill="#7154d9" font-weight="650">formula.txt</text><rect x="18" y="63" width="356" height="48" rx="6" fill="#f5f7fb" stroke="none" stroke-width="1.4" /><text x="29" y="93" font-size="20" fill="#24384f" font-weight="400">\frac{x}{2}</text></g><g transform="translate(24 296)"><rect x="0" y="0" width="392" height="194" rx="11" fill="#fff" stroke="#d1dbE8" stroke-width="1.4" /><text x="18" y="30" font-size="22" fill="#7154d9" font-weight="650">Check the result</text><text x="18" y="81" font-size="20" fill="#24384f" font-weight="400">Copy a fragment ≠ save all</text><text x="18" y="108" font-size="20" fill="#24384f" font-weight="400">source</text><text x="18" y="143" font-size="20" fill="#24384f" font-weight="400">Reopen TXT, then use it in the</text><text x="18" y="170" font-size="20" fill="#24384f" font-weight="400">target formula environment.</text></g></g><path d="M24 661 H416" stroke="#dce3ef"/><text x="24" y="688" font-size="17" fill="#536b83" font-weight="400">Instructional illustration</text></g></svg>