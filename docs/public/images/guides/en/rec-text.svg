<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" role="img" aria-labelledby="title desc"><title id="title">Turn image text into copyable text</title><desc id="desc">① Select complete text → ② Correct against the original → ③ Tidy line breaks and punctuation.</desc><rect width="960" height="560" rx="24" fill="#f5f7fc" /><g font-family="system-ui,-apple-system,PingFang SC,Microsoft YaHei,sans-serif"><text x="36" y="52" font-size="30" fill="#18233b" font-weight="700">Turn image text into copyable text</text><text x="36" y="88" font-size="20" fill="#53627d" font-weight="400">① Select complete text → ② Correct against the original → ③ Tidy line breaks and punctuation</text><rect x="36" y="122" width="415" height="326" rx="16" fill="#ffffff" stroke="#c8d3e6" stroke-width="2" /><rect x="58" y="144" width="180" height="38" rx="19" fill="#ede9fe" stroke="#ede9fe" stroke-width="2" /><text x="72" y="170" font-size="16.83" fill="#5941bd" font-weight="600">Recognized text</text><text x="63" y="225" font-size="29" fill="#18233b" font-weight="400">Error code: O12</text><text x="63" y="275" font-size="27" fill="#18233b" font-weight="400">Check the network</text><text x="63" y="321" font-size="27" fill="#18233b" font-weight="400">then try again.</text><rect x="58" y="188" width="356" height="155" rx="6" fill="none" stroke="#6954d9" stroke-width="2" /><path d="M454 281 L498 281" fill="none" stroke="#6954d9" stroke-width="3" /><path d="M489 274 L498 281 L489 288" fill="none" stroke="#6954d9" stroke-width="3" /><rect x="514" y="122" width="410" height="326" rx="16" fill="#ffffff" stroke="#c8d3e6" stroke-width="2" /><rect x="536" y="144" width="150" height="38" rx="19" fill="#ede9fe" stroke="#ede9fe" stroke-width="2" /><text x="550" y="170" font-size="18.02" fill="#5941bd" font-weight="600">Corrected text</text><text x="541" y="225" font-size="29" fill="#18233b" font-weight="400">Error code: 012</text><path d="M704 233 L759 233" fill="none" stroke="#c96520" stroke-width="4" /><text x="541" y="278" font-size="26" fill="#18233b" font-weight="400">Check the network, then</text><text x="541" y="319" font-size="26" fill="#18233b" font-weight="400">try again.</text><rect x="539" y="369" width="153" height="38" rx="19" fill="#ede9fe" stroke="#ede9fe" stroke-width="2" /><text x="553" y="395" font-size="14.12" fill="#5941bd" font-weight="600">Remove line breaks</text><text x="706" y="397" font-size="18.23" fill="#167d69" font-weight="400">Copy → Paste and verify</text><path d="M36 510 L924 510" fill="none" stroke="#dce3ef" stroke-width="1" /><text x="36" y="539" font-size="18" fill="#53627d" font-weight="400">Snow Shot · Instructional illustration</text></g></svg>