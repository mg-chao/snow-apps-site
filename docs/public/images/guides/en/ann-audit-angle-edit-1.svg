<svg xmlns="http://www.w3.org/2000/svg" width="760" height="430" viewBox="0 0 760 430" role="img" aria-labelledby="title desc" font-family="system-ui,sans-serif"><title id="title">Edit the arc or the side endpoints: Select the angle arc</title><desc id="desc">The two sides are already defined. Select the object and locate its arc control.</desc><rect width="760" height="430" rx="12" fill="#f3f7fc" /><text x="24" y="34" font-size="25" fill="#24384f">Edit the arc or the side endpoints</text><text x="24" y="63" font-size="18" fill="#536c86">Select the angle arc</text><rect x="18" y="80" width="724" height="260" rx="7" fill="white" stroke="#b9cce0" /><rect x="45" y="98" width="180" height="33" rx="5" fill="#e2effb" stroke="#2877bd" /><text x="57" y="121" font-size="18" fill="#2877bd">180° interior angle</text><path d="M280 278 L280 108" stroke="#2877bd" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round" /><path d="M280 278 L450 278" stroke="#2877bd" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round" /><circle cx="280" cy="278" r="6" fill="white" stroke="#2877bd" stroke-width="2" /><circle cx="280" cy="108" r="6" fill="white" stroke="#2877bd" stroke-width="2" /><circle cx="450" cy="278" r="6" fill="white" stroke="#2877bd" stroke-width="2" /><path d="M280 232 A46 46 0 0 1 326 278" stroke="#d84d53" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round" /><text x="408" y="232" font-size="28" fill="#d84d53">90°</text><circle cx="312.522" cy="245.478" r="7" fill="white" stroke="#2877bd" stroke-width="2" /><text x="26" y="364" font-size="18" fill="#24384f">The two sides are already defined. Select the object and locate its arc control.</text><text x="24" y="416" font-size="15" fill="#536c86">Instructional illustration</text></svg>