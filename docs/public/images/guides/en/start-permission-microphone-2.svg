<svg xmlns="http://www.w3.org/2000/svg" width="440" height="650" viewBox="0 0 440 650"><title>Wait for the system result</title><rect width="440" height="650" rx="14" fill="#f5f7fc"/><g font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif"><text x="24" y="32" font-size="23" fill="#24384f" font-weight="400">Wait for the system result</text><rect x="24" y="78" width="392" height="250" rx="10" fill="#fff" stroke="#bac8d9" stroke-width="1.4" /><text x="39" y="107" font-size="25" fill="#267cba" font-weight="400">↑</text><text x="385" y="107" font-size="24" fill="#536b83" font-weight="400">×</text><text x="75" y="108" font-size="20" fill="#24384f" font-weight="400">Request microphone access,</text><text x="75" y="135" font-size="20" fill="#24384f" font-weight="400">then allow it in the macOS</text><text x="75" y="162" font-size="20" fill="#24384f" font-weight="400">prompt</text><rect x="202" y="201" width="190" height="42" rx="7" fill="#e3e8f0" stroke="#536b83" stroke-width="1.4" /><text x="214" y="229" font-size="19" fill="#536b83" font-weight="400">Requesting…</text><rect x="24" y="350" width="392" height="151" rx="10" fill="white" stroke="#c8d3e6" stroke-width="1.4" /><text x="40" y="379" font-size="21" fill="#7154d9" font-weight="400">Allow access in the macOS prompt</text><text x="40" y="412" font-size="20" fill="#24384f" font-weight="400">Allow microphone access, then</text><text x="40" y="439" font-size="20" fill="#24384f" font-weight="400">wait for the system result.</text><rect x="24" y="521" width="392" height="84" rx="10" fill="white" stroke="#c8d3e6" stroke-width="1.4" /><text x="40" y="550" font-size="21" fill="#7154d9" font-weight="400">Request finished ≠ Authorized</text><path d="M24 620H416" stroke="#dbe3ef"/><text x="24" y="640" font-size="17" fill="#536b83" font-weight="400">Instructional illustration</text></g></svg>
