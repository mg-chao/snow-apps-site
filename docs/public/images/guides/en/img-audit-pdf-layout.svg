<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" role="img" aria-labelledby="title desc"><title id="title">Pages and ID-card templates use paper differently</title><desc id="desc">Check placement and page count after choosing a template.</desc><rect width="960" height="560" rx="22" fill="#f5f7fc" /><g font-family="system-ui,-apple-system,PingFang SC,Microsoft YaHei,sans-serif"><text x="35" y="50" font-size="29" fill="#1e293b" font-weight="700">Pages and ID-card templates use paper differently</text><text x="35" y="86" font-size="20" fill="#53627d" font-weight="400">Check placement and page count after choosing a template</text><rect x="40" y="126" width="293" height="38" rx="19" fill="#ede9fe" stroke="#ede9fe" stroke-width="2" /><text x="54" y="152" font-size="20" fill="#6146bd" font-weight="600">Pages: one image per page</text><rect x="576" y="126" width="346" height="38" rx="19" fill="#ede9fe" stroke="#ede9fe" stroke-width="2" /><text x="590" y="152" font-size="20" fill="#6146bd" font-weight="600">ID card: both sides on one page</text><rect x="40" y="182" width="183" height="258" rx="0" fill="#fff" stroke="#aabbd2" stroke-width="2" /><rect x="56" y="246" width="151" height="95" rx="5" fill="#e7e0fa" stroke="#7654c9" stroke-width="2" /><text x="68" y="278" font-size="19.32" fill="#7654c9" font-weight="600">Fictional card</text><text x="86" y="393" font-size="25" fill="#1e293b" font-weight="400">Front</text><rect x="258" y="182" width="183" height="258" rx="0" fill="#fff" stroke="#aabbd2" stroke-width="2" /><rect x="274" y="246" width="151" height="95" rx="5" fill="#dcefe9" stroke="#268471" stroke-width="2" /><text x="286" y="278" font-size="19.32" fill="#268471" font-weight="600">Fictional card</text><text x="304" y="393" font-size="25" fill="#1e293b" font-weight="400">Back</text><rect x="660" y="182" width="183" height="258" rx="0" fill="#fff" stroke="#aabbd2" stroke-width="2" /><rect x="714" y="235" width="75" height="47" rx="5" fill="#e7e0fa" stroke