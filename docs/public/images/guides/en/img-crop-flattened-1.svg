<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560" role="img" aria-labelledby="title desc"><title id="title">Crop editable and saved annotations: Same appearance, different content</title><desc id="desc">Instructional illustration. The left arrow is editable. The right arrow was saved into image pixels; both start at y = 145.</desc><rect width="960" height="560" rx="20" fill="#f5f7fc"/><g font-family="system-ui,-apple-system,PingFang SC,Microsoft YaHei,sans-serif"><text x="28" y="42" font-size="28" fill="#24384f" font-weight="700" text-anchor="start">Crop editable and saved annotations</text><text x="28" y="77" font-size="19" fill="#536b83" font-weight="400" text-anchor="start">Same appearance, different content</text><rect x="28" y="98" width="438" height="396" rx="8" fill="white" stroke="#c8d3e6" stroke-width="1.5" /><text x="48" y="133" font-size="22" fill="#7154d9" font-weight="650" text-anchor="start">Editable annotation</text><text x="72" y="161" font-size="18" fill="#536b83" font-weight="600" text-anchor="start">300 × 200 px</text><g transform="translate(72 177) scale(1.2)"><rect x="0" y="0" width="300" height="200" rx="0" fill="white" stroke="#aabbd2" stroke-width="1.5" /><rect x="20" y="20" width="110" height="40" rx="0" fill="#e5effa" stroke="none" stroke-width="1.5" /><text x="36" y="49" font-size="25" fill="#2877bd" font-weight="700" text-anchor="start">A</text><rect x="20" y="130" width="260" height="30" rx="0" fill="#dcefe9" stroke="none" stroke-width="1.5" /><text x="36" y="154" font-size="25" fill="#258568" font-weight="700" text-anchor="start">B</text><path d="M0 145 L300 145" fill="none" stroke="#aabbd2" stroke-width="1" stroke-dasharray="4 4"/><path d="M160 145 L260 145" fill="none" stroke="#7154d9" stroke-width="3"/><path d="M250.0 139.0 L260 145 L250.0 151.0" fill="none" stroke="#7154d9" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></g><text x="64" y="356.0" font-size="16" fill="#536b83" font-weight="400" text-anchor="end">145</text><text x="48" y="451" font-size="19" fill="#536b83" font-weight="400" text-anchor="start">B and arrow at y =145.</text><text x="48" y="478" font-size="19" fill="#536b83" font-weight="400" text-anchor="start">Arrow can be selected.</text><rect x="494" y="98" width="438" height="396" rx="8" fill="white" stroke="#c8d3e6" stroke-width="1.5" /><text x="514" y="133" font-size="22" fill="#7154d9" font-weight="650" text-anchor="start">Saved image pixels</text><text x="538" y="161" font-size="18" fill="#536b83" font-weight="600" text-anchor="start">300 × 200 px</text><g transform="translate(538 177) scale(1.2)"><rect x="0" y="0" width="300" height="200" rx="0" fill="white" stroke="#aabbd2" stroke-width="1.5" /><rect x="20" y="20" width="110" height="40" rx="0" fill="#e5effa" stroke="none" stroke-width="1.5" /><text x="36" y="49" font-size="25" fill="#2877bd" font-weight="700" text-anchor="start">A</text><rect x="20" y="130" width="260" height="30" rx="0" fill="#dcefe9" stroke="none" stroke-width="1.5" /><text x="36" y="154" font-size="25" fill="#258568" font-weight="700" text-anchor="start">B</text><path d="M0 145 L300 145" fill="none" stroke="#aabbd2" stroke-width="1" stroke-dasharray="4 4"/><path d="M160 145 L260 145" fill="none" stroke="#7154d9" stroke-width="3"/><path d="M250.0 139.0 L260 145 L250.0 151.0" fill="none" stroke="#7154d9" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></g><text x="530" y="356.0" font-size="16" fill="#536b83" font-weight="400" text-anchor="end">145</text><text x="514" y="451" font-size="19" fill="#536b83" font-weight="400" text-anchor="start">Same starting appearance.</text><text x="514" y="478" font-size="19" fill="#536b83" font-weight="400" text-anchor="start">Arrow is part of the pixels.</text><path d="M28 509 L932 509" fill="none" stroke="#dbe3ef" stroke-width="1"/><text x="28" y="539" font-size="18" fill="#536b83" font-weight="400" text-anchor="start">Same crop and scale; compa