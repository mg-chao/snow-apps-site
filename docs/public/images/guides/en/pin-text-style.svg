<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" role="img" aria-labelledby="title desc"><title id="title">Compare new text pins with the same plain text</title><desc id="desc">Settings → Pin to screen → Text style; rich text retains formatting where possible.</desc><rect width="960" height="560" rx="24" fill="#f5f7fc" /><g font-family="system-ui,-apple-system,PingFang SC,Microsoft YaHei,sans-serif"><text x="36" y="52" font-size="30" fill="#18233b" font-weight="700">Compare new text pins with the same plain text</text><text x="36" y="88" font-size="20" fill="#53627d" font-weight="400">Settings → Pin to screen → Text style; rich text retains formatting where possible</text><rect x="36" y="140" width="524" height="301" rx="16" fill="#ffffff" stroke="#c8d3e6" stroke-width="2" /><rect x="56" y="158" width="190" height="38" rx="19" fill="#ede9fe" stroke="#ede9fe" stroke-width="2" /><text x="70" y="184" font-size="14.17" fill="#5941bd" font-weight="600">Wider maximum text width</text><text x="62" y="259" font-size="24" fill="#18233b" font-weight="400">This reference note fits in a wider text box.</text><text x="62" y="321" font-size="23" fill="#53627d" font-weight="400">Font · Size · Text color · Background</text><text x="62" y="403" font-size="21.69" fill="#6954d9" font-weight="400">Change defaults, then create a new plain-text pin</text><rect x="598" y="140" width="326" height="301" rx="16" fill="#ffffff" stroke="#c8d3e6" stroke-width="2" /><rect x="618" y="158" width="190" height="38" rx="19" fill="#ede9fe" stroke="#ede9fe" stroke-width="2" /><text x="632" y="184" font-size="12.63" fill="#5941bd" font-weight="600">Narrower maximum text width</text><text x="620" y="254" font-size="26.25" fill="#18233b" font-weight="400">The same reference note</text><text x="620" y="304" font-size="27" fill="#18233b" font-weight="400">wraps onto another line</text><text x="620" y="403" font-size="23" fill="#53627d" font-weight="400">Width includes padding</text><path d="M36 510 L924 510" fill="none" stroke="#dce3ef" stroke-width="1" /><text x="36" y="539" font-size="18" fill="#53627d" font-weight="400">Snow Shot · Instructional illustration</text></g></svg>