<svg xmlns="http://www.w3.org/2000/svg" width="440" height="720" viewBox="0 0 440 720" role="img" aria-labelledby="title desc"><title id="title">Start OCR without assigning keys: Click the title, not Not set</title><desc id="desc">Click the Text recognition row title or its blank area to capture, then confirm the selection to recognize it. Not set on the right records a shortcut; it is not needed just to try OCR.</desc><rect width="440" height="720" rx="16" fill="#f5f7fc"/><g font-family="system-ui,-apple-system,PingFang SC,Microsoft YaHei,sans-serif"><text x="24" y="35" font-size="23" fill="#24384f" font-weight="700">Start OCR without assigning</text><text x="24" y="64" font-size="23" fill="#24384f" font-weight="700">keys</text><text x="24" y="99" font-size="20" fill="#267cba" font-weight="600">Click the title, not Not set</text><g transform="translate(0 140)"><g transform="translate(24 0)"><rect x="0" y="0" width="392" height="144" rx="11" fill="#fff" stroke="#d1dbE8" stroke-width="1.4" /><text x="18" y="30" font-size="22" fill="#7154d9" font-weight="650">Global shortcut action row</text><text x="18" y="78" font-size="18" fill="#536b83" font-weight="400">Clickable action title</text><rect x="18" y="86" width="356" height="42" rx="6" fill="#fff" stroke="#c8d3e6" stroke-width="1.4" /><text x="30" y="114" font-size="20" fill="#24384f" font-weight="400">Text recognition</text></g><g transform="translate(24 161)"><rect x="0" y="0" width="392" height="167" rx="11" fill="#fff" stroke="#d1dbE8" stroke-width="1.4" /><text x="18" y="30" font-size="22" fill="#7154d9" font-weight="650">Two click destinations</text><text x="18" y="81" font-size="20" fill="#24384f" font-weight="400">Title or blank area → capture</text><text x="18" y="108" font-size="20" fill="#24384f" font-weight="400">and recognize</text><text x="18" y="143" font-size="20" fill="#24384f" font-weight="400">Not set → configure a shortcut</text></g></g><path d="M24 671 H416" stroke="#dce3ef"/><text x="24" y="698" font-size="17" fill="#536b83" font-weight="400">Instructional illustration</text></g></svg>