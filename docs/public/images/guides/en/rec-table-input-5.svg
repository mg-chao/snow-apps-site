<svg xmlns="http://www.w3.org/2000/svg" width="440" height="950" viewBox="0 0 440 950" role="img" aria-labelledby="title desc"><title id="title">Cell text or table range: Select and copy the full table</title><desc id="desc">For this exercise, Reset to the initial table. Leave cell editing, press Ctrl+A (Command+A on macOS) to select all cells, then right-click Copy inside the selection. Paste into a spreadsheet and check its three rows and columns.</desc><rect width="440" height="950" rx="16" fill="#f5f7fc"/><g font-family="system-ui,-apple-system,PingFang SC,Microsoft YaHei,sans-serif"><text x="24" y="35" font-size="23" fill="#24384f" font-weight="700">Cell text or table range</text><text x="24" y="70" font-size="20" fill="#267cba" font-weight="600">Select and copy the full table</text><g transform="translate(0 111)"><g transform="translate(24 0)"><rect x="0" y="0" width="392" height="242" rx="11" fill="#fff" stroke="#d1dbE8" stroke-width="1.4" /><text x="18" y="30" font-size="22" fill="#7154d9" font-weight="650">Select cells, not text</text><text x="18" y="58" font-size="22" fill="#7154d9" font-weight="650">inside a cell</text><rect x="18" y="91" width="116" height="42" rx="0" fill="#eee9fb" stroke="#b9c9da" stroke-width="1.4" /><text x="28" y="119" font-size="20" fill="#24384f" font-weight="400">Item</text><rect x="134" y="91" width="116" height="42" rx="0" fill="#eee9fb" stroke="#b9c9da" stroke-width="1.4" /><text x="144" y="119" font-size="20" fill="#24384f" font-weight="400">Qty</text><rect x="250" y="91" width="116" height="42" rx="0" fill="#eee9fb" stroke="#b9c9da" stroke-width="1.4" /><text x="260" y="119" font-size="20" fill="#24384f" font-weight="400">Sum</text><rect x="18" y="133" width="116" height="42" rx="0" fill="#eee9fb" stroke="#b9c9da" stroke-width="1.4" /><text x="28" y="161" font-size="20" fill="#24384f" font-weight="400">Pen</text><rect x="134" y="133" width="116" height="42" rx="0" fill="#eee9fb" stroke="#b9c9da" stroke-width="1.4" /><text x="144" y="161" font-size="20" fill="#24384f" font-weight="400">2</text><rect x="250" y="133" width="116" height="42" rx="0" fill="#eee9fb" stroke="#b9c9da" stroke-width="1.4" /><text x="260" y="161" font-size="20" fill="#24384f" font-weight="400">80</text><rect x="18" y="175" width="116" height="42" rx="0" fill="#eee9fb" stroke="#b9c9da" stroke-width="1.4" /><text x="28" y="203" font-size="20" fill="#24384f" font-weight="400">Paper</text><rect x="134" y="175" width="116" height="42" rx="0" fill="#eee9fb" stroke="#b9c9da" stroke-width="1.4" /><text x="144" y="203" font-size="20" fill="#24384f" font-weight="400">3</text><rect x="250" y="175" width="116" height="42" rx="0" fill="#eee9fb" stroke="#b9c9da" stroke-width="1.4" /><text x="260" y="203" font-size="20" fill="#24384f" font-weight="400">60</text></g><g transform="translate(24 259)"><rect x="0" y="0" width="392" height="276" rx="11" fill="#fff" stroke="#d1dbE8" stroke-width="1.4" /><text x="18" y="30" font-size="22" fill="#7154d9" font-weight="650">Check after pasting</text><rect x="18" y="63" width="116" height="42" rx="0" fill="#eaf0f8" stroke="#b9c9da" stroke-width="1.4" /><text x="28" y="91" font-size="20" fill="#24384f" font-weight="400">Item</text><rect x="134" y="63" width="116" height="42" rx="0" fill="#eaf0f8" stroke="#b9c9da" stroke-width="1.4" /><text x="144" y="91" font-size="20" fill="#24384f" font-weight="400">Qty</text><rect x="250" y="63" width="116" height="42" rx="0" fill="#eaf0f8" stroke="#b9c9da" stroke-width="1.4" /><text x="260" y="91" font-size="20" fill="#24384f" font-weight="400">Sum</text><rect x="18" y="105" width="116" height="42" rx="0" fill="white" stroke="#b9c9da" stroke-width="1.4" /><text x="28" y="133" font-size="20" fill="#24384f" font-weight="400">Pen</text><rect x="134" y="105" width="116" height="42" rx="0" fill="white" stroke="#b9c9da" stroke-width="1.4" /><text x="144" y="133" font-size="20" fill="#24384f" font-weight="400">2</text><rect x="250" y="105" width="116" height="4