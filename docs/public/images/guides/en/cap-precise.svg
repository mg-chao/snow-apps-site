<svg xmlns="http://www.w3.org/2000/svg" width="960" height="480" viewBox="0 0 960 480" role="img" aria-labelledby="title"><title id="title">Exact region: position, size, ratio and decoration (illustration)</title><g font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif"><rect x="1" y="1" width="958" height="478" rx="12" fill="#f6f7fc" stroke="#cbd4e4" stroke-width="2" /><text x="30" y="43" font-size="28" fill="#263148">Exact region: position, size, ratio and decoration</text><text x="30" y="460" font-size="18" fill="#536078">Instructional illustration</text><rect x="30" y="80" width="900" height="70" rx="12" fill="#fff" stroke="#cbd4e4" stroke-width="2" /><text x="50" y="124" font-size="25" fill="#263148">X, Y position   🔒   Width × Height   px / dp   16:9</text><path d="M145 150L145 200" fill="none" stroke="#7652dc" stroke-width="4" /><rect x="30" y="205" width="420" height="200" rx="12" fill="#fff" stroke="#cbd4e4" stroke-width="2" /><text x="55" y="246" font-size="25" fill="#263148">Adjust selection size</text><text x="55" y="290" font-size="23" fill="#263148">X / Y: upper-left position</text><text x="55" y="331" font-size="23" fill="#263148">Width / Height: retained bounds</text><text x="55" y="372" font-size="23" fill="#263148">Lock: link width and height</text><rect x="480" y="205" width="450" height="200" rx="12" fill="#ebe6fb" stroke="#cbd4e4" stroke-width="2" /><text x="505" y="246" font-size="24" fill="#263148">Click a value → Enter a number</text><text x="505" y="290" font-size="24" fill="#263148">Scroll over a value → Fine-tune</text><text x="505" y="331" font-size="24" fill="#263148">Ratio menu → Choose a preset</text><text x="505" y="372" font-size="23.29" fill="#263148">Confirm and inspect the updated border</text></g></svg>