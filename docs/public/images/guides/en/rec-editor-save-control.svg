<svg xmlns="http://www.w3.org/2000/svg" width="440" height="730" viewBox="0 0 440 730" role="img" aria-labelledby="title desc"><title id="title">Save the text result: Check the Save as file tooltip</title><desc id="desc">This is the Save as file glyph. Keep the image editor&#x27;s text-recognition result active, check the tooltip, click it and choose a TXT destination. Cancel keeps text; reopen TXT after saving. This differs from saving the original image.</desc><rect width="440" height="730" rx="16" fill="#f5f7fc"/><g font-family="system-ui,-apple-system,PingFang SC,Microsoft YaHei,sans-serif"><text x="24" y="35" font-size="23" fill="#24384f" font-weight="700">Save the text result</text><text x="24" y="70" font-size="20" fill="#267cba" font-weight="600">Check the Save as file tooltip</text><g transform="translate(0 111)"><g transform="translate(24 0)"><rect x="0" y="0" width="392" height="120" rx="11" fill="#fff" stroke="#d1dbE8" stroke-width="1.4" /><text x="18" y="30" font-size="22" fill="#7154d9" font-weight="650">Save as file</text><rect x="18" y="63" width="58" height="58" rx="9" fill="#f0edfb" stroke="#bdb0ea" stroke-width="1.4" /><g transform="translate(26 71) scale(0.041015625)"><path d="M198.4 64h456.96q33.6 0 57.12 23.52l170.24 170.24q23.52 23.52 23.52 57.12v564.48q0 80.64-80.64 80.64H198.4q-80.64 0-80.64-80.64V144.64q0-80.64 80.64-80.64Zm0 80.64v734.72h98.56V592.64q0-80.64 80.64-80.64h268.8q80.64 0 80.64 80.64v286.72h98.56V314.88L655.36 144.64v161.28q0 80.64-80.64 80.64H413.44q-80.64 0-80.64-80.64V144.64H198.4Zm215.04 0v161.28h161.28V144.64H413.44Zm-35.84 448v286.72h268.8V592.64H377.6Z" fill="#7154d9" fill-rule="evenodd"/></g><text x="90" y="88" font-size="20" fill="#24384f" font-weight="400">Tooltip: Save as file</text></g><g transform="translate(24 137)"><rect x="0" y="0" width="392" height="159" rx="11" fill="#fff" stroke="#d1dbE8" stroke-width="1.4" /><text x="18" y="30" font-size="22" fill="#7154d9" font-weight="650">Keep Text recognition active</text><rect x="18" y="63" width="356" height="76" rx="6" fill="#f5f7fb" stroke="none" stroke-width="1.4" /><text x="29" y="93" font-size="20" fill="#24384f" font-weight="400">Start</text><text x="29" y="121" font-size="20" fill="#24384f" font-weight="400">Goal</text></g><g transform="translate(24 313)"><rect x="0" y="0" width="392" height="229" rx="11" fill="#fff" stroke="#d1dbE8" stroke-width="1.4" /><text x="18" y="30" font-size="22" fill="#7154d9" font-weight="650">File-dialog outcomes</text><text x="18" y="81" font-size="20" fill="#24384f" font-weight="400">Cancel → current text remains</text><text x="18" y="108" font-size="20" fill="#24384f" font-weight="400">editable</text><text x="18" y="143" font-size="20" fill="#24384f" font-weight="400">Save → recognized-goal.txt</text><text x="18" y="178" font-size="20" fill="#24384f" font-weight="400">Reopen TXT → check the two</text><text x="18" y="205" font-size="20" fill="#24384f" font-weight="400">lines Start and Goal</text></g></g><path d="M24 681 H416" stroke="#dce3ef"/><text x="24" y="708" font-size="17" fill="#536b83" font-weight="400">Instructional illustration</text></g></svg>