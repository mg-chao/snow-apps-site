<svg xmlns="http://www.w3.org/2000/svg" width="820" height="440" viewBox="0 0 820 440" role="img" aria-labelledby="title"><title id="title">Element eraser removes whole objects</title><rect width="100%" height="100%" fill="#f3f7fc" /><text x="22" y="36" fill="#26384c" font-size="25">Element eraser removes whole objects</text><text x="22" y="66" fill="#26384c" font-size="18">1 / 3  Touch part of a stroke; erase the whole object</text><rect x="30" y="96" width="360" height="260" rx="6" fill="#fff" stroke="#c5d5e5" /><text x="48" y="132" fill="#26384c" font-size="23">Before erasing</text><rect x="55" y="164" width="290" height="7" rx="3" fill="#c6d4e2" stroke="#c6d4e2" /><rect x="55" y="197" width="255" height="7" rx="3" fill="#c6d4e2" stroke="#c6d4e2" /><rect x="55" y="230" width="280" height="7" rx="3" fill="#c6d4e2" stroke="#c6d4e2" /><rect x="55" y="263" width="210" height="7" rx="3" fill="#c6d4e2" stroke="#c6d4e2" /><path d="M55 290 Q110 150 180 270 T350 220" fill="none" stroke="#e34f52" stroke-width="7" /><circle cx="132" cy="227" r="18" fill="none" stroke="#347ec7" stroke-width="2" /><rect x="425" y="96" width="360" height="260" rx="6" fill="#fff" stroke="#c5d5e5" /><text x="443" y="132" fill="#26384c" font-size="23">After release</text><rect x="450" y="164" width="290" height="7" rx="3" fill="#c6d4e2" stroke="#c6d4e2" /><rect x="450" y="197" width="255" height="7" rx="3" fill="#c6d4e2" stroke="#c6d4e2" /><rect x="450" y="230" width="280" height="7" rx="3" fill="#c6d4e2" stroke="#c6d4e2" /><rect x="450" y="263" width="210" height="7" rx="3" fill="#c6d4e2" stroke="#c6d4e2" /><text x="110" y="395" fill="#26384c" font-size="20">Other content stays. Undo restores the erased objects.</text><text x="22" y="422" fill="#546c84" font-size="16">Instructional illustration</text></svg>