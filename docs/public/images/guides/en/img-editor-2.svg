<svg xmlns="http://www.w3.org/2000/svg" width="820" height="440" viewBox="0 0 820 440" role="img" aria-labelledby="title desc"><title id="title">Image editing: select a horizontal strip</title><desc id="desc">Drag across the strip to remove.</desc><rect width="820" height="440" rx="16" fill="#f3f7fc" /><rect x="22" y="75" width="500" height="330" rx="10" fill="#fff" stroke="#d2deeb" /><rect x="540" y="75" width="260" height="330" rx="10" fill="#fff" stroke="#d2deeb" /><text x="25" y="39" font-size="25" fill="#26384c" font-weight="bold">Open images and crop strips</text><text x="25" y="63" font-size="17" fill="#546c84" font-weight="normal">2 / 3  Select a horizontal strip</text><rect x="145" y="115" width="255" height="230" rx="6" fill="white" stroke="#8da7bf" /><rect x="160" y="145" width="215" height="8" rx="4" fill="#c6d4e2" stroke="#c6d4e2" /><rect x="160" y="183" width="185" height="8" rx="4" fill="#c6d4e2" stroke="#c6d4e2" /><rect x="160" y="221" width="205" height="8" rx="4" fill="#c6d4e2" stroke="#c6d4e2" /><rect x="160" y="259" width="170" height="8" rx="4" fill="#c6d4e2" stroke="#c6d4e2" /><rect x="145" y="211" width="255" height="45" rx="0" fill="#ffdadb" stroke="#e34f52" opacity=".8" /><text x="165" y="240" font-size="18" fill="#26384c" font-weight="normal">Whole rows to remove</text><circle cx="430" cy="232" r="12" fill="#347ec7" stroke="#347ec7" stroke-width="2" /><text x="425" y="238" font-size="17" fill="white" font-weight="bold">1</text><text x="555" y="116" font-size="21" fill="#26384c" font-weight="bold">Key steps</text><text x="555" y="165" font-size="17" fill="#26384c" font-weight="normal">Inspect the whole image first</text><text x="555" y="215" font-size="13.31" fill="#26384c" font-weight="normal">Vertical crop removes horizontal strips</text><text x="555" y="265" font-size="14.12" fill="#26384c" font-weight="normal">Delete a strip, not retain a rectangle</text><text x="555" y="355" font-size="17" fill="#546c84" font-weight="normal">Follow the page steps</text><text x="555" y="385" font-size="16" fill="#546c84" font-weight="normal">Instructional illustration</text></svg>