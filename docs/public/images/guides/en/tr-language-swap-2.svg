<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 580" role="img" aria-labelledby="title desc"><title id="title">Only the languages change</title><desc id="desc">The English input is still unchanged.</desc><rect width="440" height="580" rx="20" fill="#f5f7fc"/><g font-family="system-ui,-apple-system,PingFang SC,Microsoft YaHei,sans-serif"><text x="24" y="45" font-size="25" fill="#28374e" font-weight="700">Only the languages change</text><text x="24" y="96" font-size="24" fill="#2864ae" font-weight="700">French → English</text><rect x="24" y="125" width="392" height="110" rx="12" fill="white" stroke="#c8d4e4"/><text x="42" y="158" font-size="18" fill="#53627d" font-weight="400">Source text</text><text x="42" y="204" font-size="25" fill="#28374e" font-weight="400">Open the window.</text><rect x="24" y="265" width="392" height="130" rx="12" fill="white" stroke="#c8d4e4"/><text x="42" y="299" font-size="18" fill="#53627d" font-weight="400">Translation</text><text x="42" y="347" font-size="25" fill="#28374e" font-weight="400">…</text><text x="42" y="378" font-size="17" fill="#53627d" font-weight="400">New request starts</text><text x="24" y="449" font-size="20" fill="#28374e" font-weight="400">The English input is still unchanged.</text><text x="24" y="492" font-size="18" fill="#53627d" font-weight="400">Copy → Swap → Paste → Wait</text><text x="24" y="550" font-size="17" fill="#53627d" font-weight="400">Instructional illustration</text><text x="365" y="550" font-size="17" fill="#53627d" font-weight="400">2 / 4</text></g></svg>