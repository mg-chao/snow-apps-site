<svg xmlns="http://www.w3.org/2000/svg" width="760" height="430" viewBox="0 0 760 430" role="img" aria-labelledby="title desc" font-family="system-ui,sans-serif"><title id="title">Reset the next number on empty canvas: Right-click truly empty canvas</title><desc id="desc">Right-click empty canvas: the next number is 1; old numbers stay.</desc><rect width="760" height="430" rx="12" fill="#f3f7fc" /><text x="24" y="34" font-size="25" fill="#24384f">Reset the next number on empty canvas</text><text x="24" y="63" font-size="18" fill="#536c86">Right-click truly empty canvas</text><rect x="18" y="80" width="724" height="260" rx="7" fill="white" stroke="#b9cce0" /><circle cx="130" cy="170" r="25" fill="#2877bd" stroke="#2877bd" stroke-width="2" /><text x="122" y="179" font-size="25" fill="white">1</text><circle cx="310" cy="170" r="25" fill="#2877bd" stroke="#2877bd" stroke-width="2" /><text x="302" y="179" font-size="25" fill="white">2</text><circle cx="490" cy="170" r="25" fill="#2877bd" stroke="#2877bd" stroke-width="2" /><text x="482" y="179" font-size="25" fill="white">3</text><rect x="45" y="101" width="105" height="33" rx="5" fill="#e2effb" stroke="#2877bd" /><text x="57" y="124" font-size="11.72" fill="#2877bd">Tool: Sequence</text><circle cx="600" cy="280" r="15" fill="none" stroke="#d84d53" stroke-width="2" /><rect x="540" y="238" width="105" height="33" rx="5" fill="#e2effb" stroke="#2877bd" /><text x="552" y="261" font-size="10.53" fill="#2877bd">Right-click blank</text><text x="185" y="305" font-size="23" fill="#d84d53">Next: 1</text><text x="26" y="364" font-size="18" fill="#24384f">Right-click empty canvas: the next number is 1; old numbers stay.</text><text x="24" y="416" font-size="15" fill="#536c86">Instructional illustration</text></svg>