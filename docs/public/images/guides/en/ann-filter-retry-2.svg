<svg xmlns="http://www.w3.org/2000/svg" width="760" height="430" viewBox="0 0 760 430" role="img" aria-labelledby="title desc" font-family="system-ui,sans-serif"><title id="title">Auto filter: switch tools</title><desc id="desc">Re-enter Auto filter to detect again.</desc><rect width="760" height="430" rx="12" fill="#f3f7fc" /><text x="24" y="34" font-size="25" fill="#24384f">Retry automatic region detection</text><text x="24" y="63" font-size="18" fill="#536c86">Choose Rectangle filter, then Auto filter</text><rect x="36" y="92" width="688" height="48" rx="7" fill="#edf4fb" stroke="#b9cce0" /><text x="52" y="123" font-size="20" fill="#24384f">Filter</text><rect x="140" y="99" width="145" height="34" rx="7" fill="white" stroke="#b9cce0" /><text x="163" y="123" font-size="19" fill="#24384f">Brush filter</text><rect x="300" y="99" width="145" height="34" rx="7" fill="#d8eafb" stroke="#2877bd" /><text x="323" y="123" font-size="15.73" fill="#2877bd">Rectangle filter</text><rect x="460" y="99" width="145" height="34" rx="7" fill="white" stroke="#b9cce0" /><text x="483" y="123" font-size="19" fill="#24384f">Auto filter</text><rect x="45" y="160" width="430" height="176" rx="7" fill="white" stroke="#b9cce0" /><text x="66" y="190" font-size="18" fill="#536c86">Loaded example image</text><rect x="67" y="208" width="55" height="55" rx="7" fill="#c5dcee" stroke="#b9cce0" /><text x="142" y="231" font-size="22" fill="#24384f">Example message</text><text x="142" y="260" font-size="18" fill="#536c86">Retry region detection</text><rect x="503" y="163" width="201" height="44" rx="7" fill="#eef1f4" stroke="#ccd3da" /><text x="543" y="192" font-size="22" fill="#657887">Fill regions</text><text x="506" y="247" font-size="19" fill="#24384f">Next:</text><text x="506" y="277" font-size="22" fill="#2877bd">Choose Auto filter</text><path d="M534 286 V303 H661 V141" fill="none" stroke="#2877bd" stroke-width="3" /><path d="M653 154 L661 141 L669 154" fill="none" stroke="#2877bd" stroke-width="3" /><text x="24" y="370" font-size="19" fill="#24384f">Re-enter Auto filter to detect again.</text><text x="24" y="412" font-size="15" fill="#536c86">Instructional illustration</text></svg>