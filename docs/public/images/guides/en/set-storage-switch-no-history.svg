<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1330" viewBox="0 0 720 1330" role="img" aria-labelledby="title desc">
<title id="title">Switch folders while keeping history in its original location</title>
<desc id="desc">A is the current directory. B is the new target. Turn migration off → Check the scope, then proceed → Check both locations</desc>
<rect width="720" height="1330" rx="24" fill="#f3f6fb"/>
<g font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif">
<text x="32" y="37" font-size="22" fill="#58708d" font-weight="600">Instructional illustration · Windows</text>
<text x="32" y="84" font-size="32" fill="#172e50" font-weight="700">Switch folders while keeping</text>
<text x="32" y="124" font-size="32" fill="#172e50" font-weight="700">history in its original location</text>
<text x="32" y="157" font-size="23" fill="#4c6481" font-weight="400">A is the current directory. B is the new target.</text>
<rect x="32" y="188" width="656" height="316" rx="18" fill="#fff" stroke="#c8d4e4" stroke-width="2"/>
<rect x="48" y="204" width="624" height="64" rx="12" fill="#eaf0ff"/>
<circle cx="78" cy="236" r="21" fill="#2c57a5"/>
<text x="71" y="245" font-size="26" fill="#fff" font-weight="700">1</text>
<text x="112" y="246" font-size="28" fill="#2c57a5" font-weight="700">Turn migration off</text>
<text x="58" y="314" font-size="28" fill="#33465e" font-weight="400">Settings → Export &amp; storage → Data storage</text>
<text x="58" y="356" font-size="28" fill="#33465e" font-weight="400">Storage directory → Choose directory</text>
<text x="58" y="398" font-size="28" fill="#33465e" font-weight="400">Set the target path to directory B.</text>
<text x="58" y="440" font-size="28" fill="#33465e" font-weight="400">Migrate existing data: Off</text>
<path d="M360 515v23m-10-10 10 10 10-10" fill="none" stroke="#7890ad" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="32" y="550" width="656" height="316" rx="18" fill="#fff" stroke="#c8d4e4" stroke-width="2"/>
<rect x="48" y="566" width="624" height="64" rx="12" fill="#fff2da"/>
<circle cx="78" cy="598" r="21" fill="#865414"/>
<text x="71" y="607" font-size="26" fill="#fff" font-weight="700">2</text>
<text x="112" y="608" font-size="28" fill="#865414" font-weight="700">Check the scope, then proceed</text>
<text x="58" y="676" font-size="28" fill="#33465e" font-weight="400">Click OK. Read Change storage directory?</text>
<text x="58" y="718" font-size="28" fill="#33465e" font-weight="400">Copy to B: settings and open pinned windows</text>
<text x="58" y="760" font-size="28" fill="#33465e" font-weight="400">Keep in A: screenshot and closed-pin history</text>
<text x="58" y="802" font-size="28" fill="#33465e" font-weight="400">Click Proceed and wait for completion.</text>
<path d="M360 877v23m-10-10 10 10 10-10" fill="none" stroke="#7890ad" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="32" y="912" width="656" height="316" rx="18" fill="#fff" stroke="#c8d4e4" stroke-width="2"/>
<rect x="48" y="928" width="624" height="64" rx="12" fill="#e6f6ee"/>
<circle cx="78" cy="960" r="21" fill="#20614a"/>
<text x="71" y="969" font-size="26" fill="#fff" font-weight="700">3</text>
<text x="112" y="970" font-size="28" fill="#20614a" font-weight="700">Check both locations</text>
<text x="58" y="1038" font-size="28" fill="#33465e" font-weight="400">Current effective directory: B</text>
<text x="58" y="1080" font-size="28" fill="#33465e" font-weight="400">B has copied settings and open pins.</text>
<text x="58" y="1122" font-size="28" fill="#33465e" font-weight="400">Existing screenshot and closed-pin history</text>
<text x="58" y="1164" font-size="28" fill="#33465e" font-weight="400">remain in A. Check directory and usage.</text>
<text x="32" y="1284" font-size="23" fill="#4c6481" font-weight="400">Decide whether you need to move history before switching.</text>
</g>
</svg>
