<svg xmlns="http://www.w3.org/2000/svg" width="440" height="650" viewBox="0 0 440 650"><title>Check Authorized and test audio</title><rect width="440" height="650" rx="14" fill="#f5f7fc"/><g font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif"><text x="24" y="32" font-size="23" fill="#24384f" font-weight="400">Check Authorized and test</text><text x="24" y="62" font-size="23" fill="#24384f" font-weight="400">audio</text><rect x="24" y="78" width="392" height="151" rx="10" fill="white" stroke="#c8d3e6" stroke-width="1.4" /><text x="40" y="108" font-size="21" fill="#7154d9" font-weight="400">App permissions</text><text x="40" y="139" font-size="20" fill="#24384f" font-weight="400">Microphone</text><rect x="232" y="175" width="168" height="42" rx="7" fill="#e9f6f0" stroke="#258568" stroke-width="1.4" /><text x="244" y="203" font-size="19" fill="#258568" font-weight="400">Authorized</text><rect x="24" y="251" width="392" height="120" rx="10" fill="white" stroke="#c8d3e6" stroke-width="1.4" /><text x="40" y="280" font-size="21" fill="#7154d9" font-weight="400">The helper closes automatically</text><text x="40" y="313" font-size="20" fill="#24384f" font-weight="400">Check the Authorized status in</text><text x="40" y="340" font-size="20" fill="#24384f" font-weight="400">the app.</text><rect x="24" y="392" width="392" height="213" rx="10" fill="white" stroke="#c8d3e6" stroke-width="1.4" /><text x="40" y="421" font-size="21" fill="#7154d9" font-weight="400">Record a short audio check</text><text x="40" y="454" font-size="20" fill="#24384f" font-weight="400">Choose MP4 and enable the</text><text x="40" y="481" font-size="20" fill="#24384f" font-weight="400">microphone. Start → speak →</text><text x="40" y="508" font-size="20" fill="#24384f" font-weight="400">stop → play the file and check</text><text x="40" y="535" font-size="20" fill="#24384f" font-weight="400">that your voice is audible.</text><path d="M24 620H416" stroke="#dbe3ef"/><text x="24" y="640" font-size="17" fill="#536b83" font-weight="400">Instructional illustration</text></g></svg>
