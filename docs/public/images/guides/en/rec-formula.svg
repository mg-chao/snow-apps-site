e → Paste in a formula editor</text><text x="403" y="399" font-size="22" fill="#167d69" font-weight="400">Save as file → .txt</text><path d="M36 510 L924 510" fill="none" stroke="#dce3ef" stroke-width="1" /><text x="36" y="539" font-size="18" fill="#53627d" font-weight="400">Snow Shot · Instructional illustration</text></g></svg>