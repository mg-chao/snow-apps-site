<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" role="img" aria-labelledby="title desc"><title id="title">Two API address types use different rules</title><desc id="desc">Save configuration, then test with a short sentence or small image. Illustration</desc><rect width="960" height="560" rx="24" fill="#f5f7fc" /><g font-family="system-ui,-apple-system,PingFang SC,Microsoft YaHei,sans-serif"><text x="36" y="52" font-size="30" fill="#18233b" font-weight="700">Two API address types use different rules</text><text x="36" y="88" font-size="20" fill="#53627d" font-weight="400">Save configuration, then test with a short sentence or small image</text><rect x="36" y="138" width="888" height="141" rx="16" fill="#ffffff" stroke="#c8d3e6" stroke-width="2" /><rect x="57" y="157" width="185" height="38" rx="19" fill="#ede9fe" stroke="#ede9fe" stroke-width="2" /><text x="71" y="183" font-size="11.37" fill="#5941bd" font-weight="600">Dedicated translation service</text><text x="57" y="235" font-size="27" fill="#2563c6" font-weight="400">Full endpoint: https://example.com/translate</text><rect x="36" y="305" width="888" height="165" rx="16" fill="#ffffff" stroke="#c8d3e6" stroke-width="2" /><rect x="57" y="324" width="185" height="38" rx="19" fill="#ede9fe" stroke="#ede9fe" stroke-width="2" /><text x="71" y="350" font-size="20" fill="#5941bd" font-weight="600">Custom AI model</text><text x="57" y="396" font-size="27" fill="#2563c6" font-weight="400">Base URL: https://example.com/v1</text><text x="57" y="443" font-size="23" fill="#53627d" font-weight="400">The app appends /chat/completions. Use the server’s actual model ID.</text><path d="M36 510 L924 510" fill="none" stroke="#dce3ef" stroke-width="1" /><text x="36" y="539" font-size="18" fill="#53627d" font-weight="400">Snow Shot · Instructional illustration</text></g></svg>