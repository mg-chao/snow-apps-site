<svg xmlns="http://www.w3.org/2000/svg" width="440" height="690" viewBox="0 0 440 690" role="img" aria-labelledby="title desc"><title id="title">Table states and files: Generating previews are read-only</title><desc id="desc">Choose the dedicated table model or an available listed vision model. Vision generation may show a read-only preview; wait for completion before editing or treating missing rows as final.</desc><rect width="440" height="690" rx="16" fill="#f5f7fc"/><g font-family="system-ui,-apple-system,PingFang SC,Microsoft YaHei,sans-serif"><text x="24" y="35" font-size="23" fill="#24384f" font-weight="700">Table states and files</text><text x="24" y="70" font-size="20" fill="#267cba" font-weight="600">Generating previews are read-only</text><g transform="translate(0 111)"><g transform="translate(24 0)"><rect x="0" y="0" width="392" height="206" rx="11" fill="#fff" stroke="#d1dbE8" stroke-width="1.4" /><text x="18" y="30" font-size="22" fill="#7154d9" font-weight="650">Recognition model</text><text x="18" y="78" font-size="18" fill="#536b83" font-weight="400">Default choice</text><rect x="18" y="86" width="356" height="42" rx="6" fill="#fff" stroke="#c8d3e6" stroke-width="1.4" /><text x="30" y="114" font-size="20" fill="#24384f" font-weight="400">Table-specific model</text><text x="18" y="155" font-size="20" fill="#24384f" font-weight="400">Available vision models can</text><text x="18" y="182" font-size="20" fill="#24384f" font-weight="400">also be selected.</text></g><g transform="translate(24 223)"><rect x="0" y="0" width="392" height="276" rx="11" fill="#fff" stroke="#d1dbE8" stroke-width="1.4" /><text x="18" y="30" font-size="22" fill="#7154d9" font-weight="650">While generating</text><rect x="18" y="63" width="116" height="42" rx="0" fill="#eaf0f8" stroke="#b9c9da" stroke-width="1.4" /><text x="28" y="91" font-size="20" fill="#24384f" font-weight="400">Item</text><rect x="134" y="63" width="116" height="42" rx="0" fill="#eaf0f8" stroke="#b9c9da" stroke-width="1.4" /><text x="144" y="91" font-size="20" fill="#24384f" font-weight="400">Qty</text><rect x="250" y="63" width="116" height="42" rx="0" fill="#eaf0f8" stroke="#b9c9da" stroke-width="1.4" /><text x="260" y="91" font-size="20" fill="#24384f" font-weight="400">Sum</text><rect x="18" y="105" width="116" height="42" rx="0" fill="white" stroke="#b9c9da" stroke-width="1.4" /><text x="28" y="133" font-size="20" fill="#24384f" font-weight="400">Pen</text><rect x="134" y="105" width="116" height="42" rx="0" fill="white" stroke="#b9c9da" stroke-width="1.4" /><text x="144" y="133" font-size="20" fill="#24384f" font-weight="400">2</text><rect x="250" y="105" width="116" height="42" rx="0" fill="white" stroke="#b9c9da" stroke-width="1.4" /><text x="260" y="133" font-size="20" fill="#24384f" font-weight="400">80</text><rect x="18" y="147" width="116" height="42" rx="0" fill="white" stroke="#b9c9da" stroke-width="1.4" /><text x="28" y="175" font-size="20" fill="#24384f" font-weight="400">Paper</text><rect x="134" y="147" width="116" height="42" rx="0" fill="white" stroke="#b9c9da" stroke-width="1.4" /><text x="144" y="175" font-size="20" fill="#24384f" font-weight="400">3</text><rect x="250" y="147" width="116" height="42" rx="0" fill="white" stroke="#b9c9da" stroke-width="1.4" /><text x="260" y="175" font-size="20" fill="#24384f" font-weight="400">60</text><text x="18" y="225" font-size="20" fill="#24384f" font-weight="400">Read-only preview → editable</text><text x="18" y="252" font-size="20" fill="#24384f" font-weight="400">after completion</text></g></g><path d="M24 641 H416" stroke="#dce3ef"/><text x="24" y="668" font-size="17" fill="#536b83" font-weight="400">Instructional illustration</text></g></svg>