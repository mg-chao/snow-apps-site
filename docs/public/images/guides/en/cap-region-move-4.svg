<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 700" width="600" height="700" role="img" aria-labelledby="title"><title id="title">Snap one region to another</title><defs><pattern id="check" width="20" height="20" patternUnits="userSpaceOnUse"><rect width="20" height="20" fill="#fff"/><path d="M0 0h10v10H0zM10 10h10v10H10z" fill="#dce1ec"/></pattern></defs><rect x="1" y="1" width="598" height="698" rx="14" fill="#f6f7fc" stroke="#cbd4e4"/><g font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif">
<text x="28" y="42" font-size="25" fill="#263148">Snap one region to another</text>
<text x="28" y="108" font-size="19" fill="#536078">Selection bounds move; screen pixels stay fixed</text>
<rect x="30" y="145" width="540" height="350" rx="10" fill="#fff" stroke="#cbd4e4" stroke-width="2"/>
<rect x="100" y="205" width="85" height="45" rx="10" fill="#e5effa" stroke="#cbd4e4" stroke-width="2"/>
<text x="132" y="236" font-size="26" fill="#263148">A</text>
