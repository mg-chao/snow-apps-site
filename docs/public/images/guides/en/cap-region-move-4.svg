<path d="M350 250v24l6-6 6 10 5-3-6-10h10z" fill="#263148" stroke="white" stroke-width="1"/>
<circle cx="358" cy="258" r="16" fill="none" stroke="#c5503e" stroke-width="2"/>
<text x="28" y="535" font-size="22" fill="#263148">Release Space. Hold Ctrl on Windows or Command</text>
<text x="28" y="563" font-size="22" fill="#263148">on macOS while dragging region 1 near region</text>
<text x="28" y="591" font-size="22" fill="#263148">2’s left edge; release at the guide.</text>
<text x="28" y="676" font-size="18" fill="#536078">Instructional illustration</text>
</g></svg>
