<text x="282" y="236" font-size="26" fill="#263148">C</text>
<rect x="350" y="300" width="85" height="45" rx="10" fill="#fff0dc" stroke="#cbd4e4" stroke-width="2"/>
<text x="382" y="331" font-size="26" fill="#263148">B</text>
<rect x="100" y="320" width="85" height="45" rx="10" fill="#f5e8ef" stroke="#cbd4e4" stroke-width="2"/>
<text x="132" y="351" font-size="26" fill="#263148">D</text>
<path d="M62 275h465" stroke="#e0e5ef" stroke-width="4" fill="none" opacity="1"/>
<path d="M62 380h465" stroke="#e0e5ef" stroke-width="4" fill="none" opacity="1"/>
<path d="M62 420h465" stroke="#e0e5ef" stroke-width="4" fill="none" opacity="1"/>
<path d="M60 463h24" stroke="#7652dc" stroke-width="3" fill="none" opacity="1"/>
<text x="92" y="470" font-size="18" fill="#7652dc">Region 1</text>
