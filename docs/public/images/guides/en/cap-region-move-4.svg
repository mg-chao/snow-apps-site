<text x="257" y="470" font-size="18" fill="#d68b24">Region 2</text>
<path d="M220 230h120v90h-120Z" stroke="#adb8cd" stroke-width="2" fill="none" stroke-dasharray="7 5" opacity="1"/>
<path d="M320 210h120v90h-120Z" stroke="#7652dc" stroke-width="3" fill="none" opacity="1"/>
<path d="M320 320h120v90h-120Z" stroke="#d68b24" stroke-width="3" fill="none" opacity="1"/>
