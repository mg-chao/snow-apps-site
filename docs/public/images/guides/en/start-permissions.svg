<svg xmlns="http://www.w3.org/2000/svg" width="960" height="480" viewBox="0 0 960 480" role="img" aria-labelledby="title"><title id="title">macOS permissions: Check each feature (illustration)</title><g font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif"><rect x="1" y="1" width="958" height="478" rx="12" fill="#f6f7fc" stroke="#cbd4e4" stroke-width="2" /><text x="30" y="43" font-size="28" fill="#263148">macOS permissions: Check each feature</text><text x="30" y="460" font-size="18" fill="#536078">Instructional illustration</text><rect x="30" y="80" width="900" height="65" rx="12" fill="#fff" stroke="#cbd4e4" stroke-width="2" /><circle cx="60" cy="112" r="19" fill="#7652dc" /><text x="53" y="120" font-size="23" fill="white">1</text><text x="95" y="120" font-size="24" fill="#263148">Screen recording</text><text x="445" y="120" font-size="22" fill="#263148">Screenshot and recording images</text><rect x="30" y="159" width="900" height="65" rx="12" fill="#fff" stroke="#cbd4e4" stroke-width="2" /><circle cx="60" cy="191" r="19" fill="#7652dc" /><text x="53" y="199" font-size="23" fill="white">2</text><text x="95" y="199" font-size="24" fill="#263148">Accessibility</text><text x="445" y="199" font-size="22" fill="#263148">Actions needing system control</text><rect x="30" y="238" width="900" height="65" rx="12" fill="#fff" stroke="#cbd4e4" stroke-width="2" /><circle cx="60" cy="270" r="19" fill="#7652dc" /><text x="53" y="278" font-size="23" fill="white">3</text><text x="95" y="278" font-size="24" fill="#263148">Input Monitoring</text><text x="445" y="278" font-size="22" fill="#263148">Global input and recording effects</text><rect x="30" y="317" width="900" height="65" rx="12" fill="#fff" stroke="#cbd4e4" stroke-width="2" /><circle cx="60" cy="349" r="19" fill="#7652dc" /><text x="53" y="357" font-size="23" fill="white">4</text><text x="95" y="357" font-size="24" fill="#263148">Microphone</text><text x="445" y="357" font-size="22" fill="#263148">Record your voice</text></g></svg>