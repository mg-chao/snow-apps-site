<svg xmlns="http://www.w3.org/2000/svg" width="440" height="620" viewBox="0 0 440 620" role="img" aria-labelledby="title desc"><title id="title">Discard a draft or end capture: Same draft: Esc ends capture</title><desc id="desc">Default Esc ends the screenshot layer and returns to the original app without exporting this capture</desc><rect width="440" height="620" rx="15" fill="#f4f7fc"/><g font-family="system-ui,-apple-system,PingFang SC,Microsoft YaHei,sans-serif"><text x="24" y="34" font-size="23" fill="#263b51" font-weight="700" >Discard a draft or end capture</text><text x="24" y="70" font-size="20" fill="#287dbc" font-weight="600" >Same draft: Esc ends capture</text><g transform="translate(24 115)"><rect x="0" y="0" width="392" height="393" rx="11" fill="white" stroke="#d0dbe7" stroke-width="1.5" /><text x="18" y="31" font-size="21" fill="#7654d6" font-weight="600" >Action: Esc in screenshot</text><text x="18" y="58" font-size="21" fill="#7654d6" font-weight="600" >capture</text><g transform="translate(18 92)"><rect x="0" y="0" width="356" height="218" rx="6" fill="#fafcfe" stroke="#c6d5e4" stroke-width="1.5" /><text x="22" y="43" font-size="22" fill="#263b51" font-weight="600" >Return to the original app</text><rect x="22" y="70" width="275" height="7" rx="3" fill="#d1dce7" stroke="none" stroke-width="1.5" /><rect x="22" y="97" width="238" height="7" rx="3" fill="#d1dce7" stroke="none" stroke-width="1.5" /><rect x="22" y="124" width="266" height="7" rx="3" fill="#d1dce7" stroke="none" stroke-width="1.5" /><rect x="22" y="151" width="191" height="7" rx="3" fill="#d1dce7" stroke="none" stroke-width="1.5" /><text x="22" y="198" font-size="18" fill="#587087" font-weight="400" >This capture was not exported</text></g><text x="18" y="345" font-size="19" fill="#263b51" font-weight="400" >If confirmation appears, confirm</text><text x="18" y="371" font-size="19" fill="#263b51" font-weight="400" >to close.</text></g><path d="M24 572 H416" stroke="#d9e2ed"/><text x="24" y="598" font-size="17" fill="#587087" font-weight="400" >Instructional illustration</text></g></svg>