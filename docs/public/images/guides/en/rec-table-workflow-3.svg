<svg xmlns="http://www.w3.org/2000/svg" width="440" height="690" viewBox="0 0 440 690" role="img" aria-labelledby="title desc"><title id="title">Table states and files: Save the full table or open it</title><desc id="desc">Save as file exports the entire current table as XLSX, not just selected cells. Cancel keeps edits; success ends capture. Open spreadsheet file creates a temporary XLSX for the default app; save a lasting copy there.</desc><rect width="440" height="690" rx="16" fill="#f5f7fc"/><g font-family="system-ui,-apple-system,PingFang SC,Microsoft YaHei,sans-serif"><text x="24" y="35" font-size="23" fill="#24384f" font-weight="700">Table states and files</text><text x="24" y="70" font-size="20" fill="#267cba" font-weight="600">Save the full table or open it</text><g transform="translate(0 111)"><g transform="translate(24 0)"><rect x="0" y="0" width="392" height="214" rx="11" fill="#fff" stroke="#d1dbE8" stroke-width="1.4" /><text x="18" y="30" font-size="22" fill="#7154d9" font-weight="650">table.xlsx</text><rect x="18" y="63" width="116" height="42" rx="0" fill="#eaf0f8" stroke="#b9c9da" stroke-width="1.4" /><text x="28" y="91" font-size="20" fill="#24384f" font-weight="400">Item</text><rect x="134" y="63" width="116" height="42" rx="0" fill="#eaf0f8" stroke="#b9c9da" stroke-width="1.4" /><text x="144" y="91" font-size="20" fill="#24384f" font-weight="400">Qty</text><rect x="250" y="63" width="116" height="42" rx="0" fill="#eaf0f8" stroke="#b9c9da" stroke-width="1.4" /><text x="260" y="91" font-size="20" fill="#24384f" font-weight="400">Sum</text><rect x="18" y="105" width="116" height="42" rx="0" fill="white" stroke="#b9c9da" stroke-width="1.4" /><text x="28" y="133" font-size="20" fill="#24384f" font-weight="400">Pen</text><rect x="134" y="105" width="116" height="42" rx="0" fill="white" stroke="#b9c9da" stroke-width="1.4" /><text x="144" y="133" font-size="20" fill="#24384f" font-weight="400">2</text><rect x="250" y="105" width="116" height="42" rx="0" fill="white" stroke="#b9c9da" stroke-width="1.4" /><text x="260" y="133" font-size="20" fill="#24384f" font-weight="400">80</text><rect x="18" y="147" width="116" height="42" rx="0" fill="white" stroke="#b9c9da" stroke-width="1.4" /><text x="28" y="175" font-size="20" fill="#24384f" font-weight="400">Paper</text><rect x="134" y="147" width="116" height="42" rx="0" fill="white" stroke="#b9c9da" stroke-width="1.4" /><text x="144" y="175" font-size="20" fill="#24384f" font-weight="400">3</text><rect x="250" y="147" width="116" height="42" rx="0" fill="white" stroke="#b9c9da" stroke-width="1.4" /><text x="260" y="175" font-size="20" fill="#24384f" font-weight="400">60</text></g><g transform="translate(24 231)"><rect x="0" y="0" width="392" height="256" rx="11" fill="#fff" stroke="#d1dbE8" stroke-width="1.4" /><text x="18" y="30" font-size="22" fill="#7154d9" font-weight="650">Two destinations</text><text x="18" y="81" font-size="20" fill="#24384f" font-weight="400">Save as file → chosen folder →</text><text x="18" y="108" font-size="20" fill="#24384f" font-weight="400">reopen and check</text><text x="18" y="143" font-size="20" fill="#24384f" font-weight="400">Open spreadsheet file →</text><text x="18" y="170" font-size="20" fill="#24384f" font-weight="400">temporary XLSX → default app</text><text x="18" y="205" font-size="20" fill="#24384f" font-weight="400">Cancel save → return to the</text><text x="18" y="232" font-size="20" fill="#24384f" font-weight="400">current table</text></g></g><path d="M24 641 H416" stroke="#dce3ef"/><text x="24" y="668" font-size="17" fill="#536b83" font-weight="400">Instructional illustration</text></g></svg>