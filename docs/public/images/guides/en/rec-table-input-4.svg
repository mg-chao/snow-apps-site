<svg xmlns="http://www.w3.org/2000/svg" width="440" height="950" viewBox="0 0 440 950" role="img" aria-labelledby="title desc"><title id="title">Cell text or table range: Do not partially cover a merged cell</title><desc id="desc">Another example: Qty and Sum are merged but the source is one cell. Selecting the whole merged cell does not enlarge the source. Cover its complete dimensions or split the target before pasting.</desc><rect width="440" height="950" rx="16" fill="#f5f7fc"/><g font-family="system-ui,-apple-system,PingFang SC,Microsoft YaHei,sans-serif"><text x="24" y="35" font-size="23" fill="#24384f" font-weight="700">Cell text or table range</text><text x="24" y="70" font-size="20" fill="#267cba" font-weight="600">Do not partially cover a merged</text><text x="24" y="97" font-size="20" fill="#267cba" font-weight="600">cell</text><g transform="translate(0 138)"><g transform="translate(24 0)"><rect x="0" y="0" width="392" height="214" rx="11" fill="#fff" stroke="#d1dbE8" stroke-width="1.4" /><text x="18" y="30" font-size="22" fill="#7154d9" font-weight="650">Target remains merged</text><rect x="18" y="63" width="116" height="42" rx="0" fill="#eaf0f8" stroke="#b9c9da" stroke-width="1.4" /><text x="28" y="91" font-size="20" fill="#24384f" font-weight="400">Item</text><rect x="134" y="63" width="116" height="42" rx="0" fill="#eaf0f8" stroke="#b9c9da" stroke-width="1.4" /><text x="144" y="91" font-size="20" fill="#24384f" font-weight="400">Qty</text><rect x="250" y="63" width="116" height="42" rx="0" fill="#eaf0f8" stroke="#b9c9da" stroke-width="1.4" /><text x="260" y="91" font-size="20" fill="#24384f" font-weight="400">Sum</text><rect x="18" y="105" width="116" height="42" rx="0" fill="white" stroke="#b9c9da" stroke-width="1.4" /><text x="28" y="133" font-size="20" fill="#24384f" font-weight="400">Pen</text><rect x="134" y="105" width="232" height="42" rx="0" fill="#eee9fb" stroke="#b9c9da" stroke-width="1.4" /><text x="144" y="122" font-size="18" fill="#24384f" font-weight="400">2</text><text x="144" y="142" font-size="18" fill="#24384f" font-weight="400">80</text><rect x="18" y="147" width="116" height="42" rx="0" fill="white" stroke="#b9c9da" stroke-width="1.4" /><text x="28" y="175" font-size="20" fill="#24384f" font-weight="400">Paper</text><rect x="134" y="147" width="116" height="42" rx="0" fill="white" stroke="#b9c9da" stroke-width="1.4" /><text x="144" y="175" font-size="20" fill="#24384f" font-weight="400">3</text><rect x="250" y="147" width="116" height="42" rx="0" fill="white" stroke="#b9c9da" stroke-width="1.4" /><text x="260" y="175" font-size="20" fill="#24384f" font-weight="400">60</text></g><g transform="translate(24 231)"><rect x="0" y="0" width="392" height="194" rx="11" fill="#fff" stroke="#d1dbE8" stroke-width="1.4" /><text x="18" y="30" font-size="22" fill="#c34d56" font-weight="650">Source 1×1: 7</text><text x="18" y="81" font-size="20" fill="#24384f" font-weight="400">Partial coverage is rejected;</text><text x="18" y="108" font-size="20" fill="#24384f" font-weight="400">the table is unchanged.</text><text x="18" y="143" font-size="20" fill="#24384f" font-weight="400">Split target → paste again from</text><text x="18" y="170" font-size="20" fill="#24384f" font-weight="400">its upper-left cell</text></g></g><path d="M24 901 H416" stroke="#dce3ef"/><text x="24" y="928" font-size="17" fill="#536b83" font-weight="400">Instructional illustration</text></g></svg>