<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560" role="img" aria-labelledby="title desc"><title id="title">Undo follows the most recent edit: Redo 1: apply the crop</title><desc id="desc">Instructional illustration. Redo first reapplies the 40-row crop. The orange circle is still absent.</desc><rect width="960" height="560" rx="20" fill="#f5f7fc"/><g font-family="system-ui,-apple-system,PingFang SC,Microsoft YaHei,sans-serif"><text x="28" y="42" font-size="28" fill="#24384f" font-weight="700" text-anchor="start">Undo follows the most recent edit</text><text x="28" y="77" font-size="19" fill="#536b83" font-weight="400" text-anchor="start">Redo 1: apply the crop</text><rect x="28" y="98" width="592" height="396" rx="8" fill="white" stroke="#c8d3e6" stroke-width="1.5" /><text x="80" y="121" font-size="19" fill="#536b83" font-weight="600" text-anchor="start">300 × 160 px</text><rect x="80" y="136" width="480" height="320" rx="0" fill="none" stroke="#aabbd2" stroke-width="1.5" stroke-dasharray="5 5"/><g transform="translate(80 136) scale(1.6)"><rect x="0" y="0" width="300" height="160" rx="0" fill="white" stroke="#aabbd2" stroke-width="1.5" /><rect x="20" y="20" width="110" height="40" rx="0" fill="#e5effa" stroke="none" stroke-width="1.5" /><text x="36" y="49" font-size="25" fill="#2877bd" font-weight="700" text-anchor="start">A</text><rect x="20" y="90" width="260" height="30" rx="0" fill="#dcefe9" stroke="none" stroke-width="1.5" /><text x="36" y="114" font-size="25" fill="#258568" font-weight="700" text-anchor="start">B</text><path d="M0 145 L300 145" fill="none" stroke="#aabbd2" stroke-width="1" stroke-dasharray="4 4"/><path d="M160 145 L260 145" fill="none" stroke="#7154d9" stroke-width="3"/><path d="M250.0 139.0 L260 145 L250.0 151.0" fill="none" stroke="#7154d9" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></g><text x="66" y="141" font-size="16" fill="#536b83" font-weight="400" text-anchor="end">0</text><text x="66" y="397.0" font-size="16" fill="#536b83" font-weight="400" text-anchor="end">160</text><text x="66" y="373.0" font-size="16" fill="#7154d9" font-weight="400" text-anchor="end">145</text><text x="86" y="485" font-size="18" fill="#7154d9" font-weight="400" text-anchor="start">Purple arrow: earlier annotation</text><rect x="644" y="98" width="288" height="396" rx="8" fill="white" stroke="#c8d3e6" stroke-width="1.5" /><text x="666" y="134" font-size="22" fill="#7154d9" font-weight="650" text-anchor="start">Redo 1</text><text x="666" y="181" font-size="20" fill="#24384f" font-weight="400" text-anchor="start">Redo reapplies the</text><text x="666" y="209" font-size="20" fill="#24384f" font-weight="400" text-anchor="start">crop.</text><text x="666" y="257" font-size="20" fill="#24384f" font-weight="400" text-anchor="start">Height returns to 160</text><text x="666" y="285" font-size="20" fill="#24384f" font-weight="400" text-anchor="start">px.</text><text x="666" y="382" font-size="17" fill="#536b83" font-weight="400" text-anchor="start">Applied edits</text><circle cx="679" cy="408" r="7" fill="#7154d9" stroke="#7154d9" stroke-width="2"/><text x="697" y="413" font-size="18" fill="#24384f" font-weight="400" text-anchor="start">Crop 40 rows</text><circle cx="679" cy="446" r="7" fill="white" stroke="#aabbd2" stroke-width="2"/><text x="697" y="451" font-size="18" fill="#8293a4" font-weight="400" text-anchor="start">New orange circle</text><path d="M28 509 L932 509" fill="none" stroke="#dbe3ef" stroke-width="1"/><text x="28" y="539" font-size="18" fill="#536b83" font-weight="400" text-anchor="start">Canvas history; finish text editing before using it.</text><text x="930" y="539" font-size="17" fill="#536b83" font-weight="400" text-anchor="end">Instructional illustration</text></g></svg>