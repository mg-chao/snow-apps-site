<svg xmlns="http://www.w3.org/2000/svg" width="440" height="600" viewBox="0 0 440 600" role="img" aria-labelledby="title desc"><title id="title">Local OCR controls: Compare detection options</title><desc id="desc">Change one detection option at a time and recognize the same area again. Enlarge short side may find smaller text; Speed first may change the result.</desc><rect width="440" height="600" rx="16" fill="#f5f7fc"/><g font-family="system-ui,-apple-system,PingFang SC,Microsoft YaHei,sans-serif"><text x="24" y="35" font-size="23" fill="#24384f" font-weight="700">Local OCR controls</text><text x="24" y="70" font-size="20" fill="#267cba" font-weight="600">Compare detection options</text><g transform="translate(0 111)"><g transform="translate(24 0)"><rect x="0" y="0" width="392" height="167" rx="11" fill="#fff" stroke="#d1dbE8" stroke-width="1.4" /><text x="18" y="30" font-size="22" fill="#7154d9" font-weight="650">Text detection scaling</text><text x="18" y="81" font-size="20" fill="#24384f" font-weight="400">Limit long side (faster)</text><text x="18" y="116" font-size="20" fill="#24384f" font-weight="400">Enlarge short side (more</text><text x="18" y="143" font-size="20" fill="#24384f" font-weight="400">detail)</text></g><g transform="translate(24 184)"><rect x="0" y="0" width="392" height="229" rx="11" fill="#fff" stroke="#d1dbE8" stroke-width="1.4" /><text x="18" y="30" font-size="22" fill="#7154d9" font-weight="650">Text detection processing</text><text x="18" y="81" font-size="20" fill="#24384f" font-weight="400">Accuracy first</text><text x="18" y="116" font-size="20" fill="#24384f" font-weight="400">Speed first</text><text x="18" y="151" font-size="20" fill="#24384f" font-weight="400">Choose the preceding rule to</text><text x="18" y="178" font-size="20" fill="#24384f" font-weight="400">restore your comparison</text><text x="18" y="205" font-size="20" fill="#24384f" font-weight="400">baseline.</text></g></g><path d="M24 551 H416" stroke="#dce3ef"/><text x="24" y="578" font-size="17" fill="#536b83" font-weight="400">Instructional illustration</text></g></svg>