<svg xmlns="http://www.w3.org/2000/svg" width="440" height="610" viewBox="0 0 440 610" role="img" aria-labelledby="title desc"><title id="title">Which points does finishing keep?: Same draft: double-click C</title><desc id="desc">Double-clicking C from the same unfinished draft produces a completed path through A, B and C</desc><rect width="440" height="610" rx="15" fill="#f4f7fc"/><g font-family="system-ui,-apple-system,PingFang SC,Microsoft YaHei,sans-serif"><text x="24" y="34" font-size="23" fill="#263b51" font-weight="700" >Which points does finishing</text><text x="24" y="64" font-size="23" fill="#263b51" font-weight="700" >keep?</text><text x="24" y="100" font-size="20" fill="#287dbc" font-weight="600" >Same draft: double-click C</text><g transform="translate(24 145)"><rect x="0" y="0" width="392" height="358" rx="11" fill="white" stroke="#d0dbe7" stroke-width="1.5" /><text x="18" y="31" font-size="21" fill="#7654d6" font-weight="600" >Action: double-click C</text><g transform="translate(18 65)"><rect x="0" y="0" width="356" height="236" rx="6" fill="#fafcfe" stroke="#c6d5e4" stroke-width="1.5" /><path d="M44 141 L151 67" fill="none" stroke="#d44f58" stroke-width="3" stroke-linecap="round"/><path d="M151 67 L297 153" fill="none" stroke="#d44f58" stroke-width="3" stroke-linecap="round"/><polygon points="297.00,153.00 284.98,151.73 290.06,143.11" fill="#d44f58"/><circle cx="44" cy="141" r="6" fill="white" stroke="#287dbc" stroke-width="2" /><text x="38" y="125" font-size="19" fill="#287dbc" font-weight="600" >A</text><circle cx="151" cy="67" r="6" fill="white" stroke="#287dbc" stroke-width="2" /><text x="145" y="51" font-size="19" fill="#287dbc" font-weight="600" >B</text><circle cx="297" cy="153" r="6" fill="white" stroke="#287dbc" stroke-width="2" /><text x="309" y="159" font-size="19" fill="#287dbc" font-weight="600" >C</text><text x="18" y="213" font-size="18" fill="#263b51" font-weight="400" >A → B → C; endpoint included</text></g><text x="18" y="336" font-size="19" fill="#263b51" font-weight="400" >C becomes the final fixed point.</text></g><path d="M24 562 H416" stroke="#d9e2ed"/><text x="24" y="588" font-size="17" fill="#587087" font-weight="400" >Instructional illustration</text></g></svg>