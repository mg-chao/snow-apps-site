<svg xmlns="http://www.w3.org/2000/svg" width="760" height="430" viewBox="0 0 760 430" role="img" aria-labelledby="title desc" font-family="system-ui,sans-serif"><title id="title">Add a straight section to a stroke: Draw a curved section</title><desc id="desc">Hold the left mouse button and move freely to record the first section.</desc><rect width="760" height="430" rx="12" fill="#f3f7fc" /><text x="24" y="34" font-size="25" fill="#24384f">Add a straight section to a stroke</text><text x="24" y="63" font-size="18" fill="#536c86">Draw a curved section</text><rect x="18" y="80" width="724" height="260" rx="7" fill="white" stroke="#b9cce0" /><path d="M75 230 Q155 105 245 220" stroke="#2877bd" stroke-width="7" fill="none" stroke-linecap="round" stroke-linejoin="round" /><text x="26" y="364" font-size="18" fill="#24384f">Hold the left mouse button and move freely to record the first section.</text><text x="24" y="416" font-size="15" fill="#536c86">Instructional illustration</text></svg>