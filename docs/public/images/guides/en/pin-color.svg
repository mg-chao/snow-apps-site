<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" role="img" aria-labelledby="title desc"><title id="title">One color, three standard formats</title><desc id="desc">Copy plain #FF0000 → pin clipboard → copy a format row.</desc><rect width="960" height="560" rx="24" fill="#f5f7fc" /><g font-family="system-ui,-apple-system,PingFang SC,Microsoft YaHei,sans-serif"><text x="36" y="52" font-size="30" fill="#18233b" font-weight="700">One color, three standard formats</text><text x="36" y="88" font-size="20" fill="#53627d" font-weight="400">Copy plain #FF0000 → pin clipboard → copy a format row</text><rect x="37" y="138" width="331" height="309" rx="16" fill="#ffffff" stroke="#c8d3e6" stroke-width="2" /><rect x="65" y="167" width="275" height="153" rx="16" fill="#ff0000" stroke="#ff0000" stroke-width="2" /><text x="66" y="370" font-size="28" fill="#18233b" font-weight="400">Color value: red</text><text x="66" y="416" font-size="16.61" fill="#53627d" font-weight="400">Color alpha differs from window opacity</text><path d="M381 290 L423 290" fill="none" stroke="#6954d9" stroke-width="3" /><path d="M414 283 L423 290 L414 297" fill="none" stroke="#6954d9" stroke-width="3" /><rect x="444" y="138" width="480" height="309" rx="16" fill="#ffffff" stroke="#c8d3e6" stroke-width="2" /><text x="469" y="205" font-size="28" fill="#2563c6" font-weight="400">HEX   #FF0000</text><text x="469" y="271" font-size="26" fill="#2563c6" font-weight="400">RGB   rgb(255, 0, 0)</text><text x="469" y="337" font-size="25" fill="#2563c6" font-weight="400">HSL   hsl(0, 100%, 50%)</text><rect x="467" y="381" width="291" height="38" rx="19" fill="#ede9fe" stroke="#ede9fe" stroke-width="2" /><text x="481" y="407" font-size="15.26" fill="#5941bd" font-weight="600">Each format has its own copy control</text><path d="M36 510 L924 510" fill="none" stroke="#dce3ef" stroke-width="1" /><text x="36" y="539" font-size="18" fill="#53627d" font-weight="400">Snow Shot · Instructional illustration</text></g></svg>