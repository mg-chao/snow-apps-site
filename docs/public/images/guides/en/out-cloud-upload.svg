<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="900" height="470" viewBox="0 0 900 470" role="img" aria-labelledby="title desc">
<title id="title">Get a link after upload succeeds</title><desc id="desc">Write success and public read access differ; bucket/CDN policy controls access.</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#1677ff" /></marker></defs>
<rect width="900" height="470" rx="20" fill="#fff" />
<g font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif"><text x="30" y="47" font-size="30" fill="#163963" font-weight="700">Get a link after upload succeeds</text><text x="30" y="79" font-size="18" fill="#62758e" font-weight="400">Instructional illustration</text><rect x="30" y="112" width="263" height="265" rx="16" fill="#f2f6fc" stroke="#cbd8e9" stroke-width="2" /><circle cx="58" cy="142" r="20" fill="#1677ff" /><text x="51" y="150" font-size="24" fill="white" font-weight="700">1</text><text x="88" y="151" font-size="19.23" fill="#163963" font-weight="600">Default configuration</text><rect x="318" y="112" width="263" height="265" rx="16" fill="#f2f6fc" stroke="#cbd8e9" stroke-width="2" /><circle cx="346" cy="142" r="20" fill="#1677ff" /><text x="339" y="150" font-size="24" fill="white" font-weight="700">2</text><text x="376" y="151" font-size="24" fill="#163963" font-weight="600">Upload image</text><rect x="606" y="112" width="263" height="265" rx="16" fill="#f2f6fc" stroke="#cbd8e9" stroke-width="2" /><circle cx="634" cy="142" r="20" fill="#1677ff" /><text x="627" y="150" font-size="24" fill="white" font-weight="700">3</text><text x="664" y="151" font-size="24" fill="#163963" font-weight="600">Link</text><text x="54" y="208" font-size="23.56" fill="#24344d" font-weight="400">S3 endpoint · Region</text><text x="54" y="251" font-size="23.85" fill="#24344d" font-weight="400">Bucket · Credentials</text><text x="54" y="307" font-size="24" fill="#24344d" font-weight="400">Select default target</text><rect x="346" y="193" width="206" height="126" rx="12" fill="#e9f5ed" stroke="#9dceb0" stroke-width="2" /><text x="362" y="239" font-size="21.77" fill="#24344d" font-weight="400">Prepare → Upload</text><text x="362" y="285" font-size="20.69" fill="#24344d" font-weight="400">Wait for completion</text><text x="633" y="210" font-size="24" fill="#24344d" font-weight="400">Copy object URL</text><text x="633" y="260" font-size="21.4" fill="#24344d" font-weight="400">Test access in browser</text><text x="633" y="310" font-size="23" fill="#24344d" font-weight="400">Then share the link</text><path d="M290 250L317 250" stroke="#1677ff" stroke-width="4" marker-end="url(#a)" fill="none" /><path d="M580 250L606 250" stroke="#1677ff" stroke-width="4" marker-end="url(#a)" fill="none" /><text x="30" y="444" font-size="20" fill="#52647e" font-weight="400">Write success and public read access differ; bucket/CDN policy controls access.</text></g></svg>