<svg xmlns="http://www.w3.org/2000/svg" width="440" height="580" viewBox="0 0 440 580" role="img" aria-labelledby="title desc"><title id="title">Transform and restore text: Reset to the initial text</title><desc id="desc">Reset restores the initial two lines and full-width punctuation and clears both transform choices. It does not submit the image again.</desc><rect width="440" height="580" rx="16" fill="#f5f7fc"/><g font-family="system-ui,-apple-system,PingFang SC,Microsoft YaHei,sans-serif"><text x="24" y="35" font-size="23" fill="#24384f" font-weight="700">Transform and restore text</text><text x="24" y="70" font-size="20" fill="#267cba" font-weight="600">Reset to the initial text</text><g transform="translate(0 111)"><g transform="translate(24 0)"><rect x="0" y="0" width="392" height="159" rx="11" fill="#fff" stroke="#d1dbE8" stroke-width="1.4" /><text x="18" y="30" font-size="22" fill="#7154d9" font-weight="650">Click: Reset</text><rect x="18" y="63" width="356" height="76" rx="6" fill="#f5f7fb" stroke="none" stroke-width="1.4" /><text x="29" y="93" font-size="20" fill="#24384f" font-weight="400">Snow，</text><text x="29" y="121" font-size="20" fill="#24384f" font-weight="400">Shot！</text></g><g transform="translate(24 176)"><rect x="0" y="0" width="392" height="218" rx="11" fill="#fff" stroke="#d1dbE8" stroke-width="1.4" /><text x="18" y="30" font-size="22" fill="#7154d9" font-weight="650">Transform choices cleared</text><text x="18" y="78" font-size="18" fill="#536b83" font-weight="400">Formatting</text><rect x="18" y="86" width="356" height="42" rx="6" fill="#fff" stroke="#c8d3e6" stroke-width="1.4" /><text x="30" y="114" font-size="20" fill="#24384f" font-weight="400">None</text><text x="18" y="152" font-size="18" fill="#536b83" font-weight="400">Punctuation</text><rect x="18" y="160" width="356" height="42" rx="6" fill="#fff" stroke="#c8d3e6" stroke-width="1.4" /><text x="30" y="188" font-size="20" fill="#24384f" font-weight="400">None</text></g></g><path d="M24 531 H416" stroke="#dce3ef"/><text x="24" y="558" font-size="17" fill="#536b83" font-weight="400">Instructional illustration</text></g></svg>