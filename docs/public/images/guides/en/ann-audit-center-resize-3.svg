cap="round" stroke-linejoin="round" /><path d="M202.59049730511038 135.06274607234172 L195 124 L208.40449524093958 124.56524979931675" stroke="#d84d53" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round" /><rect x="45" y="100" width="75" height="33" rx="5" fill="#e2effb" stroke="#2877bd" /><text x="57" y="123" font-size="18" fill="#2877bd">Alt</text><text x="26" y="364" font-size="18" fill="#24384f">The bounds grow; the center stays. Alt-dragging the body duplicates.</text><text x="24" y="416" font-size="15" fill="#536c86">Instructional illustration</text></svg>