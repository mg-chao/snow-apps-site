<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" role="img" aria-labelledby="title desc"><title id="title">Navigate the annotation layer: Prepare the drawing layer</title><desc id="desc">Instructional illustration. Disable click-through, finish text editing and color sampling, then choose Select elements. The purple ring and arrow are annotations; A and B belong to the application underneath.</desc><defs><clipPath id="scene-clip"><rect x="0" y="0" width="840" height="280" rx="8"/></clipPath></defs><rect width="960" height="600" rx="20" fill="#f5f7fc"/><g font-family="system-ui,-apple-system,PingFang SC,Microsoft YaHei,sans-serif"><text x="32" y="43" font-size="29" fill="#24384f" font-weight="700" text-anchor="start">Navigate the annotation layer</text><text x="928" y="42" font-size="22" fill="#536b83" font-weight="600" text-anchor="end">1 / 6</text><text x="32" y="82" font-size="25" fill="#267cba" font-weight="650" text-anchor="start">Click-through off · Select elements</text><text x="32" y="124" font-size="22" fill="#536b83" font-weight="400" text-anchor="start">Application: fixed · Purple: annotation layer</text><g transform="translate(60 154)"><g id="fixed-application"><rect x="0" y="0" width="840" height="280" rx="8" fill="#fff" stroke="#aebdd0" stroke-width="1.5" /><rect x="1" y="1" width="838" height="42" rx="7" fill="#e8edf4" stroke="none" stroke-width="1.5" /><text x="20" y="30" font-size="21" fill="#536b83" font-weight="600" text-anchor="start">Application underneath — fixed</text><rect x="22" y="63" width="112" height="188" rx="6" fill="#f1f4f8" stroke="none" stroke-width="1.5" /><path d="M39 85 L115 85" fill="none" stroke="#ccd5df" stroke-width="6" stroke-linecap="round" /><path d="M39 113 L101 113" fill="none" stroke="#ccd5df" stroke-width="6" stroke-linecap="round" /><path d="M39 141 L114 141" fill="none" stroke="#ccd5df" stroke-width="6" stroke-linecap="round" /><path d="M39 169 L93 169" fill="none" stroke="#ccd5df" stroke-width="6" stroke-linecap="round" /><path d="M39 197 L107 197" fill="none" stroke="#ccd5df" stroke-width="6" stroke-linecap="round" /><rect x="170" y="99" width="120" height="82" rx="4" fill="#e5eef7" stroke="#b5c5d4" stroke-width="1.5" /><text x="230" y="155" font-size="36" fill="#24384f" font-weight="700" text-anchor="middle">A</text><rect x="510" y="99" width="120" height="82" rx="4" fill="#e3eee9" stroke="#b5c5d4" stroke-width="1.5" /><text x="570" y="155" font-size="36" fill="#24384f" font-weight="700" text-anchor="middle">B</text><path d="M175 222 L350 222" fill="none" stroke="#d5dee8" stroke-width="9" stroke-linecap="round" /><path d="M515 222 L690 222" fill="none" stroke="#d5dee8" stroke-width="9" stroke-linecap="round" /></g><g clip-path="url(#scene-clip)"><g id="annotation-layer"><g transform="translate(0.000000000 0.000000000) scale(1.000000000)"><ellipse cx="230" cy="140" rx="78" ry="59" fill="none" stroke="#7946cb" stroke-width="4"/><path d="M415 205 L559 158" fill="none" stroke="#7946cb" stroke-width="5" stroke-linecap="round" /><path d="M545.3582413366506 154.87871491674815 L559 158 L549.8262737908486 168.56800584024865" fill="none" stroke="#7946cb" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/></g></g><circle cx="230.0" cy="140.0" r="8" fill="white" stroke="#267cba" stroke-width="2.5"/><path d="M217.0 140.0 L243.0 140.0" fill="none" stroke="#267cba" stroke-width="1.8" stroke-linecap="round" /><path d="M230.0 127.0 L230.0 153.0" fill="none" stroke="#267cba" stroke-width="1.8" stroke-linecap="round" /></g></g><text x="32" y="479" font-size="23" fill="#24384f" font-weight="600" text-anchor="start">A and B stay fixed; purple marks are annotations.</text><text x="32" y="510" font-size="23" fill="#24384f" font-weight="400" text-anchor="start">Only the layer&#x27;s view will move or scale.</text><path d="M32 538 L928 538" fill="none" stroke="#dbe3ef" stroke-width="1" stroke-linecap="round" /><text x="32" y="568" font-size="19" fill="#536b83" font-weight="400" text-anchor="start">Dashed purple = previous view</text><text x="928" y="568" font-size="19" fill="#536b83" font-weight="400" text-anchor="end">Instructional illustration</text></g></svg>