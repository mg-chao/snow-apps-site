<svg xmlns="http://www.w3.org/2000/svg" width="600" height="720" viewBox="0 0 600 720" role="img"><title>Paste into an empty split window</title><desc>Paste image pixels or readable local image paths. With a file list, only the first supported image is read.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#487bd0"/></marker></defs><rect width="600" height="720" rx="20" fill="#f4f7fc"/><g font-family="Arial,PingFang SC,Microsoft YaHei,sans-serif"><text x="24" y="43" font-size="25" fill="#203858" font-weight="700" text-anchor="start">Paste into an empty split window</text><rect x="24" y="98" width="552" height="398" rx="12" fill="#fff" stroke="#c7d4e7" stroke-width="2"/><text x="44" y="134" font-size="21" fill="#233a5b" font-weight="400" text-anchor="start">Clipboard input</text><rect x="60" y="150" width="62.5" height="100" rx="7" fill="#c5dbf3" stroke="#8fa7c8" stroke-width="2"/><text x="91.25" y="212.0" font-size="32" fill="#345075" font-weight="600" text-anchor="middle">G</text><rect x="122.5" y="150" width="62.5" height="100" rx="7" fill="#f7e8b3" stroke="#8fa7c8" stroke-width="2"/><text x="153.75" y="212.0" font-size="32" fill="#345075" font-weight="600" text-anchor="middle">H</text><text x="123" y="276" font-size="19" fill="#233a5b" font-weight="400" text-anchor="middle">Image B pixels</text><rect x="318" y="158" width="232" height="90" rx="12" fill="#f7faff" stroke="#c7d4e7" stroke-width="2"/><text x="434" y="195" font-size="23" fill="#233a5b" font-weight="400" text-anchor="middle">Paths: B, C</text><text x="434" y="228" font-size="18" fill="#233a5b" font-weight="400" text-anchor="middle">Read B only</text><path d="M300 284L300 316" stroke="#487bd0" stroke-width="4" marker-end="url(#arrow)"/><rect x="210" y="332" width="90.0" height="144" rx="7" fill="#c5dbf3" stroke="#8fa7c8" stroke-width="2"/><text x="255.0" y="416.0" font-size="32" fill="#345075" font-weight="600" text-anchor="middle">G</text><rect x="300.0" y="332" width="90.0" height="144" rx="7" fill="#f7e8b3" stroke="#8fa7c8" stroke-width="2"/><text x="345.0" y="416.0" font-size="32" fill="#345075" font-weight="600" text-anchor="middle">H</text><rect x="24" y="516" width="552" height="144" rx="12" fill="#fff" stroke="#d2dced" stroke-width="2"/><text x="44" y="548" font-size="21" fill="#233a5b" font-weight="400" text-anchor="start">Paste image pixels or readable local image</text><text x="44" y="578" font-size="21" fill="#233a5b" font-weight="400" text-anchor="start">paths. With a file list, only the first</text><text x="44" y="608" font-size="21" fill="#233a5b" font-weight="400" text-anchor="start">supported image is read.</text><text x="24" y="694" font-size="19" fill="#5a6c86" font-weight="400" text-anchor="start">Instructional illustration</text><text x="548" y="694" font-size="19" fill="#5a6c86" font-weight="400" text-anchor="end">1/4</text></g></svg>
