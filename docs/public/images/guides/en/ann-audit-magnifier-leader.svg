oke="#2877bd" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round" /><text x="26" y="364" font-size="18" fill="#24384f">Hide the source frame; its content and</text><text x="26" y="389" font-size="18" fill="#24384f">sampling position stay unchanged.</text><text x="24" y="416" font-size="15" fill="#536c86">Instructional illustration</text></svg>