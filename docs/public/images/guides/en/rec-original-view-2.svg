<svg xmlns="http://www.w3.org/2000/svg" width="440" height="660" viewBox="0 0 440 660" role="img" aria-labelledby="title desc"><title id="title">Original and result views: Inspect input, then return</title><desc id="desc">Show original image hides the text result temporarily. Check 012 in the input, then click the same button again to return to the text result for editing.</desc><rect width="440" height="660" rx="16" fill="#f5f7fc"/><g font-family="system-ui,-apple-system,PingFang SC,Microsoft YaHei,sans-serif"><text x="24" y="35" font-size="23" fill="#24384f" font-weight="700">Original and result views</text><text x="24" y="70" font-size="20" fill="#267cba" font-weight="600">Inspect input, then return</text><g transform="translate(0 111)"><g transform="translate(24 0)"><rect x="0" y="0" width="392" height="131" rx="11" fill="#fff" stroke="#d1dbE8" stroke-width="1.4" /><text x="18" y="30" font-size="22" fill="#7154d9" font-weight="650">Show original image: on</text><rect x="18" y="63" width="356" height="48" rx="6" fill="#f5f7fb" stroke="none" stroke-width="1.4" /><text x="29" y="93" font-size="20" fill="#24384f" font-weight="400">Error code: 012</text></g><g transform="translate(24 148)"><rect x="0" y="0" width="392" height="160" rx="11" fill="#fff" stroke="#d1dbE8" stroke-width="1.4" /><text x="18" y="30" font-size="22" fill="#7154d9" font-weight="650">Text result temporarily</text><text x="18" y="58" font-size="22" fill="#7154d9" font-weight="650">hidden</text><text x="18" y="109" font-size="20" fill="#24384f" font-weight="400">Click the same button again →</text><text x="18" y="136" font-size="20" fill="#24384f" font-weight="400">return to the result</text></g></g><path d="M24 611 H416" stroke="#dce3ef"/><text x="24" y="638" font-size="17" fill="#536b83" font-weight="400">Instructional illustration</text></g></svg>