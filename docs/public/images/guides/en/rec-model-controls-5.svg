<svg xmlns="http://www.w3.org/2000/svg" width="440" height="590" viewBox="0 0 440 590" role="img" aria-labelledby="title desc"><title id="title">Local OCR controls: A switch is not GPU-use proof</title><desc id="desc">When acceleration is enabled, an available GPU can be used; otherwise recognition uses the CPU. If it misbehaves, disable the option and try a fresh CPU recognition task.</desc><rect width="440" height="590" rx="16" fill="#f5f7fc"/><g font-family="system-ui,-apple-system,PingFang SC,Microsoft YaHei,sans-serif"><text x="24" y="35" font-size="23" fill="#24384f" font-weight="700">Local OCR controls</text><text x="24" y="70" font-size="20" fill="#267cba" font-weight="600">A switch is not GPU-use proof</text><g transform="translate(0 111)"><g transform="translate(24 0)"><rect x="0" y="0" width="392" height="144" rx="11" fill="#fff" stroke="#d1dbE8" stroke-width="1.4" /><text x="18" y="30" font-size="22" fill="#7154d9" font-weight="650">OCR models &amp; performance</text><text x="18" y="78" font-size="18" fill="#536b83" font-weight="400">Hardware acceleration</text><rect x="18" y="91" width="59" height="30" rx="15" fill="#7154d9" stroke="#7154d9" stroke-width="1.4" /><circle cx="62" cy="106" r="11" fill="white"/><text x="93" y="114" font-size="20" fill="#24384f" font-weight="400">On</text></g><g transform="translate(24 161)"><rect x="0" y="0" width="392" height="202" rx="11" fill="#fff" stroke="#d1dbE8" stroke-width="1.4" /><text x="18" y="30" font-size="22" fill="#7154d9" font-weight="650">Actual processing path</text><text x="18" y="81" font-size="20" fill="#24384f" font-weight="400">Acceleration available → GPU</text><text x="18" y="116" font-size="20" fill="#24384f" font-weight="400">Acceleration unavailable → CPU</text><text x="18" y="151" font-size="20" fill="#24384f" font-weight="400">The enabled switch alone does</text><text x="18" y="178" font-size="20" fill="#24384f" font-weight="400">not identify the active path.</text></g></g><path d="M24 541 H416" stroke="#dce3ef"/><text x="24" y="568" font-size="17" fill="#536b83" font-weight="400">Instructional illustration</text></g></svg>