<svg xmlns="http://www.w3.org/2000/svg" width="440" height="830" viewBox="0 0 440 830" role="img" aria-labelledby="title desc"><title id="title">Image conversion controls: Settings Retry refreshes the list</title><desc id="desc">Open Image conversion settings from Settings in the property bar. If the list fails to load, check the connection and Retry in this window. Choose an available vision model and OK; Cancel discards the choice.</desc><rect width="440" height="830" rx="16" fill="#f5f7fc"/><g font-family="system-ui,-apple-system,PingFang SC,Microsoft YaHei,sans-serif"><text x="24" y="35" font-size="23" fill="#24384f" font-weight="700">Image conversion controls</text><text x="24" y="70" font-size="20" fill="#267cba" font-weight="600">Settings Retry refreshes the list</text><g transform="translate(0 111)"><g transform="translate(24 0)"><rect x="0" y="0" width="392" height="271" rx="11" fill="#fff" stroke="#d1dbE8" stroke-width="1.4" /><text x="18" y="30" font-size="22" fill="#7154d9" font-weight="650">Image conversion settings</text><rect x="260" y="63" width="114" height="36" rx="8" fill="#f1edfb" stroke="#bdb0ea" stroke-width="1.4" /><text x="273" y="88" font-size="20" fill="#7154d9" font-weight="600">Retry</text><text x="18" y="125" font-size="18" fill="#536b83" font-weight="400">Vision model</text><rect x="18" y="133" width="356" height="68" rx="6" fill="#fff" stroke="#c8d3e6" stroke-width="1.4" /><text x="30" y="161" font-size="20" fill="#24384f" font-weight="400">Choose from the available</text><text x="30" y="187" font-size="20" fill="#24384f" font-weight="400">list</text><rect x="18" y="210" width="84" height="39" rx="8" fill="#f1edfb" stroke="#bdb0ea" stroke-width="1.4" /><text x="32" y="237" font-size="20" fill="#7154d9" font-weight="600">OK</text><rect x="114" y="210" width="94" height="39" rx="8" fill="#f1edfb" stroke="#bdb0ea" stroke-width="1.4" /><text x="128" y="237" font-size="20" fill="#7154d9" font-weight="600">Cancel</text></g><g transform="translate(24 288)"><rect x="0" y="0" width="392" height="159" rx="11" fill="#fff" stroke="#d1dbE8" stroke-width="1.4" /><text x="18" y="30" font-size="22" fill="#7154d9" font-weight="650">Model sources</text><text x="18" y="81" font-size="20" fill="#24384f" font-weight="400">Available Snow Shot vision</text><text x="18" y="108" font-size="20" fill="#24384f" font-weight="400">models or image-capable custom</text><text x="18" y="135" font-size="20" fill="#24384f" font-weight="400">models.</text></g></g><path d="M24 781 H416" stroke="#dce3ef"/><text x="24" y="808" font-size="17" fill="#536b83" font-weight="400">Instructional illustration</text></g></svg>