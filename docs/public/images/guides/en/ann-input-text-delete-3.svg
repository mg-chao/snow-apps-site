<svg xmlns="http://www.w3.org/2000/svg" width="440" height="660" viewBox="0 0 440 660" role="img" aria-labelledby="title desc"><title id="title">Delete depends on a setting: Setting off: remove the text object</title><desc id="desc">With the same input but the setting off, Delete removes the entire text object and ends input; the purple box stays</desc><rect width="440" height="660" rx="15" fill="#f4f7fc"/><g font-family="system-ui,-apple-system,PingFang SC,Microsoft YaHei,sans-serif"><text x="24" y="34" font-size="23" fill="#263b51" font-weight="700" >Delete depends on a setting</text><text x="24" y="70" font-size="20" fill="#287dbc" font-weight="600" >Setting off: remove the text</text><text x="24" y="97" font-size="20" fill="#287dbc" font-weight="600" >object</text><g transform="translate(24 142)"><rect x="0" y="0" width="392" height="430" rx="11" fill="white" stroke="#d0dbe7" stroke-width="1.5" /><text x="18" y="31" font-size="21" fill="#7654d6" font-weight="600" >Delete text after the cursor</text><rect x="18" y="65" width="57" height="28" rx="14" fill="#8a9bab" stroke="none" stroke-width="1.5" /><circle cx="32" cy="79" r="10" fill="white" stroke="white" stroke-width="2" /><text x="90" y="87" font-size="19" fill="#263b51" font-weight="400" >Off</text><g transform="translate(18 107)"><rect x="0" y="0" width="356" height="240" rx="6" fill="#fafcfe" stroke="#c6d5e4" stroke-width="1.5" /><rect x="244" y="35" width="70" height="45" rx="4" fill="none" stroke="#7654d6" stroke-width="1.5" /><text x="203" y="108" font-size="17" fill="#7654d6" font-weight="400" >Completed box</text><text x="25" y="184" font-size="21" fill="#d44f58" font-weight="600" >Whole text object removed</text></g><text x="18" y="382" font-size="19" fill="#263b51" font-weight="400" >The text object and caret</text><text x="18" y="408" font-size="19" fill="#263b51" font-weight="400" >disappear.</text></g><path d="M24 612 H416" stroke="#d9e2ed"/><text x="24" y="638" font-size="17" fill="#587087" font-weight="400" >Instructional illustration</text></g></svg>