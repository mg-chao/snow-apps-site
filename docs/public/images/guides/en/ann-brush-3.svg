<svg xmlns="http://www.w3.org/2000/svg" width="820" height="440" viewBox="0 0 820 440" role="img" aria-labelledby="title desc"><title id="title">Brush and pressure-sensitive strokes: Release, select and edit</title><desc id="desc">Step 3: Release, select and edit</desc><rect width="820" height="440" rx="16" fill="#f3f7fc" /><rect x="22" y="75" width="500" height="330" rx="10" fill="#fff" stroke="#d2deeb" /><rect x="540" y="75" width="260" height="330" rx="10" fill="#fff" stroke="#d2deeb" /><text x="25" y="39" font-size="25" fill="#26384c" font-weight="bold">Brush and pressure-sensitive strokes</text><text x="25" y="63" font-size="17" fill="#546c84" font-weight="normal">3 / 3  Release, select and edit</text><path d="M80 230 Q120 135 175 205 T280 205 Q320 130 365 215 L430 170" stroke="#347ec7" stroke-width="7" fill="none" stroke-linejoin="round" stroke-linecap="round" /><text x="80" y="320" font-size="22" fill="#26384c" font-weight="normal">Press → move continuously → release</text><rect x="65" y="135" width="385" height="115" rx="0" fill="none" stroke="#347ec7" stroke-dasharray="5 5" /><rect x="61" y="131" width="8" height="8" rx="1" fill="white" stroke="#347ec7" /><rect x="446" y="131" width="8" height="8" rx="1" fill="white" stroke="#347ec7" /><rect x="61" y="246" width="8" height="8" rx="1" fill="white" stroke="#347ec7" /><rect x="446" y="246" width="8" height="8" rx="1" fill="white" stroke="#347ec7" /><text x="80" y="115" font-size="19" fill="#26384c" font-weight="normal">One stroke is one editable object</text><text x="555" y="116" font-size="21" fill="#26384c" font-weight="bold">Key steps</text><text x="555" y="165" font-size="17" fill="#26384c" font-weight="normal">Press to start a stroke</text><text x="555" y="215" font-size="15.16" fill="#26384c" font-weight="normal">Keep holding and move the pointer</text><text x="555" y="265" font-size="17" fill="#26384c" font-weight="normal">Release, then select to edit</text><text x="555" y="355" font-size="17" fill="#54