<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="900" height="470" viewBox="0 0 900 470" role="img" aria-labelledby="title desc">
<title id="title">Know the scope of each shortcut</title><desc id="desc">Configure → Enter keys → OK → Check state → Test action.</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#1677ff" /></marker></defs>
<rect width="900" height="470" rx="20" fill="#fff" />
<g font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif"><text x="30" y="47" font-size="30" fill="#163963" font-weight="700">Know the scope of each shortcut</text><text x="30" y="79" font-size="18" fill="#62758e" font-weight="400">Instructional illustration</text><rect x="30" y="112" width="263" height="265" rx="16" fill="#f2f6fc" stroke="#cbd8e9" stroke-width="2" /><circle cx="58" cy="142" r="20" fill="#1677ff" /><text x="51" y="150" font-size="24" fill="white" font-weight="700">1</text><text x="88" y="151" font-size="24" fill="#163963" font-weight="600">Global shortcuts</text><rect x="318" y="112" width="263" height="265" rx="16" fill="#f2f6fc" stroke="#cbd8e9" stroke-width="2" /><circle cx="346" cy="142" r="20" fill="#1677ff" /><text x="339" y="150" font-size="24" fill="white" font-weight="700">2</text><text x="376" y="151" font-size="18.91" fill="#163963" font-weight="600">Application shortcuts</text><rect x="606" y="112" width="263" height="265" rx="16" fill="#f2f6fc" stroke="#cbd8e9" stroke-width="2" /><circle cx="634" cy="142" r="20" fill="#1677ff" /><text x="627" y="150" font-size="24" fill="white" font-weight="700">3</text><text x="664" y="151" font-size="24" fill="#163963" font-weight="600">Global mouse</text><text x="52" y="208" font-size="24" fill="#24344d" font-weight="400">Other apps in front</text><rect x="54" y="239" width="210" height="53" rx="8" fill="#fff" stroke="#9fc2ee" stroke-width="2" /><text x="74" y="274" font-size="16.11" fill="#24344d" font-weight="400">Key combination → Task</text><text x="52" y="344" font-size="24" fill="#24344d" font-weight="400">Check registration</text><text x="341" y="208" font-size="24" fill="#24344d" font-weight="400">Within current tool</text><rect x="342" y="239" width="210" height="53" rx="8" fill="#fff" stroke="#9fc2ee" stroke-width="2" /><text x="360" y="274" font-size="23" fill="#24344d" font-weight="400">Key → Action</text><text x="341" y="344" font-size="22.37" fill="#24344d" font-weight="400">Check focus and state</text><text x="628" y="208" font-size="24" fill="#24344d" font-weight="400">Hold activation keys</text><path d="M645 256L810 302" stroke="#1677ff" stroke-width="4" marker-end="url(#a)" fill="none" /><text x="628" y="344" font-size="19.64" fill="#24344d" font-weight="400">Drag with assigned button</text><text x="30" y="444" font-size="20" fill="#52647e" font-weight="400">Configure → Enter keys → OK → Check state → Test action.</text></g></svg>