<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" role="img" aria-labelledby="title desc"><title id="title">Compare rotation with horizontal flipping</title><desc id="desc">Rotation changes orientation; flipping mirrors text too.</desc><rect width="960" height="560" rx="22" fill="#f5f7fc" /><g font-family="system-ui,-apple-system,PingFang SC,Microsoft YaHei,sans-serif"><text x="35" y="50" font-size="29" fill="#1e293b" font-weight="700">Compare rotation with horizontal flipping</text><text x="35" y="86" font-size="20" fill="#53627d" font-weight="400">Rotation changes orientation; flipping mirrors text too.</text><rect x="37" y="134" width="545" height="325" rx="12" fill="#fff" stroke="#c8d3e6" stroke-width="2" /><rect x="56" y="151" width="222" height="38" rx="19" fill="#ede9fe" stroke="#ede9fe" stroke-width="2" /><text x="70" y="177" font-size="20" fill="#6146bd" font-weight="600">One preview cell</text><g transform="rotate(90 178.5 302.0)"><rect x="91" y="227" width="175" height="150" rx="0" fill="#e6e0fa" stroke="#7654c9" stroke-width="2" /><text x="109" y="282" font-size="44" fill="#6146bd" font-weight="700">F</text><path d="M134.75 329.0 L225.75 329.0" fill="none" stroke="#6146bd" stroke-width="6" /><path d="M211.75 312.5 L231.0 329.0 L211.75 345.5" fill="none" stroke="#6146bd" stroke-width="6" /></g><g transform="translate(847 0) scale(-1 1)"><rect x="336" y="227" width="175" height="150" rx="0" fill="#e6e0fa" stroke="#7654c9" stroke-width="2" /><text x="354" y="282" font-size="44" fill="#6146bd" font-weight="700">F</text><path d="M379.75 329.0 L470.75 329.0" fill="none" stroke="#6146bd" stroke-width="6" /><path d="M456.75 312.5 L476.0 329.0 L456.75 345.5" fill="none" stroke="#6146bd" stroke-width="6" /></g><text x="103" y="431" font-size="22" fill="#1e293b" font-weight="400">90° clockwise</text><text x="342" y="431" font-size="22" fill="#1e293b" font-weight="400">Flip horizontally</text><rect x="609" y="134" width="315" height="325" rx="12" fill="#fff" stroke="#c8d3e6" stroke-width="2" /><rect x="628" y="152" width="265" height="38" rx="19" fill="#ede9fe" stroke="#ede9fe" stroke-width="2" /><text x="642" y="178" font-size="20" fill="#6146bd" font-weight="600">Compare separately</text><text x="634" y="265" font-size="25" fill="#6146bd" font-weight="400">Avoid mirrored text</text><text x="634" y="409" font-size="19.69" fill="#53627d" font-weight="400">Reset transforms to start again</text><path d="M35 511 L925 511" fill="none" stroke="#dbe3ef" stroke-width="1" /><text x="35" y="539" font-size="18" fill="#53627d" font-weight="400">Snow Shot · Instructional illustration</text></g></svg>