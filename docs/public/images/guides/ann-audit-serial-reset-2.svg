<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="760" height="430" viewBox="0 0 760 430" role="img" aria-labelledby="title desc" font-family="system-ui,sans-serif"><title id="title">空白处右键重置下一次序号：在真正空白处右键</title><desc id="desc">操作示意。保持序号工具，在没有对象的空白处右键；后续起始值重置为1，旧数字不变。</desc><rect width="760" height="430" rx="12" fill="#f3f7fc" /><text x="24" y="34" font-size="25" fill="#24384f">空白处右键重置下一次序号</text><text x="24" y="63" font-size="18" fill="#536c86">在真正空白处右键</text><rect x="18" y="80" width="724" height="260" rx="7" fill="white" stroke="#b9cce0" /><circle cx="130" cy="170" r="25" fill="#2877bd" stroke="#2877bd" stroke-width="2" /><text x="122" y="179" font-size="25" fill="white">1</text><circle cx="310" cy="170" r="25" fill="#2877bd" stroke="#2877bd" stroke-width="2" /><text x="302" y="179" font-size="25" fill="white">2</text><circle cx="490" cy="170" r="25" fill="#2877bd" stroke="#2877bd" stroke-width="2" /><text x="482" y="179" font-size="25" fill="white">3</text><rect x="45" y="101" width="105" height="33" rx="5" fill="#e2effb" stroke="#2877bd" /><text x="57" y="124" font-size="18" fill="#2877bd">当前：序号</text><circle cx="600" cy="280" r="15" fill="none" stroke="#d84d53" stroke-width="2" /><rect x="540" y="238" width="105" height="33" rx="5" fill="#e2effb" stroke="#2877bd" /><text x="552" y="261" font-size="18" fill="#2877bd">空白处右键</text><text x="185" y="305" font-size="23" fill="#d84d53">下一次：1</text><text x="26" y="364" font-size="18" fill="#24384f">保持序号工具，在没有对象的空白处右键；后续起始值重置为1，旧数字不变。</text><text x="24" y="416" font-size="15" fill="#536c86">操作示意</text></svg>