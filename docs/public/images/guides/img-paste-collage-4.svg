<svg xmlns="http://www.w3.org/2000/svg" width="600" height="720" viewBox="0 0 600 720" role="img"><title>PDF 追加保留已有变换</title><desc>两图 PDF 模板中，粘贴把 B 加入下一个格子；已有 A 的旋转和位置保持。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#487bd0"/></marker></defs><rect width="600" height="720" rx="20" fill="#f4f7fc"/><g font-family="Arial,PingFang SC,Microsoft YaHei,sans-serif"><text x="24" y="43" font-size="25" fill="#203858" font-weight="700" text-anchor="start">PDF 追加保留已有变换</text><rect x="24" y="98" width="552" height="398" rx="12" fill="#fff" stroke="#c7d4e7" stroke-width="2"/><text x="44" y="132" font-size="21" fill="#233a5b" font-weight="400" text-anchor="start">PDF：两图模板</text><text x="149" y="170" font-size="21" fill="#233a5b" font-weight="400" text-anchor="middle">追加前</text><rect x="46" y="188" width="210" height="262" rx="3" fill="#fff" stroke="#9fb1cb" stroke-width="2"/><rect x="59" y="200" width="184" height="112" rx="3" fill="#f9fbff" stroke="#cbd7e7" stroke-width="2"/><rect x="59" y="326" width="184" height="112" rx="3" fill="#f9fbff" stroke="#cbd7e7" stroke-width="2"/><rect x="80" y="221" width="130" height="69" rx="7" fill="#f3d0d7" stroke="#8fa7c8" stroke-width="2"/><g transform="translate(145.0 255.5) rotate(90)"><text x="-22" y="9" font-size="36" fill="#345075" font-weight="700" text-anchor="start">F</text><path d="M19 20L19 -25" stroke="#487bd0" stroke-width="4" marker-end="url(#arrow)"/></g><text x="439" y="170" font-size="21" fill="#233a5b" font-weight="400" text-anchor="middle">追加后</text><rect x="336" y="188" width="210" height="262" rx="3" fill="#fff" stroke="#9fb1cb" stroke-width="2"/><rect x="349" y="200" width="184" height="112" rx="3" fill="#f9fbff" stroke="#cbd7e7" stroke-width="2"/><rect x="349" y="326" width="184" height="112" rx="3" fill="#f9fbff" stroke="#cbd7e7" stroke-width="2"/><rect x="370" y="221" width="130" height="69" rx="7" fill="#f3d0d7" stroke="#8fa7c8" stroke-width="2"/><g transform="translate(435.0 255.5) rotate(90)"><text x="-22" y="9" font-size="36" fill="#345075" font-weight="700" text-anchor="start">F</text><path d="M19 20L19 -25" stroke="#487bd0" stroke-width="4" marker-end="url(#arrow)"/></g><rect x="371" y="345" width="140" height="75" rx="7" fill="#c5dbf3" stroke="#8fa7c8" stroke-width="2"/><text x="441.0" y="394.5" font-size="32" fill="#345075" font-weight="600" text-anchor="middle">B</text><text x="48" y="480" font-size="20" fill="#233a5b" font-weight="400" text-anchor="start">A 的旋转与位置均保留</text><rect x="24" y="516" width="552" height="144" rx="12" fill="#fff" stroke="#d2dced" stroke-width="2"/><text x="44" y="548" font-size="21" fill="#233a5b" font-weight="400" text-anchor="start">两图 PDF 模板中，粘贴把 B 加入下一个格子；已有</text><text x="44" y="578" font-size="21" fill="#233a5b" font-weight="400" text-anchor="start"> A 的旋转和位置保持。</text><text x="24" y="694" font-size="19" fill="#5a6c86" font-weight="400" text-anchor="start">操作示意</text><text x="548" y="694" font-size="19" fill="#5a6c86" font-weight="400" text-anchor="end">4/4</text></g></svg>
