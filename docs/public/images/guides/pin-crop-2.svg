<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" role="img" aria-labelledby="title desc"><title id="title">按住右键拖出保留范围</title><desc id="desc">松开前可以按 Esc 取消；松开后窗口显示范围会收窄。。操作示意。</desc><rect width="960" height="560" rx="24" fill="#f5f7fc" /><g font-family="system-ui,-apple-system,PingFang SC,Microsoft YaHei,sans-serif"><text x="36" y="52" font-size="30" fill="#18233b" font-weight="700">按住右键拖出保留范围</text><text x="36" y="88" font-size="20" fill="#53627d" font-weight="400">松开前可以按 Esc 取消；松开后窗口显示范围会收窄。</text><rect x="69" y="142" width="534" height="313" rx="16" fill="#eaf0fa" stroke="#c8d3e6" stroke-width="2" /><rect x="101" y="174" width="183" height="245" rx="16" fill="#dce5f7" stroke="#c8d3e6" stroke-width="2" /><text x="122" y="227" font-size="25" fill="#18233b" font-weight="400">旁边说明</text><rect x="310" y="174" width="260" height="245" rx="16" fill="#fff" stroke="#c8d3e6" stroke-width="2" /><text x="335" y="227" font-size="26" fill="#18233b" font-weight="600">目标参考内容</text><text x="335" y="290" font-size="26" fill="#18233b" font-weight="400">保留这一块</text><text x="335" y="350" font-size="24" fill="#18233b" font-weight="400">核对边界与文字</text><rect x="642" y="142" width="261" height="313" rx="16" fill="#ffffff" stroke="#c8d3e6" stroke-width="2" /><rect x="662" y="164" width="195" height="38" rx="19" fill="#ede9fe" stroke="#ede9fe" stroke-width="2" /><text x="676" y="190" font-size="20" fill="#5941bd" font-weight="600">右键拖动</text><text x="664" y="274" font-size="24" fill="#6954d9" font-weight="400">收窄可见范围</text><text x="662" y="407" font-size="23" fill="#53627d" font-weight="400">操作 2 / 3</text><rect x="310" y="174" width="260" height="245" rx="0" fill="none" stroke="#6954d9" stroke-width="2" /><path d="M326 191 L552 399" fill="none" stroke="#6954d9" stroke-width="4" stroke-dasharray="10 7" /><path d="M36 510 L924 510" fill="none" stroke="#dce3ef" stroke-width="1" /><text x="36" y="539" font-size="18" fill="#53627d" font-weight="400">Snow Shot · 操作示意</text></g></svg>