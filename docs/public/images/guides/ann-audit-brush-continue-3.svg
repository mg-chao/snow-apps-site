<svg xmlns="http://www.w3.org/2000/svg" width="760" height="430" viewBox="0 0 760 430" role="img" aria-labelledby="title desc" font-family="system-ui,sans-serif"><title id="title">从笔画端点继续画：松开并检查对象</title><desc id="desc">操作示意。松开后续画合入原笔画；选中可看到它作为一个对象，而不是独立的新笔画。</desc><rect width="760" height="430" rx="12" fill="#f3f7fc" /><text x="24" y="34" font-size="25" fill="#24384f">从笔画端点继续画</text><text x="24" y="63" font-size="18" fill="#536c86">松开并检查对象</text><rect x="18" y="80" width="724" height="260" rx="7" fill="white" stroke="#b9cce0" /><path d="M80 245 Q165 125 280 225" stroke="#2877bd" stroke-width="7" fill="none" stroke-linecap="round" stroke-linejoin="round" /><circle cx="280" cy="225" r="11" fill="none" stroke="#d84d53" stroke-width="2" /><path d="M280 225 Q365 315 470 175 T645 190" stroke="#2877bd" stroke-width="7" fill="none" stroke-linecap="round" stroke-linejoin="round" /><rect x="60" y="130" width="610" height="168" rx="0" fill="none" stroke="#2877bd" stroke-dasharray="5 5" /><rect x="56" y="126" width="8" height="8" rx="1" fill="white" stroke="#2877bd" /><rect x="666" y="126" width="8" height="8" rx="1" fill="white" stroke="#2877bd" /><rect x="56" y="294" width="8" height="8" rx="1" fill="white" stroke="#2877bd" /><rect x="666" y="294" width="8" height="8" rx="1" fill="white" stroke="#2877bd" /><text x="385" y="318" font-size="20" fill="#24384f">同一个笔画对象</text><text x="26" y="364" font-size="18" fill="#24384f">松开后续画合入原笔画；选中可看到它作为一个对象，而不是独立的新笔画。</text><text x="24" y="416" font-size="15" fill="#536c86">操作示意</text></svg>