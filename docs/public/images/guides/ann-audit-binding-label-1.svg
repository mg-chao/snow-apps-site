<svg xmlns="http://www.w3.org/2000/svg" width="760" height="430" viewBox="0 0 760 430" role="img" aria-labelledby="title desc" font-family="system-ui,sans-serif"><title id="title">连线绑定图形与随附文字：在图形边缘连接</title><desc id="desc">操作示意。画箭头时将端点靠近图形边缘，按吸附预览确认连接。</desc><rect width="760" height="430" rx="12" fill="#f3f7fc" /><text x="24" y="34" font-size="25" fill="#24384f">连线绑定图形与随附文字</text><text x="24" y="63" font-size="18" fill="#536c86">在图形边缘连接</text><rect x="18" y="80" width="724" height="260" rx="7" fill="white" stroke="#b9cce0" /><rect x="65" y="190" width="155" height="74" rx="7" fill="#e8f2fc" stroke="#2877bd" /><text x="92" y="235" font-size="22" fill="#24384f">来源图形</text><rect x="525" y="155" width="155" height="74" rx="7" fill="#e8f2fc" stroke="#2877bd" /><text x="553" y="200" font-size="22" fill="#24384f">目标图形</text><path d="M224 227 L520 192" stroke="#2877bd" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round" /><path d="M507.37846801974064 187.45061207729088 L520 192 L508.78757047367714 199.367592830582" stroke="#2877bd" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round" /><circle cx="224" cy="227" r="6" fill="white" stroke="#2877bd" stroke-width="2" /><circle cx="520" cy="192" r="6" fill="white" stroke="#2877bd" stroke-width="2" /><text x="26" y="364" font-size="18" fill="#24384f">画箭头时将端点靠近图形边缘，按吸附预览确认连接。</text><text x="24" y="416" font-size="15" fill="#536c86">操作示意</text></svg>