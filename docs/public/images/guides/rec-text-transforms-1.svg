<svg xmlns="http://www.w3.org/2000/svg" width="440" height="580" viewBox="0 0 440 580" role="img" aria-labelledby="title desc"><title id="title">整理整段文字，再恢复: 移除换行作用于整段</title><desc id="desc">原始示例是两行Snow，和Shot！。即使只选了局部文字，属性栏移除换行仍整理整段，结果不会自动补入空格。</desc><rect width="440" height="580" rx="16" fill="#f5f7fc"/><g font-family="system-ui,-apple-system,PingFang SC,Microsoft YaHei,sans-serif"><text x="24" y="35" font-size="23" fill="#24384f" font-weight="700">整理整段文字，再恢复</text><text x="24" y="70" font-size="20" fill="#267cba" font-weight="600">移除换行作用于整段</text><g transform="translate(0 111)"><g transform="translate(24 0)"><rect x="0" y="0" width="392" height="159" rx="11" fill="#fff" stroke="#d1dbE8" stroke-width="1.4" /><text x="18" y="30" font-size="22" fill="#7154d9" font-weight="650">原始识别文字</text><rect x="18" y="63" width="356" height="76" rx="6" fill="#f5f7fb" stroke="none" stroke-width="1.4" /><text x="29" y="93" font-size="20" fill="#24384f" font-weight="400">Snow，</text><text x="29" y="121" font-size="20" fill="#24384f" font-weight="400">Shot！</text></g><g transform="translate(24 176)"><rect x="0" y="0" width="392" height="131" rx="11" fill="#fff" stroke="#d1dbE8" stroke-width="1.4" /><text x="18" y="30" font-size="22" fill="#7154d9" font-weight="650">选择格式：移除换行</text><rect x="18" y="63" width="356" height="48" rx="6" fill="#f5f7fb" stroke="none" stroke-width="1.4" /><text x="29" y="93" font-size="20" fill="#24384f" font-weight="400">Snow，Shot！</text></g></g><path d="M24 531 H416" stroke="#dce3ef"/><text x="24" y="558" font-size="17" fill="#536b83" font-weight="400">操作示意</text></g></svg>