<svg xmlns="http://www.w3.org/2000/svg" width="760" height="430" viewBox="0 0 760 430" role="img" aria-labelledby="title desc" font-family="system-ui,sans-serif"><title id="title">在自由笔画中加入直线段：先画一段曲线</title><desc id="desc">操作示意。按住左键自由移动；当前轨迹按普通画笔方式记录。</desc><rect width="760" height="430" rx="12" fill="#f3f7fc" /><text x="24" y="34" font-size="25" fill="#24384f">在自由笔画中加入直线段</text><text x="24" y="63" font-size="18" fill="#536c86">先画一段曲线</text><rect x="18" y="80" width="724" height="260" rx="7" fill="white" stroke="#b9cce0" /><path d="M75 230 Q155 105 245 220" stroke="#2877bd" stroke-width="7" fill="none" stroke-linecap="round" stroke-linejoin="round" /><text x="26" y="364" font-size="18" fill="#24384f">按住左键自由移动；当前轨迹按普通画笔方式记录。</text><text x="24" y="416" font-size="15" fill="#536c86">操作示意</text></svg>