<svg xmlns="http://www.w3.org/2000/svg" width="600" height="720" viewBox="0 0 600 720" role="img"><title>确认后载入新图，重查切线</title><desc>确认替换，载入 200×160 新图。旧分割编辑和历史不保留，重新检查新图切线。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#487bd0"/></marker></defs><rect width="600" height="720" rx="20" fill="#f4f7fc"/><g font-family="Arial,PingFang SC,Microsoft YaHei,sans-serif"><text x="24" y="43" font-size="25" fill="#203858" font-weight="700" text-anchor="start">确认后载入新图，重查切线</text><rect x="24" y="98" width="552" height="398" rx="12" fill="#fff" stroke="#c7d4e7" stroke-width="2"/><text x="44" y="134" font-size="21" fill="#233a5b" font-weight="400" text-anchor="start">新输入 · 200×160 px</text><rect x="200" y="181" width="100.0" height="160" rx="7" fill="#c5dbf3" stroke="#8fa7c8" stroke-width="2"/><text x="250.0" y="273.0" font-size="32" fill="#345075" font-weight="600" text-anchor="middle">G</text><rect x="300.0" y="181" width="100.0" height="160" rx="7" fill="#f7e8b3" stroke="#8fa7c8" stroke-width="2"/><text x="350.0" y="273.0" font-size="32" fill="#345075" font-weight="600" text-anchor="middle">H</text><rect x="65" y="378" width="470" height="38" rx="7" fill="#ecf3fe" stroke="#9db8e0" stroke-width="2"/><text x="300.0" y="405" font-size="20" fill="#325a92" font-weight="600" text-anchor="middle">旧分割历史已重置</text><text x="44" y="461" font-size="21" fill="#233a5b" font-weight="400" text-anchor="start">重新检查新图的切线位置</text><rect x="24" y="516" width="552" height="144" rx="12" fill="#fff" stroke="#d2dced" stroke-width="2"/><text x="44" y="548" font-size="21" fill="#233a5b" font-weight="400" text-anchor="start">确认替换，载入 200×160 新图。旧分割编辑和历史</text><text x="44" y="578" font-size="21" fill="#233a5b" font-weight="400" text-anchor="start">不保留，重新检查新图切线。</text><text x="24" y="694" font-size="19" fill="#5a6c86" font-weight="400" text-anchor="start">操作示意</text><text x="548" y="694" font-size="19" fill="#5a6c86" font-weight="400" text-anchor="end">4/4</text></g></svg>
