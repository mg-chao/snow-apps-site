<svg xmlns="http://www.w3.org/2000/svg" width="820" height="440" viewBox="0 0 820 440" role="img" aria-labelledby="title desc"><title id="title">直线、曲线与多点线条：点击添加路径点</title><desc id="desc">操作示意。第 2 帧：点击添加路径点。</desc><rect width="820" height="440" rx="16" fill="#f3f7fc" /><rect x="22" y="75" width="500" height="330" rx="10" fill="#fff" stroke="#d2deeb" /><rect x="540" y="75" width="260" height="330" rx="10" fill="#fff" stroke="#d2deeb" /><text x="25" y="39" font-size="25" fill="#26384c" font-weight="bold">直线、曲线与多点线条</text><text x="25" y="63" font-size="17" fill="#546c84" font-weight="normal">2 / 3　点击添加路径点</text><path d="M90 270 L190 145 L290 250 L420 155" stroke="#347ec7" stroke-width="4" fill="none" stroke-linejoin="round" stroke-linecap="round" /><circle cx="90" cy="270" r="6" fill="white" stroke="#347ec7" stroke-width="2" /><circle cx="190" cy="145" r="6" fill="white" stroke="#347ec7" stroke-width="2" /><circle cx="290" cy="250" r="6" fill="white" stroke="#347ec7" stroke-width="2" /><circle cx="420" cy="155" r="6" fill="white" stroke="#347ec7" stroke-width="2" /><text x="555" y="116" font-size="21" fill="#26384c" font-weight="bold">操作要点</text><text x="555" y="165" font-size="17" fill="#26384c" font-weight="normal">按住拖动即成一条线</text><text x="555" y="215" font-size="17" fill="#26384c" font-weight="normal">单击续点，终点双击结束</text><text x="555" y="265" font-size="17" fill="#26384c" font-weight="normal">选中后拖动路径点</text><text x="555" y="355" font-size="17" fill="#546c84" font-weight="normal">按正文步骤操作</text><text x="555" y="385" font-size="16" fill="#546c84" font-weight="normal">操作示意</text></svg>