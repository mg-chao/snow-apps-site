<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" role="img" aria-labelledby="title desc"><title id="title">统一尺寸与原始尺寸：看相同素材如何变化</title><desc id="desc">保持纵向与图片顺序相同，只改变尺寸策略。原创操作示意。</desc><rect width="960" height="560" rx="22" fill="#f5f7fc" /><g font-family="system-ui,-apple-system,PingFang SC,Microsoft YaHei,sans-serif"><text x="35" y="50" font-size="29" fill="#1e293b" font-weight="700">统一尺寸与原始尺寸：看相同素材如何变化</text><text x="35" y="86" font-size="20" fill="#53627d" font-weight="400">保持纵向与图片顺序相同，只改变尺寸策略</text><rect x="36" y="130" width="275" height="348" rx="12" fill="#fff" stroke="#c8d3e6" stroke-width="2" /><rect x="53" y="146" width="194" height="38" rx="19" fill="#ede9fe" stroke="#ede9fe" stroke-width="2" /><text x="67" y="172" font-size="20" fill="#6146bd" font-weight="600">来源尺寸不同</text><rect x="74" y="205" width="150" height="100" rx="5" fill="#e7e0fa" stroke="#7654c9" stroke-width="2" /><text x="86" y="237" font-size="22" fill="#7654c9" font-weight="600">A</text><rect x="110" y="318" width="75" height="75" rx="5" fill="#dcefe9" stroke="#268471" stroke-width="2" /><text x="122" y="350" font-size="22" fill="#268471" font-weight="600">B</text><rect x="91" y="406" width="113" height="56" rx="5" fill="#fce8d7" stroke="#c26b2c" stroke-width="2" /><text x="103" y="438" font-size="22" fill="#c26b2c" font-weight="600">C</text><rect x="342" y="130" width="275" height="348" rx="12" fill="#fff" stroke="#c8d3e6" stroke-width="2" /><rect x="359" y="146" width="224" height="38" rx="19" fill="#ede9fe" stroke="#ede9fe" stroke-width="2" /><text x="373" y="172" font-size="20" fill="#6146bd" font-weight="600">纵向 · 统一尺寸</text><rect x="421" y="204" width="108" height="72" rx="5" fill="#e7e0fa" stroke="#7654c9" stroke-width="2" /><text x="433" y="236" font-size="22" fill="#7654c9" font-weight="600">A</text><rect x="421" y="286" width="108" height="108" rx="5" fill="#dcefe9" stroke="#268471" stroke-width="2" /><text x="433" y="318" font-size="22" fill="#268471" font-weight="600">B</text><rect x="421" y="404" width="108" height="54" rx="5" fill="#fce8d7" stroke="#c26b2c" stroke-width="2" /><text x="433" y="436" font-size="22" fill="#c26b2c" font-weight="600">C</text><rect x="648" y="130" width="276" height="348" rx="12" fill="#fff" stroke="#c8d3e6" stroke-width="2" /><rect x="665" y="146" width="224" height="38" rx="19" fill="#ede9fe" stroke="#ede9fe" stroke-width="2" /><text x="679" y="172" font-size="20" fill="#6146bd" font-weight="600">纵向 · 原始尺寸</text><rect x="731" y="204" width="108" height="72" rx="5" fill="#e7e0fa" stroke="#7654c9" stroke-width="2" /><text x="743" y="236" font-size="22" fill="#7654c9" font-weight="600">A</text><rect x="758" y="286" width="54" height="54" rx="5" fill="#dcefe9" stroke="#268471" stroke-width="2" /><text x="770" y="318" font-size="22" fill="#268471" font-weight="600">B</text><rect x="744" y="350" width="81" height="41" rx="5" fill="#fce8d7" stroke="#c26b2c" stroke-width="2" /><text x="756" y="382" font-size="22" fill="#c26b2c" font-weight="600">C</text><text x="39" y="502" font-size="20" fill="#53627d" font-weight="400">统一尺寸：各图按首图宽度等比缩放。原始尺寸：保留各图大小，较窄图片居中。</text><path d="M35 511 L925 511" fill="none" stroke="#dbe3ef" stroke-width="1" /><text x="35" y="539" font-size="18" fill="#53627d" font-weight="400">Snow Shot · 操作示意</text></g></svg>