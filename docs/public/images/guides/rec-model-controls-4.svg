<svg xmlns="http://www.w3.org/2000/svg" width="440" height="590" viewBox="0 0 440 590" role="img" aria-labelledby="title desc"><title id="title">本地文字识别设置: 开启常驻后再开热启动</title><desc id="desc">先开启常驻识别进程，模型热启动才可操作。开启热启动会预加载所选模型并增加内存占用；不需要时关闭热启动或常驻。</desc><rect width="440" height="590" rx="16" fill="#f5f7fc"/><g font-family="system-ui,-apple-system,PingFang SC,Microsoft YaHei,sans-serif"><text x="24" y="35" font-size="23" fill="#24384f" font-weight="700">本地文字识别设置</text><text x="24" y="70" font-size="20" fill="#267cba" font-weight="600">开启常驻后再开热启动</text><g transform="translate(0 111)"><g transform="translate(24 0)"><rect x="0" y="0" width="392" height="218" rx="11" fill="#fff" stroke="#d1dbE8" stroke-width="1.4" /><text x="18" y="30" font-size="22" fill="#7154d9" font-weight="650">按顺序设置</text><text x="18" y="78" font-size="18" fill="#536b83" font-weight="400">常驻识别进程</text><rect x="18" y="91" width="59" height="30" rx="15" fill="#7154d9" stroke="#7154d9" stroke-width="1.4" /><circle cx="62" cy="106" r="11" fill="white"/><text x="93" y="114" font-size="20" fill="#24384f" font-weight="400">开启</text><text x="18" y="152" font-size="18" fill="#536b83" font-weight="400">模型热启动</text><rect x="18" y="165" width="59" height="30" rx="15" fill="#7154d9" stroke="#7154d9" stroke-width="1.4" /><circle cx="62" cy="180" r="11" fill="white"/><text x="93" y="188" font-size="20" fill="#24384f" font-weight="400">开启</text></g><g transform="translate(24 235)"><rect x="0" y="0" width="392" height="105" rx="11" fill="#fff" stroke="#d1dbE8" stroke-width="1.4" /><text x="18" y="30" font-size="22" fill="#7154d9" font-weight="650">再比较新识别任务</text><text x="18" y="81" font-size="20" fill="#24384f" font-weight="400">比较首次与后续等待，同时观察内存。</text></g></g><path d="M24 541 H416" stroke="#dce3ef"/><text x="24" y="568" font-size="17" fill="#536b83" font-weight="400">操作示意</text></g></svg>