<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="760" height="430" viewBox="0 0 760 430" role="img" aria-labelledby="title desc" font-family="system-ui,sans-serif"><title id="title">普通与压感笔画的差异：同类轨迹，比较粗细变化</title><desc id="desc">操作示意。此图只示意模式区别，不对应固定压力值；鼠标模式可模拟粗细，有压力设备可使用原生压力。</desc><rect width="760" height="430" rx="12" fill="#f3f7fc" /><text x="24" y="34" font-size="25" fill="#24384f">普通与压感笔画的差异</text><text x="24" y="63" font-size="18" fill="#536c86">同类轨迹，比较粗细变化</text><rect x="18" y="80" width="724" height="260" rx="7" fill="white" stroke="#b9cce0" /><text x="45" y="125" font-size="22" fill="#24384f">普通画笔：较一致的宽度</text><path d="M70 180 Q150 105 225 180 T385 180 T560 180" stroke="#2877bd" stroke-width="7" fill="none" stroke-linecap="round" stroke-linejoin="round" /><text x="45" y="238" font-size="22" fill="#24384f">压感画笔：粗细随输入变化</text><path d="M70 285 Q145 218 225 280 Q300 340 385 280 Q470 218 560 280 Q470 230 385 294 Q300 355 225 293 Q145 230 70 285 Z" stroke="#2877bd" stroke-width="1" fill="#2877bd" stroke-linecap="round" stroke-linejoin="round" /><text x="26" y="364" font-size="18" fill="#24384f">此图只示意模式区别，不对应固定压力值；鼠标模式可模拟粗细，有压力设备可使</text><text x="26" y="389" font-size="18" fill="#24384f">用原生压力。</text><text x="24" y="416" font-size="15" fill="#536c86">操作示意</text></svg>