<svg xmlns="http://www.w3.org/2000/svg" width="820" height="440" viewBox="0 0 820 440" role="img" aria-labelledby="title desc"><title id="title">全屏画布与激光笔：开启穿透操作下方应用</title><desc id="desc">操作示意。第 2 帧：开启穿透操作下方应用。</desc><rect width="820" height="440" rx="16" fill="#f3f7fc" /><rect x="22" y="75" width="500" height="330" rx="10" fill="#fff" stroke="#d2deeb" /><rect x="540" y="75" width="260" height="330" rx="10" fill="#fff" stroke="#d2deeb" /><text x="25" y="39" font-size="25" fill="#26384c" font-weight="bold">全屏画布与激光笔</text><text x="25" y="63" font-size="17" fill="#546c84" font-weight="normal">2 / 3　开启穿透操作下方应用</text><rect x="65" y="115" width="430" height="220" rx="6" fill="#eaf0f6" stroke="#8da7bf" /><text x="85" y="148" font-size="20" fill="#26384c" font-weight="normal">正在演示的应用窗口</text><rect x="85" y="180" width="335" height="8" rx="4" fill="#c6d4e2" stroke="#c6d4e2" /><rect x="85" y="210" width="285" height="8" rx="4" fill="#c6d4e2" stroke="#c6d4e2" /><rect x="85" y="240" width="320" height="8" rx="4" fill="#c6d4e2" stroke="#c6d4e2" /><rect x="85" y="270" width="230" height="8" rx="4" fill="#c6d4e2" stroke="#c6d4e2" /><rect x="370" y="270" width="100" height="38" rx="6" fill="#d4e9fc" stroke="#347ec7" /><text x="385" y="296" font-size="18" fill="#26384c" font-weight="normal">下一页</text><line x1="335" y1="290" x2="365" y2="290" stroke="#e34f52" stroke-width="3" /><path d="M355 284 L365 290 L355 296" stroke="#e34f52" stroke-width="3" fill="none" stroke-linejoin="round" stroke-linecap="round" /><text x="80" y="365" font-size="18" fill="#26384c" font-weight="normal">穿透开启：点击交给下方应用</text><text x="555" y="116" font-size="21" fill="#26384c" font-weight="bold">操作要点</text><text x="555" y="165" font-size="17" fill="#26384c" font-weight="normal">绘图层覆盖在应用上方</text><text x="555" y="215" font-size="17" fill="#26384c" font-weight="normal">穿透与画写是两种状态</text><text x="555" y="265" font-size="17" fill="#26384c" font-weight="normal">激光笔用于临时引导注意</text><text x="555" y="355" font-size="17" fill="#546c84" font-weight="normal">按正文步骤操作</text><text x="555" y="385" font-size="16" fill="#546c84" font-weight="normal">操作示意</text></svg>