<svg xmlns="http://www.w3.org/2000/svg" width="960" height="480" viewBox="0 0 960 480" role="img" aria-labelledby="title"><title id="title">紧凑布局：调整区域间距（操作示意）</title><g font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif"><rect x="1" y="1" width="958" height="478" rx="12" fill="#f6f7fc" stroke="#cbd4e4" stroke-width="2" /><text x="30" y="43" font-size="28" fill="#263148">紧凑布局：调整区域间距</text><text x="30" y="460" font-size="18" fill="#536078">操作示意</text><rect x="30" y="80" width="900" height="330" rx="12" fill="#fff" stroke="#cbd4e4" stroke-width="2" /><text x="60" y="125" font-size="26" fill="#263148">紧凑布局：把多个区域靠拢排列</text><rect x="180" y="170" width="260" height="160" rx="0" fill="#ede8fb" stroke="#7652dc" stroke-width="2" /><text x="205" y="220" font-size="32" fill="#263148">A</text><rect x="460" y="170" width="260" height="160" rx="0" fill="#ede8fb" stroke="#7652dc" stroke-width="2" /><text x="485" y="220" font-size="32" fill="#263148">B</text><text x="180" y="380" font-size="24" fill="#263148">区域间距可调；复制前检查合成结果</text></g></svg>