<svg xmlns="http://www.w3.org/2000/svg" width="760" height="430" viewBox="0 0 760 430" role="img" aria-labelledby="title desc" font-family="system-ui,sans-serif"><title id="title">在自由笔画中加入直线段：松开 Shift 继续画</title><desc id="desc">操作示意。松开Shift再继续自由移动，最后抬起鼠标；曲线和直边属于同一笔画。</desc><rect width="760" height="430" rx="12" fill="#f3f7fc" /><text x="24" y="34" font-size="25" fill="#24384f">在自由笔画中加入直线段</text><text x="24" y="63" font-size="18" fill="#536c86">松开 Shift 继续画</text><rect x="18" y="80" width="724" height="260" rx="7" fill="white" stroke="#b9cce0" /><path d="M75 230 Q155 105 245 220" stroke="#2877bd" stroke-width="7" fill="none" stroke-linecap="round" stroke-linejoin="round" /><path d="M245 220 L445 160" stroke="#2877bd" stroke-width="7" fill="none" stroke-linecap="round" stroke-linejoin="round" /><rect x="530" y="112" width="150" height="33" rx="5" fill="#e2effb" stroke="#2877bd" /><text x="542" y="135" font-size="18" fill="#2877bd">松开 Shift</text><path d="M445 160 Q520 90 620 230" stroke="#2877bd" stroke-width="7" fill="none" stroke-linecap="round" stroke-linejoin="round" /><text x="26" y="364" font-size="18" fill="#24384f">松开Shift再继续自由移动，最后抬起鼠标；曲线和直边属于同一笔画。</text><text x="24" y="416" font-size="15" fill="#536c86">操作示意</text></svg>