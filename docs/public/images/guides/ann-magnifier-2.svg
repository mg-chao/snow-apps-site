<svg xmlns="http://www.w3.org/2000/svg" width="820" height="440" viewBox="0 0 820 440" role="img" aria-labelledby="title desc"><title id="title">放大镜与局部细节：把镜片移到空白处</title><desc id="desc">操作示意。第 2 帧：把镜片移到空白处。</desc><rect width="820" height="440" rx="16" fill="#f3f7fc" /><rect x="22" y="75" width="500" height="330" rx="10" fill="#fff" stroke="#d2deeb" /><rect x="540" y="75" width="260" height="330" rx="10" fill="#fff" stroke="#d2deeb" /><text x="25" y="39" font-size="25" fill="#26384c" font-weight="bold">放大镜与局部细节</text><text x="25" y="63" font-size="17" fill="#546c84" font-weight="normal">2 / 3　把镜片移到空白处</text><rect x="70" y="160" width="335" height="8" rx="4" fill="#c6d4e2" stroke="#c6d4e2" /><rect x="70" y="190" width="285" height="8" rx="4" fill="#c6d4e2" stroke="#c6d4e2" /><rect x="70" y="220" width="320" height="8" rx="4" fill="#c6d4e2" stroke="#c6d4e2" /><rect x="70" y="250" width="230" height="8" rx="4" fill="#c6d4e2" stroke="#c6d4e2" /><rect x="85" y="175" width="80" height="70" rx="6" fill="none" stroke="#e34f52" stroke-width="3" /><rect x="95" y="185" width="60" height="36" fill="white" /><text x="99" y="208" font-size="14" fill="#26384c">图像细节</text><text x="85" y="270" font-size="18" fill="#26384c" font-weight="normal">来源区域</text><rect x="310" y="130" width="160" height="140" rx="9" fill="#eef4fb" stroke="#e34f52" stroke-width="3" /><text x="330" y="185" font-size="29" fill="#26384c" font-weight="normal">图像细节</text><text x="330" y="228" font-size="24" fill="#26384c" font-weight="normal">2.0×</text><line x1="165" y1="208.5" x2="310" y2="203" stroke="#e34f52" stroke-width="2" /><text x="555" y="116" font-size="21" fill="#26384c" font-weight="bold">操作要点</text><text x="555" y="165" font-size="17" fill="#26384c" font-weight="normal">框出要看的来源细节</text><text x="555" y="215" font-size="17" fill="#26384c" font-weight="normal">镜片可独立移到旁边</text><text x="555" y="265" font-size="17" fill="#26384c" font-weight="normal">调倍数与连接，再检查效果</text><text x="555" y="355" font-size="17" fill="#546c84" font-weight="normal">按正文步骤操作</text><text x="555" y="385" font-size="16" fill="#546c84" font-weight="normal">操作示意</text></svg>