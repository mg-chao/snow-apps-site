<svg xmlns="http://www.w3.org/2000/svg" width="440" height="590" viewBox="0 0 440 590" role="img" aria-labelledby="title desc"><title id="title">本地文字识别设置: 硬件开关不等于正在用 GPU</title><desc id="desc">硬件加速开启后，可用时使用 GPU，不可用时仍使用 CPU。若出现异常，关闭这一项，再用新识别任务检查 CPU 路径。</desc><rect width="440" height="590" rx="16" fill="#f5f7fc"/><g font-family="system-ui,-apple-system,PingFang SC,Microsoft YaHei,sans-serif"><text x="24" y="35" font-size="23" fill="#24384f" font-weight="700">本地文字识别设置</text><text x="24" y="70" font-size="20" fill="#267cba" font-weight="600">硬件开关不等于正在用 GPU</text><g transform="translate(0 111)"><g transform="translate(24 0)"><rect x="0" y="0" width="392" height="144" rx="11" fill="#fff" stroke="#d1dbE8" stroke-width="1.4" /><text x="18" y="30" font-size="22" fill="#7154d9" font-weight="650">OCR 模型与性能</text><text x="18" y="78" font-size="18" fill="#536b83" font-weight="400">硬件加速</text><rect x="18" y="91" width="59" height="30" rx="15" fill="#7154d9" stroke="#7154d9" stroke-width="1.4" /><circle cx="62" cy="106" r="11" fill="white"/><text x="93" y="114" font-size="20" fill="#24384f" font-weight="400">开启</text></g><g transform="translate(24 161)"><rect x="0" y="0" width="392" height="175" rx="11" fill="#fff" stroke="#d1dbE8" stroke-width="1.4" /><text x="18" y="30" font-size="22" fill="#7154d9" font-weight="650">实际处理路径</text><text x="18" y="81" font-size="20" fill="#24384f" font-weight="400">加速可用 → GPU</text><text x="18" y="116" font-size="20" fill="#24384f" font-weight="400">加速不可用 → CPU</text><text x="18" y="151" font-size="20" fill="#24384f" font-weight="400">开关开启本身不能判断实际路径。</text></g></g><path d="M24 541 H416" stroke="#dce3ef"/><text x="24" y="568" font-size="17" fill="#536b83" font-weight="400">操作示意</text></g></svg>