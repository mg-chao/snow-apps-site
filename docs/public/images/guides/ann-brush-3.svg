<svg xmlns="http://www.w3.org/2000/svg" width="820" height="440" viewBox="0 0 820 440" role="img" aria-labelledby="title desc"><title id="title">画笔与压感笔画：松开后选择和修改</title><desc id="desc">操作示意。第 3 帧：松开后选择和修改。</desc><rect width="820" height="440" rx="16" fill="#f3f7fc" /><rect x="22" y="75" width="500" height="330" rx="10" fill="#fff" stroke="#d2deeb" /><rect x="540" y="75" width="260" height="330" rx="10" fill="#fff" stroke="#d2deeb" /><text x="25" y="39" font-size="25" fill="#26384c" font-weight="bold">画笔与压感笔画</text><text x="25" y="63" font-size="17" fill="#546c84" font-weight="normal">3 / 3　松开后选择和修改</text><path d="M80 230 Q120 135 175 205 T280 205 Q320 130 365 215 L430 170" stroke="#347ec7" stroke-width="7" fill="none" stroke-linejoin="round" stroke-linecap="round" /><text x="80" y="320" font-size="22" fill="#26384c" font-weight="normal">按下 → 连续移动 → 松开</text><rect x="65" y="135" width="385" height="115" rx="0" fill="none" stroke="#347ec7" stroke-dasharray="5 5" /><rect x="61" y="131" width="8" height="8" rx="1" fill="white" stroke="#347ec7" /><rect x="446" y="131" width="8" height="8" rx="1" fill="white" stroke="#347ec7" /><rect x="61" y="246" width="8" height="8" rx="1" fill="white" stroke="#347ec7" /><rect x="446" y="246" width="8" height="8" rx="1" fill="white" stroke="#347ec7" /><text x="80" y="115" font-size="19" fill="#26384c" font-weight="normal">一笔是一个可编辑对象</text><text x="555" y="116" font-size="21" fill="#26384c" font-weight="bold">操作要点</text><text x="555" y="165" font-size="17" fill="#26384c" font-weight="normal">按下开始记录轨迹</text><text x="555" y="215" font-size="17" fill="#26384c" font-weight="normal">保持按住，移动指针</text><text x="555" y="265" font-size="17" fill="#26384c" font-weight="normal">松开结束，选择后编辑</text><text x="555" y="355" font-size="17" fill="#546c84" font-weight="normal">按正文步骤操作</text><text x="555" y="385" font-size="16" fill="#546c84" font-weight="normal">操作示意</text></svg>