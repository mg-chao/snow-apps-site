<svg xmlns="http://www.w3.org/2000/svg" width="820" height="440" viewBox="0 0 820 440" role="img" aria-labelledby="title desc"><title id="title">角度标注：点第二边并调整角弧</title><desc id="desc">操作示意。第 3 帧：点第二边并调整角弧。</desc><rect width="820" height="440" rx="16" fill="#f3f7fc" /><rect x="22" y="75" width="500" height="330" rx="10" fill="#fff" stroke="#d2deeb" /><rect x="540" y="75" width="260" height="330" rx="10" fill="#fff" stroke="#d2deeb" /><text x="25" y="39" font-size="25" fill="#26384c" font-weight="bold">角度标注</text><text x="25" y="63" font-size="17" fill="#546c84" font-weight="normal">3 / 3　点第二边并调整角弧</text><circle cx="120" cy="160" r="6" fill="white" stroke="#347ec7" stroke-width="2" /><circle cx="100" cy="145" r="12" fill="#347ec7" stroke="#347ec7" stroke-width="2" /><text x="95" y="151" font-size="17" fill="white" font-weight="bold">1</text><line x1="120" y1="160" x2="250" y2="280" stroke="#e34f52" stroke-width="3" /><circle cx="250" cy="280" r="6" fill="white" stroke="#347ec7" stroke-width="2" /><circle cx="245" cy="315" r="12" fill="#347ec7" stroke="#347ec7" stroke-width="2" /><text x="240" y="321" font-size="17" fill="white" font-weight="bold">2</text><line x1="250" y1="280" x2="420" y2="175" stroke="#e34f52" stroke-width="3" /><circle cx="420" cy="175" r="6" fill="white" stroke="#347ec7" stroke-width="2" /><circle cx="445" cy="162" r="12" fill="#347ec7" stroke="#347ec7" stroke-width="2" /><text x="440" y="168" font-size="17" fill="white" font-weight="bold">3</text><path d="M207 240 Q250 210 300 249" stroke="#347ec7" stroke-width="3" fill="none" stroke-linejoin="round" stroke-linecap="round" /><text x="235" y="225" font-size="20" fill="#347ec7" font-weight="normal">角度</text><text x="75" y="110" font-size="18" fill="#26384c" font-weight="normal">第一边端点 → 顶点 → 第二边端点</text><text x="555" y="116" font-size="21" fill="#26384c" font-weight="bold">操作要点</text><text x="555" y="165" font-size="17" fill="#26384c" font-weight="normal">第一个位置在第一边外端</text><text x="555" y="215" font-