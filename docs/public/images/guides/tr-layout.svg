<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" role="img" aria-labelledby="title desc"><title id="title">原图翻译前，决定文字怎样分组</title><desc id="desc">智能合并组织段落；原始模式保留识别行划分。操作示意。</desc><rect width="960" height="560" rx="24" fill="#f5f7fc" /><g font-family="system-ui,-apple-system,PingFang SC,Microsoft YaHei,sans-serif"><text x="36" y="52" font-size="30" fill="#18233b" font-weight="700">原图翻译前，决定文字怎样分组</text><text x="36" y="88" font-size="20" fill="#53627d" font-weight="400">智能合并组织段落；原始模式保留识别行划分</text><rect x="36" y="137" width="414" height="308" rx="16" fill="#ffffff" stroke="#c8d3e6" stroke-width="2" /><rect x="56" y="155" width="155" height="38" rx="19" fill="#ede9fe" stroke="#ede9fe" stroke-width="2" /><text x="70" y="181" font-size="20" fill="#5941bd" font-weight="600">智能合并</text><rect x="61" y="228" width="359" height="139" rx="16" fill="#e7e1fc" stroke="#6954d9" stroke-width="2" /><text x="83" y="271" font-size="25" fill="#18233b" font-weight="400">连续正文第一行</text><text x="83" y="322" font-size="25" fill="#18233b" font-weight="400">连续正文第二行</text><text x="62" y="410" font-size="21" fill="#53627d" font-weight="400">相邻行按布局关系组成文本块</text><rect x="510" y="137" width="414" height="308" rx="16" fill="#ffffff" stroke="#c8d3e6" stroke-width="2" /><rect x="530" y="155" width="155" height="38" rx="19" fill="#ede9fe" stroke="#ede9fe" stroke-width="2" /><text x="544" y="181" font-size="20" fill="#5941bd" font-weight="600">原始</text><rect x="535" y="228" width="359" height="59" rx="16" fill="#e7e1fc" stroke="#6954d9" stroke-width="2" /><text x="557" y="268" font-size="25" fill="#18233b" font-weight="400">原始识别行一</text><rect x="535" y="307" width="359" height="59" rx="16" fill="#e3f3ee" stroke="#167d69" stroke-width="2" /><text x="557" y="347" font-size="25" fill="#18233b" font-weight="400">原始识别行二</text><text x="535" y="410" font-size="21" fill="#53627d" font-weight="400">每个识别行保持各自对应</text><path d="M36 510 L924 510" fill="none" stroke="#dce3ef" stroke-width="1" /><text x="36" y="539" font-size="18" fill="#53627d" font-weight="400">Snow Shot · 操作示意</text></g></svg>