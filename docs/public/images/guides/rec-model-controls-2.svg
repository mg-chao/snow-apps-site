<svg xmlns="http://www.w3.org/2000/svg" width="440" height="600" viewBox="0 0 440 600" role="img" aria-labelledby="title desc"><title id="title">本地文字识别设置: 分别比较检测策略</title><desc id="desc">先选检测缩放，再选处理策略，每次只改一项并重新识别同一范围。放大短边可能找到更小文字；速度优先可能改变识别结果。</desc><rect width="440" height="600" rx="16" fill="#f5f7fc"/><g font-family="system-ui,-apple-system,PingFang SC,Microsoft YaHei,sans-serif"><text x="24" y="35" font-size="23" fill="#24384f" font-weight="700">本地文字识别设置</text><text x="24" y="70" font-size="20" fill="#267cba" font-weight="600">分别比较检测策略</text><g transform="translate(0 111)"><g transform="translate(24 0)"><rect x="0" y="0" width="392" height="140" rx="11" fill="#fff" stroke="#d1dbE8" stroke-width="1.4" /><text x="18" y="30" font-size="22" fill="#7154d9" font-weight="650">文本检测缩放</text><text x="18" y="81" font-size="20" fill="#24384f" font-weight="400">限制长边（更快）</text><text x="18" y="116" font-size="20" fill="#24384f" font-weight="400">放大短边（更多细节）</text></g><g transform="translate(24 157)"><rect x="0" y="0" width="392" height="175" rx="11" fill="#fff" stroke="#d1dbE8" stroke-width="1.4" /><text x="18" y="30" font-size="22" fill="#7154d9" font-weight="650">文本检测处理</text><text x="18" y="81" font-size="20" fill="#24384f" font-weight="400">准确优先</text><text x="18" y="116" font-size="20" fill="#24384f" font-weight="400">速度优先</text><text x="18" y="151" font-size="20" fill="#24384f" font-weight="400">选回原规则可恢复比较基准。</text></g></g><path d="M24 551 H416" stroke="#dce3ef"/><text x="24" y="578" font-size="17" fill="#536b83" font-weight="400">操作示意</text></g></svg>