<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" role="img" aria-labelledby="title desc"><title id="title">两类 API 地址，填写规则不同</title><desc id="desc">先保存配置，再回到任务里用短句或小图验证。操作示意。</desc><rect width="960" height="560" rx="24" fill="#f5f7fc" /><g font-family="system-ui,-apple-system,PingFang SC,Microsoft YaHei,sans-serif"><text x="36" y="52" font-size="30" fill="#18233b" font-weight="700">两类 API 地址，填写规则不同</text><text x="36" y="88" font-size="20" fill="#53627d" font-weight="400">先保存配置，再回到任务里用短句或小图验证</text><rect x="36" y="138" width="888" height="141" rx="16" fill="#ffffff" stroke="#c8d3e6" stroke-width="2" /><rect x="57" y="157" width="185" height="38" rx="19" fill="#ede9fe" stroke="#ede9fe" stroke-width="2" /><text x="71" y="183" font-size="20" fill="#5941bd" font-weight="600">专用翻译配置</text><text x="57" y="235" font-size="27" fill="#2563c6" font-weight="400">完整端点：https://example.com/translate</text><rect x="36" y="305" width="888" height="165" rx="16" fill="#ffffff" stroke="#c8d3e6" stroke-width="2" /><rect x="57" y="324" width="185" height="38" rx="19" fill="#ede9fe" stroke="#ede9fe" stroke-width="2" /><text x="71" y="350" font-size="20" fill="#5941bd" font-weight="600">自定义 AI 模型</text><text x="57" y="396" font-size="27" fill="#2563c6" font-weight="400">基础地址：https://example.com/v1</text><text x="57" y="443" font-size="23" fill="#53627d" font-weight="400">应用追加 /chat/completions　　模型 ID：按服务端实际名称填写</text><path d="M36 510 L924 510" fill="none" stroke="#dce3ef" stroke-width="1" /><text x="36" y="539" font-size="18" fill="#53627d" font-weight="400">Snow Shot · 操作示意</text></g></svg>