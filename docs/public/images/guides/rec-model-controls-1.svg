<svg xmlns="http://www.w3.org/2000/svg" width="440" height="960" viewBox="0 0 440 960" role="img" aria-labelledby="title desc"><title id="title">本地文字识别设置: 选模型，再新建识别任务</title><desc id="desc">在模型类型中选择需要的大小，设置会保存。结束当前截图，重新框选同一样例；资源完整时直接识别，缺少所选模型资源时才准备组件。</desc><rect width="440" height="960" rx="16" fill="#f5f7fc"/><g font-family="system-ui,-apple-system,PingFang SC,Microsoft YaHei,sans-serif"><text x="24" y="35" font-size="23" fill="#24384f" font-weight="700">本地文字识别设置</text><text x="24" y="70" font-size="20" fill="#267cba" font-weight="600">选模型，再新建识别任务</text><g transform="translate(0 111)"><g transform="translate(24 0)"><rect x="0" y="0" width="392" height="238" rx="11" fill="#fff" stroke="#d1dbE8" stroke-width="1.4" /><text x="18" y="30" font-size="22" fill="#7154d9" font-weight="650">OCR 模型与性能</text><text x="18" y="78" font-size="18" fill="#536b83" font-weight="400">模型类型</text><rect x="18" y="86" width="356" height="42" rx="6" fill="#fff" stroke="#c8d3e6" stroke-width="1.4" /><text x="30" y="114" font-size="20" fill="#24384f" font-weight="400">小型 V6</text><text x="34" y="155" font-size="20" fill="#7154d9" font-weight="400">超小型 V6</text><text x="34" y="184" font-size="20" fill="#7154d9" font-weight="400">小型 V6</text><text x="34" y="213" font-size="20" fill="#7154d9" font-weight="400">中型 V6</text></g><g transform="translate(24 255)"><rect x="0" y="0" width="392" height="140" rx="11" fill="#fff" stroke="#d1dbE8" stroke-width="1.4" /><text x="18" y="30" font-size="22" fill="#7154d9" font-weight="650">新截图 → 文本识别</text><text x="18" y="81" font-size="20" fill="#24384f" font-weight="400">资源已齐 → 可断网本地识别</text><text x="18" y="116" font-size="20" fill="#24384f" font-weight="400">资源缺少 → 准备组件 → 识别</text></g><g transform="translate(24 412)"><rect x="0" y="0" width="392" height="193" rx="11" fill="#fff" stroke="#d1dbE8" stroke-width="1.4" /><text x="18" y="30" font-size="22" fill="#7154d9" font-weight="650">下载时的示例进度</text><rect x="18" y="63" width="356" height="48" rx="6" fill="#f5f7fb" stroke="none" stroke-width="1.4" /><text x="29" y="93" font-size="20" fill="#24384f" font-weight="400">正在准备文本识别组件（50%）</text><text x="18" y="142" font-size="20" fill="#24384f" font-weight="400">保持联网等待；资源已齐不会出现此下</text><text x="18" y="169" font-size="20" fill="#24384f" font-weight="400">载提示。</text></g></g><path d="M24 911 H416" stroke="#dce3ef"/><text x="24" y="938" font-size="17" fill="#536b83" font-weight="400">操作示意</text></g></svg>