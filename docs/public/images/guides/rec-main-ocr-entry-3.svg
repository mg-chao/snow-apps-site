<svg xmlns="http://www.w3.org/2000/svg" width="440" height="720" viewBox="0 0 440 720" role="img" aria-labelledby="title desc"><title id="title">不用先绑定按键也能识别: Mini的两套工具栏分开</title><desc id="desc">要显示Mini隐藏的文本识别按钮，截图入口改截图工具栏，图像编辑器改固定到屏幕工具栏。把隐藏的工具拖入可见位置；不要只改一套布局就去另一处找按钮。</desc><rect width="440" height="720" rx="16" fill="#f5f7fc"/><g font-family="system-ui,-apple-system,PingFang SC,Microsoft YaHei,sans-serif"><text x="24" y="35" font-size="23" fill="#24384f" font-weight="700">不用先绑定按键也能识别</text><text x="24" y="70" font-size="20" fill="#267cba" font-weight="600">Mini的两套工具栏分开</text><g transform="translate(0 111)"><g transform="translate(24 0)"><rect x="0" y="0" width="392" height="140" rx="11" fill="#fff" stroke="#d1dbE8" stroke-width="1.4" /><text x="18" y="30" font-size="22" fill="#7154d9" font-weight="650">截图入口</text><text x="18" y="81" font-size="20" fill="#24384f" font-weight="400">设置 → 截图 → 操作工具栏</text><text x="18" y="116" font-size="20" fill="#24384f" font-weight="400">截图工具栏设置</text></g><g transform="translate(24 157)"><rect x="0" y="0" width="392" height="140" rx="11" fill="#fff" stroke="#d1dbE8" stroke-width="1.4" /><text x="18" y="30" font-size="22" fill="#7154d9" font-weight="650">图像编辑器入口</text><text x="18" y="81" font-size="20" fill="#24384f" font-weight="400">设置 → 固定到屏幕 → 操作工具栏</text><text x="18" y="116" font-size="20" fill="#24384f" font-weight="400">固定到屏幕工具栏设置</text></g><g transform="translate(24 314)"><rect x="0" y="0" width="392" height="105" rx="11" fill="#fff" stroke="#d1dbE8" stroke-width="1.4" /><text x="18" y="30" font-size="22" fill="#7154d9" font-weight="650">同一个工具</text><text x="18" y="81" font-size="20" fill="#24384f" font-weight="400">隐藏的工具：文本识别 → 可见位置</text></g></g><path d="M24 671 H416" stroke="#dce3ef"/><text x="24" y="698" font-size="17" fill="#536b83" font-weight="400">操作示意</text></g></svg>