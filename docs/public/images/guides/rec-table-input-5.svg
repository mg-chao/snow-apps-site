<svg xmlns="http://www.w3.org/2000/svg" width="440" height="950" viewBox="0 0 440 950" role="img" aria-labelledby="title desc"><title id="title">区分格内文字与表格范围: 回到初始表格后全选复制</title><desc id="desc">继续练习时，先用重置回到初始表格。退出格内编辑，按Ctrl+A（macOS为Command+A）全选单元格，再在选区内右键复制。粘贴到电子表格后检查3行3列。</desc><rect width="440" height="950" rx="16" fill="#f5f7fc"/><g font-family="system-ui,-apple-system,PingFang SC,Microsoft YaHei,sans-serif"><text x="24" y="35" font-size="23" fill="#24384f" font-weight="700">区分格内文字与表格范围</text><text x="24" y="70" font-size="20" fill="#267cba" font-weight="600">回到初始表格后全选复制</text><g transform="translate(0 111)"><g transform="translate(24 0)"><rect x="0" y="0" width="392" height="214" rx="11" fill="#fff" stroke="#d1dbE8" stroke-width="1.4" /><text x="18" y="30" font-size="22" fill="#7154d9" font-weight="650">全选单元格，不是格内文字</text><rect x="18" y="63" width="116" height="42" rx="0" fill="#eee9fb" stroke="#b9c9da" stroke-width="1.4" /><text x="28" y="91" font-size="20" fill="#24384f" font-weight="400">项目</text><rect x="134" y="63" width="116" height="42" rx="0" fill="#eee9fb" stroke="#b9c9da" stroke-width="1.4" /><text x="144" y="91" font-size="20" fill="#24384f" font-weight="400">数量</text><rect x="250" y="63" width="116" height="42" rx="0" fill="#eee9fb" stroke="#b9c9da" stroke-width="1.4" /><text x="260" y="91" font-size="20" fill="#24384f" font-weight="400">金额</text><rect x="18" y="105" width="116" height="42" rx="0" fill="#eee9fb" stroke="#b9c9da" stroke-width="1.4" /><text x="28" y="133" font-size="20" fill="#24384f" font-weight="400">笔</text><rect x="134" y="105" width="116" height="42" rx="0" fill="#eee9fb" stroke="#b9c9da" stroke-width="1.4" /><text x="144" y="133" font-size="20" fill="#24384f" font-weight="400">2</text><rect x="250" y="105" width="116" height="42" rx="0" fill="#eee9fb" stroke="#b9c9da" stroke-width="1.4" /><text x="260" y="133" font-size="20" fill="#24384f" font-weight="400">80</text><rect x="18" y="147" width="116" height="42" rx="0" fill="#eee9fb