<svg xmlns="http://www.w3.org/2000/svg" width="760" height="430" viewBox="0 0 760 430" role="img" aria-labelledby="title desc" font-family="system-ui,sans-serif"><title id="title">区分角弧与边端点的编辑：径向拖动角弧</title><desc id="desc">操作示意。沿离开顶点的方向拖动角弧，弧半径变大；两条边和90°数值保持不变。</desc><rect width="760" height="430" rx="12" fill="#f3f7fc" /><text x="24" y="34" font-size="25" fill="#24384f">区分角弧与边端点的编辑</text><text x="24" y="63" font-size="18" fill="#536c86">径向拖动角弧</text><rect x="18" y="80" width="724" height="260" rx="7" fill="white" stroke="#b9cce0" /><rect x="45" y="98" width="180" height="33" rx="5" fill="#e2effb" stroke="#2877bd" /><text x="57" y="121" font-size="18" fill="#2877bd">180° 角（内角）</text><path d="M280 278 L280 108" stroke="#2877bd" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round" /><path d="M280 278 L450 278" stroke="#2877bd" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round" /><circle cx="280" cy="278" r="6" fill="white" stroke="#2877bd" stroke-width="2" /><circle cx="280" cy="108" r="6" fill="white" stroke="#2877bd" stroke-width="2" /><circle cx="450" cy="278" r="6" fill="white" stroke="#2877bd" stroke-width="2" /><path d="M280 188 A90 90 0 0 1 370 278" stroke="#d84d53" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round" /><text x="408" y="232" font-size="28" fill="#d84d53">90°</text><circle cx="343.63" cy="214.37" r="7" fill="white" stroke="#2877bd" stroke-width="2" /><path d="M325 233 L365 193" stroke="#d84d53" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round" /><path d="M352.27207793864216 197.2426406871193 L365 193 L360.7573593128807 205.72792206135787" stroke="#d84d53" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round" /><text x="470" y="132" font-size="21" fill="#24384f">两边保持原位</text><text x="26" y="364" font-size="18" fill="#24384f">沿离开顶点的方向拖动角弧，弧半径变大；两条边和90°数值保持不变。</text><text x="24" y="416" font-size="15" fill="#536c86">操作示意</text></svg>