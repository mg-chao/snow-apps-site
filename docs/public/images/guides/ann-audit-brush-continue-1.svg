<svg xmlns="http://www.w3.org/2000/svg" width="760" height="430" viewBox="0 0 760 430" role="img" aria-labelledby="title desc" font-family="system-ui,sans-serif"><title id="title">从笔画端点继续画：靠近开放端点</title><desc id="desc">操作示意。保持画笔工具，把指针移到未闭合笔画的首端或末端，观察端点反馈。</desc><rect width="760" height="430" rx="12" fill="#f3f7fc" /><text x="24" y="34" font-size="25" fill="#24384f">从笔画端点继续画</text><text x="24" y="63" font-size="18" fill="#536c86">靠近开放端点</text><rect x="18" y="80" width="724" height="260" rx="7" fill="white" stroke="#b9cce0" /><path d="M80 245 Q165 125 280 225" stroke="#2877bd" stroke-width="7" fill="none" stroke-linecap="round" stroke-linejoin="round" /><circle cx="280" cy="225" r="11" fill="none" stroke="#d84d53" stroke-width="2" /><text x="330" y="210" font-size="22" fill="#24384f">开放端点反馈</text><text x="26" y="364" font-size="18" fill="#24384f">保持画笔工具，把指针移到未闭合笔画的首端或末端，观察端点反馈。</text><text x="24" y="416" font-size="15" fill="#536c86">操作示意</text></svg>