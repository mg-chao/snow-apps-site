<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" role="img" aria-labelledby="title desc"><title id="title">分页与身份证模板，纸张安排不同</title><desc id="desc">只使用虚构正反面素材；选择模板后再次检查位置和页数。原创操作示意。</desc><rect width="960" height="560" rx="22" fill="#f5f7fc" /><g font-family="system-ui,-apple-system,PingFang SC,Microsoft YaHei,sans-serif"><text x="35" y="50" font-size="29" fill="#1e293b" font-weight="700">分页与身份证模板，纸张安排不同</text><text x="35" y="86" font-size="20" fill="#53627d" font-weight="400">只使用虚构正反面素材；选择模板后再次检查位置和页数</text><rect x="40" y="126" width="293" height="38" rx="19" fill="#ede9fe" stroke="#ede9fe" stroke-width="2" /><text x="54" y="152" font-size="20" fill="#6146bd" font-weight="600">分页拼接：每张各占一页</text><rect x="576" y="126" width="346" height="38" rx="19" fill="#ede9fe" stroke="#ede9fe" stroke-width="2" /><text x="590" y="152" font-size="20" fill="#6146bd" font-weight="600">身份证模板：正反面放一页</text><rect x="40" y="182" width="183" height="258" rx="0" fill="#fff" stroke="#aabbd2" stroke-width="2" /><rect x="56" y="246" width="151" height="95" rx="5" fill="#e7e0fa" stroke="#7654c9" stroke-width="2" /><text x="68" y="278" font-size="22" fill="#7654c9" font-weight="600">虚构卡片</text><text x="86" y="393" font-size="25" fill="#1e293b" font-weight="400">正面</text><rect x="258" y="182" width="183" height="258" rx="0" fill="#fff" stroke="#aabbd2" stroke-width="2" /><rect x="274" y="246" width="151" height="95" rx="5" fill="#dcefe9" stroke="#268471" stroke-width="2" /><text x="286" y="278" font-size="22" fill="#268471" font-weight="600">虚构卡片</text><text x="304" y="393" font-size="25" fill="#1e293b" font-weight="400">反面</text><rect x="660" y="182" width="183" height="258" rx="0" fill="#fff" stroke="#aabbd2" stroke-width="2" /><rect x="714" y="235" width="75" height="47" rx="5" fill="#e7e0fa" stroke="#7654c9" stroke-width="2" /><text x="726" y="267" font-size="22" fill="#7654c9" font-weight="600">正</text><rect x="714" y="354" width="75" height="47" rx="5" fill="#dcefe9" stroke="#268471" stroke-width="2" /><text x="726" y="386" font-size="22" fill="#268471" font-weight="600">反</text><text x="548" y="477" font-size="19" fill="#53627d" font-weight="400">卡片比例有约束；不承诺打印一定为实物尺寸。</text><path d="M35 511 L925 511" fill="none" stroke="#dbe3ef" stroke-width="1" /><text x="35" y="539" font-size="18" fill="#53627d" font-weight="400">Snow Shot · 操作示意</text></g></svg>