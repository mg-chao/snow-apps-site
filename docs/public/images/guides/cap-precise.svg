<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="480" viewBox="0 0 960 480" role="img" aria-labelledby="title"><title id="title">精确选区：位置、尺寸、比例与装饰（操作示意）</title><g font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif"><rect x="1" y="1" width="958" height="478" rx="12" fill="#f6f7fc" stroke="#cbd4e4" stroke-width="2" /><text x="30" y="43" font-size="28" fill="#263148">精确选区：位置、尺寸、比例与装饰</text><text x="30" y="460" font-size="18" fill="#536078">操作示意</text><rect x="30" y="80" width="900" height="70" rx="12" fill="#fff" stroke="#cbd4e4" stroke-width="2" /><text x="50" y="124" font-size="25" fill="#263148">X, Y 位置   🔒   宽度 × 高度   px / dp   16:9</text><path d="M145 150L145 200" fill="none" stroke="#7652dc" stroke-width="4" /><rect x="30" y="205" width="420" height="200" rx="12" fill="#fff" stroke="#cbd4e4" stroke-width="2" /><text x="55" y="246" font-size="25" fill="#263148">调整选区大小</text><text x="55" y="290" font-size="23" fill="#263148">X / Y：左上角位置</text><text x="55" y="331" font-size="23" fill="#263148">宽 / 高：需要保留的范围</text><text x="55" y="372" font-size="23" fill="#263148">锁定：联动修改宽高</text><rect x="480" y="205" width="450" height="200" rx="12" fill="#ebe6fb" stroke="#cbd4e4" stroke-width="2" /><text x="505" y="246" font-size="24" fill="#263148">在数值上单击 → 输入</text><text x="505" y="290" font-size="24" fill="#263148">在数值上滚动 → 微调</text><text x="505" y="331" font-size="24" fill="#263148">比例菜单 → 选择预设</text><text x="505" y="372" font-size="24" fill="#263148">确认后观察边框变化</text></g></svg>