<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="760" height="430" viewBox="0 0 760 430" role="img" aria-labelledby="title desc" font-family="system-ui,sans-serif"><title id="title">自动滤镜：识别失败</title><desc id="desc">操作示意。失败提示不是识别结果；此时不能按类别填充。</desc><rect width="760" height="430" rx="12" fill="#f3f7fc" /><text x="24" y="34" font-size="25" fill="#24384f">自动滤镜识别失败后重试</text><text x="24" y="63" font-size="18" fill="#536c86">确认提示，再切换工具重试</text><rect x="36" y="92" width="688" height="48" rx="7" fill="#edf4fb" stroke="#b9cce0" /><text x="52" y="123" font-size="20" fill="#24384f">滤镜</text><rect x="140" y="99" width="145" height="34" rx="7" fill="white" stroke="#b9cce0" /><text x="163" y="123" font-size="19" fill="#24384f">画笔滤镜</text><rect x="300" y="99" width="145" height="34" rx="7" fill="white" stroke="#b9cce0" /><text x="323" y="123" font-size="19" fill="#24384f">矩形滤镜</text><rect x="460" y="99" width="145" height="34" rx="7" fill="#d8eafb" stroke="#2877bd" /><text x="483" y="123" font-size="19" fill="#2877bd">自动滤镜</text><rect x="45" y="160" width="430" height="176" rx="7" fill="white" stroke="#b9cce0" /><text x="66" y="190" font-size="18" fill="#536c86">已加载的虚构图像</text><rect x="67" y="208" width="55" height="55" rx="7" fill="#c5dcee" stroke="#b9cce0" /><text x="142" y="231" font-size="22" fill="#24384f">示例消息</text><text x="142" y="260" font-size="18" fill="#536c86">只展示恢复流程</text><rect x="503" y="163" width="201" height="44" rx="7" fill="#eef1f4" stroke="#ccd3da" /><text x="543" y="192" font-size="22" fill="#657887">填充区域</text><rect x="56" y="279" width="642" height="42" rx="7" fill="#fff0f0" stroke="#dc9aa0" /><text x="73" y="307" font-size="24" fill="#c53b45">区域识别失败。请再次尝试自动滤镜</text><text x="514" y="241" font-size="18" fill="#536c86">尚无可用识别区域</text><text x="24" y="370" font-size="19" fill="#24384f">失败提示不是识别结果；此时不能按类别填充。</text><text x="24" y="412" font-size="15" fill="#536c86">操作示意；控件布局为流程示意</text></svg>