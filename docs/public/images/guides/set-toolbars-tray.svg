<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="900" height="470" viewBox="0 0 900 470" role="img" aria-labelledby="title desc">
<title id="title">工具栏的三种拖放结果</title><desc id="desc">隐藏的工具可以拖回预览；叠放组可展开选择其他工具。</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#1677ff" /></marker></defs>
<rect width="900" height="470" rx="20" fill="#fff" />
<g font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif"><text x="30" y="47" font-size="30" fill="#163963" font-weight="700">工具栏的三种拖放结果</text><text x="30" y="79" font-size="18" fill="#62758e" font-weight="400">操作示意</text><rect x="30" y="112" width="263" height="265" rx="16" fill="#f2f6fc" stroke="#cbd8e9" stroke-width="2" /><circle cx="58" cy="142" r="20" fill="#1677ff" /><text x="51" y="150" font-size="24" fill="white" font-weight="700">1</text><text x="88" y="151" font-size="24" fill="#163963" font-weight="600">拖到旁边</text><rect x="318" y="112" width="263" height="265" rx="16" fill="#f2f6fc" stroke="#cbd8e9" stroke-width="2" /><circle cx="346" cy="142" r="20" fill="#1677ff" /><text x="339" y="150" font-size="24" fill="white" font-weight="700">2</text><text x="376" y="151" font-size="24" fill="#163963" font-weight="600">拖到上方</text><rect x="606" y="112" width="263" height="265" rx="16" fill="#f2f6fc" stroke="#cbd8e9" stroke-width="2" /><circle cx="634" cy="142" r="20" fill="#1677ff" /><text x="627" y="150" font-size="24" fill="white" font-weight="700">3</text><text x="664" y="151" font-size="24" fill="#163963" font-weight="600">拖入隐藏区</text><rect x="55" y="236" width="54" height="54" rx="7" fill="#fff" stroke="#8bbcff" stroke-width="2" /><rect x="125" y="236" width="54" height="54" rx="7" fill="#fff" stroke="#8bbcff" stroke-width="2" /><rect x="195" y="236" width="54" height="54" rx="7" fill="#fff" stroke="#8bbcff" stroke-width="2" /><text x="68" y="273" font-size="24" fill="#24344d" font-weight="400">A</text><text x="138" y="273" font-size="24" fill="#24344d" font-weight="400">B</text><text x="208" y="273" font-size="24" fill="#24344d" font-weight="400">C</text><path d="M160 185L160 227" stroke="#1677ff" stroke-width="4" marker-end="url(#a)" fill="none" /><text x="52" y="347" font-size="24" fill="#24344d" font-weight="400">创建独立位置</text><rect x="393" y="190" width="75" height="54" rx="7" fill="#e6f0ff" stroke="#1677ff" stroke-width="2" /><text x="419" y="227" font-size="24" fill="#24344d" font-weight="400">A</text><rect x="393" y="246" width="75" height="54" rx="7" fill="#fff" stroke="#1677ff" stroke-width="2" /><text x="419" y="283" font-size="24" fill="#24344d" font-weight="400">B</text><text x="342" y="347" font-size="22" fill="#24344d" font-weight="400">底部 B 留在主行</text><rect x="633" y="260" width="206" height="73" rx="8" fill="#edf0f5" stroke="#a6b6cb" stroke-width="2" /><text x="658" y="306" font-size="24" fill="#24344d" font-weight="400">隐藏工具</text><path d="M735 184L735 250" stroke="#1677ff" stroke-width="4" marker-end="url(#a)" fill="none" /><text x="30" y="444" font-size="20" fill="#52647e" font-weight="400">隐藏的工具可以拖回预览；叠放组可展开选择其他工具。</text></g></svg>