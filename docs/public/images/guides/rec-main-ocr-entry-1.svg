<svg xmlns="http://www.w3.org/2000/svg" width="440" height="720" viewBox="0 0 440 720" role="img" aria-labelledby="title desc"><title id="title">不用先绑定按键也能识别: 搜索结果只定位动作</title><desc id="desc">在主窗口搜索功能输入文本识别并选择结果。页面定位到全局快捷键中的动作行；选搜索结果本身不会立即截图。</desc><rect width="440" height="720" rx="16" fill="#f5f7fc"/><g font-family="system-ui,-apple-system,PingFang SC,Microsoft YaHei,sans-serif"><text x="24" y="35" font-size="23" fill="#24384f" font-weight="700">不用先绑定按键也能识别</text><text x="24" y="70" font-size="20" fill="#267cba" font-weight="600">搜索结果只定位动作</text><g transform="translate(0 111)"><g transform="translate(24 0)"><rect x="0" y="0" width="392" height="144" rx="11" fill="#fff" stroke="#d1dbE8" stroke-width="1.4" /><text x="18" y="30" font-size="22" fill="#7154d9" font-weight="650">搜索功能</text><text x="18" y="78" font-size="18" fill="#536b83" font-weight="400">输入</text><rect x="18" y="86" width="356" height="42" rx="6" fill="#fff" stroke="#c8d3e6" stroke-width="1.4" /><text x="30" y="114" font-size="20" fill="#24384f" font-weight="400">文本识别</text></g><g transform="translate(24 161)"><rect x="0" y="0" width="392" height="140" rx="11" fill="#fff" stroke="#d1dbE8" stroke-width="1.4" /><text x="18" y="30" font-size="22" fill="#7154d9" font-weight="650">选择结果后</text><text x="18" y="81" font-size="20" fill="#24384f" font-weight="400">定位：全局快捷键 → 文本识别</text><text x="18" y="116" font-size="20" fill="#24384f" font-weight="400">这一步尚未启动截图。</text></g></g><path d="M24 671 H416" stroke="#dce3ef"/><text x="24" y="698" font-size="17" fill="#536b83" font-weight="400">操作示意</text></g></svg>