<svg xmlns="http://www.w3.org/2000/svg" width="820" height="440" viewBox="0 0 820 440" role="img" aria-labelledby="title desc"><title id="title">距离标注与尺寸换算：拖动创建尺寸线</title><desc id="desc">操作示意。第 1 帧：拖动创建尺寸线。</desc><rect width="820" height="440" rx="16" fill="#f3f7fc" /><rect x="22" y="75" width="500" height="330" rx="10" fill="#fff" stroke="#d2deeb" /><rect x="540" y="75" width="260" height="330" rx="10" fill="#fff" stroke="#d2deeb" /><text x="25" y="39" font-size="25" fill="#26384c" font-weight="bold">距离标注与尺寸换算</text><text x="25" y="63" font-size="17" fill="#546c84" font-weight="normal">1 / 3　拖动创建尺寸线</text><rect x="95" y="160" width="310" height="95" rx="6" fill="#e8f2fc" stroke="#b5c6d8" /><line x1="95" y1="290" x2="405" y2="290" stroke="#e34f52" stroke-width="3" /><line x1="95" y1="276" x2="95" y2="304" stroke="#e34f52" stroke-width="3" /><line x1="405" y1="276" x2="405" y2="304" stroke="#e34f52" stroke-width="3" /><text x="205" y="280" font-size="23" fill="#c63e45" font-weight="normal">310 px</text><text x="555" y="116" font-size="21" fill="#26384c" font-weight="bold">操作要点</text><text x="555" y="165" font-size="17" fill="#26384c" font-weight="normal">端点落在需要标出的边缘</text><text x="555" y="215" font-size="17" fill="#26384c" font-weight="normal">实际值建立这条线的比例</text><text x="555" y="265" font-size="17" fill="#26384c" font-weight="normal">改端点后重新检查标签</text><text x="555" y="355" font-size="17" fill="#546c84" font-weight="normal">按正文步骤操作</text><text x="555" y="385" font-size="16" fill="#546c84" font-weight="normal">操作示意</text></svg>