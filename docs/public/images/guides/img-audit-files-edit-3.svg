<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" role="img" aria-labelledby="title desc"><title id="title">编辑选中的图像：检查打开的结果</title><desc id="desc">图示窗口只表达数量与内容去向，不是应用界面截图。。原创操作示意。</desc><rect width="960" height="560" rx="22" fill="#f5f7fc" /><g font-family="system-ui,-apple-system,PingFang SC,Microsoft YaHei,sans-serif"><text x="35" y="50" font-size="29" fill="#1e293b" font-weight="700">编辑选中的图像：检查打开的结果</text><text x="35" y="86" font-size="20" fill="#53627d" font-weight="400">图示窗口只表达数量与内容去向，不是应用界面截图。</text><rect x="41" y="144" width="435" height="309" rx="12" fill="#fff" stroke="#c8d3e6" stroke-width="2" /><rect x="60" y="162" width="395" height="38" rx="19" fill="#ede9fe" stroke="#ede9fe" stroke-width="2" /><text x="74" y="188" font-size="20" fill="#6146bd" font-weight="600">图片 A 的独立编辑窗口</text><rect x="84" y="235" width="349" height="177" rx="5" fill="#e7e0fa" stroke="#7654c9" stroke-width="2" /><text x="96" y="267" font-size="22" fill="#7654c9" font-weight="600">图片 A</text><rect x="517" y="144" width="435" height="309" rx="12" fill="#fff" stroke="#c8d3e6" stroke-width="2" /><rect x="536" y="162" width="395" height="38" rx="19" fill="#ede9fe" stroke="#ede9fe" stroke-width="2" /><text x="550" y="188" font-size="20" fill="#6146bd" font-weight="600">图片 B 的独立编辑窗口</text><rect x="560" y="235" width="349" height="177" rx="5" fill="#dcefe9" stroke="#268471" stroke-width="2" /><text x="572" y="267" font-size="22" fill="#268471" font-weight="600">图片 B</text><text x="42" y="490" font-size="22" fill="#53627d" font-weight="400">不同入口取得相同编辑能力；随后按本页教程继续处理并保存。</text><path d="M35 511 L925 511" fill="none" stroke="#dbe3ef" stroke-width="1" /><text x="35" y="539" font-size="18" fill="#53627d" font-weight="400">Snow Shot · 操作示意</text></g></svg>