<svg xmlns="http://www.w3.org/2000/svg" width="960" height="480" viewBox="0 0 960 480" role="img" aria-labelledby="title"><title id="title">放大取色：中心像素与格式（操作示意）</title><g font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif"><rect x="1" y="1" width="958" height="478" rx="12" fill="#f6f7fc" stroke="#cbd4e4" stroke-width="2" /><text x="30" y="43" font-size="28" fill="#263148">放大取色：中心像素与格式</text><text x="30" y="460" font-size="18" fill="#536078">操作示意</text><rect x="60" y="100" width="82" height="82" rx="0" fill="#7652dc" stroke="#fff" stroke-width="2" /><rect x="142" y="100" width="82" height="82" rx="0" fill="#6b48cb" stroke="#fff" stroke-width="2" /><rect x="224" y="100" width="82" height="82" rx="0" fill="#222b44" stroke="#fff" stroke-width="2" /><rect x="60" y="182" width="82" height="82" rx="0" fill="#2b3450" stroke="#fff" stroke-width="2" /><rect x="142" y="182" width="82" height="82" rx="0" fill="#d4c9ef" stroke="#fff" stroke-width="2" /><rect x="224" y="182" width="82" height="82" rx="0" fill="#906ee9" stroke="#fff" stroke-width="2" /><rect x="60" y="264" width="82" height="82" rx="0" fill="#7652dc" stroke="#fff" stroke-width="2" /><rect x="142" y="264" width="82" height="82" rx="0" fill="#7652dc" stroke="#fff" stroke-width="2" /><rect x="224" y="264" width="82" height="82" rx="0" fill="#736a8e" stroke="#fff" stroke-width="2" /><rect x="142" y="182" width="82" height="82" rx="0" fill="none" stroke="#e44848" stroke-width="2" /><path d="M224 222L390 222" fill="none" stroke="#7652dc" stroke-width="4" /><rect x="410" y="95" width="510" height="270" rx="12" fill="#fff" stroke="#cbd4e4" stroke-width="2" /><text x="440" y="145" font-size="27" fill="#263148">中心像素：#7652DC</text><text x="440" y="199" font-size="22" fill="#263148">HEX → 无 # HEX → RGB → HSL</text><text x="440" y="251" font-size="22" fill="#263148">Shift：切换格式；C：复制并退出</text><text x="440" y="312" font-size="22" fill="#263148">Shift+P：切换坐标模式</text><text x="60" y="405" font-size="23" fill="#263148">先对准中心像素，再复制；不要读取抗锯齿边缘的混合色。</text></g></svg>