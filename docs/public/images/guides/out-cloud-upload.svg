<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="900" height="470" viewBox="0 0 900 470" role="img" aria-labelledby="title desc">
<title id="title">上传成功后取得链接</title><desc id="desc">写入成功与公开读取是两件事；读取遵循存储桶/CDN 策略。</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#1677ff" /></marker></defs>
<rect width="900" height="470" rx="20" fill="#fff" />
<g font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif"><text x="30" y="47" font-size="30" fill="#163963" font-weight="700">上传成功后取得链接</text><text x="30" y="79" font-size="18" fill="#62758e" font-weight="400">操作示意</text><rect x="30" y="112" width="263" height="265" rx="16" fill="#f2f6fc" stroke="#cbd8e9" stroke-width="2" /><circle cx="58" cy="142" r="20" fill="#1677ff" /><text x="51" y="150" font-size="24" fill="white" font-weight="700">1</text><text x="88" y="151" font-size="24" fill="#163963" font-weight="600">默认配置</text><rect x="318" y="112" width="263" height="265" rx="16" fill="#f2f6fc" stroke="#cbd8e9" stroke-width="2" /><circle cx="346" cy="142" r="20" fill="#1677ff" /><text x="339" y="150" font-size="24" fill="white" font-weight="700">2</text><text x="376" y="151" font-size="24" fill="#163963" font-weight="600">上传图像</text><rect x="606" y="112" width="263" height="265" rx="16" fill="#f2f6fc" stroke="#cbd8e9" stroke-width="2" /><circle cx="634" cy="142" r="20" fill="#1677ff" /><text x="627" y="150" font-size="24" fill="white" font-weight="700">3</text><text x="664" y="151" font-size="24" fill="#163963" font-weight="600">链接</text><text x="54" y="208" font-size="24" fill="#24344d" font-weight="400">S3 端点 · 区域</text><text x="54" y="251" font-size="24" fill="#24344d" font-weight="400">存储桶 · 凭据</text><text x="54" y="307" font-size="24" fill="#24344d" font-weight="400">选择默认目标</text><rect x="346" y="193" width="206" height="126" rx="12" fill="#e9f5ed" stroke="#9dceb0" stroke-width="2" /><text x="362" y="239" font-size="24" fill="#24344d" font-weight="400">准备 → 上传</text><text x="362" y="285" font-size="23" fill="#24344d" font-weight="400">等待进度完成</text><text x="633" y="210" font-size="24" fill="#24344d" font-weight="400">复制对象 URL</text><text x="633" y="260" font-size="23" fill="#24344d" font-weight="400">浏览器验证访问</text><text x="633" y="310" font-size="23" fill="#24344d" font-weight="400">再分享给对方</text><path d="M290 250L317 250" stroke="#1677ff" stroke-width="4" marker-end="url(#a)" fill="none" /><path d="M580 250L606 250" stroke="#1677ff" stroke-width="4" marker-end="url(#a)" fill="none" /><text x="30" y="444" font-size="20" fill="#52647e" font-weight="400">写入成功与公开读取是两件事；读取遵循存储桶/CDN 策略。</text></g></svg>