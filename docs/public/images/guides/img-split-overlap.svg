<svg xmlns="http://www.w3.org/2000/svg" width="820" height="460" viewBox="0 0 820 460" role="img" aria-labelledby="title"><title id="title">分割重叠保留哪些内容</title><rect width="100%" height="100%" fill="#f3f7fc" /><text x="22" y="36" fill="#26384c" font-size="25">分割重叠保留哪些内容</text><text x="22" y="69" fill="#26384c" font-size="18">示例把一行看作一个重叠单位，C / D 是分界两侧的内容。</text><text x="44" y="113" fill="#26384c" font-size="22">原图</text><rect x="30" y="140" width="100" height="32" rx="0" fill="#e5f2fb" stroke="#c5d5e5" /><text x="72" y="163" fill="#26384c" font-size="20">A</text><rect x="30" y="175" width="100" height="32" rx="0" fill="#e5f2fb" stroke="#c5d5e5" /><text x="72" y="198" fill="#26384c" font-size="20">B</text><rect x="30" y="210" width="100" height="32" rx="0" fill="#fff0bd" stroke="#c5d5e5" /><text x="72" y="233" fill="#26384c" font-size="20">C</text><rect x="30" y="245" width="100" height="32" rx="0" fill="#fbd7d8" stroke="#c5d5e5" /><text x="72" y="268" fill="#26384c" font-size="20">D</text><rect x="30" y="280" width="100" height="32" rx="0" fill="#e2f2e5" stroke="#c5d5e5" /><text x="72" y="303" fill="#26384c" font-size="20">E</text><rect x="30" y="315" width="100" height="32" rx="0" fill="#e2f2e5" stroke="#c5d5e5" /><text x="72" y="338" fill="#26384c" font-size="20">F</text><path d="M24 244 L142 244" fill="none" stroke="#e34f52" stroke-width="3" /><text x="216" y="113" fill="#26384c" font-size="22">重叠 = 0</text><rect x="210" y="140" width="100" height="32" rx="0" fill="#e5f2fb" stroke="#c5d5e5" /><text x="252" y="163" fill="#26384c" font-size="20">A</text><rect x="210" y="175" width="100" height="32" rx="0" fill="#e5f2fb" stroke="#c5d5e5" /><text x="252" y="198" fill="#26384c" font-size="20">B</text><rect x="210" y="210" width="100" height="32" rx="0" fill="#fff0bd" stroke="#c5d5e5" /><text x="252" y="233" fill="#26384c" font-size="20">C</text><rect x="350" y="245" width="100" height="32" rx="0" fill="#fbd7d8" stroke="#c5d5e5" /><text x="392" y="268" fill="#26384c" font-size="20">D</text><rect x="350" y="280" width="100" height="32" rx="0" fill="#e2f2e5" stroke="#c5d5e5" /><text x="392" y="303" fill="#26384c" font-size="20">E</text><rect x="350" y="315" width="100" height="32" rx="0" fill="#e2f2e5" stroke="#c5d5e5" /><text x="392" y="338" fill="#26384c" font-size="20">F</text><text x="492" y="113" fill="#26384c" font-size="22">重叠 = 1 行</text><rect x="490" y="140" width="100" height="32" rx="0" fill="#e5f2fb" stroke="#c5d5e5" /><text x="532" y="163" fill="#26384c" font-size="20">A</text><rect x="490" y="175" width="100" height="32" rx="0" fill="#e5f2fb" stroke="#c5d5e5" /><text x="532" y="198" fill="#26384c" font-size="20">B</text><rect x="490" y="210" width="100" height="32" rx="0" fill="#fff0bd" stroke="#c5d5e5" /><text x="532" y="233" fill="#26384c" font-size="20">C</text><rect x="490" y="245" width="100" height="32" rx="0" fill="#fbd7d8" stroke="#c5d5e5" /><text x="532" y="268" fill="#26384c" font-size="20">D</text><rect x="640" y="210" width="100" height="32" rx="0" fill="#fff0bd" stroke="#c5d5e5" /><text x="682" y="233" fill="#26384c" font-size="20">C</text><rect x="640" y="245" width="100" height="32" rx="0" fill="#fbd7d8" stroke="#c5d5e5" /><text x="682" y="268" fill="#26384c" font-size="20">D</text><rect x="640" y="280" width="100" height="32" rx="0" fill="#e2f2e5" stroke="#c5d5e5" /><text x="682" y="303" fill="#26384c" font-size="20">E</text><rect x="640" y="315" width="100" height="32" rx="0" fill="#e2f2e5" stroke="#c5d5e5" /><text x="682" y="338" fill="#26384c" font-size="20">F</text><text x="475" y="400" fill="#26384c" font-size="18">两个切片都保留 C / D，方便衔接。</text><text x="22" y="442" fill="#546c84" font-size="16">操作示意</text></svg>