# Install as /etc/nginx/sites-available/www.snowshot.top.conf and enable it
# with a matching symlink in /etc/nginx/sites-enabled/. This is a standalone
# server block, not an include inside the main snowshot.top server block.
# The shared certificate must cover www.snowshot.top as well as snowshot.top.
server {
    listen 80;
    listen [::]:80;
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.snowshot.top;

    ssl_certificate /etc/nginx/ssh_keys/snowshot.top/snowshot.top.pem;
    ssl_certificate_key /etc/nginx/ssh_keys/snowshot.top/snowshot.top.key;

    return 301 https://snowshot.top$request_uri;
}
